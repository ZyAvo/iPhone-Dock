<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="mon-ecran-version" content="be9cc0d0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ambreval</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1630">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<script src="config/config.js"></script>
<script src="noyau.js"></script>
<script>/* page désactivée : on s'arrête là */Noyau.accueil.garde('ambreval');</script>
<script src="themes.js"></script>
<link rel="preload" href="polices/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="commun.css">
<style>
/* Ambreval (v80) : un vitrail autour d'un diorama. La peau du jeu est la même quel que soit le thème de KiosK. */
:root{
  color-scheme:dark;
  --nuit:#0e1630; --lapis:#1c2b58; --lapis2:#27396f; --plomb:#070c1c; --ambre:#f2b544; --ivoire:#f5ecd6; --brume:#b9c0d6;
  --emeraude:#4cb58a; --rubis:#e0625a; --amethyste:#a585e8; --turquoise:#5fd6d0;
  --f-titre:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --f-ui:"Geist",-apple-system,"SF Pro Text",system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --nav:62px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--nuit)}
body{font:14px/1.4 var(--f-ui);color:var(--ivoire);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.tap-dot,.hors-ligne{display:none}   /* le jeu répond déjà au toucher sur la carte, et il marche sans réseau */
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ambre);outline-offset:2px}
svg.i{width:1em;height:1em;fill:currentColor;fill-rule:evenodd;flex:none;vertical-align:-.13em}
#carte{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}

/* ---------- Haut de l'écran ---------- */
#haut{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(var(--st) + 6px) 0 0;pointer-events:none;
  background:linear-gradient(180deg,rgba(14,22,48,.86),rgba(14,22,48,.55) 70%,transparent)}
#haut>*{pointer-events:auto}
.bar{display:flex;align-items:center;gap:8px;padding:0 max(12px,env(safe-area-inset-left,0px))}
.retour{display:flex;align-items:center;gap:2px;min-height:44px;color:var(--ivoire);font-weight:600}
.retour svg.f{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.retour svg.k-logo{width:15px;height:15px;fill:currentColor;margin-right:4px}
#titre{flex:1;min-width:0;text-align:center;font-family:var(--f-titre);line-height:1.15}
#titre b{display:block;font-size:1.14rem;font-weight:600;letter-spacing:.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#titre span{font-size:.76rem;color:var(--brume)}
.rond{width:44px;height:44px;display:grid;place-items:center;position:relative;font-size:21px;color:var(--ambre)}
.rond .n{position:absolute;right:3px;top:4px;min-width:17px;height:17px;padding:0 4px;display:grid;place-items:center;border-radius:9px;background:var(--rubis);color:#fff;font:700 .68rem/1 var(--f-ui)}
#ress{display:flex;gap:6px;overflow-x:auto;padding:5px 12px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x}
#ress::-webkit-scrollbar{display:none}
.res{display:flex;align-items:center;gap:5px;flex:none;padding:5px 9px 5px 7px;background:rgba(14,22,48,.78);border:1px solid rgba(242,181,68,.28);font-size:.82rem;font-weight:600;white-space:nowrap;
  clip-path:polygon(5px 0,calc(100% - 5px) 0,100% 5px,100% calc(100% - 5px),calc(100% - 5px) 100%,5px 100%,0 calc(100% - 5px),0 5px)}
.res svg{font-size:15px}
.res small{font-size:.68rem;font-weight:500;color:var(--brume)}
.res.plein{border-color:var(--ambre)} .res.plein small{color:var(--ambre)}
.res.baisse small{color:var(--rubis)}
#quete{display:flex;align-items:center;gap:8px;margin:0 12px;max-width:calc(100% - 24px);padding:7px 10px;width:fit-content;background:rgba(14,22,48,.82);border-left:3px solid var(--ambre);font-size:.82rem;text-align:left}
#quete.fait{background:var(--ambre);color:#2a1c05;font-weight:600;animation:pouls 1.8s ease-in-out infinite}
#quete .pr{color:var(--brume);font-size:.74rem;white-space:nowrap}
#quete.fait .pr{color:#2a1c05}
@keyframes pouls{50%{transform:scale(1.025)}}

/* ---------- Vitrail du bas : les 5 onglets ---------- */
#onglets{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;gap:2px;padding-bottom:var(--sb);background:var(--plomb)}
#onglets button{flex:1;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--brume);position:relative;background:linear-gradient(180deg,var(--lapis2),var(--lapis))}
#onglets button svg{font-size:21px}
#onglets button[aria-selected="true"]{color:#14100a;background:var(--t)}
#onglets button.ferme{opacity:.5}
#onglets .n{position:absolute;right:calc(50% - 22px);top:6px;width:9px;height:9px;border-radius:50%;background:var(--ambre);box-shadow:0 0 0 2px var(--plomb)}

/* ---------- Panneau ---------- */
#pano{position:fixed;left:0;right:0;bottom:calc(var(--nav) + var(--sb));z-index:7;max-height:calc(100dvh - var(--nav) - var(--sb) - var(--st) - 96px);display:flex;flex-direction:column;
  background:linear-gradient(180deg,#22336a,#182551 42%,#141f45);border-top:2px solid var(--ambre);clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%,0 14px);transform:translateY(0);transition:transform .22s ease}
#pano.cache{transform:translateY(calc(100% + 4px));visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
.tete{display:flex;align-items:center;gap:6px;padding:9px 6px 7px 16px;flex:none;border-bottom:1px solid rgba(242,181,68,.2)}
.tete h2{margin:0;flex:1;min-width:0;font:600 1.24rem/1.15 var(--f-titre)}
.tete .sous{display:block;font:500 .78rem/1.2 var(--f-ui);color:var(--brume);margin-top:1px}
.fermer{width:44px;height:44px;display:grid;place-items:center;color:var(--brume);font-size:22px;line-height:1}
.retourP{width:36px;height:44px;display:grid;place-items:center;color:var(--ambre);margin-left:-8px}
.retourP svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#corps{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 14px 18px;overscroll-behavior:contain;touch-action:pan-y}
.g{margin:14px 0 6px;font:600 1rem/1.2 var(--f-titre);color:var(--ambre)}
.g:first-child{margin-top:2px}
.note{color:var(--brume);font-size:.82rem;margin:0 0 8px;line-height:1.45}
.ligne{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid rgba(185,192,214,.13);width:100%;text-align:left}
.ligne:last-child{border-bottom:0}
.ligne .t{flex:1;min-width:0}
.ligne .t b{display:block;font-weight:600;font-size:.94rem}
.ligne .t>span{display:block;font-size:.8rem;color:var(--brume);line-height:1.32}
.ligne .t>span.couts{display:flex;color:var(--ivoire)}
.ligne.off{opacity:.5}
.ligne img{width:58px;height:58px;flex:none;object-fit:contain}
.couts{display:flex;flex-wrap:wrap;gap:3px 9px;margin-top:3px;font-size:.8rem;font-weight:600}
.cout{display:inline-flex;align-items:center;gap:3px}
.cout svg{font-size:13px}
.cout.ko{color:var(--rubis)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;background:var(--ambre);color:#241703;font-weight:700;font-size:.92rem;
  clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px)}
.btn:active{filter:brightness(.88)}
.btn.sec{background:var(--lapis2);color:var(--ivoire)}
.btn.dan{background:#5a2330;color:#ffd9d4}
.btn[disabled]{background:#2a3762;color:#7f88a8;cursor:default}
.btn.large{width:100%}
.rangs{display:flex;gap:8px;margin-top:10px}
.rangs .btn{flex:1}
.pb{height:6px;background:rgba(7,12,28,.7);margin-top:6px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--ambre)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 9px;scrollbar-width:none;margin:-2px -14px 2px;padding-inline:14px;touch-action:pan-x}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:36px;padding:0 12px;background:rgba(7,12,28,.5);color:var(--brume);font-weight:600;font-size:.82rem;position:relative}
.chips button[aria-pressed="true"]{background:var(--ambre);color:#241703}
.stat{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:.88rem}
.stat span:first-child{color:var(--brume)}
.stat b{font-weight:600;text-align:right}
.lettre{padding:10px 12px;background:rgba(245,236,214,.07);border-left:3px solid var(--c,var(--ambre));margin-bottom:8px}
.lettre p{margin:0 0 4px;font:italic 400 .92rem/1.38 var(--f-titre)}
.lettre small{color:var(--brume)}
.gaz{font-size:.82rem;color:var(--brume);padding:4px 0;line-height:1.35}
.prix{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(185,192,214,.13)}
.prix .n{display:flex;align-items:center;gap:7px;font-weight:600;min-width:0}
.prix .n small{display:block;font-weight:400;color:var(--brume);font-size:.74rem}
.prix .btn{min-height:40px;padding:0 9px;font-size:.8rem;min-width:76px;flex-direction:column;gap:0;line-height:1.05}
.prix .btn small{font-weight:500;font-size:.68rem;opacity:.8}
.prix .ev{color:var(--ambre)}

/* ---------- Pose d'un bâtiment ---------- */
#pose{position:fixed;left:0;right:0;bottom:calc(var(--nav) + var(--sb));z-index:7;padding:10px 12px;background:linear-gradient(180deg,#22336a,#141f45);border-top:2px solid var(--ambre);display:flex;align-items:center;gap:10px}
#pose .t{flex:1;min-width:0;font-size:.84rem;line-height:1.3}
#pose .t b{display:block;font:600 1rem/1.2 var(--f-titre)}
#pose .t span{color:var(--brume)}
#cloche{position:fixed;right:12px;bottom:calc(var(--nav) + var(--sb) + 12px);z-index:6;width:58px;height:58px;display:grid;place-items:center;color:#241703;background:var(--ambre);font-size:27px;
  clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
#cloche[disabled]{background:#2c3a69;color:#8891b0}
#cloche span{position:absolute;font:700 .8rem/1 var(--f-ui);color:var(--ivoire)}

/* ---------- Fenêtres ---------- */
#fond{position:fixed;inset:0;z-index:20;background:rgba(5,9,22,.62);display:grid;place-items:center;padding:calc(var(--st) + 16px) 16px calc(var(--sb) + 16px)}
#boite{width:100%;max-width:420px;max-height:100%;overflow-y:auto;padding:18px;background:linear-gradient(180deg,#27396f,#172350);border:2px solid var(--ambre);touch-action:pan-y;
  clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px)}
#boite h3{margin:0 0 8px;font:600 1.3rem/1.2 var(--f-titre)}
#boite p{margin:0 0 12px;line-height:1.45}
#boite .col{display:flex;flex-direction:column;gap:8px;margin-top:12px}
#boite textarea{width:100%;height:92px;background:#0e1630;color:var(--ivoire);border:1px solid rgba(242,181,68,.4);padding:8px;font:.74rem/1.3 ui-monospace,monospace;-webkit-user-select:text;user-select:text}
#boite input[type=range]{width:100%;accent-color:var(--ambre);height:32px;touch-action:none}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--st) + 138px);z-index:15;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{padding:7px 13px;background:rgba(14,22,48,.94);border:1px solid var(--ambre);font-size:.84rem;text-align:center;animation:tin .22s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

/* ---------- PC : le panneau devient une colonne ---------- */
html.desk{--nav:66px}
html.desk #carte{width:calc(100% - 430px)}
html.desk #haut{right:430px}
html.desk #pano{left:auto;right:0;width:430px;top:0;bottom:var(--nav);max-height:none;clip-path:none;border-top:0;border-left:2px solid var(--ambre);transition:none}
html.desk #pano.cache{transform:none;visibility:visible}
html.desk #onglets{left:auto;right:0;width:430px;border-left:2px solid var(--ambre)}
html.desk .fermer.tel{visibility:hidden}
html.desk #pose{left:0;right:430px;bottom:0;}
html.desk #cloche{right:446px;bottom:18px}
html.desk #fond{right:0}
html.desk #toasts{left:calc(50% - 215px)}
html.desk #corps{flex:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="carte" aria-label="Carte de la vallée"></canvas>
<header id="haut">
  <div class="bar">
    <a class="retour back" href="index.html" aria-label="Retour à KiosK"><svg class="f" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><svg class="k-logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="9.2" height="9.2" rx="2.6"/><rect x="12.8" y="2" width="9.2" height="9.2" rx="2.6" opacity=".6"/><rect x="2" y="12.8" width="9.2" height="9.2" rx="2.6" opacity=".78"/><rect x="12.8" y="12.8" width="9.2" height="9.2" rx="2.6" opacity=".4"/></svg>KiosK</a>
    <div id="titre"><b></b><span></span></div>
    <button class="rond" id="msg" aria-label="Messagers" hidden></button>
  </div>
  <div id="ress"></div>
  <button id="quete" hidden></button>
</header>
<button id="cloche" aria-label="Sonner la cloche : 15 secondes de production d'un coup"></button>
<div id="pose" hidden></div>
<aside id="pano" class="cache" aria-live="off">
  <div class="tete" id="tete"></div>
  <div id="corps"></div>
</aside>
<nav id="onglets" role="tablist" aria-label="Menus du jeu"></nav>
<div id="toasts" role="status"></div>
<div id="fond" hidden><div id="boite" role="dialog" aria-modal="true"></div></div>

<script src="ambreval.js"></script>
<script src="ambreval-art.js"></script>
<script src="ambreval-ui.js"></script>
<script src="commun.js"></script>
</body>
</html>
