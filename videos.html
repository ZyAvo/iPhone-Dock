<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}

<script>/* thème, mode clair/sombre (choisis dans État) et mise en page PC, avant l'affichage */try{const d=document.documentElement,p=localStorage.getItem('palette'),m=localStorage.getItem('mode');if(p&&p!=='bleu')d.dataset.palette=p;if(m==='clair')d.dataset.theme='light';else if(m==='sombre')d.dataset.theme='dark';const q=matchMedia('(min-width:1024px) and (hover:hover) and (pointer:fine)');d.classList.toggle('desk',q.matches);q.addEventListener&&q.addEventListener('change',e=>d.classList.toggle('desk',e.matches))}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600;700&display=swap">
<style>
/* Layout : en-tête collant en verre (retour, actualiser, titre) ; une carte par source de données
   (résumé coloré en tête, détails dépliables) */
:root{
  --base:#e7ecef;
  --blob-1:rgba(163,206,241,.95); --blob-2:rgba(96,150,186,.55); --blob-3:rgba(39,76,119,.35);
  --ink:#10233a; --ink-soft:#56636f;
  --glass:rgba(255,255,255,.22); --glass-tint:rgba(163,206,241,.10);
  --rim-1:rgba(255,255,255,.95); --rim-2:rgba(255,255,255,.12); --rim-3:rgba(255,255,255,.6);
  --spec:rgba(255,255,255,.55);
  --shadow:0 14px 34px -16px rgba(39,76,119,.45);
  --head:rgba(231,236,239,.72);
  --card:rgba(255,255,255,.6); --line:rgba(39,76,119,.12);
  --accent:#274c77; --on-accent:#e7ecef;
  --t-brick:#274c77; --t-slate:#6096ba; --t-olive:#3d6b97; --t-plum:#1b3656;
  --t-teal:#4c86b0; --t-ochre:#8b8c89; --t-char:#2f3e50; --t-rose:#7fb0d8;
  --f-ui:"Geist", -apple-system, "SF Pro Text", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --base:#08121f;
  --blob-1:rgba(39,76,119,.85); --blob-2:rgba(96,150,186,.45); --blob-3:rgba(163,206,241,.22);
  --ink:#e7ecef; --ink-soft:#a7b6c4;
  --glass:rgba(231,236,239,.07); --glass-tint:rgba(163,206,241,.06);
  --rim-1:rgba(231,236,239,.55); --rim-2:rgba(231,236,239,.04); --rim-3:rgba(163,206,241,.35);
  --spec:rgba(231,236,239,.16);
  --shadow:0 14px 34px -14px rgba(0,0,0,.75);
  --head:rgba(8,18,31,.66);
  --card:rgba(231,236,239,.06); --line:rgba(231,236,239,.1); --accent:#a3cef1; --on-accent:#08121f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --base:#08121f;
  --blob-1:rgba(39,76,119,.85); --blob-2:rgba(96,150,186,.45); --blob-3:rgba(163,206,241,.22);
  --ink:#e7ecef; --ink-soft:#a7b6c4;
  --glass:rgba(231,236,239,.07); --glass-tint:rgba(163,206,241,.06);
  --rim-1:rgba(231,236,239,.55); --rim-2:rgba(231,236,239,.04); --rim-3:rgba(163,206,241,.35);
  --spec:rgba(231,236,239,.16);
  --shadow:0 14px 34px -14px rgba(0,0,0,.75);
  --head:rgba(8,18,31,.66);
  --card:rgba(231,236,239,.06); --line:rgba(231,236,239,.1); --accent:#a3cef1; --on-accent:#08121f;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;font-family:var(--f-ui);color:var(--ink);
  background-color:var(--base);
  background-image:
    radial-gradient(60% 45% at 10% 8%, var(--blob-1), transparent 70%),
    radial-gradient(55% 45% at 95% 35%, var(--blob-2), transparent 70%),
    radial-gradient(70% 50% at 30% 100%, var(--blob-3), transparent 70%);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--head);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}

/* verre */
.glass{position:relative;isolation:isolate;background:linear-gradient(160deg, var(--glass), var(--glass-tint));box-shadow:var(--shadow);
  backdrop-filter:blur(30px) saturate(1.8) brightness(1.05);-webkit-backdrop-filter:blur(30px) saturate(1.8) brightness(1.05)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 70% at 15% 0%, var(--spec), transparent 55%)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(145deg, var(--rim-1), var(--rim-2) 35%, var(--rim-2) 65%, var(--rim-3));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

.wrap{max-width:560px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* ---------- Choix du thème ---------- */
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}
.th{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:16px;background:var(--card);border:2px solid transparent;text-align:left;min-height:44px}
.th[aria-checked="true"]{border-color:var(--accent)}
.themes .th b{font-size:.88rem;letter-spacing:0}
.th small{font-size:.72rem;color:var(--ink-soft)}
.pal{display:flex;height:24px;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.pal i{flex:1}
/* ---------- Interrupteurs ---------- */
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.sw-row small{display:block;color:var(--ink-soft);font-size:.78rem;margin-top:2px}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;border-radius:99px;background:rgba(139,140,137,.45);position:relative;cursor:pointer;transition:background .2s;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw:checked{background:#2fa35a}
.sw:checked::after{transform:translateX(18px)}
/* ---------- En-tête ---------- */
header{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--head);
  backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);
  border-bottom:1px solid var(--line)}
header .wrap{padding-block:10px 12px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.back{display:flex;align-items:center;gap:2px;color:var(--accent);font-weight:500;font-size:1rem;padding-block:6px}
.back svg,.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn{color:var(--accent);width:38px;height:38px;display:grid;place-items:center;border-radius:50%}
.icon-btn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.title-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-weight:700;font-size:2.2rem;letter-spacing:-.035em;margin:0;line-height:1}
.stamp{font-size:.74rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}

.tabs{display:flex;gap:4px;padding:4px;border-radius:18px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;scroll-snap-align:center;padding:8px 14px;border-radius:14px;font-size:.85rem;font-weight:500;color:var(--ink-soft);white-space:nowrap;
  transition:background .2s ease,color .2s ease}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}

/* ---------- État ---------- */
main .wrap{padding-block:14px 40px;display:flex;flex-direction:column;gap:12px}
.sum{border-radius:24px;padding:16px 18px;display:flex;align-items:center;gap:14px}
.sum b{font-size:1.1rem;letter-spacing:-.01em}
.sum p{margin:2px 0 0;font-size:.82rem;color:var(--ink-soft)}
.lamp{width:14px;height:14px;border-radius:50%;flex:none;background:var(--lc);box-shadow:0 0 0 4px color-mix(in oklab, var(--lc) 22%, transparent)}
.ok{--lc:#1e8a4c}.warn{--lc:#e08a12}.err{--lc:#d63c3c}.none{--lc:#8b8c89}
.part{border-radius:24px;overflow:hidden}
.part > summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.part > summary::-webkit-details-marker{display:none}
.part > summary .t{flex:1;min-width:0}
.part > summary b{display:block;font-size:1rem}
.part > summary small{display:block;font-size:.8rem;color:var(--ink-soft);margin-top:2px}
.part > summary .chev{width:18px;height:18px;fill:none;stroke:var(--ink-soft);stroke-width:2;transition:transform .2s ease}
.part[open] > summary .chev{transform:rotate(90deg)}
.body{padding:0 16px 14px;font-size:.84rem}
.rows{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.rows th,.rows td{text-align:left;padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
.rows th{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;border-top:0}
.rows td.n{text-align:right;white-space:nowrap}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:600;background:color-mix(in oklab, var(--lc) 16%, transparent);color:color-mix(in oklab, var(--lc) 80%, var(--ink))}
.note{color:var(--ink-soft);font-size:.8rem;margin:8px 0 0;line-height:1.45}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, monospace;font-size:.72rem;overflow-wrap:anywhere;color:var(--ink-soft)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{padding:10px 14px;border-radius:14px;font-weight:600;font-size:.86rem;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.main{background:var(--accent);color:var(--on-accent);border-color:transparent}
/* ---------- Toucher visible et fondu entre les pages ---------- */
@view-transition{navigation:auto}
::view-transition-old(root),::view-transition-new(root){animation-duration:.22s}
.tap-dot{position:fixed;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;pointer-events:none;z-index:9999;
  background:radial-gradient(circle, color-mix(in oklab, var(--accent) 45%, transparent), color-mix(in oklab, var(--accent) 22%, transparent) 55%, rgba(255,255,255,.15) 72%);
  box-shadow:0 0 0 2.5px rgba(255,255,255,.9), 0 0 0 4px color-mix(in oklab, var(--accent) 45%, transparent), 0 4px 16px rgba(0,0,0,.22);animation:tapdot .6s ease-out forwards}
.maj-toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:9998;
  padding:10px 16px;border-radius:999px;background:var(--accent, #274c77);color:var(--on-accent, #e7ecef);font:600 .85rem/1.2 var(--f-ui, system-ui);box-shadow:0 10px 26px -10px rgba(0,0,0,.5);
  animation:majin .3s ease-out}
@keyframes majin{from{opacity:0;transform:translate(-50%, 10px)}}
@keyframes tapdot{from{transform:scale(.55);opacity:1}to{transform:scale(1.45);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* ==PALETTES== Thèmes de couleurs (choix dans la page État, gardé sur l'appareil). « Bleu » = valeurs ci-dessus. */
:root[data-palette="gris"]{
  --base:#eef0f2;

/* ---------- Vidéos ---------- */
.tool-row{display:flex;gap:8px}
.k{font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.search{display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);min-height:44px}
.search svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--ink-soft);stroke-width:2;stroke-linecap:round}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);outline:none;min-height:42px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:.82rem;font-weight:500;white-space:nowrap;min-height:36px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.chip.sel{padding:0 8px;appearance:none;-webkit-appearance:none;font:inherit;font-size:.82rem;font-weight:500}
.count{font-size:.78rem;color:var(--ink-soft)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px}
@media (min-width:700px){ .grid{grid-template-columns:repeat(5,minmax(0,1fr))} }
.tit{display:flex;flex-direction:column;gap:5px;text-align:left;min-width:0}
.poster{position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:var(--card);box-shadow:0 8px 18px -12px rgba(0,0,0,.5)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster .noimg{position:absolute;inset:0;display:grid;place-items:center;padding:8px;text-align:center;font-size:.74rem;color:var(--ink-soft)}
.poster .bd{position:absolute;left:6px;top:6px;padding:2px 7px;border-radius:999px;font-size:.62rem;font-weight:700;background:var(--accent);color:var(--on-accent)}
.poster .mk{position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;background:rgba(0,0,0,.55);color:#fff}
.poster .nt{position:absolute;right:6px;bottom:6px;padding:2px 6px;border-radius:8px;font-size:.66rem;font-weight:700;background:rgba(0,0,0,.6);color:#fff}

</style>

<body>
<header>
  <div class="wrap">
    <div class="top">
      <a class="back" href="index.html"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Accueil</a>
      <button class="icon-btn glass" id="refreshBtn" type="button" aria-label="Actualiser"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    </div>
    <div class="title-row"><h1>Vidéos</h1><span class="stamp" id="stamp"></span></div>
    <div class="tabs glass" role="tablist" aria-label="Sources" id="tabs"></div>
  </div>
</header>
<main><div class="wrap" id="out" role="tabpanel"></div></main>
<div class="sheet-bg" id="sheetBg" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div></div>

<script>
/* ========== Réglages lus aussi par la tâche GitHub « Vidéos » (outils/videos-data.mjs) ==========
   PLATEFORMES : tmdb = nom de la plateforme chez TMDB ; app = ouverture de l'appli iPhone ; web = recherche sur le site (le titre est ajouté au bout).
   CHAINES_YT  : chaînes YouTube suivies (identifiant « UC… » de la chaîne). */
const PLATEFORMES = [
  {id:'prime', nom:'Prime Video', tmdb:'amazon prime video', app:'aiv://', web:'https://www.primevideo.com/search/ref=atv_nb_sr?phrase='}
];
const CHAINES_YT = [
  {id:'UCFKDEp9si4RmHFWJW1vYsMA', nom:'EthosLab'}
];

/* ========== Outils ========== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {get(k, d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? d; }catch{ return d; } },
            set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }};
const fold = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const IMG = (p, w = 'w342') => p ? `https://image.tmdb.org/t/p/${w}${p}` : '';
const ago = t => { const m = Math.round((Date.now() - t) / 60000); if (m < 60) return `il y a ${Math.max(1, m)} min`; const h = Math.round(m / 60); if (h < 48) return `il y a ${h} h`; const d = Math.round(h / 24); return d < 30 ? `il y a ${d} j` : new Date(t).toLocaleDateString('fr-FR', {day:'numeric', month:'short', year:'numeric'}); };
const TABS = [...PLATEFORMES.map(p => ({id:p.id, nom:p.nom})), {id:'youtube', nom:'YouTube'}];

let tab = TABS.some(t => t.id === LS.get('videos:onglet', '')) ? LS.get('videos:onglet') : TABS[0].id;
let CAT = {}, YT = null, loadedAt = 0;
let F = {type:'tout', tri:'pop', genre:'', q:'', vus:false}, shown = 60;
let LISTE = new Set(LS.get('videos:liste', [])), VUS = new Set(LS.get('videos:vus', [])), YTVUS = new Set(LS.get('videos:yt-vus', []));
const saveSets = () => { LS.set('videos:liste', [...LISTE]); LS.set('videos:vus', [...VUS]); LS.set('videos:yt-vus', [...YTVUS].slice(-400)); };
let playing = null;

/* ========== Rendu ========== */
function render(){
  $('#tabs').innerHTML = TABS.map(t => `<button class="tab" role="tab" type="button" data-tab="${t.id}" aria-selected="${t.id === tab}">${esc(t.nom)}</button>`).join('');
  $('#out').innerHTML = tab === 'youtube' ? ytHTML() : catHTML(PLATEFORMES.find(p => p.id === tab));
  const d = tab === 'youtube' ? YT : CAT[tab];
  $('#stamp').textContent = d && d.updated ? `à jour ${ago(Date.parse(d.updated))}` : '';
}

/* ---------- Bibliothèque d'une plateforme ---------- */
function filtrer(C){
  const q = fold(F.q).trim(), mois = Date.now() - 30 * 864e5, auj = new Date().toISOString().slice(0, 10);
  let l = C.titres.filter(x => (F.type === 'tout' || x.t === F.type) && (!F.genre || (x.genres || []).includes(F.genre)));
  if (q) l = l.filter(x => fold(x.titre + ' ' + (x.orig || '')).includes(q));
  if (F.tri === 'liste') l = l.filter(x => LISTE.has(x.k));
  else if (!F.vus) l = l.filter(x => !VUS.has(x.k));
  if (F.tri === 'nouveau') l = l.filter(x => x.vu && Date.parse(x.vu) >= mois).sort((a, b) => a.vu < b.vu ? 1 : -1);
  else if (F.tri === 'recent') l = l.filter(x => x.sortie && x.sortie <= auj).sort((a, b) => a.sortie < b.sortie ? 1 : -1);
  else if (F.tri === 'note') l = l.filter(x => x.note && x.votes >= 100).sort((a, b) => b.note - a.note);
  else l = l.sort((a, b) => a.rang - b.rang);
  return l;
}
function catHTML(P){
  const C = CAT[P.id];
  if (!C) return '<div class="msgbox glass">Chargement du catalogue…</div>';
  if (!C.titres.length) return `<div class="msgbox glass"><b>Catalogue ${esc(P.nom)} pas encore prêt</b>
    ${/clé/i.test(C.erreur || '') ? `<span>Il faut une clé gratuite TMDB (la base de films qui sait ce qui est sur ${esc(P.nom)} en France) :</span>
      <ol><li>Crée un compte sur <a href="https://www.themoviedb.org/signup" target="_blank" rel="noopener">themoviedb.org</a>.</li>
      <li>Paramètres → API → demande une clé (usage personnel), puis copie le « API Read Access Token ».</li>
      <li>Sur GitHub : Settings → Secrets and variables → Actions → New repository secret, nom <b>TMDB_TOKEN</b>, colle le jeton.</li>
      <li>Actions → « Vidéos » → Run workflow.</li></ol>` : `<span>${esc(C.erreur || 'La tâche « Vidéos » n\'a pas encore tourné.')}</span>`}</div>`;
  const genres = [...new Set(C.titres.flatMap(x => x.genres || []))].sort((a, b) => a.localeCompare(b, 'fr'));
  const l = filtrer(C), nNew = C.titres.filter(x => x.vu && Date.parse(x.vu) >= Date.now() - 30 * 864e5).length;
  const chip = (k, v, t) => `<button class="chip" type="button" data-f="${k}" data-v="${v}" aria-pressed="${F[k] === v}">${t}</button>`;
  return `<label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Chercher un film, une série" value="${esc(F.q)}" autocomplete="off" aria-label="Chercher dans ${esc(P.nom)}"></label>
    <div class="chips" role="group" aria-label="Type">${chip('type', 'tout', 'Tout')}${chip('type', 'film', 'Films')}${chip('type', 'serie', 'Séries')}
      <select class="chip sel" id="genre" aria-label="Genre"><option value="">Tous genres</option>${genres.map(g => `<option${F.genre === g ? ' selected' : ''}>${esc(g)}</option>`).join('')}</select></div>
    <div class="chips" role="group" aria-label="Tri">${chip('tri', 'pop', 'Populaires')}${chip('tri', 'recent', 'Sorties récentes')}${chip('tri', 'note', 'Mieux notés')}${nNew ? chip('tri', 'nouveau', `Nouveaux (${nNew})`) : ''}${chip('tri', 'liste', `Ma liste${LISTE.size ? ` (${LISTE.size})` : ''}`)}</div>
    <div id="res" style="display:flex;flex-direction:column;gap:12px">${catRes(P, l)}</div>
    <p class="credit">Catalogue ${esc(P.nom)} en France, mis à jour chaque nuit. Données : TMDB (ce produit utilise l'API TMDB mais n'est ni approuvé ni certifié par TMDB) · disponibilités : JustWatch.</p>`;
}
function catRes(P, l = filtrer(CAT[P.id])){
  return `<span class="count">${l.length} titre${l.length > 1 ? 's' : ''}${!F.vus && F.tri !== 'liste' && VUS.size ? ` · <button type="button" class="chip" data-f="vus" data-v="1" style="min-height:28px;padding:3px 10px">afficher les déjà vus</button>` : ''}</span>
    ${l.length ? `<div class="grid">${l.slice(0, shown).map(posterHTML).join('')}</div>` : `<div class="msgbox glass">${F.tri === 'liste' ? 'Ta liste est vide : ouvre un titre et touche « Ma liste ».' : 'Aucun titre ne correspond.'}</div>`}
    ${l.length > shown ? `<button class="btn more" type="button" data-act="more">Afficher plus (${l.length - shown} restants)</button>` : ''}`;
}
function posterHTML(x){
  const neu = x.vu && Date.parse(x.vu) >= Date.now() - 14 * 864e5;
  return `<button class="tit" type="button" data-titre="${esc(x.k)}" aria-label="${esc(x.titre)}${x.an ? ', ' + x.an : ''}">
    <span class="poster">${x.affiche ? `<img src="${IMG(x.affiche, 'w185')}" alt="" loading="lazy" decoding="async" onerror="this.remove()">` : `<span class="noimg">${esc(x.titre)}</span>`}
      ${neu ? '<span class="bd">Nouveau</span>' : ''}${LISTE.has(x.k) ? '<span class="mk" aria-hidden="true">＋</span>' : VUS.has(x.k) ? '<span class="mk" aria-hidden="true">✓</span>' : ''}
      ${x.note ? `<span class="nt">★ ${x.note.toLocaleString('fr-FR')}</span>` : ''}</span>
    <b>${esc(x.titre)}</b><small>${x.t === 'film' ? 'Film' : 'Série'}${x.an ? ' · ' + x.an : ''}</small></button>`;
}
function ficheSheet(k){
  const P = PLATEFORMES.find(p => p.id === tab), x = CAT[tab].titres.find(t => t.k === k); if (!x) return;
  openSheet(`<div class="fiche-top"><span class="poster">${x.affiche ? `<img src="${IMG(x.affiche)}" alt="" onerror="this.remove()">` : ''}</span>
      <div><h2 id="sheetTitle">${esc(x.titre)}</h2>
      <div class="meta">${x.orig ? esc(x.orig) + '<br>' : ''}${x.t === 'film' ? 'Film' : 'Série'}${x.an ? ' · ' + x.an : ''}${x.genres && x.genres.length ? '<br>' + x.genres.map(esc).join(', ') : ''}
        ${x.note ? `<br>★ ${x.note.toLocaleString('fr-FR')}/10 <small>(${x.votes.toLocaleString('fr-FR')} votes)</small>` : ''}</div></div></div>
    ${x.resume ? `<p class="resume">${esc(x.resume)}</p>` : ''}
    <button class="btn main wide" type="button" data-act="ouvrir" data-k="${esc(k)}">Ouvrir dans l'appli ${esc(P.nom)}</button>
    <p class="credit" id="ouvMsg" style="margin:-4px 0 0">Le titre est copié : colle-le dans la recherche de l'appli.</p>
    <a class="credit" href="${esc(P.web + encodeURIComponent(x.titre))}" target="_blank" rel="noopener">Chercher sur le site ${esc(P.nom)} ›</a>
    <div class="row-btns"><button class="btn${LISTE.has(k) ? ' on' : ''}" type="button" data-act="liste" data-k="${esc(k)}" aria-pressed="${LISTE.has(k)}">${LISTE.has(k) ? '✓ Dans ma liste' : '＋ Ma liste'}</button>
      <button class="btn${VUS.has(k) ? ' on' : ''}" type="button" data-act="vu" data-k="${esc(k)}" aria-pressed="${VUS.has(k)}">${VUS.has(k) ? '✓ Déjà vu' : 'Déjà vu'}</button></div>
    <a class="credit" href="https://www.themoviedb.org/${x.t === 'film' ? 'movie' : 'tv'}/${esc(x.k.slice(1))}?language=fr" target="_blank" rel="noopener">Fiche complète sur TMDB ›</a>
    <button class="btn" type="button" data-act="close">Fermer</button>`);
}

/* ---------- YouTube ---------- */
function ytHTML(){
  if (!YT) return '<div class="msgbox glass">Chargement des vidéos…</div>';
  const player = playing ? `<div class="player"><iframe src="https://www.youtube-nocookie.com/embed/${esc(playing.id)}?autoplay=1&playsinline=1&rel=0" title="${esc(playing.titre)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <div class="now"><b>${esc(playing.titre)}</b><a class="chip" href="https://www.youtube.com/watch?v=${esc(playing.id)}" target="_blank" rel="noopener">YouTube</a>${navigator.share ? `<button class="chip" type="button" data-act="partager">Ouvrir avec…</button>` : ''}<button class="chip" type="button" data-act="stop" aria-label="Fermer le lecteur">✕</button></div>` : '';
  return `<div class="ytgrid"><div class="ytplay">${player}</div><div class="ytlist">` + (YT.chaines || []).map(c => `<div class="chan"><h2>${esc(c.nom)}</h2><a href="https://www.youtube.com/channel/${esc(c.id)}" target="_blank" rel="noopener">Ouvrir la chaîne ›</a></div>
    ${c.videos.length ? `<div class="vlist glass">${c.videos.map(v => { const seen = YTVUS.has(v.id), neu = !seen && v.date && Date.now() - v.date < 48 * 3600e3;
      return `<button class="v${seen ? ' seen' : ''}" type="button" data-yt="${esc(v.id)}"><span class="th"><img src="https://i.ytimg.com/vi/${esc(v.id)}/mqdefault.jpg" alt="" loading="lazy" decoding="async" onerror="this.remove()">${neu ? '<span class="bd">Nouveau</span>' : v.short ? '<span class="bd">Short</span>' : ''}${seen ? '<span class="vu"></span>' : ''}</span>
        <span><b>${esc(v.titre)}</b><small>${v.date ? ago(v.date) : ''}${v.vues ? ' · ' + v.vues.toLocaleString('fr-FR') + ' vues' : ''}</small></span></button>`; }).join('')}</div>`
      : `<div class="msgbox glass">${esc(c.erreur || 'Pas encore de vidéos.')}</div>`}${c.ancien ? '<p class="credit">YouTube ne répond pas : dernière liste connue.</p>' : ''}`).join('')
    + '<p class="credit">Lecture avec le lecteur officiel de YouTube. Certaines vidéos ne se lisent que sur YouTube : utilise alors « YouTube » ou « Ouvrir avec… ».</p></div></div>';
}

/* ========== Fenêtre ========== */
let lastFocus = null;
function openSheet(html){ lastFocus = document.activeElement; $('#sheet').innerHTML = html; $('#sheetBg').hidden = false; }
function closeSheet(){ $('#sheetBg').hidden = true; $('#sheet').innerHTML = ''; }

/* ========== Évènements ========== */
document.addEventListener('click', e => {
  if (e.target === $('#sheetBg')){ closeSheet(); return; }
  const t = e.target.closest('[data-tab],[data-f],[data-titre],[data-act],[data-yt]'); if (!t) return;
  if (t.dataset.tab){ tab = t.dataset.tab; LS.set('videos:onglet', tab); shown = 60; render(); window.scrollTo({top:0}); return; }
  if (t.dataset.f){ const k = t.dataset.f; F[k] = k === 'vus' ? true : t.dataset.v; shown = 60; render(); return; }
  if (t.dataset.titre){ ficheSheet(t.dataset.titre); return; }
  if (t.dataset.yt){ const v = (YT.chaines || []).flatMap(c => c.videos).find(x => x.id === t.dataset.yt);
    playing = v; YTVUS.add(v.id); saveSets(); render(); if (!document.documentElement.classList.contains('desk')) window.scrollTo({top:0, behavior:'smooth'}); return; }
  const a = t.dataset.act;
  if (a === 'close') closeSheet();
  else if (a === 'more'){ shown += 60; render(); }
  else if (a === 'ouvrir'){                 // l'appli ne sait pas recevoir un titre : on le copie, puis on l'ouvre
    const P = PLATEFORMES.find(p => p.id === tab), x = CAT[tab].titres.find(y => y.k === t.dataset.k);
    const go = () => { window.location.href = P.app; };
    const msg = $('#ouvMsg');
    (navigator.clipboard ? navigator.clipboard.writeText(x.titre) : Promise.reject()).then(() => { if (msg) msg.textContent = `« ${x.titre} » copié : colle-le dans la recherche de l'appli.`; })
      .catch(() => { if (msg) msg.textContent = `Cherche « ${x.titre} » dans l'appli.`; }).finally(() => setTimeout(go, 350));
  }
  else if (a === 'stop'){ playing = null; render(); }
  else if (a === 'partager'){                // feuille de partage de l'iPhone : choisir Video Lite (ou une autre appli) si elle y figure
    const url = `https://www.youtube.com/watch?v=${playing.id}`;
    navigator.share({title:playing.titre, url}).catch(() => {});
  }
  else if (a === 'liste' || a === 'vu'){ const S = a === 'liste' ? LISTE : VUS, k = t.dataset.k; S.has(k) ? S.delete(k) : S.add(k); saveSets(); ficheSheet(k); render(); }
});
let qt = null;
document.addEventListener('input', e => { if (e.target.id === 'q'){ clearTimeout(qt); qt = setTimeout(() => { F.q = e.target.value; shown = 60; const P = PLATEFORMES.find(p => p.id === tab); if (P && $('#res')) $('#res').innerHTML = catRes(P); }, 250); } });
document.addEventListener('change', e => { if (e.target.id === 'genre'){ F.genre = e.target.value; shown = 60; render(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheetBg').hidden) closeSheet(); });
$('#refreshBtn').addEventListener('click', () => load());

/* ========== Chargement ========== */
async function load(){
  $('#refreshBtn').classList.add('spin');
  await Promise.all([
    ...PLATEFORMES.map(async P => { try{ const r = await fetch(`donnees/videos/catalogue-${P.id}.json`, {cache:'no-cache'}); CAT[P.id] = r.ok ? await r.json() : {titres:[], erreur:'La tâche « Vidéos » n\'a pas encore tourné.'}; }catch{ CAT[P.id] = CAT[P.id] || {titres:[], erreur:'Pas de réseau.'}; } }),
    (async () => { try{ const r = await fetch('donnees/videos/youtube.json', {cache:'no-cache'}); YT = r.ok ? await r.json() : {chaines:CHAINES_YT.map(c => ({...c, videos:[], erreur:'La tâche « Vidéos » n\'a pas encore tourné.'}))}; }catch{ YT = YT || {chaines:[]}; } })()
  ]);
  loadedAt = Date.now(); $('#refreshBtn').classList.remove('spin'); render();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - loadedAt > 30 * 60e3) load(); });
render(); load();
</script>
<script>
/* Toucher visible : un rond qui s'efface là où le doigt appuie (pratique aussi pour les vidéos de démo) */
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const d = document.createElement('span'); d.className = 'tap-dot';
  d.style.left = e.clientX + 'px'; d.style.top = e.clientY + 'px';
  document.body.appendChild(d); setTimeout(() => d.remove(), 650);
}, {passive:true, capture:true});
</script>
<script>
/* Mise en mémoire sur l'iPhone (démarrage instantané, hors ligne) + avis quand une nouvelle version est déposée */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  const t0 = Date.now(); let majDispo = false, cacheAt = 0;
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => {
    if (!e.data || e.data.type !== 'nouvelle-version') return;
    majDispo = true;
    if (Date.now() - t0 < 8000){ location.reload(); return; }         // page tout juste ouverte : on passe directement à la nouvelle version
    if (document.querySelector('.maj-toast')) return;
    const b = document.createElement('button'); b.type = 'button'; b.className = 'maj-toast'; b.textContent = 'Nouvelle version — toucher pour l\'afficher';
    b.addEventListener('click', () => location.reload()); document.body.appendChild(b);
  });
  try{ navigator.serviceWorker.startMessages(); }catch{}
  /* Retour sur l'appli : nouvelle version déjà prête → rechargement ; sinon on vérifie s'il y en a une (au plus toutes les 2 min) */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (majDispo){ location.reload(); return; }
    if (Date.now() - cacheAt < 120e3) return;
    cacheAt = Date.now();
    navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});
    fetch(location.pathname, {cache:'no-cache'}).catch(() => {});
  });
}
</script>
