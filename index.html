deskMQ.addEventListener && deskMQ.addEventListener('change', () => { if (DESK()){ loadDeskNews(); loadLive(); } });
setInterval(() => { if (DESK() && !document.hidden && autoOn('actus') && Date.now() - deskNewsAt > 15 * 60e3) loadDeskNews(); }, 60e3);

/* ---------- Témoin LIVE Sports (matchs du jour préparés + vérification ESPN des matchs censés être en cours) ---------- */
const SPORT_FAV = {equipes:['Liverpool', 'Arsenal', 'Marseille', 'Toulouse', 'Rodez', 'Castres', 'Stade Toulousain', 'Lakers', 'Packers', 'Steelers', 'Maple Leafs'], ligues:['f1', 'motogp']};
const favWords = t => String(t || '').toLowerCase().replace(/[ßæœøłđðþıħ]/g, c => ({'ß':'ss', 'æ':'ae', 'œ':'oe', 'ø':'o', 'ł':'l', 'đ':'d', 'ð':'d', 'þ':'th', 'ı':'i', 'ħ':'h'})[c]).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim().split(' ')
  .map(w => ({toulousain:'toulouse', rochelais:'rochelle', paloise:'pau', bayonnais:'bayonne'})[w] || w).filter(w => w.length >= 3 && !['stade', 'olympique', 'club', 'the', 'les'].includes(w));
function favOf(){ try{ return JSON.parse(localStorage.getItem('sport:favoris')) || SPORT_FAV; }catch{ return SPORT_FAV; } }
const isFavEv = (e, F) => F.ligues.includes(e.l) || F.equipes.some(n => { const f = favWords(n); return f.length && [e.h, e.a].some(x => { const w = favWords(x); return f.every(t => w.includes(t)); }); });
async function loadLive(){
  const dots = document.querySelectorAll('[data-livedot]'); if (!dots.length) return;
  const auto = autoOn('sport'); const scores = {};
  try{
    const r = await fetch('donnees/sport/aujourdhui.json', {cache:'no-cache'}); if (!r.ok) throw 0;
    const j = await r.json(), now = Date.now(), F = favOf();
    let live = (j.events || []).filter(e => e.s !== 'post' && now >= e.t && now < e.t + e.d * 60e3);
    if (auto){                                            // confirmation auprès d'ESPN (pas pour F1 / MotoGP : horaires officiels)
      const leagues = [...new Set(live.filter(e => e.sp && e.sp !== 'racing').map(e => e.sp + '/' + e.l))];
      const states = {};
      await Promise.all(leagues.map(async k => { try{
        const s = await (await fetch(`https://site.api.espn.com/apis/site/v2/sports/${k}/scoreboard`)).json();
        (s.events || []).forEach(ev => { states[ev.id] = ((ev.status || {}).type || {}).state;
          const cs = ((ev.competitions || [])[0] || {}).competitors || [], h = cs.find(c => c.homeAway === 'home'), a = cs.find(c => c.homeAway === 'away');
          if (h && a && h.score != null && a.score != null) scores[ev.id] = `${h.score}–${a.score}`; });
      }catch{} }));
      live = live.filter(e => !(e.id in states) || states[e.id] === 'in');
    }
    const fav = live.filter(e => isFavEv(e, F));
    renderDeskSport(j.events || [], live, F);
    window.liveCls = 'live-dot' + (!auto ? ' paused' : fav.length ? ' fav' : live.length ? ' on' : '');
    const lab = `Sports — ${live.length ? `${live.length} en direct${fav.length ? `, dont ${fav.length} de tes favoris` : ''}` : 'aucun direct'}${auto ? '' : ' (mise à jour auto coupée)'}`;
    dots.forEach(dot => { dot.className = window.liveCls; const btn = dot.closest('.app-btn, .w-sport'); if (btn) btn.setAttribute('aria-label', lab); });
    LIVE_NOW = {ids:new Set(live.map(e => e.id)), n:live.length, nFav:fav.length, scores, auto}; renderBand();
  }catch{}
}
/* Bandeau Sports (iPhone) : témoin de direct + tes favoris en cours puis à venir (8 jours) */
let PROCH = null, LIVE_NOW = {ids:new Set(), n:0, nFav:0, scores:{}, auto:true};
const quand = t => { const d = new Date(t), j = Math.round((new Date(d).setHours(0, 0, 0, 0) - new Date().setHours(0, 0, 0, 0)) / 864e5);
  const h = d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
  const jour = j === 0 ? 'Auj.' : j === 1 ? 'Dem.' : (w => w[0].toUpperCase() + w.slice(1))(d.toLocaleDateString('fr-FR', {weekday:'short'}).replace('.', '')) + '.';
  return jour + ' ' + h; };
function renderBand(){
  const rows = $('#sbRows'), etat = $('#sbEtat'); if (!rows) return;
  const L = LIVE_NOW;
  etat.textContent = (L.n ? `${L.n} en direct${L.nFav ? ` · ${L.nFav} favori${L.nFav > 1 ? 's' : ''}` : ''}` : 'aucun direct') + (L.auto ? '' : ' · auto coupé');
  etat.classList.toggle('on', !!L.n);
  if (!PROCH){ return; }
  const F = favOf(), now = Date.now();
  const list = PROCH.filter(e => e.s !== 'post' && e.t + (e.d || 120) * 60e3 > now && isFavEv(e, F))
    .sort((a, b) => (L.ids.has(b.id) - L.ids.has(a.id)) || a.t - b.t).slice(0, 2);
  rows.innerHTML = list.length ? list.map(e => {
    const live = L.ids.has(e.id) || now >= e.t, sc = L.scores[e.id];
    const ses = String(e.a || '').replace(/^essais libres (\d)$/i, 'EL$1').replace(/^qualifications sprint$/i, 'QS').replace(/^qualifications (\d)$/i, 'Q$1').replace(/^qualifications$/i, 'Q').replace(/^warm-?up$/i, 'WU');
    const titre = e.sp === 'racing' ? `${e.ln} · ${ses}${e.h ? ' · ' + e.h.replace(/^(Grand Prix|GP) (de |du |d'|des )?/i, '') : ''}` : `${e.hc || e.h} – ${e.ac || e.a}`;
    return `<span class="pr-row"><span class="pr-t${live ? ' live' : ''}">${live ? 'En cours' : quand(e.t)}</span><span class="pr-m">${esc(titre)}</span>${sc ? `<span class="pr-sc">${esc(sc)}</span>` : e.tv ? `<span class="pr-tv">${esc(e.tv)}</span>` : ''}</span>`; }).join('')
    : '<span class="sb-vide">Aucun match de tes favoris dans les 8 jours</span>';
}
const renderProchains = renderBand;
async function loadProchains(){
  try{ const r = await fetch('donnees/sport/prochains.json', {cache:'no-cache'}); PROCH = r.ok ? (await r.json()).events || [] : (PROCH || []); }catch{ PROCH = PROCH || []; }
  renderBand();
}
loadProchains();
setInterval(() => { if (!document.hidden) renderProchains(); }, 60e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadProchains(); });
loadLive();
setInterval(() => { if (!document.hidden && autoOn('sport')) loadLive(); }, 2 * 60e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadLive(); });

tick(); setInterval(tick, 15000);
loadWidget(); let widgetAt = Date.now(); loadDeskNews();
document.addEventListener('visibilitychange', () => {            // retour sur l'accueil : nouvelle « une » au plus tous les quarts d'heure
  if (!document.hidden && autoOn('actus') && Date.now() - widgetAt > 15 * 60e3){ widgetAt = Date.now(); loadWidget(); }
});
showPlace(); loadWx();
if (place.mode === 'gps' && Date.now() - (place.at || 0) > 30 * 60e3 && navigator.permissions){       // position relue si déjà autorisée
  navigator.permissions.query({name:'geolocation'}).then(p => { if (p.state === 'granted') navigator.geolocation.getCurrentPosition(pos => {
    setPlace({...place, lat:+pos.coords.latitude.toFixed(4), lon:+pos.coords.longitude.toFixed(4), at:Date.now()}); }, () => {}, {timeout:12000, maximumAge:10 * 60e3}); }).catch(() => {});
}
setInterval(() => { if (!document.hidden) loadWx(); }, 10 * 60e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadWx(); });
</script>
<script>
/* Toucher visible : un rond qui s'efface là où le doigt appuie (pratique aussi pour les vidéos de démo) */
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const d = document.createElement('span'); d.className = 'tap-dot';
  d.style.left = e.clientX + 'px'; d.style.top = e.clientY + 'px';
  document.body.appendChild(d); setTimeout(() => d.remove(), 650);
}, {passive:true, capture:true});
</script>
<script>
/* Mise en mémoire sur l'iPhone (démarrage instantané, hors ligne) + avis quand une nouvelle version est déposée */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  const t0 = Date.now(); let majDispo = false, cacheAt = 0;
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => {
    if (!e.data || e.data.type !== 'nouvelle-version') return;
    majDispo = true;
    if (Date.now() - t0 < 8000){ location.reload(); return; }         // page tout juste ouverte : on passe directement à la nouvelle version
    if (document.querySelector('.maj-toast')) return;
    const b = document.createElement('button'); b.type = 'button'; b.className = 'maj-toast'; b.textContent = 'Nouvelle version — toucher pour l\'afficher';
    b.addEventListener('click', () => location.reload()); document.body.appendChild(b);
  });
  try{ navigator.serviceWorker.startMessages(); }catch{}
  /* Retour sur l'appli : nouvelle version déjà prête → rechargement ; sinon on vérifie s'il y en a une (au plus toutes les 2 min) */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (majDispo){ location.reload(); return; }
    if (Date.now() - cacheAt < 120e3) return;
    cacheAt = Date.now();
    navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});
    fetch(location.pathname, {cache:'no-cache'}).catch(() => {});
  });
}
</script>

<!-- ==TIRER== Tirer vers le bas pour recharger (comme Safari) -->
<style>
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top, 0px) + 6px);z-index:9999;width:38px;height:38px;margin-left:-19px;border-radius:50%;
  display:grid;place-items:center;pointer-events:none;opacity:0;transform:translateY(-60px);
  background:var(--sheet-solid, var(--base, #eef2f5));color:var(--ink-soft, #56636f);box-shadow:0 6px 18px -8px rgba(0,0,0,.45);border:1px solid var(--line, rgba(0,0,0,.1))}
.ptr svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.ptr.pret{color:var(--accent, #274c77)}
.ptr.pret svg{transform:rotate(180deg)}
.ptr.va{transition:transform .2s, opacity .2s}
.ptr.tourne svg{animation:ptr-t .7s linear infinite}
@keyframes ptr-t{to{transform:rotate(360deg)}}
</style>
<div class="ptr" id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg></div>
<script>
(() => {
  const el = document.getElementById('ptr'), SEUIL = 78;
  let y0 = null, x0 = 0, d = 0, actif = false;
  const OVER = '.scrim:not([hidden]),.sheet-bg:not([hidden]),.sheet:not([hidden]),[role="dialog"]:not([hidden])';
  const bloque = t => [...document.querySelectorAll(OVER)].some(e => e.getClientRects().length) || !t.closest || t.closest('input,textarea,select,[data-no-ptr]') ||
    (() => { for (let n = t; n && n !== document.body; n = n.parentElement) if (n.scrollTop > 0) return true; return false; })();
  const set = (y, cls) => { el.style.transform = `translateY(${y}px)`; el.style.opacity = Math.min(1, y / 40); el.className = 'ptr' + (cls ? ' ' + cls : ''); };
  addEventListener('touchstart', e => {
    if (e.touches.length !== 1 || (scrollY || document.documentElement.scrollTop) > 0 || bloque(e.target)) { y0 = null; return; }
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; d = 0; actif = false;
  }, {passive:true});
  addEventListener('touchmove', e => {
    if (y0 == null) return;
    const dy = e.touches[0].clientY - y0, dx = e.touches[0].clientX - x0;
    if (!actif){ if (Math.abs(dx) > Math.abs(dy) || dy < 6){ if (Math.abs(dx) > 10 || dy < -6) y0 = null; return; } if ((scrollY || document.documentElement.scrollTop) > 0){ y0 = null; return; } actif = true; }
    d = Math.max(0, dy);
    const y = Math.min(80, d * .5);
    set(y - 10, d >= SEUIL ? 'pret' : '');
  }, {passive:true});
  addEventListener('touchend', () => {
    if (y0 == null || !actif){ y0 = null; return; }
    y0 = null;
    if (d >= SEUIL){ set(34, 'va tourne'); setTimeout(() => location.reload(), 250); }
    else { set(-60, 'va'); }
  }, {passive:true});
  addEventListener('touchcancel', () => { if (actif) set(-60, 'va'); y0 = null; }, {passive:true});
})();
</script>
<!-- ==FIN TIRER== -->
