<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon Écran</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mon Écran">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
html{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600;700&display=swap">
<style>
/* Layout : fond en dégradé maillé ; rangée de 2 widgets carrés (heure + météo, À la une), grille d'apps 5 colonnes, bandeau d'accès rapides en bas */
:root{
  --base:#e7ecef;
  --blob-1:rgba(163,206,241,.95); --blob-2:rgba(96,150,186,.55); --blob-3:rgba(39,76,119,.35);
  --ink:#10233a; --ink-soft:#56636f;
  --glass:rgba(255,255,255,.22); --glass-tint:rgba(163,206,241,.10);
  --rim-1:rgba(255,255,255,.95); --rim-2:rgba(255,255,255,.12); --rim-3:rgba(255,255,255,.6);
  --spec:rgba(255,255,255,.55);
  --shadow:0 14px 34px -16px rgba(39,76,119,.45);
  --panel:#e7ecef; --card:rgba(255,255,255,.6); --line:rgba(39,76,119,.12);
  --accent:#274c77; --on-accent:#e7ecef;
  --t-brick:#274c77; --t-slate:#6096ba; --t-olive:#3d6b97; --t-plum:#1b3656;
  --t-teal:#4c86b0; --t-ochre:#8b8c89; --t-char:#2f3e50; --t-rose:#7fb0d8;
  --glyph:#ffffff;
  --f-ui:"Geist", -apple-system, "SF Pro Text", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --base:#08121f;
  --blob-1:rgba(39,76,119,.85); --blob-2:rgba(96,150,186,.45); --blob-3:rgba(163,206,241,.22);
  --ink:#e7ecef; --ink-soft:#a7b6c4;
  --glass:rgba(231,236,239,.07); --glass-tint:rgba(163,206,241,.06);
  --rim-1:rgba(231,236,239,.55); --rim-2:rgba(231,236,239,.04); --rim-3:rgba(163,206,241,.35);
  --spec:rgba(231,236,239,.16);
  --shadow:0 14px 34px -14px rgba(0,0,0,.75);
  --panel:#08121f; --card:rgba(231,236,239,.06); --line:rgba(231,236,239,.1); --accent:#a3cef1;
  --on-accent:#08121f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --base:#08121f;
  --blob-1:rgba(39,76,119,.85); --blob-2:rgba(96,150,186,.45); --blob-3:rgba(163,206,241,.22);
  --ink:#e7ecef; --ink-soft:#a7b6c4;
  --glass:rgba(231,236,239,.07); --glass-tint:rgba(163,206,241,.06);
  --rim-1:rgba(231,236,239,.55); --rim-2:rgba(231,236,239,.04); --rim-3:rgba(163,206,241,.35);
  --spec:rgba(231,236,239,.16);
  --shadow:0 14px 34px -14px rgba(0,0,0,.75);
  --panel:#08121f; --card:rgba(231,236,239,.06); --line:rgba(231,236,239,.1); --accent:#a3cef1;
  --on-accent:#08121f;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--f-ui);color:var(--ink);
  background-color:var(--base);
  background-image:
    radial-gradient(60% 45% at 10% 8%, var(--blob-1), transparent 70%),
    radial-gradient(55% 45% at 95% 35%, var(--blob-2), transparent 70%),
    radial-gradient(70% 50% at 30% 100%, var(--blob-3), transparent 70%);
  background-attachment:fixed;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color:transparent;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}

.app{height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column}

/* verre commun : fond très léger, flou fort, reflet en haut à gauche et liseré dégradé */
.glass{
  position:relative;isolation:isolate;
  background:linear-gradient(160deg, var(--glass), var(--glass-tint));
  box-shadow:var(--shadow);
  backdrop-filter:blur(30px) saturate(1.8) brightness(1.05);-webkit-backdrop-filter:blur(30px) saturate(1.8) brightness(1.05);
}
.glass::before,.tile::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 70% at 15% 0%, var(--spec), transparent 55%);
}
.glass::after,.tile::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(145deg, var(--rim-1), var(--rim-2) 35%, var(--rim-2) 65%, var(--rim-3));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}

/* ---------- Accueil ---------- */
#home{flex:1;display:flex;flex-direction:column;min-height:0;padding-block:16px 0}
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.w{aspect-ratio:1;max-width:100%;border-radius:32px;padding:16px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.w-label{font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.w-clock .time{font-weight:200;font-size:clamp(2.9rem,15vw,3.8rem);line-height:.95;letter-spacing:-.045em;font-variant-numeric:tabular-nums;margin-top:auto}
.w-clock .day{font-weight:600;font-size:.92rem;margin-top:8px;text-transform:capitalize}
.w-clock a{color:inherit;text-decoration:none;display:block;align-self:flex-start;border-radius:10px}
.w-clock a:active{opacity:.6}
.w-clock .place{font-size:.78rem;color:var(--ink-soft);margin-top:2px;display:flex;align-items:center;gap:3px;align-self:flex-start;border-radius:8px;max-width:100%}
.w-clock .place span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-clock .place svg{width:11px;height:11px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.w-clock .place:active{opacity:.6}
.w-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.w-clock .wx{display:flex;align-self:auto;align-items:center;gap:4px;margin:-6px -6px 0 0;padding:2px 4px;border-radius:12px;font-size:.92rem;font-weight:500;font-variant-numeric:tabular-nums}
.wx svg{width:30px;height:30px;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.wx .sun{stroke:#e9a23b;fill:rgba(233,162,59,.18)}
.wx .moon{stroke:#8fa8c4;fill:rgba(143,168,196,.18)}
.wx .cloud{stroke:var(--ink-soft);fill:color-mix(in oklab, var(--base) 75%, transparent)}
.wx .rain{stroke:#4c86b0}
.wx .snow{stroke:#7fb0d8}
.wx .bolt{stroke:#e9a23b}
.wx:active{opacity:.6}
.w-news{gap:8px}
.w-news .src{display:flex;align-items:center;gap:6px}
.w-news .src i{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.w-news .headline{font-weight:600;font-size:.98rem;line-height:1.28;letter-spacing:-.01em;margin-top:auto;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.w-news .foot{display:flex;justify-content:space-between;font-size:.74rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.w:active{transform:scale(.97)}
.w{transition:transform .15s ease}

.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px 12px;margin-top:24px;padding:0 2px}
.app-btn{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.tile{
  width:100%;aspect-ratio:1;max-width:100%;border-radius:26%;
  display:grid;place-items:center;color:var(--glyph);position:relative;isolation:isolate;
  background:linear-gradient(160deg, color-mix(in oklab, var(--c) 55%, transparent), color-mix(in oklab, var(--c) 88%, transparent));
  backdrop-filter:blur(18px) saturate(1.8);-webkit-backdrop-filter:blur(18px) saturate(1.8);
  box-shadow:0 10px 22px -12px color-mix(in oklab, var(--c) 80%, black);
  transition:transform .2s cubic-bezier(.3,.7,.3,1.3);
}
.app-btn:active .tile{transform:scale(.9)}
.tile svg{width:50%;height:50%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.tile .mono.long{font-size:clamp(.62rem,2.6vw,.75rem)}
.tile .mono{font-weight:700;font-size:clamp(.8rem,3.6vw,1rem);letter-spacing:-.03em;text-shadow:0 1px 1px rgba(0,0,0,.18)}
.app-btn .name{font-size:.66rem;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

.tile.folder{
  background:linear-gradient(160deg, var(--glass), var(--glass-tint));
  box-shadow:var(--shadow);
  backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10%;padding:16%;place-items:stretch}
.tile.folder i{border-radius:30%;display:block;min-width:0;min-height:0;
  background:linear-gradient(160deg, color-mix(in oklab, var(--c) 60%, transparent), var(--c))}
.tile.img,.tile.folder i.img{background:var(--img) center / cover no-repeat}
.tile.img{backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 8px 18px -10px rgba(0,0,0,.45)}
.tile.img > *,.tile.img::before{display:none}

.spacer{flex:1}
.dots{display:flex;justify-content:center;gap:6px;margin-bottom:12px}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--ink);opacity:.22}
.dots span.on{opacity:.7;width:16px;border-radius:3px}

.quick{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 4px;margin-bottom:12px}
.q-side{display:flex;gap:7px}
.q{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--ink);position:relative;isolation:isolate}
.q svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.q.img{background:var(--img) center / cover no-repeat;backdrop-filter:none;-webkit-backdrop-filter:none}
.q.img svg,.q.img::before{display:none}
.q:active{transform:scale(.9)}

@keyframes rise{from{transform:translateY(8px) scale(.96)}}

/* ---------- Dossier ---------- */
.scrim{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
  padding:max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
  background:rgba(8,12,16,.3);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);animation:fade .2s ease}
.folder-panel{width:min(100%,330px);animation:pop .28s cubic-bezier(.2,.9,.25,1.15)}
.folder-panel h3{font-weight:600;font-size:1.6rem;letter-spacing:-.03em;color:#fff;text-align:center;margin:0 0 16px;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.folder-box{border-radius:40px;padding:22px 18px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px 16px}
.folder-box .app-btn{animation:none}
/* ---------- Choix du lieu ---------- */
.place-panel{width:min(100%,360px);border-radius:32px;padding:20px 16px 16px;animation:pop .28s cubic-bezier(.2,.9,.25,1.15);max-height:100%;overflow:auto}
.place-panel h3{font-weight:600;font-size:1.15rem;letter-spacing:-.02em;margin:0 4px 12px}
.pl-list{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:4px}
.pl-row{display:flex;align-items:center;gap:6px}
.pl-pick{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--card)}
.pl-pick[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.pl-pick b{font-weight:600}
.pl-pick small{opacity:.7;font-size:.78rem;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-pick svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pl-del{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink-soft);font-size:1.1rem}
.pl-search{display:flex;gap:6px;margin-bottom:8px}
.pl-search input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.pl-msg{font-size:.8rem;color:var(--ink-soft);margin:4px 4px 8px;min-height:1em}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.86)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div class="app">
  <section id="home" aria-label="Écran d'accueil">
    <div class="widgets">
      <div class="w w-clock glass">
        <div class="w-top">
          <span class="w-label">Aujourd'hui</span>
          <a class="wx" id="wx" href="weather://" data-app="weather://" aria-label="Ouvrir Météo"></a>
        </div>
        <a class="time" id="clock" href="shortcuts://run-shortcut?name=Horloge" data-app="shortcuts://run-shortcut?name=Horloge" aria-label="Ouvrir Horloge">--:--</a>
        <a class="day" id="day" href="calshow://" data-app="calshow://" data-alt="Calendrier" aria-label="Ouvrir Calendrier"></a>
        <button type="button" class="place" id="placeBtn" aria-haspopup="dialog" aria-label="Changer de lieu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span id="placeName">Réalmont · Tarn</span></button>
      </div>
      <a class="w w-news glass" id="newsWidget" href="actus.html" aria-label="Ouvrir les actus">
        <span class="src"><i id="wDot"></i><span class="w-label" id="wSrc">À la une</span></span>
        <span class="headline" id="wTitle">Chargement des actus…</span>
        <span class="foot"><span>Actus</span><span id="wTime"></span></span>
      </a>
    </div>
    <div class="grid" id="grid"></div>
    <div class="spacer"></div>
    <div class="dots" aria-hidden="true"><span class="on"></span><span></span></div>
    <div class="quick" aria-label="Accès rapides"><div class="q-side" id="quickLeft"></div><div class="q-side" id="quickRight"></div></div>
  </section>

</div>

<div class="scrim" id="scrim" hidden>
  <div class="folder-panel" role="dialog" aria-modal="true" aria-labelledby="folderTitle">
    <h3 id="folderTitle"></h3>
    <div class="folder-box glass" id="folderBox"></div>
  </div>
</div>

<div class="scrim" id="placeScrim" hidden>
  <div class="place-panel glass" role="dialog" aria-modal="true" aria-labelledby="placeTitle">
    <h3 id="placeTitle">Lieu de la météo</h3>
    <ul class="pl-list" id="placeList"></ul>
    <form class="pl-search" id="placeForm" autocomplete="off">
      <input type="search" id="placeQuery" placeholder="Ajouter une ville…" aria-label="Rechercher une ville">
    </form>
    <p class="pl-msg" id="placeMsg" role="status"></p>
    <ul class="pl-list" id="placeResults"></ul>
  </div>
</div>

<script>
/* ======================================================
   CONFIG — c'est ici qu'on ajoute / retire des "apps"
   type : "page" (page du projet), "folder" (dossier), "link" (site)
   app  : ouvre l'application installée (adresse spéciale de l'appli) ;
          web : site ouvert à la place si l'appli ne répond pas.
          Si une appli ne s'ouvre pas, remplacer app par
          'shortcuts://run-shortcut?name=NomDuRaccourci' (raccourci « Ouvrir l'app »)
   alt  : nom d'un raccourci essayé si l'appli ne s'ouvre pas
   star : true → l'appli apparaît dans son dossier ET seule sur l'accueil
   store: nom de l'appli sur l'App Store, pour afficher sa vraie icône
          (ou storeId:'123456789' pour viser une appli précise)
   ====================================================== */
/* Applis sans adresse fiable : ouvertes par un raccourci du même nom (app Raccourcis → « Ouvrir l'app ») */
function sc(name){ return 'shortcuts://run-shortcut?name=' + encodeURIComponent(name); }

const ICONS = {
  phone:'<path d="M6.6 3.5h2.6l1.5 4.2-2 1.5a12 12 0 0 0 6.1 6.1l1.5-2 4.2 1.5v2.6a2 2 0 0 1-2.1 2A16.5 16.5 0 0 1 4.6 5.6a2 2 0 0 1 2-2.1z"/>',
  bubble:'<path d="M4 5.5h16a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5H10l-4.5 3.5V17.5H4A1.5 1.5 0 0 1 2.5 16V7A1.5 1.5 0 0 1 4 5.5z"/>',
  round:'<path d="M12 3.5a8.5 8.5 0 0 0-7.4 12.7L3.5 20.5l4.4-1.1A8.5 8.5 0 1 0 12 3.5z"/><path d="M8.6 12h.01M12 12h.01M15.4 12h.01"/>',
  duo:'<path d="M3.5 6.5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H9l-3.5 2.8V13.5a2 2 0 0 1-2-2z"/><path d="M15.5 8.5h3a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2V20l-3-2.5h-3.5a2 2 0 0 1-2-2v-.5"/>',
  card:'<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 9.5h19M6 15h4"/>',
  folder:'<path d="M3 7.5a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 10h18"/>',
  camera:'<path d="M4 7.5h3.2L9 5h6l1.8 2.5H20a1.5 1.5 0 0 1 1.5 1.5v9.5A1.5 1.5 0 0 1 20 20H4a1.5 1.5 0 0 1-1.5-1.5V9A1.5 1.5 0 0 1 4 7.5z"/><circle cx="12" cy="13.3" r="3.8"/>',
  gear:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/><path d="M4 12h5M13 12h7"/><circle cx="11" cy="12" r="2"/>',
  media:'<rect x="2.5" y="4.5" width="19" height="13" rx="2.5"/><path d="m10 8.2 4.8 2.8-4.8 2.8z"/><path d="M8 20.5h8"/>',
  news:'<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 8.5h6M7 12h10M7 15.5h10"/>',
  meteo:'<circle cx="8.5" cy="8.5" r="3.2"/><path d="M8.5 2.5v1.3M2.5 8.5h1.3M4.3 4.3l.9.9M12.7 4.3l-.9.9"/><path d="M8 20h9.5a3.8 3.8 0 0 0 0-7.6 5 5 0 0 0-9.4 1.6A3 3 0 0 0 8 20z"/>',
  map:'<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/>',
  drive:'<path d="M3 7.5a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  translate:'<path d="M3.5 5.5h9M8 3.5v2M5.5 5.5c1 4 3.8 6.8 6.5 7.8M10.5 5.5c-1 4-3.8 6.8-6.5 7.8"/><path d="m13 20.5 4-9 4 9M14.4 17.5h5.2"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>',
  play:'<rect x="2.5" y="5.5" width="19" height="13" rx="3.5"/><path d="m10 9.2 5 2.8-5 2.8z"/>',
  book:'<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/>',
  tag:'<path d="M3 11.5V4h7.5L21 14.5 13.5 22z"/><circle cx="7.5" cy="8" r="1.4"/>',
  sport:'<circle cx="12" cy="12" r="8.5"/><path d="m12 7.6 4.2 3-1.6 4.9H9.4l-1.6-4.9z"/><path d="M12 3.5v4.1M16.2 10.6l3.9-1.3M14.6 15.5l2.4 3.4M9.4 15.5 7 18.9M7.8 10.6 3.9 9.3"/>'

/* Icônes App Store : récupérées une fois, puis gardées sur l'iPhone */
let ICONS_STORE = {};
try{ ICONS_STORE = JSON.parse(localStorage.getItem('icons:v1')) || {}; }catch{}
const iconKey = a => a.icon && !a.store && !a.storeId ? '' : a.storeId ? 'id:' + a.storeId : a.store ? 's:' + a.store : '';
const iconOf = a => { const k = iconKey(a); return k && ICONS_STORE[k] ? ICONS_STORE[k] : ''; };
function jsonp(url){
  return new Promise((ok, ko) => {
    const cb = '__ic' + Math.random().toString(36).slice(2), sc = document.createElement('script');
    const end = () => { clearTimeout(t); delete window[cb]; sc.remove(); };
    const t = setTimeout(() => { end(); ko(); }, 8000);
    window[cb] = d => { end(); ok(d); };
    sc.onerror = () => { end(); ko(); };
    sc.src = `${url}&callback=${cb}`;
    document.head.appendChild(sc);
  });
}
async function fetchIcons(){
  const all = [...HOME, ...QUICK_LEFT, ...QUICK_RIGHT, ...Object.values(FOLDERS).flatMap(f => f.items)].filter(a => iconKey(a) && !(iconKey(a) in ICONS_STORE));
  const todo = [...new Map(all.map(a => [iconKey(a), a])).values()];
  for (const a of todo){
    try{
      const url = a.storeId ? `https://itunes.apple.com/lookup?id=${encodeURIComponent(a.storeId)}&country=fr`
                            : `https://itunes.apple.com/search?term=${encodeURIComponent(a.store)}&entity=software&country=fr&limit=1`;
      const d = await jsonp(url), r = (d.results || [])[0];
      const img = r && (r.artworkUrl512 || r.artworkUrl100);
      if (!img) continue;
      ICONS_STORE[iconKey(a)] = img;
      try{ localStorage.setItem('icons:v1', JSON.stringify(ICONS_STORE)); }catch{}
      document.querySelectorAll(`[data-icon="${CSS.escape(iconKey(a))}"]`).forEach(el => { el.classList.add('img'); el.style.setProperty('--img', `url("${img}")`); });
    }catch{}
    await new Promise(r => setTimeout(r, 250));
  }
}
const iconAttrs = a => { const k = iconKey(a), u = iconOf(a); return `${k ? ` data-icon="${esc(k)}"` : ''}${u ? ` data-has="1"` : ''}`; };

function tileHTML(a){
  if (a.type === 'folder'){
    const minis = FOLDERS[a.target].items.slice(0,4).map(i => { const u = iconOf(i);
      return `<i class="${u ? 'img' : ''}"${iconAttrs(i)} style="--c:var(${i.color})${u ? `;--img:url(&quot;${esc(u)}&quot;)` : ''}"></i>`; }).join('');
    return `<span class="tile folder">${minis}</span>`;
  }
  const inner = a.icon ? `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[a.icon]}</svg>` : `<span class="mono${String(a.mono).length > 3 ? ' long' : ''}">${esc(a.mono)}</span>`;
  const u = iconOf(a);
  return `<span class="tile${u ? ' img' : ''}"${iconAttrs(a)} style="--c:var(${a.color})${u ? `;--img:url(&quot;${esc(u)}&quot;)` : ''}">${inner}</span>`;
}
function appHTML(a, idx = 0){
  const body = `${tileHTML(a)}<span class="name">${esc(a.label)}</span>`;
  const delay = `style="animation-delay:${idx * 35}ms"`;
  if (a.app) return `<a class="app-btn" ${delay} href="${esc(a.app)}" data-app="${esc(a.app)}" data-alt="${esc(a.alt || '')}" data-web="${esc(a.web || '')}" aria-label="${esc(a.label)}">${body}</a>`;
  if (a.type === 'page') return `<a class="app-btn" ${delay} href="${esc(a.url)}" aria-label="${esc(a.label)}">${body}</a>`;
  if (!a.type || a.type === 'link') return `<a class="app-btn" ${delay} href="${esc(a.url)}" target="_blank" rel="noopener" aria-label="${esc(a.label)}">${body}</a>`;
  return `<button type="button" class="app-btn" ${delay} data-type="${a.type}" data-target="${a.target}" aria-label="${esc(a.label)}">${body}</button>`;
}

/* Ouverture d'une appli : appli → raccourci (alt) → site, en passant au suivant si rien ne s'ouvre en 1,5 s */
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-app]'); if (!a) return;
  e.preventDefault();
  const chain = [a.dataset.app, a.dataset.alt ? `shortcuts://run-shortcut?name=${encodeURIComponent(a.dataset.alt)}` : '', a.dataset.web].filter(Boolean);
  let left = false; const gone = () => { left = true; };
  document.addEventListener('visibilitychange', gone, {once:true});
  window.addEventListener('pagehide', gone, {once:true});
  window.addEventListener('blur', gone, {once:true});
  const next = i => {
    if (left || document.hidden || i >= chain.length) return;
    window.location.href = chain[i];
    setTimeout(() => next(i + 1), 1500);
  };
  next(0);
});

/* Widget À la une */
let headline = null;
function ago(t){
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return "à l'instant";
  if (m < 60) return `il y a ${m} min`;
  const h = Math.round(m / 60);
  if (h < 24) return `il y a ${h} h`;
  return new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
}
function renderWidget(){
  $('#wSrc').textContent = headline.source;
  $('#wDot').style.background = `var(${headline.color})`;
  $('#wTitle').textContent = headline.title;
  $('#wTime').textContent = headline.sample ? '' : ago(headline.date);
}
async function loadWidget(){
  try{
    const saved = JSON.parse(localStorage.getItem('actus:top'));
    if (saved && Date.now() - saved.date < 6 * 3600000){ headline = saved; renderWidget(); }
  }catch{}
  try{
    const r = await fetch(RSS_PROXY + encodeURIComponent(WIDGET_FEED.url));
    const j = await r.json();
    if (j.status !== 'ok' || !j.items.length) throw 0;
    const it = j.items[0];
    headline = {source:WIDGET_FEED.name, color:WIDGET_FEED.color, title:it.title,
           date:Date.parse((it.pubDate || '').replace(' ','T') + 'Z') || Date.now()};
  }catch{
    if (!headline) headline = {source:'À la une', color:'--t-slate', title:'Toutes les actus, classées par thème', sample:true};

}

/* Icônes météo (codes WMO) : soleil, éclaircies, nuages, brouillard, pluie, neige, orage */
const SUN = '<circle class="sun" cx="12" cy="12" r="4.2"/><path class="sun" d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>';
const MOON = '<path class="moon" d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"/>';
const CLOUD = (y = 0) => `<path class="cloud" transform="translate(0 ${y})" d="M7.5 18.5h9.5a3.6 3.6 0 0 0 .3-7.2 5.3 5.3 0 0 0-10.2 1.3 3 3 0 0 0 .4 5.9z"/>`;
const SMALL_SUN = '<g transform="translate(-3.5 -4) scale(.75)">' + SUN + '</g>';
const SMALL_MOON = '<g transform="translate(-2.5 -3) scale(.7)">' + MOON + '</g>';
function wxIcon(code, day){
  const sky = day ? SMALL_SUN : SMALL_MOON;
  if (code === 0) return day ? SUN : MOON;
  if (code <= 2) return sky + CLOUD(1);
  if (code === 3) return CLOUD();
  if (code === 45 || code === 48) return CLOUD(-2) + '<path class="cloud" d="M5 20.5h14M7 22.5h10"/>';
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return CLOUD(-3) + '<path class="snow" d="M8 19.5h.01M12 21h.01M16 19.5h.01M10 22.5h.01M14 22.5h.01"/>';
  if (code >= 95) return CLOUD(-3) + '<path class="bolt" d="m12.5 16-2 3.5h3l-2 3.5"/>';
  if (code >= 51) return CLOUD(-3) + '<path class="rain" d="m8.5 18.5-1 2.5M12.5 18.5l-1 2.5M16.5 18.5l-1 2.5"/>';
  return CLOUD();
}
const WX_FR = c => c === 0 ? 'Ciel dégagé' : c <= 2 ? 'Éclaircies' : c === 3 ? 'Couvert' : c === 45 || c === 48 ? 'Brouillard' : c >= 95 ? 'Orage'
  : (c >= 71 && c <= 77) || c === 85 || c === 86 ? 'Neige' : c >= 80 ? 'Averses' : c >= 61 ? 'Pluie' : c >= 51 ? 'Bruine' : '';
function renderWx(w){
  const el = $('#wx');
  if (!w){ el.innerHTML = ''; return; }
  el.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${wxIcon(w.code, w.day)}</svg><span>${Math.round(w.temp)}°</span>`;
  el.setAttribute('aria-label', `Météo : ${WX_FR(w.code)}, ${Math.round(w.temp)} degrés. Ouvrir Météo`);
  el.title = WX_FR(w.code);
}
async function loadWx(force){
  if (place.lat == null){ renderWx(null); return; }
  const key = `${place.lat.toFixed(2)},${place.lon.toFixed(2)}`, c = LS.get('meteo:v1', null);
  if (c && c.key === key) renderWx(c);
  if (!force && c && c.key === key && Date.now() - c.at < 20 * 60e3) return;
  try{
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${place.lat}&longitude=${place.lon}&current=temperature_2m,weather_code,is_day&timezone=auto`);
    const j = await r.json(), cur = j.current;
    const w = {key, at:Date.now(), code:cur.weather_code, temp:cur.temperature_2m, day:!!cur.is_day};
    LS.set('meteo:v1', w); renderWx(w);
  }catch{}
}
function setPlace(p){ place = p; LS.set('lieu:actuel', p); showPlace(); loadWx(true); }

const LOC = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 11 17-7.5L13 20.5l-2-7.5z"/></svg>';
const same = (a, b) => Math.abs(a.lat - b.lat) < .01 && Math.abs(a.lon - b.lon) < .01;

      <button type="button" class="pl-del" data-del="${i}" aria-label="Retirer ${esc(f.name)} des favoris">×</button></li>`).join('');

function openPlaces(){ lastFocus = document.activeElement; renderPlaces(); $('#placeMsg').textContent = ''; $('#placeResults').innerHTML = ''; $('#placeQuery').value = '';

function locate(){
  if (!navigator.geolocation){ $('#placeMsg').textContent = 'La localisation n\'est pas disponible sur cet appareil.'; return; }
  $('#placeMsg').textContent = 'Recherche de ta position…';
  navigator.geolocation.getCurrentPosition(async pos => {
    const lat = +pos.coords.latitude.toFixed(4), lon = +pos.coords.longitude.toFixed(4);
    let name = 'Ma position';
    try{
      const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=fr`);
      const j = await r.json(); name = j.city || j.locality || name;
    }catch{}
    setPlace({mode:'gps', name, lat, lon, at:Date.now()}); closePlaces();
  }, err => {
    $('#placeMsg').textContent = err.code === 1 ? 'Localisation refusée : autorise-la dans Réglages › Confidentialité › Service de localisation.' : 'Position introuvable pour l\'instant.';
  }, {enableHighAccuracy:false, timeout:12000, maximumAge:10 * 60e3});
}
$('#placeList').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.gps){ locate(); return; }
  if (b.dataset.del != null){ favs.splice(+b.dataset.del, 1); LS.set('lieu:favoris', favs); renderPlaces(); return; }
  if (b.dataset.fav != null){ setPlace({mode:'fav', ...favs[+b.dataset.fav]}); closePlaces(); }
});
let found = [];
$('#placeForm').addEventListener('submit', async e => {
  e.preventDefault();
  const q = $('#placeQuery').value.trim(); if (q.length < 2) return;
  $('#placeMsg').textContent = 'Recherche…'; $('#placeResults').innerHTML = '';
  try{
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=fr&format=json`);
    const j = await r.json();
    found = (j.results || []).map(x => ({name:x.name, region:x.admin2 || x.admin1 || x.country || '', lat:+x.latitude.toFixed(4), lon:+x.longitude.toFixed(4)}));
    $('#placeMsg').textContent = found.length ? 'Touche une ville pour l\'ajouter à tes favoris.' : 'Aucune ville trouvée.';
    $('#placeResults').innerHTML = found.map((f, i) => `<li class="pl-row"><button type="button" class="pl-pick" data-add="${i}">${PIN}<b>${esc(f.name)}</b><small>${esc(f.region)}</small></button></li>`).join('');
  }catch{ $('#placeMsg').textContent = 'Recherche impossible pour l\'instant.'; }
});
$('#placeResults').addEventListener('click', e => {
  const b = e.target.closest('[data-add]'); if (!b) return;
  const f = found[+b.dataset.add];
  if (!favs.some(x => same(x, f))){ favs.push(f); LS.set('lieu:favoris', favs); }
  setPlace({mode:'fav', ...f}); closePlaces();
});

tick(); setInterval(tick, 15000);
loadWidget();
showPlace(); loadWx();
if (place.mode === 'gps' && Date.now() - (place.at || 0) > 30 * 60e3 && navigator.permissions){       // position relue si déjà autorisée
  navigator.permissions.query({name:'geolocation'}).then(p => { if (p.state === 'granted') navigator.geolocation.getCurrentPosition(pos => {
    setPlace({...place, lat:+pos.coords.latitude.toFixed(4), lon:+pos.coords.longitude.toFixed(4), at:Date.now()}); }, () => {}, {timeout:12000, maximumAge:10 * 60e3}); }).catch(() => {});
}
setInterval(() => { if (!document.hidden) loadWx(); }, 10 * 60e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadWx(); });
</script>
