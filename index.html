body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<script src="config/config.js"></script>
<script>/* réglages du classeur (config/config.js) : CFG('sport.leagues', valeur par défaut) ; {re, flags} redevient une expression régulière */window.CFG=function(c,d){try{var v=c.split('.').reduce(function(o,k){return o==null?o:o[k]},window.MON_ECRAN_CONFIG);if(v==null)return d;return(function r(x){if(Array.isArray(x))return x.map(r);if(x&&typeof x==='object'){var k=Object.keys(x);if(k.length===2&&'re' in x&&'flags' in x)return new RegExp(x.re,x.flags);var o={};k.forEach(function(n){o[n]=r(x[n])});return o}return x})(v)}catch(e){return d}};</script>
<script>/* thème, mode clair/sombre (choisis dans État) et mise en page PC, avant l'affichage */try{const d=document.documentElement,p=localStorage.getItem('palette')||CFG('apparence.palette',''),m=localStorage.getItem('mode')||CFG('apparence.mode','');if(p&&p!=='bleu')d.dataset.palette=p;if(m==='clair')d.dataset.theme='light';else if(m==='sombre')d.dataset.theme='dark';const q=matchMedia('(min-width:1024px) and (hover:hover) and (pointer:fine)');d.classList.toggle('desk',q.matches);q.addEventListener&&q.addEventListener('change',e=>d.classList.toggle('desk',e.matches))}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600;700&display=swap">
<style>
/* Layout : fond en dégradé maillé ; rangée de 2 widgets carrés (heure + météo, À la une), grille d'apps 5 colonnes, bandeau d'accès rapides en bas */
:root{
  --base:#e7ecef;
  --blob-1:rgba(163,206,241,.95); --blob-2:rgba(96,150,186,.55); --blob-3:rgba(39,76,119,.35);
  --ink:#10233a; --ink-soft:#56636f;
  --glass:rgba(255,255,255,.22); --glass-tint:rgba(163,206,241,.10);
  --rim-1:rgba(255,255,255,.95); --rim-2:rgba(255,255,255,.12); --rim-3:rgba(255,255,255,.6);
  --spec:rgba(255,255,255,.55);
  --shadow:0 14px 34px -16px rgba(39,76,119,.45);
  --panel:#e7ecef; --card:rgba(255,255,255,.6); --line:rgba(39,76,119,.12);
  --accent:#274c77; --on-accent:#e7ecef;
  --t-brick:#274c77; --t-slate:#6096ba; --t-olive:#3d6b97; --t-plum:#1b3656;
  --t-teal:#4c86b0; --t-ochre:#8b8c89; --t-char:#2f3e50; --t-rose:#7fb0d8;
  --glyph:#ffffff;
  --f-ui:"Geist", -apple-system, "SF Pro Text", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --base:#08121f;
  --blob-1:rgba(39,76,119,.85); --blob-2:rgba(96,150,186,.45); --blob-3:rgba(163,206,241,.22);
  --ink:#e7ecef; --ink-soft:#a7b6c4;
  --glass:rgba(231,236,239,.07); --glass-tint:rgba(163,206,241,.06);
  --rim-1:rgba(231,236,239,.55); --rim-2:rgba(231,236,239,.04); --rim-3:rgba(163,206,241,.35);
  --spec:rgba(231,236,239,.16);
  --shadow:0 14px 34px -14px rgba(0,0,0,.75);
  --panel:#08121f; --card:rgba(231,236,239,.06); --line:rgba(231,236,239,.1); --accent:#a3cef1;
  --on-accent:#08121f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --base:#08121f;
  --blob-1:rgba(39,76,119,.85); --blob-2:rgba(96,150,186,.45); --blob-3:rgba(163,206,241,.22);
  --ink:#e7ecef; --ink-soft:#a7b6c4;
  --glass:rgba(231,236,239,.07); --glass-tint:rgba(163,206,241,.06);
  --rim-1:rgba(231,236,239,.55); --rim-2:rgba(231,236,239,.04); --rim-3:rgba(163,206,241,.35);
  --spec:rgba(231,236,239,.16);
  --shadow:0 14px 34px -14px rgba(0,0,0,.75);
  --panel:#08121f; --card:rgba(231,236,239,.06); --line:rgba(231,236,239,.1); --accent:#a3cef1;
  --on-accent:#08121f;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--f-ui);color:var(--ink);
  background-color:var(--base);
  background-image:
    radial-gradient(60% 45% at 10% 8%, var(--blob-1), transparent 70%),
    radial-gradient(55% 45% at 95% 35%, var(--blob-2), transparent 70%),
    radial-gradient(70% 50% at 30% 100%, var(--blob-3), transparent 70%);
  background-attachment:fixed;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color:transparent;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}

.app{height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column}

/* verre commun : fond très léger, flou fort, reflet en haut à gauche et liseré dégradé */
.glass{
  position:relative;isolation:isolate;
  background:linear-gradient(160deg, var(--glass), var(--glass-tint));
  box-shadow:var(--shadow);
  backdrop-filter:blur(30px) saturate(1.8) brightness(1.05);-webkit-backdrop-filter:blur(30px) saturate(1.8) brightness(1.05);
}
.glass::before,.tile::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 70% at 15% 0%, var(--spec), transparent 55%);
}
.glass::after,.tile::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(145deg, var(--rim-1), var(--rim-2) 35%, var(--rim-2) 65%, var(--rim-3));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}

/* ---------- Accueil ---------- */
#home{flex:1;display:flex;flex-direction:column;min-height:0;padding-block:16px 0}
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.w{aspect-ratio:1;max-width:100%;border-radius:32px;padding:16px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.w-label{font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.w-clock .time{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:opacity .4s, transform .4s}
.w-clock .time.appui{opacity:.55;transform:scale(.97)}
.w-clock .time{font-weight:200;font-size:clamp(2.9rem,15vw,3.8rem);line-height:.95;letter-spacing:-.045em;font-variant-numeric:tabular-nums;margin-top:auto;padding-right:.035em}
.w-clock .day{font-weight:600;font-size:.92rem;margin-top:8px;text-transform:capitalize;text-align:center}
.w-clock .time,.w-clock .day{align-self:center!important}
.w-clock a{color:inherit;text-decoration:none;display:block;align-self:flex-start;border-radius:10px}
.w-clock a:active{opacity:.6}
.w-clock .place{font-size:.78rem;color:var(--ink-soft);margin-top:2px;display:flex;align-items:center;gap:3px;align-self:flex-start;border-radius:8px;max-width:100%}
.w-clock .place span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-clock .place svg{width:11px;height:11px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.w-clock .place:active{opacity:.6}
.w-top{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.w-clock .wx{display:flex;align-self:auto;align-items:center;gap:4px;margin:-6px 0 0;padding:2px 4px;border-radius:12px;font-size:.92rem;font-weight:500;font-variant-numeric:tabular-nums}
.wx-more{margin-top:-6px;font-size:.72rem;line-height:1.25;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.wx-more b{font-weight:600;color:var(--ink)}
.wx svg{width:30px;height:30px;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.wx .sun{stroke:#e9a23b;fill:rgba(233,162,59,.18)}
.wx .moon{stroke:#8fa8c4;fill:rgba(143,168,196,.18)}
.wx .cloud{stroke:var(--ink-soft);fill:color-mix(in oklab, var(--base) 75%, transparent)}
.wx .rain{stroke:#4c86b0}
.wx .snow{stroke:#7fb0d8}
.wx .bolt{stroke:#e9a23b}
.wx:active{opacity:.6}
.w-news{gap:8px}
.w-news .src{display:flex;align-items:center;gap:6px}
.w-news .src i{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.w-news .headline{font-weight:600;font-size:.98rem;line-height:1.28;letter-spacing:-.01em;margin-top:auto;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.w-news .foot{display:flex;justify-content:space-between;font-size:.74rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.w-news .w-body{display:flex;flex-direction:column;gap:8px;margin-top:auto;min-width:0}
/* Avec l'image de l'article : photo en fond, bandeau flouté en bas, texte en blanc */
.w-news.has-img{padding:0;background:var(--wimg) center / cover no-repeat, var(--base)}
.w-news.has-img::before{background:linear-gradient(180deg, rgba(8,18,31,.42), transparent 34%)}
.w-news.has-img .src{position:absolute;top:14px;left:16px;right:16px}
.w-news.has-img .w-label{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-news.has-img .src i{box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.w-news.has-img .w-body{padding:11px 14px 13px;gap:6px;color:#fff;
  background:linear-gradient(180deg, rgba(8,18,31,.18), rgba(8,18,31,.5));
  backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border-top:1px solid rgba(255,255,255,.22)}
.w-news.has-img .headline{-webkit-line-clamp:3;font-size:.92rem;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.w-news.has-img .foot{color:rgba(255,255,255,.8)}
.w:active{transform:scale(.97)}
.w{transition:transform .15s ease}

.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px 12px;margin-top:20px;padding:0 2px}

/* Widget Spotify : pochette, titre, artiste, progression, commandes */
/* ---------- Écran d'ordinateur (grand écran + souris) : tableau de bord sur 3 colonnes ---------- */
.desk-only{display:none}
html.desk body{overflow:auto}
html.desk .app{max-width:1440px;height:auto;min-height:100%}
html.desk #home{display:grid;grid-template-columns:minmax(300px,340px) minmax(0,1fr) minmax(320px,380px);
  grid-template-areas:"clock news sport" "inv news sport" "spot news sport" "apps apps apps" "quick quick quick";
  grid-template-rows:auto auto 1fr auto auto;gap:18px;padding:28px 8px 20px;align-items:start}
html.desk .widgets{display:contents}
html.desk .w-clock{grid-area:clock;aspect-ratio:auto;min-height:230px}
html.desk .w-clock .time{font-size:4.2rem}
html.desk #newsWidget{display:none}
html.desk .w-inv{grid-area:inv;margin-top:0}
html.desk .w-spot{grid-area:spot;margin-top:0}
html.desk #deskNews{grid-area:news;display:flex;align-self:stretch}
html.desk #deskSport{grid-area:sport;display:flex;align-self:stretch}
html.desk .grid{grid-area:apps;display:flex;flex-wrap:wrap;justify-content:center;gap:18px 28px;margin-top:4px}
html.desk .grid .app-btn{width:92px}
html.desk .spacer{display:none}
html.desk .quick{grid-area:quick;justify-self:center;width:min(520px,100%)}
html.desk a[data-app][data-web=""] .tile,html.desk a.q[data-app][data-web=""]{opacity:.38}
html.desk .app-btn:hover .tile,html.desk .q:hover{transform:translateY(-2px);transition:transform .15s}
.dn,.ds{border-radius:30px;padding:18px 20px;flex-direction:column;gap:12px;min-width:0}
.d-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.d-head a{font-size:.8rem;font-weight:600;color:var(--accent)}
.dn-hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:center;color:inherit;text-decoration:none}
.dn-hero:not(:has(img)){grid-template-columns:1fr}
.dn-hero img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:18px;display:block;background:var(--card)}
.dn-hero b{overflow-wrap:anywhere;display:block;font-size:1.3rem;line-height:1.25;letter-spacing:-.015em;margin-top:6px}
.dn-hero p{margin:8px 0 0;font-size:.86rem;line-height:1.45;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dn-src{display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;color:var(--ink-soft)}
.dn-src i{width:8px;height:8px;border-radius:50%;flex:none}
.dn-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px}
.dn-it{display:flex;flex-direction:column;gap:4px;padding:11px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.dn-it b{font-size:.92rem;line-height:1.3;font-weight:600;overflow-wrap:anywhere}
.dn-it:hover b,.dn-hero:hover b,.ds-row:hover .ds-t{text-decoration:underline;text-underline-offset:3px}
.ds-sec{font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-top:4px}
.ds-row{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.ds-h{font-size:.82rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.ds-live{display:inline-block;padding:2px 6px;border-radius:6px;font-size:.62rem;font-weight:800;letter-spacing:.06em;background:#d6343c;color:#fff}
.ds-t{display:block;font-size:.86rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds-l{display:block;font-size:.7rem;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds-row.fav .ds-t::before{content:"★ ";color:#e0a100}
.d-empty{font-size:.86rem;color:var(--ink-soft);margin:0}
.d-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;padding:9px 16px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:.84rem;font-weight:600;box-shadow:0 10px 26px -10px rgba(0,0,0,.5)}

/* Widget Investissements (pleine largeur, montants masqués par défaut) */
.w-sport{margin-top:14px;border-radius:24px;padding:10px 14px 11px;display:flex;flex-direction:column;gap:6px}
.sb-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sb-brand{display:flex;align-items:center;gap:6px}
.sb-brand b{font-weight:800;font-size:.86rem;letter-spacing:.05em}
.sb-sub{font-size:.8rem;font-weight:700;font-style:italic;color:var(--accent)}
.sb-etat{font-size:.72rem;color:var(--ink-soft)}
.sb-etat.on{color:var(--ink);font-weight:600}
.sb-rows{display:flex;flex-direction:column;gap:4px}
.sb-vide{font-size:.82rem;color:var(--ink-soft)}
.pr-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:baseline;font-size:.86rem}
.pr-t{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;color:var(--accent);min-width:5.6em}
.pr-t.live{color:#d6343c}
.pr-m{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-tv{font-size:.72rem;color:var(--ink-soft);white-space:nowrap}
.pr-sc{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
html.desk .w-sport{display:none!important}
.w-sport .live-dot{box-shadow:0 0 0 2px color-mix(in oklab, var(--ink) 14%, transparent)}
.w-sport .live-dot.paused{background:transparent;box-shadow:inset 0 0 0 1.6px var(--ink-soft)}
html:not(.desk) .app-btn.live-app{display:none}
.w-inv{margin-top:14px;border-radius:28px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;position:relative}
.w-inv > a.inv-link::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:1}
.inv-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.inv-top .mk{min-width:0;font-size:.68rem;color:var(--ink-soft);display:flex;align-items:center;gap:5px;white-space:nowrap}
.inv-top .mk i{display:block;flex:none;width:7px;height:7px;border-radius:50%;background:#8b8c89}
.inv-top .mk:first-child{flex:none}
.inv-top .mk i.on{background:#1e8a4c}
.inv-body{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;align-items:stretch}
.inv-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.inv-tot{display:flex;align-items:center;gap:6px;font-weight:600;font-size:1.25rem;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.inv-tot.masq{letter-spacing:.06em}
.inv-eye{position:relative;z-index:2;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--accent);flex:none}
.inv-eye.ouvert{color:#1e7a46}
.inv-eye svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.inv-day{font-size:.82rem;font-weight:600;font-variant-numeric:tabular-nums}
.inv-spark{width:100%;height:30px;display:block;margin-top:auto}
.inv-vp{overflow:hidden;margin-top:auto;touch-action:pan-y}
.inv-track{display:flex;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.inv-slide{flex:0 0 100%;min-width:0;display:flex;flex-direction:column;gap:2px}
.inv-day small{font-weight:500;color:var(--ink-soft);font-size:.74rem}
.inv-day{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:5px;line-height:1.3}
.inv-day > span{white-space:nowrap}
.inv-axe{display:flex;justify-content:space-between;font-size:.62rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;margin-top:1px}
.inv-dots{display:flex;gap:2px;justify-content:center;position:relative;z-index:2;margin-top:2px}
.inv-dots button{width:22px;height:14px;display:grid;place-items:center}
.inv-dots button::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--ink-soft);opacity:.5;transition:width .2s}
.inv-dots button[aria-selected="true"]::before{width:14px;border-radius:3px;background:var(--accent);opacity:1}
@media (prefers-reduced-motion: reduce){ .inv-track{transition:none} }
.inv-r{display:flex;flex-direction:column;justify-content:center;gap:4px;padding-left:12px;border-left:1px solid var(--line);font-size:.78rem;font-variant-numeric:tabular-nums}
.inv-r div{display:flex;justify-content:space-between;gap:6px}
.inv-r span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-up{color:#1e7a46}.inv-down{color:#b4442c}.inv-flat{color:var(--ink-soft)}
:root[data-theme="dark"] .inv-up{color:#5fd08e} :root[data-theme="dark"] .inv-down{color:#ff8a70}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .inv-up{color:#5fd08e} :root:not([data-theme="light"]) .inv-down{color:#ff8a70} }
.inv-alert{min-width:0;font-size:.68rem;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(224,138,18,.16);color:#8a5200;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:root[data-theme="dark"] .inv-alert{color:#f0b04a}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .inv-alert{color:#f0b04a} }
.pin-scrim{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(8,18,31,.35)}
.pin-mini{width:min(300px,86vw);padding:18px;border-radius:24px;display:flex;flex-direction:column;gap:10px;position:relative}
.pin-mini h3{margin:0;font-size:1.05rem}
.pin-mini input{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;font:inherit;font-size:20px;letter-spacing:.3em;text-align:center;color:var(--ink)}
.pin-row{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.pin-row .sp-go{width:auto;margin:0;padding:10px 20px}
.inv-empty{font-size:.84rem;color:var(--ink-soft);align-self:center}
.w-spot{margin-top:14px;border-radius:28px;padding:10px 10px 10px 10px;display:flex;align-items:center;gap:12px;min-height:78px}
.sp-open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border-radius:16px}
.sp-art:active,.sp-link:active{opacity:.7}
.sp-art{width:58px;height:58px;border-radius:14px;flex:none;background:var(--card) center / cover no-repeat;display:grid;place-items:center;color:var(--ink-soft);box-shadow:0 6px 14px -8px rgba(0,0,0,.4)}
.sp-art svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sp-art.has svg{display:none}
.sp-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.sp-link{display:flex;flex-direction:column;gap:1px;min-width:0}
.sp-k{text-align:left;align-self:flex-start;max-width:100%}
.sp-k{font-size:.62rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-t{font-weight:600;font-size:.92rem;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-a{font-size:.78rem;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-bar{height:3px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.sp-bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px}
.sp-btns{display:flex;align-items:center;gap:0;flex:none}
.sp-btn{width:36px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.sp-btn svg{width:20px;height:20px;fill:currentColor}
.sp-btn.main{width:42px;height:42px;background:var(--accent);color:var(--on-accent)}
.sp-btn:active{transform:scale(.9)}
.sp-btn[disabled]{opacity:.35}
.sp-cta{flex:none;padding:9px 14px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:.82rem}
.sp-steps{margin:0 4px 12px;padding-left:20px;font-size:.86rem;line-height:1.45;display:flex;flex-direction:column;gap:8px}
.sp-steps a{text-decoration:underline}
.sp-uri{display:flex;gap:6px;align-items:center;margin-top:4px}
.sp-uri code{flex:1;min-width:0;font-size:.74rem;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px;overflow-wrap:anywhere}
.sp-mini{flex:none;padding:6px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:.78rem;font-weight:600}
.sp-go{width:100%;padding:11px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:600;text-align:center;margin-bottom:6px}
.sp-sep{border:0;border-top:1px solid var(--line);margin:12px 4px}
.sp-code{width:100%;font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:64px;resize:vertical;overflow-wrap:anywhere}
.app-btn{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.tile{
  width:100%;aspect-ratio:1;max-width:100%;border-radius:26%;
  display:grid;place-items:center;color:var(--glyph);position:relative;isolation:isolate;
  background:linear-gradient(160deg, color-mix(in oklab, var(--c) 55%, transparent), color-mix(in oklab, var(--c) 88%, transparent));
  /* pas de flou en direct sur chaque tuile (coûteux pour la batterie) : le dégradé presque opaque suffit */
  box-shadow:0 10px 22px -12px color-mix(in oklab, var(--c) 80%, black);
  transition:transform .2s cubic-bezier(.3,.7,.3,1.3);
}
.app-btn:active .tile{transform:scale(.9)}
.tile svg{width:50%;height:50%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.tile .mono.long{font-size:clamp(.62rem,2.6vw,.75rem)}
.tile .mono{font-weight:700;font-size:clamp(.8rem,3.6vw,1rem);letter-spacing:-.03em;text-shadow:0 1px 1px rgba(0,0,0,.18)}
.app-btn .name{font-size:.66rem;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* Tuile « LIVE Sports » : le point indique les directs (gris : aucun · jaune : en cours · vert : une de tes équipes) */
.live-tile .live-w{display:flex;flex-direction:column;align-items:flex-start;gap:0;color:var(--glyph, #fff)}
.live-row{display:flex;align-items:center;gap:4px}
.live-tile .live-dot{width:8px;height:8px}
.live-sub{margin:0 0 0 12px;font-size:clamp(.6rem,2.7vw,.74rem);font-weight:700;font-style:italic;letter-spacing:.02em;color:var(--sport-accent, #a3cef1);line-height:1}
.live-tile b{font-weight:800;font-size:clamp(.7rem,3.1vw,.86rem);letter-spacing:.05em;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.live-dot{width:9px;height:9px;border-radius:50%;background:#aeb4ba;box-shadow:0 0 0 2px rgba(255,255,255,.35);flex:none}
.live-dot.on{background:#f2c400;box-shadow:0 0 0 2px rgba(255,255,255,.55);animation:livepulse 1.6s ease-in-out infinite}
.live-dot.fav{background:#2fd16e;box-shadow:0 0 0 2px rgba(255,255,255,.6);animation:livepulse 1.6s ease-in-out infinite}
.live-dot.paused{background:transparent;box-shadow:inset 0 0 0 1.6px rgba(255,255,255,.75)}
@keyframes livepulse{50%{transform:scale(1.35);opacity:.75}}
.auto-off{font-size:.7rem;color:#b86e00}
.tile.folder{
  background:linear-gradient(160deg, var(--glass), var(--glass-tint));
  box-shadow:var(--shadow);
  backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10%;padding:16%;place-items:stretch}
.tile.folder i{border-radius:30%;display:block;min-width:0;min-height:0;
  background:linear-gradient(160deg, color-mix(in oklab, var(--c) 60%, transparent), var(--c))}
.tile.img,.tile.folder i.img{background:var(--img) center / cover no-repeat}
.tile.img{backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 8px 18px -10px rgba(0,0,0,.45)}
.tile.img > *,.tile.img::before{display:none}

.spacer{flex:1;min-height:14px}          /* au moins un peu d'air entre le dernier bloc et la barre du bas */
/* Témoin « État des données » : un simple rond au milieu du bandeau du bas (vert, orange, rouge) */
.etat{flex:none;width:28px;height:34px;display:grid;place-items:center;border-radius:10px}
.etat i{width:8px;height:8px;border-radius:50%;background:var(--lc, #8b8c89);opacity:.85;box-shadow:0 0 0 3px color-mix(in oklab, var(--lc, #8b8c89) 20%, transparent)}
.etat.ok{--lc:#1e8a4c}.etat.warn{--lc:#e08a12}.etat.err{--lc:#d63c3c}
.etat:active{opacity:.5}

.quick{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:0 4px;margin-bottom:12px}
.quick .q-side:last-child{justify-content:flex-end}
.q-side{display:flex;gap:7px}
.q{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--ink);position:relative;isolation:isolate}
/* petits boutons et dossiers posés sur le fond dégradé : le flou n'y change rien à l'œil, on l'enlève (batterie) */
.q.glass,.tile.folder{backdrop-filter:none;-webkit-backdrop-filter:none}
.q svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.q.img{background:var(--img) center / cover no-repeat;backdrop-filter:none;-webkit-backdrop-filter:none}
.q.img svg,.q.img::before{display:none}
.q:active{transform:scale(.9)}

@keyframes rise{from{transform:translateY(8px) scale(.96)}}

/* ---------- Dossier ---------- */
.scrim{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
  padding:max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
  background:rgba(8,12,16,.3);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);animation:fade .2s ease}
.folder-panel{width:min(100%,330px);animation:pop .28s cubic-bezier(.2,.9,.25,1.15)}
.folder-panel h3{font-weight:600;font-size:1.6rem;letter-spacing:-.03em;color:#fff;text-align:center;margin:0 0 16px;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.folder-box{border-radius:40px;padding:22px 18px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px 16px}
.folder-box .app-btn{animation:none}
/* Choix de navigation : Waze mis en avant */
.folder-box.nav-box .app-btn:first-child .tile{box-shadow:0 0 0 3px var(--accent), 0 10px 22px -10px rgba(0,0,0,.45)}
.folder-box.nav-box .app-btn:first-child .name{font-weight:700}
/* ---------- Choix du lieu ---------- */
.place-panel{width:min(100%,360px);border-radius:32px;padding:20px 16px 16px;animation:pop .28s cubic-bezier(.2,.9,.25,1.15);max-height:100%;overflow:auto}
.place-panel h3{font-weight:600;font-size:1.15rem;letter-spacing:-.02em;margin:0 4px 12px}
.pl-list{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:4px}
.pl-row{display:flex;align-items:center;gap:6px}
.pl-pick{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--card)}
.pl-pick[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.pl-pick b{font-weight:600}
.pl-pick small{opacity:.7;font-size:.78rem;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-pick svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pl-del{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink-soft);font-size:1.1rem}
.pl-search{display:flex;gap:6px;margin-bottom:8px}
.pl-search input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.pl-msg{font-size:.8rem;color:var(--ink-soft);margin:4px 4px 8px;min-height:1em}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.86)}}
/* ---------- Toucher visible et fondu entre les pages ---------- */
@view-transition{navigation:auto}
::view-transition-old(root),::view-transition-new(root){animation-duration:.22s}
.tap-dot{position:fixed;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;pointer-events:none;z-index:9999;
  background:radial-gradient(circle, color-mix(in oklab, var(--accent) 45%, transparent), color-mix(in oklab, var(--accent) 22%, transparent) 55%, rgba(255,255,255,.15) 72%);
  box-shadow:0 0 0 2.5px rgba(255,255,255,.9), 0 0 0 4px color-mix(in oklab, var(--accent) 45%, transparent), 0 4px 16px rgba(0,0,0,.22);animation:tapdot .6s ease-out forwards}
.maj-toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:9998;
  padding:10px 16px;border-radius:999px;background:var(--accent, #274c77);color:var(--on-accent, #e7ecef);font:600 .85rem/1.2 var(--f-ui, system-ui);box-shadow:0 10px 26px -10px rgba(0,0,0,.5);
  animation:majin .3s ease-out}
@keyframes majin{from{opacity:0;transform:translate(-50%, 10px)}}
@keyframes tapdot{from{transform:scale(.55);opacity:1}to{transform:scale(1.45);opacity:0}}
@media (prefers-reduced-motion: reduce){.tap-dot{animation:tapfade .5s ease-out forwards!important}@keyframes tapfade{to{opacity:0}}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ======================================================
   CONFIG — c'est ici qu'on ajoute / retire des "apps"
   type : "page" (page du projet), "folder" (dossier), "link" (site)
   app  : ouvre l'application installée (adresse spéciale de l'appli) ;
          web : site ouvert à la place si l'appli ne répond pas.
          Si une appli ne s'ouvre pas, remplacer app par
          'shortcuts://run-shortcut?name=NomDuRaccourci' (raccourci « Ouvrir l'app »)
   alt  : nom d'un raccourci essayé si l'appli ne s'ouvre pas
   star : true → l'appli apparaît dans son dossier ET seule sur l'accueil
   store: nom de l'appli sur l'App Store, pour afficher sa vraie icône
          (ou storeId:'123456789' pour viser une appli précise)
   ====================================================== */
/* Applis sans adresse fiable : ouvertes par un raccourci du même nom (app Raccourcis → « Ouvrir l'app ») */

/* Icônes App Store : récupérées une fois, puis gardées sur l'iPhone */
let ICONS_STORE = {};
try{ ICONS_STORE = JSON.parse(localStorage.getItem('icons:v1')) || {}; }catch{}
const iconKey = a => a.icon && !a.store && !a.storeId ? '' : a.storeId ? 'id:' + a.storeId : a.store ? 's:' + a.store : '';
const iconOf = a => { const k = iconKey(a); return k && ICONS_STORE[k] ? ICONS_STORE[k] : ''; };
function jsonp(url){
  return new Promise((ok, ko) => {
    const cb = '__ic' + Math.random().toString(36).slice(2), sc = document.createElement('script');
    const end = () => { clearTimeout(t); delete window[cb]; sc.remove(); };
    const t = setTimeout(() => { end(); ko(); }, 8000);
    window[cb] = d => { end(); ok(d); };
    sc.onerror = () => { end(); ko(); };
    sc.src = `${url}&callback=${cb}`;
    document.head.appendChild(sc);
  });
}
async function fetchIcons(){
  let rate = {}; try{ rate = JSON.parse(localStorage.getItem('icons:echecs')) || {}; }catch{}
  const noteEchec = k => { rate[k] = Date.now(); try{ localStorage.setItem('icons:echecs', JSON.stringify(rate)); }catch{} };
  // un logo introuvable n'est recherché à nouveau qu'après 7 jours
  const all = [...HOME, ...NAV_APPS, ...QUICK_LEFT, ...QUICK_RIGHT, ...Object.values(FOLDERS).flatMap(f => f.items)].filter(a => iconKey(a) && !(iconKey(a) in ICONS_STORE) && !(Date.now() - (rate[iconKey(a)] || 0) < 7 * 864e5));
  const todo = [...new Map(all.map(a => [iconKey(a), a])).values()];
  for (const a of todo){
    try{
      const url = a.storeId ? `https://itunes.apple.com/lookup?id=${encodeURIComponent(a.storeId)}&country=fr`
                            : `https://itunes.apple.com/search?term=${encodeURIComponent(a.store)}&entity=software&country=fr&limit=1`;
      const d = await jsonp(url), r = (d.results || [])[0];
      const img = r && (r.artworkUrl512 || r.artworkUrl100);
      if (!img){ noteEchec(iconKey(a)); continue; }
      ICONS_STORE[iconKey(a)] = img;
      try{ localStorage.setItem('icons:v1', JSON.stringify(ICONS_STORE)); }catch{}
      document.querySelectorAll(`[data-icon="${CSS.escape(iconKey(a))}"]`).forEach(el => { el.classList.add('img'); el.style.setProperty('--img', `url("${img}")`); });
    }catch{ if (navigator.onLine) rate[iconKey(a)] = Date.now() - 6 * 864e5; }   // erreur réseau : nouvel essai demain
    await new Promise(r => setTimeout(r, 250));
  }
  try{ localStorage.setItem('icons:echecs', JSON.stringify(rate)); }catch{}
}
const iconAttrs = a => { const k = iconKey(a), u = iconOf(a); return `${k ? ` data-icon="${esc(k)}"` : ''}${u ? ` data-has="1"` : ''}`; };

function tileHTML(a){

}

document.addEventListener('click', e => {

  if (DESK()){                                                        // sur PC : le site de l'appli s'il existe
    if (a.dataset.web) window.open(a.dataset.web, '_blank', 'noopener');
    else if (a.classList.contains('app-btn') || a.classList.contains('q')) toast(`${a.getAttribute('aria-label') || 'Cette appli'} : seulement sur iPhone`);
    return;
  }
  const chain = [a.dataset.app, a.dataset.alt ? `shortcuts://run-shortcut?name=${encodeURIComponent(a.dataset.alt)}` : '', a.dataset.web].filter(Boolean);
  let left = false; const gone = () => { left = true; };
  document.addEventListener('visibilitychange', gone, {once:true});
  window.addEventListener('pagehide', gone, {once:true});
  window.addEventListener('blur', gone, {once:true});
  const next = i => {
    if (left || document.hidden || i >= chain.length) return;
    window.location.href = chain[i];
    setTimeout(() => next(i + 1), 1500);
  };
  next(0);
});

/* Widget À la une */
let headline = null;
function ago(t){
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return "à l'instant";
  if (m < 60) return `il y a ${m} min`;
  const h = Math.round(m / 60);
  if (h < 24) return `il y a ${h} h`;
  return new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
}
/* Rafraîchissement automatique réglable dans la page État (sur cet iPhone seulement) */
const autoOn = k => { try{ const r = JSON.parse(localStorage.getItem('rafraichissement')) || {}; return r[k] !== false; }catch{ return true; } };
let wImg = '';
function renderWidget(){
  const w = $('#newsWidget'), img = headline.img || '';
  if (img !== wImg){                                     // l'image n'est posée qu'une fois chargée (sinon on garde le verre)
    wImg = img; w.classList.remove('has-img');
    if (img){ const pic = new Image(); pic.onload = () => { if (wImg === img){ w.style.setProperty('--wimg', `url("${img.replace(/"/g, '%22')}")`); w.classList.add('has-img'); } }; pic.src = img; }
  }
  $('#wSrc').textContent = headline.source;
  $('#wDot').style.background = (headline.color || '').startsWith('#') ? headline.color : `var(${headline.color || '--t-slate'})`;
  $('#wTitle').textContent = headline.title;
  $('#wTime').textContent = (headline.sample ? '' : ago(headline.date)) + (autoOn('actus') ? '' : ' · ⚠ auto coupé');
}
async function loadWidget(){
  try{
    const saved = JSON.parse(localStorage.getItem('actus:top'));
    if (saved && Date.now() - saved.date < 6 * 3600000){ headline = saved; renderWidget(); }
  }catch{}
  try{                                                   // actus préparées par la tâche GitHub (rapide)
    let r = await fetch('donnees/actus/une.json', {cache:'no-cache'});                 // 1 Ko au lieu de tout le fichier des actus
    if (r.status === 404) r = await fetch('donnees/actus/actus.json', {cache:'no-cache'}); // (le temps que la tâche « Actus » produise une.json)
    const j = r.ok ? await r.json() : null, fresh = j && Date.now() - Date.parse(j.updated) < 3 * 3600e3;
    const list = !fresh ? [] : j.top !== undefined ? (j.top ? [j.top] : []) : (((j.tabs || {}).une || {}).items || []);
    // même choix que la « une » de la page Actus : l'info la plus reprise, avec une image de préférence
    const score = i => (i.also || []).length * 2 + (i.img ? 1 : 0);
    const it = list.slice(0, 8).reduce((b, i) => !b || score(i) > score(b) ? i : b, null);
    if (it){ headline = {source:it.source, color:it.color || '--t-slate', title:it.title, date:it.date, img:it.img || ''}; renderWidget(); return; }
  }catch{}
  try{
    const r = await fetch(RSS_PROXY + encodeURIComponent(WIDGET_FEED.url));
    const j = await r.json();
    if (j.status !== 'ok' || !j.items.length) throw 0;
    const it = j.items[0];
    headline = {source:WIDGET_FEED.name, color:WIDGET_FEED.color, title:it.title,
           date:Date.parse((it.pubDate || '').replace(' ','T') + 'Z') || Date.now(),
           img:it.thumbnail || (it.enclosure && it.enclosure.link) || ''};
  }catch{
    if (!headline) headline = {source:'À la une', color:'--t-slate', title:'Toutes les actus, classées par thème', sample:true};
  }
  renderWidget();
}

/* Icônes météo (codes WMO) : soleil, éclaircies, nuages, brouillard, pluie, neige, orage */
const SUN = '<circle class="sun" cx="12" cy="12" r="4.2"/><path class="sun" d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>';
const MOON = '<path class="moon" d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"/>';
const CLOUD = (y = 0) => `<path class="cloud" transform="translate(0 ${y})" d="M7.5 18.5h9.5a3.6 3.6 0 0 0 .3-7.2 5.3 5.3 0 0 0-10.2 1.3 3 3 0 0 0 .4 5.9z"/>`;
const SMALL_SUN = '<g transform="translate(-3.5 -4) scale(.75)">' + SUN + '</g>';
const SMALL_MOON = '<g transform="translate(-2.5 -3) scale(.7)">' + MOON + '</g>';
function wxIcon(code, day){
  const sky = day ? SMALL_SUN : SMALL_MOON;
  if (code === 0) return day ? SUN : MOON;
  if (code <= 2) return sky + CLOUD(1);
  if (code === 3) return CLOUD();
  if (code === 45 || code === 48) return CLOUD(-2) + '<path class="cloud" d="M5 20.5h14M7 22.5h10"/>';
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return CLOUD(-3) + '<path class="snow" d="M8 19.5h.01M12 21h.01M16 19.5h.01M10 22.5h.01M14 22.5h.01"/>';
  if (code >= 95) return CLOUD(-3) + '<path class="bolt" d="m12.5 16-2 3.5h3l-2 3.5"/>';
  if (code >= 51) return CLOUD(-3) + '<path class="rain" d="m8.5 18.5-1 2.5M12.5 18.5l-1 2.5M16.5 18.5l-1 2.5"/>';
  return CLOUD();
}
const WX_FR = c => c === 0 ? 'Ciel dégagé' : c <= 2 ? 'Éclaircies' : c === 3 ? 'Couvert' : c === 45 || c === 48 ? 'Brouillard' : c >= 95 ? 'Orage'
  : (c >= 71 && c <= 77) || c === 85 || c === 86 ? 'Neige' : c >= 80 ? 'Averses' : c >= 61 ? 'Pluie' : c >= 51 ? 'Bruine' : '';
function renderWx(w){
  const el = $('#wx');
  if (!w){ el.innerHTML = ''; return; }
  el.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${wxIcon(w.code, w.day)}</svg><span>${Math.round(w.temp)}°</span>${autoOn('meteo') ? '' : '<span class="auto-off" title="Mise à jour auto coupée (page État)">⚠</span>'}`;
  el.setAttribute('aria-label', `Météo : ${WX_FR(w.code)}, ${Math.round(w.temp)} degrés${autoOn('meteo') ? '' : ' (mise à jour auto coupée)'}. Ouvrir Météo`);
  el.title = WX_FR(w.code);
  const more = $('#wxMore');
  if (more) more.innerHTML = w.max != null ? `max <b>${Math.round(w.max)}°</b>${w.pluie != null ? ` · pluie <b>${Math.round(w.pluie)} %</b>` : ''}` : '';
}
async function loadWx(force){
  if (place.lat == null){ renderWx(null); return; }
  const key = `${place.lat.toFixed(2)},${place.lon.toFixed(2)}`, c = LS.get('meteo:v1', null);
  if (c && c.key === key) renderWx(c);
  if (!force && c && c.key === key && c.max !== undefined && (Date.now() - c.at < 20 * 60e3 || !autoOn('meteo'))) return;   // mise à jour auto coupée : on garde la dernière météo
  try{
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${place.lat}&longitude=${place.lon}&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,precipitation_probability_max&forecast_days=1&timezone=auto`);
    const j = await r.json(), cur = j.current, d = j.daily || {};
    const w = {key, at:Date.now(), code:cur.weather_code, temp:cur.temperature_2m, day:!!cur.is_day,
      max:(d.temperature_2m_max || [])[0] ?? null, pluie:(d.precipitation_probability_max || [])[0] ?? null};   // maximum du jour et risque de pluie
    LS.set('meteo:v1', w); renderWx(w);
  }catch{}
}
function setPlace(p){ place = p; LS.set('lieu:actuel', p); showPlace(); loadWx(true); }

/* Fenêtre de choix : favoris, ma position, recherche d'une ville */
const PIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
const LOC = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 11 17-7.5L13 20.5l-2-7.5z"/></svg>';
const same = (a, b) => Math.abs(a.lat - b.lat) < .01 && Math.abs(a.lon - b.lon) < .01;
function renderPlaces(){
  const gps = place.mode === 'gps';
  $('#placeList').innerHTML = `<li class="pl-row"><button type="button" class="pl-pick" data-gps="1" aria-pressed="${gps}">${LOC}<b>Ma position</b>${gps && place.name ? `<small>${esc(place.name)}</small>` : ''}</button></li>`
    + favs.map((f, i) => `<li class="pl-row"><button type="button" class="pl-pick" data-fav="${i}" aria-pressed="${!gps && same(place, f)}">${PIN}<b>${esc(f.name)}</b><small>${esc(f.region || '')}</small></button>
      <button type="button" class="pl-del" data-del="${i}" aria-label="Retirer ${esc(f.name)} des favoris">×</button></li>`).join('');
}
function openPlaces(){ lastFocus = document.activeElement; renderPlaces(); $('#placeMsg').textContent = ''; $('#placeResults').innerHTML = ''; $('#placeQuery').value = '';
  $('#placeScrim').hidden = false; focusSi($('#placeList button')); }
function closePlaces(){ $('#placeScrim').hidden = true; focusSi(lastFocus); }
$('#placeBtn').addEventListener('click', openPlaces);
$('#placeScrim').addEventListener('click', e => { if (!e.target.closest('.place-panel')) closePlaces(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#placeScrim').hidden) closePlaces(); });
function locate(){
  if (!navigator.geolocation){ $('#placeMsg').textContent = 'La localisation n\'est pas disponible sur cet appareil.'; return; }
  $('#placeMsg').textContent = 'Recherche de ta position…';
  navigator.geolocation.getCurrentPosition(async pos => {
    const lat = +pos.coords.latitude.toFixed(4), lon = +pos.coords.longitude.toFixed(4);
    let name = 'Ma position';
    try{
      const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=fr`);
      const j = await r.json(); name = j.city || j.locality || name;
    }catch{}
    setPlace({mode:'gps', name, lat, lon, at:Date.now()}); closePlaces();
  }, err => {
    $('#placeMsg').textContent = err.code === 1 ? 'Localisation refusée : autorise-la dans Réglages › Confidentialité › Service de localisation.' : 'Position introuvable pour l\'instant.';
  }, {enableHighAccuracy:false, timeout:12000, maximumAge:10 * 60e3});
}
$('#placeList').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.gps){ locate(); return; }
  if (b.dataset.del != null){ favs.splice(+b.dataset.del, 1); LS.set('lieu:favoris', favs); if (window.Synchro) Synchro.prefsPlusTard(); renderPlaces(); return; }
  if (b.dataset.fav != null){ setPlace({mode:'fav', ...favs[+b.dataset.fav]}); closePlaces(); }
});
let found = [];
$('#placeForm').addEventListener('submit', async e => {
  e.preventDefault();
  const q = $('#placeQuery').value.trim(); if (q.length < 2) return;
  $('#placeMsg').textContent = 'Recherche…'; $('#placeResults').innerHTML = '';
  try{
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=fr&format=json`);
    const j = await r.json();
    found = (j.results || []).map(x => ({name:x.name, region:x.admin2 || x.admin1 || x.country || '', lat:+x.latitude.toFixed(4), lon:+x.longitude.toFixed(4)}));
    $('#placeMsg').textContent = found.length ? 'Touche une ville pour l\'ajouter à tes favoris.' : 'Aucune ville trouvée.';
    $('#placeResults').innerHTML = found.map((f, i) => `<li class="pl-row"><button type="button" class="pl-pick" data-add="${i}">${PIN}<b>${esc(f.name)}</b><small>${esc(f.region)}</small></button></li>`).join('');
  }catch{ $('#placeMsg').textContent = 'Recherche impossible pour l\'instant.'; }
});
$('#placeResults').addEventListener('click', e => {
  const b = e.target.closest('[data-add]'); if (!b) return;
  const f = found[+b.dataset.add];
  if (!favs.some(x => same(x, f))){ favs.push(f); LS.set('lieu:favoris', favs); if (window.Synchro) Synchro.prefsPlusTard(); }
  setPlace({mode:'fav', ...f}); closePlaces();
});

/* ---------- Widget Spotify (API officielle, connexion « PKCE » sans serveur) ----------
   Réglage une seule fois : une appli gratuite sur developer.spotify.com, dont on colle le Client ID ici.
   La page vérifie ce qui joue toutes les 3 s pendant la lecture (10 s en pause), seulement quand elle est affichée. */
const SP_API = 'https://api.spotify.com/v1', SP_ACC = 'https://accounts.spotify.com';
const SP_REDIRECT = location.origin + location.pathname.replace(/index\.html$/, '');
const SP_SCOPES = 'user-read-currently-playing user-read-playback-state user-modify-playback-state user-read-recently-played';
const SPI = {
  note:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5.5l11-2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>',
  play:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>',
  prev:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5.5" width="2.6" height="13" rx="1"/><path d="M19 5.5v13L9 12z"/></svg>',
  next:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="16.4" y="5.5" width="2.6" height="13" rx="1"/><path d="M5 5.5v13L15 12z"/></svg>'
};
let spId = LS.get('spotify:client', ''), spTok = LS.get('spotify:jeton', null);
let sp = {kind:'setup'}, spTimer = null, spTokPromise = null, spBusy = false;
const standalone = () => navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64urlTxt = t => b64url(new TextEncoder().encode(t));
const unb64url = t => new TextDecoder().decode(Uint8Array.from(atob(t.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0)));

async function spConnect(){
  const v = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const ch = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)));
  const state = b64urlTxt(JSON.stringify({v, id:spId}));        // le vérificateur revient avec la réponse : la connexion marche même si l'iPhone l'ouvre dans Safari
  location.href = `${SP_ACC}/authorize?` + new URLSearchParams({response_type:'code', client_id:spId, scope:SP_SCOPES, redirect_uri:SP_REDIRECT,
    code_challenge_method:'S256', code_challenge:ch, state});
}
function spSave(j){
  spTok = {access:j.access_token, refresh:j.refresh_token || (spTok && spTok.refresh), exp:Date.now() + (j.expires_in || 3600) * 1000};
  LS.set('spotify:jeton', spTok);
}
async function spTokenReq(body){
  const r = await fetch(`${SP_ACC}/api/token`, {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:new URLSearchParams(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error_description || j.error || 'jeton'), {status:r.status, code:j.error});
  return j;
}
async function spAccess(force){
  if (!spTok || !spTok.refresh) throw new Error('non connecté');
  if (!force && spTok.access && Date.now() < spTok.exp - 60e3) return spTok.access;
  if (!spTokPromise) spTokPromise = spTokenReq({grant_type:'refresh_token', refresh_token:spTok.refresh, client_id:spId})
    .then(j => { spSave(j); return spTok.access; })
    .catch(e => { if (e.code === 'invalid_grant'){ spTok = null; LS.set('spotify:jeton', null); } throw e; })
    .finally(() => { spTokPromise = null; });
  return spTokPromise;
}
async function spCall(method, path, retry = true){
  const r = await fetch(SP_API + path, {method, headers:{Authorization:'Bearer ' + await spAccess()}});
  if (r.status === 401 && retry){ await spAccess(true); return spCall(method, path, false); }
  if (r.status === 204 || r.status === 202) return null;
  const j = await r.json().catch(() => null);
  if (!r.ok) throw Object.assign(new Error((j && j.error && j.error.message) || 'Spotify'), {status:r.status, reason:j && j.error && j.error.reason, retry:+r.headers.get('Retry-After') || 0});
  return j;
}
/* Retour de la page de connexion Spotify */
async function spCallback(){
  const q = new URLSearchParams(location.search);
  if (!q.has('code') && !q.has('error')) return;
  history.replaceState(null, '', location.pathname);
  if (q.get('error')){ sp = {kind:'setup', msg:q.get('error') === 'access_denied' ? 'Connexion annulée.' : 'Spotify a refusé la connexion.'}; return; }
  try{
    const st = JSON.parse(unb64url(q.get('state') || ''));
    spId = st.id; LS.set('spotify:client', spId);
    spSave(await spTokenReq({grant_type:'authorization_code', code:q.get('code'), redirect_uri:SP_REDIRECT, client_id:spId, code_verifier:st.v}));
    if (!standalone()) spPanel('transfert');                 // ouvert dans Safari : on donne un code à coller dans l'appli de l'écran d'accueil
  }catch(e){ sp = {kind:'setup', msg:`Connexion impossible (${e.message}). Vérifie le Client ID et l'adresse de redirection.`}; }
}

const fmtMs = ms => { const s = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
function spProgress(){
  if (sp.kind !== 'track' || !sp.dur) return 0;
  return Math.min(sp.dur, sp.progress + (sp.playing ? Date.now() - sp.at : 0));
}
function spRender(){
  const el = $('#spot');
  if (sp.kind === 'setup'){
    el.innerHTML = `<div class="sp-open"><span class="sp-art">${SPI.note}</span><span class="sp-meta"><span class="sp-k">Spotify</span>
      <span class="sp-t">${spTok === null && spId ? 'Reconnexion nécessaire' : 'Ce que tu écoutes, ici'}</span><span class="sp-a">${esc(sp.msg || 'Connecte ton compte une fois pour l\'afficher')}</span></span></div>
      <button type="button" class="sp-cta" data-sp="setup">Connecter</button>`;
    return;
  }
  const t = sp.track || {}, art = t.img ? ` has" style="background-image:url(&quot;${esc(t.img)}&quot;)` : '';
  const head = (sp.kind === 'track' ? (sp.playing ? `En lecture${sp.device ? ' · ' + sp.device : ''}` : `En pause${sp.device ? ' · ' + sp.device : ''}`) : sp.kind === 'recent' ? 'Dernière écoute' : 'Spotify')
    + (sp.kind !== 'setup' && !autoOn('spotify') ? ' · ⚠ suivi auto coupé' : '');
  const app = `href="spotify://" data-app="${esc(t.uri || 'spotify://')}" data-web="https://open.spotify.com"`;
  el.innerHTML = `<div class="sp-open">
      <a class="sp-art${art}" ${app} aria-label="Ouvrir Spotify">${SPI.note}</a>
      <span class="sp-meta"><button type="button" class="sp-k" data-sp="setup" aria-label="${esc(head)} — réglages Spotify">${esc(head)}</button>
        <a class="sp-link" ${app} tabindex="-1"><span class="sp-t">${esc(t.name || 'Rien en lecture')}</span><span class="sp-a">${esc(t.artist || sp.msg || 'Lance un titre dans Spotify')}</span></a>
        ${sp.kind === 'track' ? `<span class="sp-bar" role="progressbar" aria-label="Progression" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="spBar"></i></span>` : ''}</span></div>
    <div class="sp-btns">
      <button type="button" class="sp-btn" data-sp="prev" aria-label="Titre précédent"${sp.kind !== 'track' ? ' disabled' : ''}>${SPI.prev}</button>
      <button type="button" class="sp-btn main" data-sp="toggle" aria-label="${sp.playing ? 'Pause' : 'Lecture'}">${sp.playing ? SPI.pause : SPI.play}</button>
      <button type="button" class="sp-btn" data-sp="next" aria-label="Titre suivant"${sp.kind !== 'track' ? ' disabled' : ''}>${SPI.next}</button>
    </div>`;
  spTick();
}
function spTick(){
  const bar = $('#spBar'); if (!bar || !sp.dur) return;
  const v = spProgress() / sp.dur * 100;
  bar.style.width = v.toFixed(1) + '%'; bar.parentElement.setAttribute('aria-valuenow', Math.round(v));
  bar.parentElement.title = `${fmtMs(spProgress())} / ${fmtMs(sp.dur)}`;
}
setInterval(() => { if (sp.kind === 'track' && sp.playing){ spTick(); if (spProgress() >= sp.dur && autoOn('spotify')) spPoll(1000); } }, 1000);

const trackOf = it => it ? {name:it.name, uri:it.uri,
  artist:(it.artists || []).map(a => a.name).join(', ') || (it.show && it.show.name) || '',
  img:(((it.album || it).images || [])[1] || ((it.album || it).images || [])[0] || {}).url || ''} : null;
async function spPoll(delay){
  clearTimeout(spTimer);
  if (delay){ spTimer = setTimeout(() => spPoll(), delay); return; }
  if (!spTok || !spId){ sp = {kind:'setup', msg:sp.msg}; spRender(); return; }
  if (document.hidden) return;
  let wait = 10e3;
  try{
    const p = await spCall('GET', '/me/player?additional_types=episode');
    if (p && p.item){
      sp = {kind:'track', track:trackOf(p.item), playing:!!p.is_playing, progress:p.progress_ms || 0, dur:p.item.duration_ms || 0, at:Date.now(), device:p.device && p.device.name};
      wait = p.is_playing ? 3000 : 10e3;
    } else {
      const r = await spCall('GET', '/me/player/recently-played?limit=1').catch(() => null);
      sp = {kind:'recent', track:trackOf(r && r.items && r.items[0] && r.items[0].track), playing:false};
      wait = 20e3;
    }
  }catch(e){
    if (!spTok){ sp = {kind:'setup', msg:'Reconnecte ton compte Spotify.'}; spRender(); return; }
    sp = {...sp, msg:e.status === 429 ? 'Spotify demande de patienter…' : 'Spotify ne répond pas pour l\'instant.'};
    wait = e.retry ? e.retry * 1000 : 30e3;
  }
  spRender();
  if (autoOn('spotify')) spTimer = setTimeout(() => spPoll(), wait);   // coupé dans État : une lecture à l'ouverture et après chaque commande
}
async function spCommand(what){
  if (spBusy) return; spBusy = true;
  try{
    if (what === 'toggle'){
      if (sp.playing){ sp.progress = spProgress(); sp.at = Date.now(); }
      sp.playing = !sp.playing; spRender();                                   // réponse immédiate à l'écran
      await spCall('PUT', `/me/player/${sp.playing ? 'play' : 'pause'}`);
    } else await spCall('POST', `/me/player/${what === 'next' ? 'next' : 'previous'}`);
    spPoll(450);
  }catch(e){
    if (e.status === 404 || e.reason === 'NO_ACTIVE_DEVICE'){ sp.msg = 'Aucun appareil actif : ouvre Spotify'; window.location.href = 'spotify://'; }
    else if (e.status === 403) sp.msg = e.reason === 'PREMIUM_REQUIRED' ? 'Commandes réservées à Spotify Premium' : 'Commande refusée par Spotify';
    spPoll(800);
  }finally{ spBusy = false; }
}
/* Fenêtre de réglage : création de l'appli Spotify, connexion, code de transfert */
function spPanel(mode = 'setup'){
  lastFocus = document.activeElement;
  const box = $('#spPanel');
  if (mode === 'transfert'){
    const code = b64urlTxt(JSON.stringify({id:spId, r:spTok.refresh}));
    box.innerHTML = `<h3 id="spTitle">Spotify est connecté ✓</h3>
      <p class="pl-msg">Si le widget de ton écran d'accueil affiche encore « Connecter », copie ce code puis, dans Mon Écran, touche <b>Connecter</b> → <b>Coller un code</b>.</p>
      <textarea class="sp-code" readonly aria-label="Code de transfert">${esc(code)}</textarea>
      <button type="button" class="sp-go" data-sp="copy" data-v="${esc(code)}">Copier le code</button>
      <button type="button" class="sp-mini" data-sp="close">Fermer</button>`;
  } else {
    const on = !!(spTok && spTok.refresh);
    box.innerHTML = `<h3 id="spTitle">${on ? 'Spotify' : 'Connecter Spotify'}</h3>
      ${on ? `<p class="pl-msg">Compte connecté. Le widget se met à jour pendant la lecture.</p>
        <button type="button" class="sp-go" data-sp="logout">Déconnecter</button>` : `
      <ol class="sp-steps">
        <li>Ouvre <a href="https://developer.spotify.com/dashboard" target="_blank" rel="noopener">developer.spotify.com/dashboard</a>, connecte-toi avec ton compte Spotify et touche <b>Create app</b>.</li>
        <li>Donne-lui un nom (ex. « Mon Écran »), coche <b>Web API</b> et colle cette adresse dans <b>Redirect URIs</b> :
          <span class="sp-uri"><code>${esc(SP_REDIRECT)}</code><button type="button" class="sp-mini" data-sp="copy" data-v="${esc(SP_REDIRECT)}">Copier</button></span></li>
        <li>Enregistre, puis copie le <b>Client ID</b> de l'appli et colle-le ici :</li>
      </ol>
      <form class="pl-search" data-sp-form="id"><input id="spIdIn" value="${esc(spId)}" placeholder="Client ID" aria-label="Client ID Spotify" autocapitalize="off" autocorrect="off" spellcheck="false"></form>
      <button type="button" class="sp-go" data-sp="login">Se connecter à Spotify</button>
      <hr class="sp-sep">
      <p class="pl-msg">Déjà connecté dans Safari ? Colle le code de transfert :</p>
      <textarea class="sp-code" id="spCodeIn" aria-label="Code de transfert"></textarea>
      <button type="button" class="sp-mini" data-sp="paste">Valider le code</button>`}
      <p class="pl-msg" id="spMsg" role="status">${esc(sp.msg || '')}</p>`;
  }
  $('#spScrim').hidden = false;
  focusSi(box.querySelector('input,button'));
}
function spClose(){ $('#spScrim').hidden = true; focusSi(lastFocus); }
$('#spScrim').addEventListener('click', e => { if (!e.target.closest('#spPanel')) spClose(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#spScrim').hidden) spClose(); });
document.addEventListener('submit', e => { if (e.target.matches('[data-sp-form]')){ e.preventDefault(); $('#spPanel [data-sp="login"]').click(); } });
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-sp]'); if (!b) return;
  e.preventDefault(); e.stopPropagation();
  const what = b.dataset.sp, msg = t => { const m = $('#spMsg'); if (m) m.textContent = t; };
  if (what === 'setup') return spPanel();
  if (what === 'close') return spClose();
  if (['toggle', 'next', 'prev'].includes(what)) return spCommand(what);
  if (what === 'copy'){
    try{ await navigator.clipboard.writeText(b.dataset.v); b.textContent = 'Copié ✓'; }
    catch{ const ta = $('#spPanel textarea, #spPanel code'); if (ta && ta.select) ta.select(); b.textContent = 'Sélectionné : copie-le'; }
    return;
  }
  if (what === 'login'){
    const id = ($('#spIdIn').value || '').trim();
    if (!/^[0-9a-f]{32}$/i.test(id)) return msg('Le Client ID fait 32 caractères (chiffres et lettres a à f).');
    spId = id; LS.set('spotify:client', id); spConnect(); return;
  }
  if (what === 'paste'){
    try{
      const c = JSON.parse(unb64url(($('#spCodeIn').value || '').trim()));
      if (!c.id || !c.r) throw 0;
      spId = c.id; LS.set('spotify:client', spId); spTok = {refresh:c.r, access:'', exp:0}; LS.set('spotify:jeton', spTok);
      await spAccess(true); sp = {kind:'idle'}; spClose(); spPoll();
    }catch{ spTok = null; LS.set('spotify:jeton', null); msg('Code non reconnu ou expiré : reconnecte-toi dans Safari.'); }
    return;
  }
  if (what === 'logout'){ spTok = null; LS.set('spotify:jeton', null); sp = {kind:'setup'}; spClose(); spRender(); }
}, true);
document.addEventListener('visibilitychange', () => { if (!document.hidden) spPoll(); else clearTimeout(spTimer); });
spCallback().finally(() => { spRender(); spPoll(); });

/* ---------- Pastille d'état des données (lit etat.json, fait par la tâche « Publication ») ---------- */
async function loadEtat(){
  try{
    const r = await fetch('etat.json', {cache:'no-cache'}); if (!r.ok) throw 0;
    const e = await r.json(), h = t => t ? (Date.now() - Date.parse(t)) / 36e5 : Infinity;
    const lv = [
      !e.sport ? 2 : h(e.sport.updated) < 5 && !e.sport.ligues.some(l => l.erreur) ? 0 : h(e.sport.updated) < 12 ? 1 : 2,
      !e.tv ? 1 : h(e.tv.updated) < 5 ? 0 : h(e.tv.updated) < 12 ? 1 : 2,
      !e.actus ? 1 : h(e.actus.updated) < 1.5 && e.actus.sources.every(s => s.ok) ? 0 : h(e.actus.updated) < 6 ? 1 : 2
    ], m = Math.max(...lv);
    const el = $('#etatBtn'), txt = ['Données à jour', 'Données à vérifier', 'Données en panne'][m];
    el.className = 'etat ' + ['ok', 'warn', 'err'][m];
    el.setAttribute('aria-label', `État des données : ${txt}`); el.title = txt;
  }catch{}
}
loadEtat(); setInterval(() => { if (!document.hidden) loadEtat(); }, 15 * 60e3);

/* ---------- Widget Investissements : lignes saisies sur la page Investissements (sur cet iPhone), cours préparés par la tâche « Marchés » ---------- */
const INV_IDX = (l => l ? l.map(c => [c, ((CFG('marches.indices', []).find(i => i.code === c) || {}).nom || c).replace(' / ', '/')])   // classeur : « Widget accueil » de l'onglet Marchés

/* Échelles du widget (on glisse de l'une à l'autre) : la journée en cours (cours toutes les 5 min), le mois en cours, l'année en cours */
const INV_PER = [['jour', "aujourd'hui"], ['mois', new Date().toLocaleDateString('fr-FR', {month:'long'})], ['an', String(new Date().getFullYear())]];
let invPer = Math.min(2, Math.max(0, +LS.get('invest:widget-per', 0) || 0));
function invRefs(){
  const d = new Date(), today = Math.floor(Date.now() / 864e5);
  return {today, mois:Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), 1) / 864e5) - 1, an:Math.floor(Date.UTC(d.getFullYear(), 0, 1) / 864e5) - 1};
}
function invCalc(){
  const perim = LS.get('invest:perimetre', 'tout') === 'ct' ? 'ct' : 'tout';
  const L = LS.get('invest:lignes', []).filter(l => perim === 'tout' || l.compte === perim); if (!L.length) return null;
  let tot = 0, prev = 0, fixe = 0; const cotes = [];
  L.forEach(l => {
    const c = l.type === 'manuel' ? null : invQuote(l.code), q = invNum(l.qte), f = c ? invFx(c.cur) : null;
    if (!c || q == null || f == null){ const v = invNum(l.valeur) || 0; tot += v; prev += v; fixe += v; return; }
    tot += q * c.px * f; prev += q * (c.prev ?? c.px) * f; cotes.push({q, cur:c.cur, s:invSer(c), j:c.j && c.j.c && c.j.c.length > 1 ? c.j : null, px:c.px, pp:c.prev ?? c.px, f});
  });
  const valAt = d => fixe + cotes.reduce((s, x) => s + x.q * (invAt2(x.s, d) ?? 0) * (invFx(x.cur, d) ?? 0), 0);
  const R = invRefs(), refOk = d => cotes.length && cotes.every(x => x.s.length && x.s[0][0] <= d);
  const sparkFrom = d0 => { const days = new Set(); cotes.forEach(x => x.s.forEach(([d]) => { if (d >= d0) days.add(d); })); return [...days].sort((a, b) => a - b).map(valAt); };

  const avecJ = cotes.filter(x => x.j), jd = avecJ.length ? Math.max(...avecJ.map(x => x.j.d)) : null;
  const sj = avecJ.filter(x => x.j.d === jd);

  const axeJour = times.length > 1 ? [new Date(times[0] * 1000), new Date(times[times.length - 1] * 1000)].map(d => d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})) : null;
  const per = {jour:{v:prev > 0 ? tot / prev - 1 : null, e:tot - prev, spark:sparkJour, axe:axeJour,

      axe:[new Date((d + 1) * 864e5).toLocaleDateString('fr-FR', {day:'numeric', month:'short'}).replace('.', ''), "auj."]}; });
  return {tot, day:per.jour.v, per, perim};
}
function invIdxVar(c, k){

  const ref = k === 'mois' ? q.m0 : q.y0; if (ref) return q.px / ref - 1;          // préparé par la tâche « Marchés »
  const R = invRefs(), s = invSer(q), d = R[k];

async function pinMini(ok){
  const r = LS.get('invest:pin', null); if (!r){ ok(); return; }
  const sha = async t => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)))].map(x => x.toString(16).padStart(2, '0')).join('');
  const box = document.createElement('div'); box.className = 'scrim pin-scrim';
  box.innerHTML = `<form class="place-panel glass pin-mini" role="dialog" aria-modal="true" aria-label="Code des montants"><h3>Déverrouiller</h3>
    <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" aria-label="Code" placeholder="Code">
    <p class="pl-msg" aria-live="polite"></p><div class="pin-row"><button type="button" class="sp-mini" data-x>Annuler</button><button type="submit" class="sp-go">OK</button></div></form>`;
  document.body.appendChild(box);
  const f = box.querySelector('form'), inp = f.querySelector('input'), msg = f.querySelector('.pl-msg'); inp.focus();
  const close = () => box.remove();
  box.addEventListener('click', e => { if (e.target === box || e.target.closest('[data-x]')) close(); });
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const t = LS.get('invest:pin-essais', {n:0, jusqu:0});
    if (t.jusqu > Date.now()){ msg.textContent = `Trop d'essais : réessaie dans ${Math.ceil((t.jusqu - Date.now()) / 1000)} s.`; return; }
    if (await sha(r.sel + inp.value) === r.h){ LS.set('invest:pin-essais', {n:0, jusqu:0}); close(); ok(inp.value); return; }
    t.n++; if (t.n >= 5){ t.n = 0; t.jusqu = Date.now() + 30e3; } LS.set('invest:pin-essais', t);
    msg.textContent = t.jusqu > Date.now() ? 'Trop d\'essais : attends 30 s.' : `Code incorrect (essai ${t.n}/5).`; inp.value = ''; inp.focus();
  });
}

(() => {
  const c = $('#clock'); if (!c) return;
  // Sur iPhone, un appui long sur un lien ouvre l'aperçu du lien et interrompt le geste : on prend la main sur le toucher
  // (l'appui court ouvre toujours l'Horloge).
  let t = null, t2 = null, fired = false, moved = false, sx = 0, sy = 0, enCours = false;
  const stop = () => { clearTimeout(t); clearTimeout(t2); c.classList.remove('appui'); enCours = false; };
  const debut = (x, y) => { fired = false; moved = false; sx = x; sy = y; enCours = true;
    t2 = setTimeout(() => c.classList.add('appui'), 1500);                   // petit signe à mi-chemin
    t = setTimeout(() => { fired = true; stop(); try{ navigator.vibrate && navigator.vibrate(15); }catch{} ouvrirCoffre(); }, 3000); };
  const bouge = (x, y) => { if (enCours && Math.abs(x - sx) + Math.abs(y - sy) > 12){ moved = true; stop(); } };
  c.addEventListener('touchstart', e => { e.preventDefault(); const p = e.touches[0]; debut(p.clientX, p.clientY); }, {passive:false});
  c.addEventListener('touchmove', e => { const p = e.touches[0]; bouge(p.clientX, p.clientY); }, {passive:true});
  c.addEventListener('touchend', e => { e.preventDefault(); const court = enCours && !fired && !moved; stop();
    if (court) c.click(); }, {passive:false});                              // appui court : comportement normal du lien
  c.addEventListener('touchcancel', stop);
  c.addEventListener('mousedown', e => { if (e.button === 0) debut(e.clientX, e.clientY); });   // ordinateur
  c.addEventListener('mousemove', e => bouge(e.clientX, e.clientY));
  ['mouseup', 'mouseleave'].forEach(ev => c.addEventListener(ev, () => { if (enCours) stop(); }));
  c.addEventListener('contextmenu', e => e.preventDefault());
  c.addEventListener('dragstart', e => e.preventDefault());
  window.addEventListener('click', e => { if (fired && e.target.closest('#clock')){ e.preventDefault(); e.stopImmediatePropagation(); fired = false; } }, true);
})();
