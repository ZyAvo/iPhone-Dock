*,*::before,*::after{box-sizing:border-box}
body{

/* verre */
.glass{position:relative;isolation:isolate;background:linear-gradient(160deg, var(--glass), var(--glass-tint));box-shadow:var(--shadow);
  backdrop-filter:blur(30px) saturate(1.8) brightness(1.05);-webkit-backdrop-filter:blur(30px) saturate(1.8) brightness(1.05)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 70% at 15% 0%, var(--spec), transparent 55%)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(145deg, var(--rim-1), var(--rim-2) 35%, var(--rim-2) 65%, var(--rim-3));

    <div class="top">
      <a class="back" href="sport.html"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Sport</a>
      <span class="top-actions"><button class="icon-btn glass" id="invBtn" type="button" aria-label="Inviter des amis" hidden><svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>
      <button class="icon-btn glass" id="refreshBtn" type="button" aria-label="Actualiser"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button></span>
    </div>
    <div class="title-row"><h1>Pronos</h1><span class="stamp" id="stamp"></span></div>
  </div>
</header>
<main><div class="wrap" id="out"><p class="vide">Chargement…</p></div></main>

<script>
/* Pronos entre amis (v50, module d'essai ; v55 : mode partagé branché).
   Matchs : calendriers déjà publiés par la tâche Sport (donnees/sport/<compétition>.json), compétitions CFG('pronos.ligues').
   Points : score exact 3, bon résultat (vainqueur ou nul) 1 ; classements du mois et de la saison.
   Deux modes, même interface (objet BASE) :
   - simulation (aucune adresse dans CFG('pronos.api')) : tout reste sur cet appareil (clé pronos:sim), avec 3 amis fictifs ;
   - partagé : appli web Google Apps Script (outils/pronos/Code.gs) qui garde les joueurs et les pronos dans un Google Sheets,
     refuse un prono après le coup d'envoi et ne montre ceux des autres qu'une fois le match commencé. */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
const LS = {get(k, d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? d; }catch{ return d; } }, set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }};
const LIGUES = CFG('pronos.ligues', [{id:'fra.1', f:'fra-1', nom:'Ligue 1'}, {id:'270559', f:'270559', nom:'Top 14'}, {id:'uefa.champions', f:'uefa-champions', nom:'Ligue des champions'}]);
// v55 : serveur de test de Yoann (Apps Script, compte perso) en attendant la ligne pronos.api du classeur — à retirer avant de rendre le dock public.
const API_TEST = 'https://script.google.com/macros/s/AKfycby6vzzsVzPJ8DuTBqexvEqGBnqMGZy2Os5RU5DDvTxEAvUwFlbH9S9StR2nVjpLuGCLug/exec';
const API = String(CFG('pronos.api', API_TEST) || '').trim();
const SIM = !API;
const JOURS_AVANT = 7, JOURS_APRES = 45;
const hm = t => new Date(t).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
const jourDe = t => new Date(t).toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
const moisDe = t => new Date(t).toISOString().slice(0, 7);
const q = new URLSearchParams(location.search);

/* ---------- points ---------- */
const issue = (h, a) => h > a ? 1 : h < a ? 2 : 0;
function points(p, m){
  if (!p || m.state !== 'post' || m.home.score === '' || m.away.score === '') return null;
  const H = +m.home.score, A = +m.away.score;
  if (+p[0] === H && +p[1] === A) return 3;
  return issue(+p[0], +p[1]) === issue(H, A) ? 1 : 0;
}

/* ---------- simulation : tout sur cet appareil, 3 amis fictifs ---------- */
const AMIS = ['Lucas', 'Inès', 'Théo'];
const hash = s => { let h = 2166136261; for (const c of String(s)) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };
function pronoFictif(nom, m){              // tirage stable : même ami, même match → même prono
  const r = hash(nom + m.id), rugby = m.league === '270559';
  if (rugby){ const a = 10 + r % 25, b = 8 + (r >>> 5) % 25; return [a, b]; }
  return [(r % 7) % 4, ((r >>> 3) % 6) % 3];
}
const SIMU = {
  etat(){ return LS.get('pronos:sim', {moi:null, groupe:'', p:{}}); },
  garder(s){ LS.set('pronos:sim', s); },
  async inscrire(pseudo, pin, groupe){ const s = this.etat(); s.moi = {pseudo, pin}; s.groupe = groupe; this.garder(s); return {ok:true}; },
  moi(){ const s = this.etat(); return s.moi ? {...s.moi, groupe:s.groupe} : null; },
  async parier(m, h, a){ if (Date.now() >= m.t) return {err:'ferme'}; const s = this.etat(); s.p[m.id] = [h, a, Date.now()]; this.garder(s); return {ok:true}; },
  async tout(matchs){
    const s = this.etat(), moi = s.moi.pseudo, pr = {};
    for (const m of matchs){
      const l = {};
      if (s.p[m.id]) l[moi] = s.p[m.id].slice(0, 2);
      if (Date.now() >= m.t) AMIS.forEach((n, i) => { if (hash(n + m.id) % 10 < 8) l[n] = pronoFictif(n, m); });   // amis : 8 matchs sur 10, visibles une fois le match commencé
      if (Object.keys(l).length) pr[m.id] = l;
    }
    return {joueurs:[moi, ...AMIS], pronos:pr};
  },
  remplirPasses(matchs){ const s = this.etat(); matchs.filter(m => m.state === 'post' && !s.p[m.id]).forEach(m => { if (hash('moi' + m.id) % 10 < 9) s.p[m.id] = [...pronoFictif('Moi' + s.moi.pseudo, m), m.t - 3600e3]; }); this.garder(s); },
  effacer(){ localStorage.removeItem('pronos:sim'); }
};
/* ---------- partagé : appli web Apps Script (requête « simple » text/plain : pas de pré-vérification CORS) ---------- */
const DISTANT = {
  async appel(action, x){ const r = await fetch(API, {method:'POST', body:JSON.stringify({action, ...x})}); if (!r.ok) throw new Error('reseau'); return r.json(); },
  moi(){ return LS.get('pronos:moi', null); },
  async inscrire(pseudo, pin, groupe){ const r = await this.appel('inscrire', {pseudo, pin, groupe}); if (r.ok) LS.set('pronos:moi', {pseudo, pin, groupe}); return r; },
  async parier(m, h, a){ const me = this.moi(); return this.appel('parier', {...me, match:m.id, ligue:m.league, h, a}); },
  async tout(matchs){ const me = this.moi(); return this.appel('etat', {...me}); },
  effacer(){ localStorage.removeItem('pronos:moi'); }
};
const BASE = SIM ? SIMU : DISTANT;

/* ---------- matchs ---------- */
let MATCHS = [], ETAT = {joueurs:[], pronos:{}}, PANNE = '', VUE = LS.get('pronos:vue', 'jouer'), PERIODE = 'mois';
async function chargerMatchs(){
  const now = Date.now(), out = [];
  await Promise.all(LIGUES.map(async L => { try{
    const j = await (await fetch(`donnees/sport/${L.f}.json`, {cache:'no-cache'})).json();
    (j.events || []).forEach(e => { if (e.home && e.away && e.t > now - JOURS_APRES * 86400e3 && e.t < now + JOURS_AVANT * 86400e3 && !/POSTPONED|CANCEL/.test(e.code || '')) out.push({...e, nomL:L.nom}); });
  }catch{} }));
  MATCHS = out.sort((a, b) => a.t - b.t);
}

/* ---------- affichage ---------- */
function rendre(){
  const me = BASE.moi(), out = $('#out');
  $('#stamp').textContent = SIM ? 'Simulation' : me ? me.groupe : '';
  $('#invBtn').hidden = !me;
  const bandeau = (SIM ? `<div class="bandeau glass"><span>🧪</span><span><b>Mode simulation</b> : tes pronos restent sur cet appareil, face à 3 amis fictifs. Les matchs et les résultats sont les vrais.</span></div>` : '')
    + (PANNE ? `<div class="bandeau glass"><span>⚠️</span><span>${esc(PANNE)}</span></div>` : '');
  if (!me){ out.innerHTML = bandeau + inscriptionHTML(); return; }
  const ong = `<div class="ong glass" role="tablist">${[['jouer', 'À pronostiquer'], ['res', 'Résultats'], ['cl', 'Classement']].map(([k, t]) => `<button type="button" role="tab" data-vue="${k}" aria-selected="${VUE === k}">${t}</button>`).join('')}</div>`;
  out.innerHTML = bandeau + ong + (VUE === 'jouer' ? jouerHTML(me) : VUE === 'res' ? resHTML(me) : clHTML(me));
}
function inscriptionHTML(){
  const g = (q.get('groupe') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
  return `<form class="carte glass" id="inscr"><h2>Rejoindre le groupe</h2>
    <p>${g ? `Tu as été invité dans le groupe <b>${esc(g)}</b>.` : 'Entre le code du groupe (ou crée-en un en inventant un code).'} Choisis un pseudo et un code à 4 chiffres : il te servira à te reconnecter sur un autre appareil.</p>
    <label class="champ">Groupe<input name="groupe" value="${esc(g || (SIM ? 'AMIS' : ''))}" autocapitalize="characters" autocomplete="off" maxlength="8" required></label>
    <label class="champ">Pseudo<input name="pseudo" autocomplete="nickname" maxlength="20" required></label>
    <label class="champ">Code (4 chiffres)<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required></label>
    <div class="btns"><button class="btn main" type="submit">Rejoindre</button></div><p class="msg" id="iMsg" role="status"></p></form>`;
}
const quitter = me => SIM ? '' : `<div class="carte glass"><h2>Cet appareil</h2><p>Connecté en tant que <b>${esc(me.pseudo)}</b> dans le groupe <b>${esc(me.groupe)}</b>. Tes pronos restent sur le serveur : tu peux revenir avec le même pseudo et le même code.</p>
  <div class="btns"><button type="button" class="btn" data-quitter>Changer de joueur ou de groupe</button></div></div>`;
const ligneEq = (m, droite) => `<span class="eq${droite ? ' d' : ''}">${esc((droite ? m.away : m.home).name)}</span>`;
function parJour(l, f){ let j = '', h = ''; for (const m of l){ const d = jourDe(m.t); if (d !== j){ j = d; h += `<p class="jour">${esc(d)}</p>`; } h += f(m); } return h; }
function jouerHTML(me){
  const now = Date.now(), l = MATCHS.filter(m => m.state !== 'post' && m.t > now - 3 * 3600e3);
  if (!l.length) return '<p class="vide">Aucun match dans les 7 prochains jours pour ces compétitions.</p>';
  return parJour(l, m => { const p = ((ETAT.pronos[m.id] || {})[me.pseudo]) || ['', ''], ferme = now >= m.t;
    return `<div class="pm glass" data-m="${esc(m.id)}"><span class="pm-h"><b>${esc(m.nomL)}</b><span>${ferme ? (m.state === 'in' ? 'En cours · fermé' : 'Fermé') : hm(m.t)}</span></span>
      ${ligneEq(m)}<span class="sc"><input inputmode="numeric" maxlength="3" aria-label="Score ${esc(m.home.name)}" value="${esc(p[0])}"${ferme ? ' disabled' : ''} data-c="0"><span>–</span><input inputmode="numeric" maxlength="3" aria-label="Score ${esc(m.away.name)}" value="${esc(p[1])}"${ferme ? ' disabled' : ''} data-c="1"></span>${ligneEq(m, true)}
      <span class="pm-b" data-etat>${ferme ? autresHTML(m, me) : p[0] !== '' ? '<span class="ok">✓ enregistré</span>' : `Ouvert jusqu'au coup d'envoi (${hm(m.t)})`}</span></div>`; });
}
function autresHTML(m, me){
  const l = ETAT.pronos[m.id] || {};
  return Object.entries(l).sort(([a], [b]) => (b === me.pseudo) - (a === me.pseudo)).map(([n, p]) => { const pt = points(p, m);
    return `<span class="chip${n === me.pseudo ? ' moi' : ''}${pt === 3 ? ' p3' : pt === 1 ? ' p1' : ''}">${esc(n)} ${esc(p[0])}–${esc(p[1])}${pt != null ? ` · ${pt} pt${pt > 1 ? 's' : ''}` : ''}</span>`; }).join('') || 'Aucun prono';
}
function resHTML(me){
  const l = MATCHS.filter(m => m.state === 'post' && ETAT.pronos[m.id]).reverse();
  if (!l.length) return '<p class="vide">Pas encore de match terminé avec des pronos.</p>' + (SIM ? simOutils() : '');
  return parJour(l, m => `<div class="pm glass"><span class="pm-h"><b>${esc(m.nomL)}</b><span>${hm(m.t)}</span></span>
    ${ligneEq(m)}<span class="sc"><span class="res">${esc(m.home.score)} – ${esc(m.away.score)}</span></span>${ligneEq(m, true)}<span class="pm-b">${autresHTML(m, me)}</span></div>`);
}
function classement(per){
  const mois = moisDe(Date.now()), T = {};
  ETAT.joueurs.forEach(n => { T[n] = {n, pts:0, ex:0, nb:0}; });
  MATCHS.filter(m => m.state === 'post' && (per === 'saison' || moisDe(m.t) === mois)).forEach(m => Object.entries(ETAT.pronos[m.id] || {}).forEach(([n, p]) => {
    const pt = points(p, m); if (pt == null) return; const x = T[n] || (T[n] = {n, pts:0, ex:0, nb:0}); x.pts += pt; x.nb++; if (pt === 3) x.ex++; }));
  return Object.values(T).sort((a, b) => b.pts - a.pts || b.ex - a.ex || a.nb - b.nb || a.n.localeCompare(b.n));
}
function clHTML(me){
  const l = classement(PERIODE);
  return `<div class="ong glass" role="tablist">${[['mois', 'Ce mois-ci'], ['saison', 'Saison']].map(([k, t]) => `<button type="button" role="tab" data-per="${k}" aria-selected="${PERIODE === k}">${t}</button>`).join('')}</div>
    <div class="cl glass"><div class="cl-r t"><span>#</span><span>Joueur</span><span class="n">Pronos</span><span class="n">Exacts</span><span class="pts">Pts</span></div>
    ${l.map((x, i) => `<div class="cl-r${x.n === me.pseudo ? ' moi' : ''}"><b>${i + 1}</b><span>${esc(x.n)}</span><span class="n">${x.nb}</span><span class="n">${x.ex}</span><span class="pts">${x.pts}</span></div>`).join('')}</div>
    <p class="note">Score exact : 3 points · bon résultat (vainqueur ou nul) : 1 point. À égalité : le plus de scores exacts, puis le moins de pronos.${PERIODE === 'saison' ? ` Saison = les ${JOURS_APRES} derniers jours dans cet essai.` : ''}</p>` + (SIM ? simOutils() : quitter(me));
}
const simOutils = () => `<div class="carte glass"><h2>Outils de simulation</h2><p>Pour voir le classement vivre tout de suite : des pronos tirés au hasard pour toi sur les matchs déjà joués.</p>
  <div class="btns"><button type="button" class="btn" data-sim="remplir">Simuler mes pronos passés</button><button type="button" class="btn" data-sim="effacer">Tout effacer</button></div></div>`;

/* ---------- actions ---------- */
async function actualiser(){
  $('#refreshBtn').classList.add('spin');
  PANNE = '';
  try{ await chargerMatchs(); if (BASE.moi()){ try{ ETAT = await BASE.tout(MATCHS); if (ETAT.err) throw new Error(ETAT.err); }
    catch(e){ ETAT = {joueurs:[], pronos:{}};
      if (e.message === 'code'){ BASE.effacer(); PANNE = 'Pseudo ou code non reconnu par le serveur : reconnecte-toi.'; }      // v55 : plus de page vide sans explication
      else PANNE = 'Serveur des pronos injoignable : les pronos affichés peuvent être incomplets. Réessaie avec ↻.'; } } rendre(); }
  finally{ $('#refreshBtn').classList.remove('spin'); }
}
document.addEventListener('submit', async e => {
  if (e.target.id !== 'inscr') return; e.preventDefault();
  const f = new FormData(e.target), groupe = String(f.get('groupe')).toUpperCase().replace(/[^A-Z0-9]/g, ''), pseudo = String(f.get('pseudo')).trim(), pin = String(f.get('pin'));
  const msg = t => { $('#iMsg').textContent = t; };
  if (!groupe || !pseudo || !/^\d{4}$/.test(pin)) return msg('Groupe, pseudo et code à 4 chiffres.');
  if (SIM && AMIS.includes(pseudo)) return msg('Pseudo déjà pris dans ce groupe.');
  try{ const r = await BASE.inscrire(pseudo, pin, groupe);
    if (!r.ok) return msg(r.err === 'pris' ? 'Ce pseudo existe déjà dans le groupe : mauvais code ?' : 'Inscription refusée.');
    actualiser(); }catch{ msg('Serveur des pronos injoignable.'); }
});
const enAttente = {};
document.addEventListener('input', e => {
  const i = e.target.closest('.sc input'); if (!i) return;
  i.value = i.value.replace(/\D/g, '').slice(0, 3);
  const box = i.closest('[data-m]'), id = box.dataset.m, m = MATCHS.find(x => x.id === id), [a, b] = box.querySelectorAll('input'), et = box.querySelector('[data-etat]');
  clearTimeout(enAttente[id]);
  if (a.value === '' || b.value === ''){ et.textContent = 'Complète les deux scores'; return; }
  et.textContent = 'Enregistrement…';
  enAttente[id] = setTimeout(async () => {
    try{ const r = await BASE.parier(m, +a.value, +b.value);
      if (r.ok){ const me = BASE.moi(); (ETAT.pronos[id] || (ETAT.pronos[id] = {}))[me.pseudo] = [+a.value, +b.value]; et.innerHTML = '<span class="ok">✓ enregistré</span>'; }
      else et.textContent = {ferme:'Trop tard : le match a commencé.', code:'Pseudo ou code non reconnu : actualise la page.', match:'Match pas encore connu du serveur : réessaie dans 10 min.'}[r.err] || 'Refusé par le serveur.'; }
    catch{ et.textContent = 'Pas enregistré (réseau) : réessaie.'; }
  }, 600);
});
document.addEventListener('click', async e => {
  const v = e.target.closest('[data-vue]'); if (v){ VUE = v.dataset.vue; LS.set('pronos:vue', VUE); rendre(); return; }
  const p = e.target.closest('[data-per]'); if (p){ PERIODE = p.dataset.per; rendre(); return; }
  if (e.target.closest('[data-quitter]')){ BASE.effacer(); ETAT = {joueurs:[], pronos:{}}; rendre(); return; }
  const s = e.target.closest('[data-sim]');
  if (s && SIM){ if (s.dataset.sim === 'remplir'){ SIMU.remplirPasses(MATCHS); } else if (confirm('Effacer la simulation (pseudo et pronos) ?')) SIMU.effacer(); else return; actualiser(); return; }
});
$('#refreshBtn').addEventListener('click', actualiser);
$('#invBtn').addEventListener('click', async () => {
  const me = BASE.moi(), url = `${location.origin}${location.pathname}?groupe=${encodeURIComponent(me.groupe)}`;
  const t = `Rejoins mon groupe de pronos ${me.groupe} :`;
  try{ if (navigator.share){ await navigator.share({title:'Pronos', text:t, url}); return; } await navigator.clipboard.writeText(`${t} ${url}`); alert('Lien copié : ' + url); }catch{}
});
setInterval(() => { if (!document.hidden && VUE === 'jouer' && BASE.moi()) rendre(); }, 60e3);   // fermeture au coup d'envoi sans recharger
actualiser();
</script>
