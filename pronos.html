/* Layout : en-tête collant en verre (retour, actualiser, titre) ; une carte par source de données
   (résumé coloré en tête, détails dépliables) */
:root{
  --base:#e7ecef;
  --blob-1:rgba(163,206,241,.95); --blob-2:rgba(96,150,186,.55); --blob-3:rgba(39,76,119,.35);
  --ink:#10233a; --ink-soft:#56636f;
  --glass:rgba(255,255,255,.22); --glass-tint:rgba(163,206,241,.10);
  --rim-1:rgba(255,255,255,.95); --rim-2:rgba(255,255,255,.12); --rim-3:rgba(255,255,255,.6);
  --spec:rgba(255,255,255,.55);
  --shadow:0 14px 34px -16px rgba(39,76,119,.45);
  --head:rgba(231,236,239,.72);
  --card:rgba(255,255,255,.6); --line:rgba(39,76,119,.12);
  --accent:#274c77; --on-accent:#e7ecef;
  --t-brick:#274c77; --t-slate:#6096ba; --t-olive:#3d6b97; --t-plum:#1b3656;
  --t-teal:#4c86b0; --t-ochre:#8b8c89; --t-char:#2f3e50; --t-rose:#7fb0d8;
  --f-ui:"Geist", -apple-system, "SF Pro Text", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --base:#08121f;
  --blob-1:rgba(39,76,119,.85); --blob-2:rgba(96,150,186,.45); --blob-3:rgba(163,206,241,.22);
  --ink:#e7ecef; --ink-soft:#a7b6c4;
  --glass:rgba(231,236,239,.07); --glass-tint:rgba(163,206,241,.06);
  --rim-1:rgba(231,236,239,.55); --rim-2:rgba(231,236,239,.04); --rim-3:rgba(163,206,241,.35);
  --spec:rgba(231,236,239,.16);
  --shadow:0 14px 34px -14px rgba(0,0,0,.75);
  --head:rgba(8,18,31,.66);
  --card:rgba(231,236,239,.06); --line:rgba(231,236,239,.1); --accent:#a3cef1; --on-accent:#08121f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --base:#08121f;
  --blob-1:rgba(39,76,119,.85); --blob-2:rgba(96,150,186,.45); --blob-3:rgba(163,206,241,.22);
  --ink:#e7ecef; --ink-soft:#a7b6c4;
  --glass:rgba(231,236,239,.07); --glass-tint:rgba(163,206,241,.06);
  --rim-1:rgba(231,236,239,.55); --rim-2:rgba(231,236,239,.04); --rim-3:rgba(163,206,241,.35);
  --spec:rgba(231,236,239,.16);
  --shadow:0 14px 34px -14px rgba(0,0,0,.75);
  --head:rgba(8,18,31,.66);
  --card:rgba(231,236,239,.06); --line:rgba(231,236,239,.1); --accent:#a3cef1; --on-accent:#08121f;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;font-family:var(--f-ui);color:var(--ink);
  background-color:var(--base);
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--head);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}

/* verre */
.glass{position:relative;isolation:isolate;background:linear-gradient(160deg, var(--glass), var(--glass-tint));box-shadow:var(--shadow);
  backdrop-filter:blur(30px) saturate(1.8) brightness(1.05);-webkit-backdrop-filter:blur(30px) saturate(1.8) brightness(1.05)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 70% at 15% 0%, var(--spec), transparent 55%)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(145deg, var(--rim-1), var(--rim-2) 35%, var(--rim-2) 65%, var(--rim-3));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

.wrap{max-width:560px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

html.desk .wrap{max-width:860px}
/* ---------- Choix du thème ---------- */
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}
.th{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:16px;background:var(--card);border:2px solid transparent;text-align:left;min-height:44px}
.th[aria-checked="true"]{border-color:var(--accent)}
.themes .th b{font-size:.88rem;letter-spacing:0}
.th small{font-size:.72rem;color:var(--ink-soft)}
.modes{display:flex;gap:2px;padding:3px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin:2px 0 4px}
.modes button{flex:1;padding:8px 6px;border-radius:11px;font-size:.84rem;font-weight:500;color:var(--ink-soft);min-height:36px}
.modes button[aria-checked="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.pals{display:flex;flex-direction:column;border-radius:16px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.pl-row{display:flex;align-items:center;gap:12px;padding:10px 12px;text-align:left;min-height:52px;border-top:1px solid var(--line)}
.pl-row:first-child{border-top:0}
.pl-row .pal{flex:none;width:78px}
.pl-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pl-t b{font-size:.9rem}
.pl-t small{font-size:.74rem;color:var(--ink-soft)}
.pl-row .ok{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}
.pl-row[aria-checked="true"] .ok{border-color:var(--accent);background:radial-gradient(circle, var(--accent) 0 5px, transparent 6px)}
.pl-row[aria-checked="true"]{background:var(--accent-soft, rgba(127,127,127,.08))}
.pal{display:flex;height:24px;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.pal i{flex:1}
/* ---------- Interrupteurs ---------- */
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.sw-row small{display:block;color:var(--ink-soft);font-size:.78rem;margin-top:2px}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;border-radius:99px;background:rgba(139,140,137,.45);position:relative;cursor:pointer;transition:background .2s;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw:checked{background:#2fa35a}
.sw:checked::after{transform:translateX(18px)}
/* ---------- En-tête ---------- */
header{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--head);
  backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);
  border-bottom:1px solid var(--line)}
header .wrap{padding-block:10px 12px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.back{display:flex;align-items:center;gap:2px;color:var(--accent);font-weight:500;font-size:1rem;padding-block:6px}
.back svg,.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn{color:var(--accent);width:38px;height:38px;display:grid;place-items:center;border-radius:50%}
.icon-btn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.title-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-weight:700;font-size:2.2rem;letter-spacing:-.035em;margin:0;line-height:1}
.stamp{font-size:.74rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}

.tabs{display:flex;gap:4px;padding:4px;border-radius:18px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;scroll-snap-align:center;padding:8px 14px;border-radius:14px;font-size:.85rem;font-weight:500;color:var(--ink-soft);white-space:nowrap;
  transition:background .2s ease,color .2s ease}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}

/* ---------- État ---------- */
main .wrap{padding-block:14px 40px;display:flex;flex-direction:column;gap:12px}
.sum{border-radius:24px;padding:16px 18px;display:flex;align-items:center;gap:14px}
.sum b{font-size:1.1rem;letter-spacing:-.01em}
.sum p{margin:2px 0 0;font-size:.82rem;color:var(--ink-soft)}
.lamp{width:14px;height:14px;border-radius:50%;flex:none;background:var(--lc);box-shadow:0 0 0 4px color-mix(in oklab, var(--lc) 22%, transparent)}
.ok{--lc:#1e8a4c}.warn{--lc:#e08a12}.err{--lc:#d63c3c}.none{--lc:#8b8c89}
.part{border-radius:24px;overflow:hidden}
.part > summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.part > summary::-webkit-details-marker{display:none}
.part > summary .t{flex:1;min-width:0}
.part > summary b{display:block;font-size:1rem}
.part > summary small{display:block;font-size:.8rem;color:var(--ink-soft);margin-top:2px}
.part > summary .chev{width:18px;height:18px;fill:none;stroke:var(--ink-soft);stroke-width:2;transition:transform .2s ease}
.part[open] > summary .chev{transform:rotate(90deg)}
.body{padding:0 16px 14px;font-size:.84rem}
.rows{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.rows th,.rows td{text-align:left;padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
.rows th{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;border-top:0}
.rows td.n{text-align:right;white-space:nowrap}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:600;background:color-mix(in oklab, var(--lc) 16%, transparent);color:color-mix(in oklab, var(--lc) 80%, var(--ink))}
.note{color:var(--ink-soft);font-size:.8rem;margin:8px 0 0;line-height:1.45}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, monospace;font-size:.72rem;overflow-wrap:anywhere;color:var(--ink-soft)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{padding:10px 14px;border-radius:14px;font-weight:600;font-size:.86rem;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.main{background:var(--accent);color:var(--on-accent);border-color:transparent}
.sv-code{width:100%;font:12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;word-break:break-all}
.sv-form label,.sv-pinl{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.sv-form input,.sv-pin{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-width:220px}
#sauvZone .actions{margin-top:8px}
#syZone .actions{margin-top:8px}
.ct-jauge{position:relative;height:10px;border-radius:99px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;margin:4px 0 8px}
.ct-jauge i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px}
.ct-jauge span{position:absolute;top:0;bottom:0;width:2px;background:#e08a12}
.sy-row{display:flex;gap:8px;align-items:center}
.sy-row input{flex:1;max-width:none!important;font:13px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace!important}
#syForm label input[name=jeton]{max-width:none}
.sy-etapes{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sy-etapes a{color:var(--accent);text-decoration:underline}
/* ---------- Toucher visible et fondu entre les pages ---------- */
@view-transition{navigation:auto}
::view-transition-old(root),::view-transition-new(root){animation-duration:.22s}

  background:radial-gradient(circle, color-mix(in oklab, var(--accent) 45%, transparent), color-mix(in oklab, var(--accent) 22%, transparent) 55%, rgba(255,255,255,.15) 72%);
  box-shadow:0 0 0 2.5px rgba(255,255,255,.9), 0 0 0 4px color-mix(in oklab, var(--accent) 45%, transparent), 0 4px 16px rgba(0,0,0,.22);animation:tapdot .6s ease-out forwards}

  padding:10px 16px;border-radius:999px;background:var(--accent, #274c77);color:var(--on-accent, #e7ecef);font:600 .85rem/1.2 var(--f-ui, system-ui);box-shadow:0 10px 26px -10px rgba(0,0,0,.5);
  animation:majin .3s ease-out}


@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* Thèmes de couleurs et fond dégradé : themes.js (v42) */

/* ---------- Écarts de cotes ---------- */
.filtres{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px 0}
.chips::-webkit-scrollbar{display:none}
.chips .lab{flex:none;align-self:center;font-size:.72rem;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-right:2px;min-width:74px}
.chip{flex:none;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:.8rem;font-weight:500;white-space:nowrap;min-height:34px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.ec{border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.ec-h{display:flex;align-items:baseline;gap:8px;min-width:0}
.ec-h b{font-size:.96rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ec-h small{margin-left:auto;flex:none;font-size:.72rem;color:var(--ink-soft);white-space:nowrap}
.ec-rows{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;column-gap:10px;row-gap:5px;align-items:center;font-variant-numeric:tabular-nums}
.ec-rows > span{white-space:nowrap}
.ec-i{font-size:.84rem;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis}
.ec-c{font-size:.9rem}.ec-c b{font-weight:700}
.ec-m{font-size:.78rem;color:var(--ink-soft)}
.ec-p{justify-self:end;padding:2px 9px;border-radius:999px;font-weight:700;font-size:.82rem;background:var(--accent);color:var(--on-accent)}
.sum-l{display:flex;align-items:center;gap:10px;font-size:.84rem;color:var(--ink-soft);margin:-2px 2px 0}
.sum-l b{color:var(--ink)}
.icon-btn .nb{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:.66rem;font-weight:700;display:grid;place-items:center}
#filtreBtn{position:relative}
.top-actions{display:flex;gap:8px}
.f-bg{position:fixed;inset:0;z-index:50;background:var(--scrim, rgba(0,0,0,.35));display:flex;align-items:flex-end;justify-content:center}
.f-bg[hidden]{display:none}
.f-sheet{width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom, 0px));background:var(--sheet-solid, var(--base));display:flex;flex-direction:column;gap:12px;box-shadow:0 -10px 30px -12px rgba(0,0,0,.5)}
html.desk .f-bg{align-items:center}
html.desk .f-sheet{border-radius:26px}
.f-sheet h2{margin:0;font-size:1.1rem}
.f-sheet h3{margin:0 0 6px;font-size:.72rem;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
.f-sheet .chips{flex-wrap:wrap;overflow:visible}
.f-ok{padding:11px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:600}
.vide{border-radius:20px;padding:16px;font-size:.86rem;line-height:1.45}
.risque{font-size:.72rem;color:var(--ink-soft);line-height:1.45;text-align:center;margin:6px 0 0}
.risque a{color:var(--accent)}

/* ---------- Pronos (v50 ; v56 : présentation « fun ») ---------- */
.bandeau{border-radius:18px;padding:10px 14px;font-size:.8rem;color:var(--ink-soft);display:flex;gap:10px;align-items:center}
.bandeau b{color:var(--ink)}
.carte{border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px}
.carte h2{margin:0;font-size:1.05rem}
.carte p{margin:0;font-size:.84rem;color:var(--ink-soft);line-height:1.45}
.champ{display:flex;flex-direction:column;gap:5px;font-size:.78rem;color:var(--ink-soft)}
.champ input{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:9px 16px;border-radius:14px;font-weight:600;font-size:.88rem;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.main{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.p-lien{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}

.b-lien{align-items:flex-start}

.ong{display:flex;gap:2px;padding:4px;border-radius:18px}
.ong button{flex:1;padding:9px 6px;border-radius:14px;font-size:.86rem;font-weight:500;color:var(--ink-soft)}
.ong button[aria-selected="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.jour{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:8px 4px -2px}
.ok{color:#1f8a4c;font-weight:600}
.vide{font-size:.86rem;color:var(--ink-soft);padding:10px 4px}
.note{font-size:.76rem;color:var(--ink-soft);line-height:1.45;margin:2px 4px}
/* avatars */
.p-av{--av:#888;display:inline-grid;place-items:center;flex:none;width:26px;height:26px;border-radius:50%;font-size:14px;line-height:1;
  background:color-mix(in oklab, var(--av) 30%, var(--base));box-shadow:inset 0 0 0 2px var(--av)}
.p-av.lg{width:46px;height:46px;font-size:24px;box-shadow:inset 0 0 0 3px var(--av)}
.p-av.xl{width:58px;height:58px;font-size:30px;box-shadow:inset 0 0 0 3px var(--av), 0 6px 16px -8px var(--av)}
.p-av.ph{background-color:var(--av);background-position:center;background-size:cover;background-repeat:no-repeat}
.p-av.ph i{visibility:hidden;font-style:normal}   /* emoji caché mais gardé : même alignement que les autres avatars */   /* v69 : photo (image posée par #photosCSS) */
.p-photo{display:flex;align-items:center;gap:12px;margin:4px 0 2px}
.p-photo .btns{margin:0}
.p-moi-av{position:relative;flex:none;padding:0;margin:0;border:0;background:none;border-radius:50%;cursor:pointer;line-height:0}
.p-moi-av i{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;line-height:1;
  background:var(--sheet-solid, var(--base));color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.3)}

/* Pronos entre amis (v50, module d'essai ; v55 : mode partagé branché ; v56 : présentation « fun »).

   Points : score exact 3, bon résultat (vainqueur ou nul) 1 ; classements du mois et de la saison.
   Deux modes, même interface (objet BASE) :
   - simulation (pronos.api vide) : tout reste sur cet appareil (clé pronos:sim), avec 3 amis fictifs ;
   - partagé : appli web Google Apps Script (outils/pronos/Code.gs) qui garde les joueurs et les pronos dans un Google Sheets,
     refuse un prono après le coup d'envoi et ne montre ceux des autres qu'une fois le match commencé.
   v56 : matchs par jour puis par compétition (logos), score au clavier ou avec − / +, compte à rebours, avatars (emoji + couleur),
   « qui a déjà pronostiqué » (serveur v56), badges de points, confettis sur un score exact, podium, flèches de progression, trophées du mois.
   Avec un serveur v55 : pas d'avatars des autres ni de « qui a pronostiqué », le reste marche. Gratuit, sans mise ni gain.
   v63 : identité (pronos:moi) partagée par la synchro chiffrée (partie « prefs ») ; lien de reconnexion ?groupe=…&pseudo=… (jamais le code dans l'adresse),
   reconnexion par l'action « etat » (ne crée pas de compte, garde l'avatar). */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
const LS = {get(k, d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? d; }catch{ return d; } }, set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }};
const LIGUES = Noyau.pronos.ligues();             // v66 : liste commune (noyau.js), aussi lue par la pastille de l'accueil
/* v68 : « Pronos en plus » : compétitions au choix de chaque joueur (pronos:extras, synchronisé), sous-section et classement à part.
   PLUSM = tous les matchs « en plus » (pour un classement juste, même ceux d'une compétition que je n'ai pas choisie), chargés dès qu'une est choisie. */
const EXTRAS = Noyau.pronos.extras();
const XCHOIX = () => { const x = LS.get('pronos:extras', null) || {}; return {on:!!x.on, tout:x.tout !== false, ids:Array.isArray(x.ids) ? x.ids : []}; };
const actifs = () => Noyau.pronos.extrasActifs().map(L => L.id);
// v65 : adresse du serveur dans le classeur (onglet Pronos) ; une copie du dépôt qui vise le serveur d'un autre compte passe en simulation (noyau.js, Noyau.pronos)
const SERVEUR = Noyau.pronos.serveur();
const API = SERVEUR.api;
const SIM = !API;
const JOURS_AVANT = 7, JOURS_APRES = 45;
const hm = t => new Date(t).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
const jourDe = t => new Date(t).toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
const moisDe = t => new Date(t).toISOString().slice(0, 7);
const q = new URLSearchParams(location.search);
// v63 : lien de reconnexion (?groupe=…&pseudo=…) ; PRE = ce qui pré-remplit les formulaires ; RECO = formulaire « Me reconnecter »
const LIEN = {g:(q.get('groupe') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8), p:(q.get('pseudo') || '').trim().slice(0, 20)};
const PRE = {...LIEN};
let RECO = !!LIEN.p, SYNC = '';             // SYNC : '' (pas de synchro ici), 'verrou' (activée, code pas saisi), 'ouverte', 'vide' (rien trouvé)
const lienReco = (g, p) => `${location.origin}${location.pathname}?groupe=${encodeURIComponent(g)}&pseudo=${encodeURIComponent(p)}`;
const synchroPlusTard = () => { try{ if (window.Synchro) Synchro.prefsPlusTard(); }catch{} };
function oublierLien(){ if (!LIEN.p) return; LIEN.p = ''; try{ history.replaceState(null, '', `${location.pathname}?groupe=${encodeURIComponent(LIEN.g)}`); }catch{} }
const hash = s => { let h = 2166136261; for (const c of String(s)) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };
const pl = (n, mot) => `${n} ${mot}${n > 1 ? 's' : ''}`;
function libJour(t){
  const a = new Date(t); a.setHours(0, 0, 0, 0); const b = new Date(); b.setHours(0, 0, 0, 0);
  const n = Math.round((a - b) / 864e5);
  return n === 0 ? "Aujourd'hui" : n === 1 ? 'Demain' : n === -1 ? 'Hier' : jourDe(t);
}
function compte(t){                         // « dans 2 h 15 », « dans 40 min », « samedi 14:30 »
  const d = t - Date.now(); if (d <= 0) return "c'est parti !";
  const min = Math.ceil(d / 60e3);
  if (min < 60) return `dans ${min} min`;
  if (min < 24 * 60) return `dans ${Math.floor(min / 60)} h ${String(min % 60).padStart(2, '0')}`;
  return `${new Date(t).toLocaleDateString('fr-FR', {weekday:'long'})} ${hm(t)}`;
}

/* ---------- points ---------- */
const issue = (h, a) => h > a ? 1 : h < a ? 2 : 0;
const RUGBY = m => !/\./.test(m.league || '');                     // règle du plus proche : identifiant ESPN sans point (rugby 270559… ; NBA, NFL : VAINQUEUR passe avant)
/* v68 : NBA et NFL : on choisit seulement le vainqueur (prono gardé en [1, 0] = domicile, [0, 1] = extérieur ; 1 point s'il gagne, nul NFL : 0) */
const VAINQUEUR = m => m.league === 'nba' || m.league === 'nfl';
const choixV = p => p ? (+p[0] > +p[1] ? 'h' : +p[0] < +p[1] ? 'a' : '') : '';
const nomV = (m, p) => { const c = choixV(p); return c ? (c === 'h' ? m.home : m.away).name : '?'; };
/* Foot : score exact 3, bon résultat 1. Rugby (v62) : bon résultat (vainqueur ou nul) 1 ; parmi eux, le plus proche du score 3
   (plus petite somme des écarts |dom − réel| + |ext − réel|, ex æquo : 3 chacun). Le rugby compare les pronos du match entre eux. */
function points(p, m){
  if (!p || m.state !== 'post' || m.home.score === '' || m.away.score === '') return null;
  const H = +m.home.score, A = +m.away.score, bon = q => issue(+q[0], +q[1]) === issue(H, A);
  if (VAINQUEUR(m)) return bon(p) ? 1 : 0;                           // v68 : NBA, NFL
  if (!RUGBY(m)) return +p[0] === H && +p[1] === A ? 3 : bon(p) ? 1 : 0;
  if (!bon(p)) return 0;
  const ecart = q => Math.abs(+q[0] - H) + Math.abs(+q[1] - A);
  const min = Math.min(ecart(p), ...Object.values((ETAT.pronos || {})[m.id] || {}).filter(bon).map(ecart));
  return ecart(p) <= min ? 3 : 1;
}

/* ---------- v73 : scores en direct (ESPN, lus depuis la page comme sur la page Sport) ----------
   Seulement pour les compétitions qui ont un match commencé depuis moins de 4 h et pas encore fini ; relu toutes les minutes, page visible.
   Points « pour l'instant » : ceux qu'on aurait si le match s'arrêtait là ; le classement reste calculé sur les matchs terminés (tâche Sport). */
const DIRECT = {};                                                   // id du match → {h, a, state, detail, at}
const SPORT_DE = id => id === 'nba' ? 'basketball' : id === 'nfl' ? 'football' : RUGBY({league:id}) ? 'rugby' : 'soccer';
const ymdL = t => { const d = new Date(t); return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`; };
const DETAIL = {HT:'Mi-temps', Halftime:'Mi-temps', FT:'Terminé', Final:'Terminé', 'Final/OT':'Terminé (prol.)', AET:'Terminé (prol.)', 'FT-Pens':'Terminé (t.a.b.)', Half:'Mi-temps'};
const detailFr = d => DETAIL[d] || String(d)                         // NBA, NFL : « 5:21 - 3rd » → « 3e qt 5:21 »
  .replace(/^(\d+:\d+) - (\d)(?:st|nd|rd|th)$/, '$2e qt $1').replace(/^End of (\d)(?:st|nd|rd|th)(?: Quarter)?$/, 'Fin du $1e qt').replace(/^(\d+:\d+) - OT$/, 'Prol. $1');
function candidatsDirect(){
  const now = Date.now(), l = [...MATCHS, ...PLUSM].map(m => ({id:String(m.id), league:m.league, t:m.t, state:m.state}));
  Object.entries((PARIS && PARIS.cotes) || {}).forEach(([id, c]) => l.push({id, league:c.lg, t:c.t, state:(JOURS[id] || {}).state}));
  return l.filter(m => m.t <= now && now - m.t < 4 * 3600e3 && m.state !== 'post' && !(DIRECT[m.id] && DIRECT[m.id].state === 'post'));
}
async function lireDirects(){
  const c = candidatsDirect(), ligues = [...new Set(c.map(m => m.league).filter(Boolean))]; if (!ligues.length) return false;
  const ids = new Set(c.map(m => m.id)), avant = JSON.stringify(DIRECT), now = Date.now();
  await Promise.all(ligues.map(async lg => { for (const d of [...new Set([ymdL(now - 864e5), ymdL(now)])]){
    try{
      const j = await (await fetch(`https://site.api.espn.com/apis/site/v2/sports/${SPORT_DE(lg)}/${lg}/scoreboard?dates=${d}&limit=200`)).json();
      (j.events || []).forEach(ev => { if (!ids.has(String(ev.id))) return;
        const k = (ev.competitions || [])[0] || {}, st = (ev.status || k.status || {}), ty = st.type || {}, eq = k.competitors || [];
        const cote = h => eq.find(x => x.homeAway === h) || {};
        if (cote('home').score == null || cote('away').score == null || ty.state === 'pre') return;
        const det = ty.shortDetail || st.displayClock || '';
        DIRECT[ev.id] = {h:+cote('home').score, a:+cote('away').score, state:ty.state, detail:detailFr(det), at:now}; });
    }catch{}
  } }));
  return JSON.stringify(DIRECT) !== avant;
}
/* score à montrer pour un match commencé : direct d'ESPN, sinon les données de la tâche Sport ; null si rien */
function vivant(m){
  const d = DIRECT[String(m.id)]; if (d) return d;
  const H = m.home && m.home.score, A = m.away && m.away.score;
  if ((m.state === 'in' || m.state === 'post') && H !== '' && H != null && A !== '' && A != null) return {h:+H, a:+A, state:m.state, detail:m.state === 'post' ? 'Terminé' : ''};
  return null;
}
const enDirect = (m, d) => ({...m, state:'post', home:{...m.home, score:d.h}, away:{...m.away, score:d.a}});
const mPoints = m => m.state === 'post' ? m : (vivant(m) ? enDirect(m, vivant(m)) : m);   // match tel qu'il est maintenant
function etatDirect(m){
  const d = vivant(m);
  if (d && d.state === 'post') return '<span class="p-fini">🏁 Terminé</span>';
  if (d || m.state === 'in') return `<span class="p-live">● ${esc((d && d.detail) || 'En direct')}</span>`;
  return '🔒 Commencé';
}
const provBadge = (pt, fini) => pt == null ? '' : `${badge(pt)}<small>${fini ? 'en attente du classement' : 'pour l\'instant'}</small>`;
let MAJ_ATTENTE = false;
function majVue(){                                                   // pas pendant une saisie (score, mise) : au passage suivant
  const a = document.activeElement;
  if (a && a.closest && a.closest('#out') && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){ MAJ_ATTENTE = true; return; }
  MAJ_ATTENTE = false; rendre();
}
setInterval(async () => { if (document.hidden || !BASE.moi() || SIM) return; if (await lireDirects() || MAJ_ATTENTE) majVue(); }, 60e3);

/* ---------- avatars : « emoji|n° de couleur » ---------- */
const EMOJIS = ['🦊', '🐺', '🦁', '🐯', '🐻', '🐼', '🐨', '🦅', '🐙', '🦄', '🐸', '🐲', '🤖', '👽', '🔥', '⚡'];
const COULEURS = ['#e4572e', '#f3a712', '#2a9d48', '#00a5cf', '#7b2cbf', '#e63978', '#3a5bd9', '#ff7b00'];
const avLire = s => { const m = /^([^|]{1,8})\|([0-7])$/.exec(String(s || '')); return m ? {e:m[1], c:+m[2]} : null; };
const avTexte = a => `${a.e}|${a.c}`;
const avHasard = n => { const h = hash(n); return {e:EMOJIS[h % EMOJIS.length], c:(h >>> 5) % COULEURS.length}; };
function avatarDe(n){
  const me = BASE.moi();
  return (me && n === me.pseudo && avLire(me.avatar)) || avLire((ETAT.avatars || {})[n]) || avHasard(n);
}
const avHTML = (n, cls = '') => { const a = avatarDe(n), ph = photoCls(n);
  return `<span class="p-av ${cls}${ph ? ' ph ' + ph : ''}" style="--av:${COULEURS[a.c]}" title="${esc(n)}" aria-hidden="true">${ph ? `<i>${esc(a.e)}</i>` : esc(a.e)}</span>`; };

/* v70 : son propre avatar (en-têtes) ouvre Mon profil (photo, avatar, lien de reconnexion), avant tout en bas de Classement */
const avMoi = me => `<button type="button" class="p-moi-av" data-profil aria-label="Mon profil : photo et avatar">${avHTML(me.pseudo, 'xl')}<i aria-hidden="true">✎</i></button>`;
/* ---------- v72 : installer les Pronos sur le téléphone (appli de l'écran d'accueil) ----------
   Sur iPhone, l'appli de l'écran d'accueil a sa propre mémoire (il faut s'y reconnecter) ; c'est là que marchent les rappels.
   Android (Chrome) : bouton « Installer » quand Chrome le propose, sinon le menu ⋮. Rien dans l'appli KiosK d'essai (vue web iOS). */
let INSTALLER = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); INSTALLER = e; if (SECTION === 'accueil' || !BASE.moi()) rendre(); });
addEventListener('appinstalled', () => { INSTALLER = null; LS.set('pronos:installer-vu', true); rendre(); });
function installHTML(me){
  const a = Noyau.appareil(), vueWebIOS = a.os === 'ios' && !/Safari\//.test(navigator.userAgent);
  if (a.installe || a.os === 'autre' || vueWebIOS || window.MonEcranNatif || LS.get('pronos:installer-vu', false)) return '';
  const recon = me ? `Ouvre-les ensuite depuis l'icône et reconnecte-toi (groupe <b>${esc(me.groupe)}</b>, ton pseudo et ton code).` : 'Ouvre-les ensuite depuis l\'icône pour t\'inscrire.';
  const comment = a.os === 'ios'
    ? `Touche <b>Partager</b> <span aria-hidden="true">⬆︎</span> en bas de Safari, puis <b>« Sur l'écran d'accueil »</b>. ${recon} Les rappels ne marchent que là.`
    : INSTALLER ? 'Une icône sur ton écran d\'accueil, plein écran, et des rappels quand un prono t\'attend.'
    : `Menu <b>⋮</b> de Chrome, puis <b>« Installer l'application »</b> (ou « Ajouter à l'écran d'accueil »).`;
  return `<div class="carte glass p-install"><h2>📲 Installer les Pronos</h2><p>${comment}</p>
    <div class="btns">${INSTALLER ? '<button type="button" class="btn main" data-installer>Installer</button>' : ''}<button type="button" class="btn" data-installer-vu>Plus tard</button></div></div>`;
}

/* ---------- v72 : rappels sur le téléphone (notifications web) ----------
   L'appareil s'abonne (navigateur → adresse d'envoi et clés) et le serveur des pronos le garde (action abonner, onglet Abonnements).
   La tâche GitHub « Rappels des pronos » envoie : le matin, les pronos du jour pas encore faits ; avant un match, s'il manque ton prono.
   Clé publique de l'envoi : donnees/pronos/notifications.json, publiée par cette tâche. */
const b64u = t => { const s = atob(String(t).replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - String(t).length % 4) % 4)); return Uint8Array.from(s, c => c.charCodeAt(0)); };
const NOTIF = {
  support: () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window,
  async cle(){ try{ const r = await fetch('donnees/pronos/notifications.json', {cache:'no-cache'}); const j = r.ok ? await r.json() : null; return (j && j.cle) || ''; }catch{ return ''; } },
  async abo(){ try{ const r = await navigator.serviceWorker.getRegistration(); return r ? await r.pushManager.getSubscription() : null; }catch{ return null; } },
  ligues: () => [...LIGUES.map(L => L.id), ...actifs()],
};
let NOTIF_MSG = '';
async function notifMaj(){
  const el = $('#notif'), me = BASE.moi(); if (!el || !me) return;
  const a = Noyau.appareil(), ios = a.os === 'ios', m = NOTIF_MSG ? `<p class="msg" role="status">${esc(NOTIF_MSG)}</p>` : '';
  let corps;
  if (SIM) corps = '<p class="note">Les rappels marchent avec le serveur des pronos, pas en simulation.</p>';
  else if (!NOTIF.support()) corps = `<p class="note">${ios && !a.installe
    ? 'Sur iPhone, les rappels marchent quand les Pronos sont installés : dans Safari, Partager ⬆︎ › « Sur l\'écran d\'accueil », puis ouvre-les depuis l\'icône (iOS 16.4 ou plus).'
    : 'Cet appareil ou cette appli ne sait pas recevoir de rappels. Utilise les Pronos installés depuis Safari (iPhone) ou Chrome (Android).'}</p>`;
  else if (Notification.permission === 'denied') corps = `<p class="note">Notifications refusées pour les Pronos. Pour les autoriser : ${ios ? 'Réglages › Notifications › Pronos' : 'réglages du site dans Chrome (cadenas ou ⋮ › Infos sur le site) › Notifications'}.</p>`;
  else {
    const sub = await NOTIF.abo(), moi = LS.get('pronos:notif', null), on = !!sub && !!moi && moi.p === me.pseudo && moi.g === me.groupe;
    corps = `<label class="x-on"><span><b>Me prévenir sur cet appareil</b><small>${on ? 'Activé' : 'Pas activé'}</small></span><input type="checkbox" role="switch" data-notif${on ? ' checked' : ''}></label>
      <p class="note">Le matin, s'il reste des pronos à faire dans la journée ; puis environ une heure avant un match que tu n'as pas pronostiqué${actifs().length ? ' (pronos en plus compris)' : ''}. Rien d'autre.</p>`;
  }
  if ($('#notif')) $('#notif').innerHTML = `<h2>🔔 Rappels</h2>${corps}${m}`;
}
async function notifActiver(){
  const me = BASE.moi();
  const perm = await Notification.requestPermission();                 // d'abord, dans le geste : sinon l'iPhone refuse de demander
  if (perm !== 'granted'){ NOTIF_MSG = 'Sans ton autorisation, pas de rappel.'; return notifMaj(); }
  NOTIF_MSG = 'Activation…'; notifMaj();
  try{
    const cle = await NOTIF.cle();
    if (!cle){ NOTIF_MSG = 'Les rappels ne sont pas encore en place (tâche GitHub « Rappels des pronos »).'; return notifMaj(); }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    const meme = sub && sub.options && sub.options.applicationServerKey && b64u(cle).every((x, i) => x === new Uint8Array(sub.options.applicationServerKey)[i]);
    if (sub && !meme){ await sub.unsubscribe(); sub = null; }                // clé d'envoi changée : nouvel abonnement
    if (!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64u(cle)});
    const r = await BASE.abonner(sub.toJSON(), NOTIF.ligues(), Noyau.appareil().nom);
    if (!r.ok){ NOTIF_MSG = r.err === 'action' ? 'Le serveur des pronos doit être mis à jour (v72).' : r.err === 'code' ? 'Pseudo ou code non reconnu.' : 'Abonnement refusé par le serveur.'; return notifMaj(); }
    LS.set('pronos:notif', {g:me.groupe, p:me.pseudo, at:Date.now()}); NOTIF_MSG = 'C\'est activé : tu seras prévenu sur cet appareil.';
  }catch{ NOTIF_MSG = 'Activation impossible (réseau ou navigateur). Réessaie plus tard.'; }
  notifMaj();
}
async function notifCouper(serveur = true){
  try{ const sub = await NOTIF.abo(); if (sub){ if (serveur && BASE.moi()) await BASE.desabonner(sub.endpoint).catch(() => {}); await sub.unsubscribe(); } }catch{}
  localStorage.removeItem('pronos:notif'); NOTIF_MSG = serveur ? 'Rappels coupés sur cet appareil.' : ''; notifMaj();
}
async function notifResync(){                                         // compétitions suivies changées (pronos en plus)
  const moi = LS.get('pronos:notif', null), me = BASE.moi(); if (!moi || !me || SIM || !NOTIF.support()) return;
  const sub = await NOTIF.abo(); if (sub) BASE.abonner(sub.toJSON(), NOTIF.ligues(), Noyau.appareil().nom).catch(() => {});
}

/* ---------- v69 : photos de profil ----------
   Le serveur (etat) donne { pseudo: version } ; les images (JPEG 128 × 128, ≈ 8 Ko) sont demandées une fois (action photos)
   et gardées sur l'appareil (pronos:photos, par groupe). Une feuille de style (#photosCSS) les pose : pas d'image recopiée à chaque avatar. */
const PHOTOS = (() => { const x = LS.get('pronos:photos', null); return x && x.l && typeof x.l === 'object' ? x : {g:'', l:{}}; })();
const photoCls = n => { const v = (ETAT.photos || {})[n], x = PHOTOS.l[n]; return v && x && x.v === v && x.d ? 'ph-' + hash(n).toString(36) : ''; };
function photosCSS(){
  let st = document.getElementById('photosCSS'); if (!st){ st = document.createElement('style'); st.id = 'photosCSS'; document.head.appendChild(st); }
  st.textContent = Object.entries(PHOTOS.l).filter(([n, x]) => x && x.d && /^data:image\/jpeg;base64,[A-Za-z0-9+/]+=*$/.test(x.d))
    .map(([n, x]) => `.p-av.ph-${hash(n).toString(36)}{background-image:url("${x.d}")}`).join('\n');
}
function photosGarder(){ LS.set('pronos:photos', PHOTOS); photosCSS(); }
photosCSS();
async function photosAJour(){                                     // images manquantes ou changées des joueurs du groupe
  const me = BASE.moi(); if (!me) return false;
  if (PHOTOS.g !== me.groupe){ PHOTOS.g = me.groupe; PHOTOS.l = {}; }
  const P = ETAT.photos || {}, manque = Object.keys(P).filter(n => !PHOTOS.l[n] || PHOTOS.l[n].v !== P[n]);
  let change = false;
  Object.keys(PHOTOS.l).forEach(n => { if (!P[n]){ delete PHOTOS.l[n]; change = true; } });   // photo retirée
  if (manque.length && BASE.photos){ try{ const r = await BASE.photos(manque); Object.entries((r && r.photos) || {}).forEach(([n, x]) => { PHOTOS.l[n] = x; change = true; }); }catch{} }
  if (change) photosGarder();
  return change;
}
/* image choisie → carré du centre, 128 × 128, JPEG (qualité baissée tant que c'est trop lourd) */
async function photoReduite(fichier){
  const url = URL.createObjectURL(fichier);
  try{
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url; });
    const c = Math.min(img.naturalWidth, img.naturalHeight); if (!c) throw new Error('image');
    const cv = document.createElement('canvas'); cv.width = cv.height = 128;
    const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, 128, 128);
    x.drawImage(img, (img.naturalWidth - c) / 2, (img.naturalHeight - c) / 2, c, c, 0, 0, 128, 128);

  l.forEach(m => Object.entries(ETAT.pronos[m.id] || {}).forEach(([n, p]) => {

/* ---------- v69 : forme et classement des équipes ----------
   Interrupteur dans « À pronostiquer » et dans les paris du jour (pronos:infos, masqué par défaut). Rang et points du classement
   publié par la tâche Sport (NBA, NFL : bilan et place dans la conférence), et les 5 derniers matchs (du plus ancien au plus récent). */
let INFOS = LS.get('pronos:infos', false) === true;
const TABLES = {}, TABLES_EN_COURS = new Set();
const ord = n => n === 1 ? '1ᵉʳ' : `${n}ᵉ`;
const CONF = t => /^East/i.test(t) ? 'Est' : /^West/i.test(t) ? 'Ouest' : /^American/i.test(t) ? 'AFC' : /^National/i.test(t) ? 'NFC' : '';
function tableDe(j, id){
  const out = {}, us = /^(nba|nfl)$/.test(id);
  ((j.table || {}).tables || []).forEach(tb => (tb.entries || []).forEach((e, i) => {
    const st = Object.fromEntries((e.stats || []).map(x => [x.name, x.v]));
    out[e.id] = {r:+st.rank || +st.playoffSeed || i + 1, pts:st.points, bil:st.overall, conf:CONF(tb.title || ''), us};
  }));
  (j.events || []).filter(e => e.state === 'post' && e.home && e.away && e.home.score != null && e.away.score != null && e.home.score !== '' && e.away.score !== '')
    .sort((a, b) => b.t - a.t).forEach(e => [[e.home, e.away], [e.away, e.home]].forEach(([a, b]) => {
      const x = out[a.id] || (out[a.id] = {us}); x.f = x.f || [];
      if (x.f.length < 5) x.f.push(+a.score > +b.score ? 'v' : +a.score < +b.score ? 'd' : 'n');
    }));
  Object.entries(j.forme || {}).forEach(([eq, f]) => { const x = out[eq] || (out[eq] = {us}); x.f = String(f).split('').filter(k => 'vnd'.includes(k)).slice(0, 5); });   // v70 : forme calculée sur la saison par la tâche
  return out;
}
async function chargerTables(ids){                               // compétitions des paris pas chargées par les pronos
  const l = [...new Set(ids)].filter(id => !TABLES[id] && !TABLES_EN_COURS.has(id)); if (!l.length) return false;
  l.forEach(id => TABLES_EN_COURS.add(id));
  await Promise.all(l.map(async id => { try{ TABLES[id] = tableDe((PRONOS_F && PRONOS_F.leagues[id]) || await (await fetch(`donnees/sport/${String(id).replace(/\./g, '-')}.json`, {cache:'no-cache'})).json(), id); }catch{ TABLES[id] = {}; } TABLES_EN_COURS.delete(id); }));
  return true;
}

  const f = (x.f || []).slice().reverse().map(k => `<em class="${k}"></em>`).join('');

/* ---------- fête : confettis sur un score exact (une fois par match) ---------- */
function fete(texte){
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches){
    const c = document.createElement('div'); c.className = 'p-conf'; c.setAttribute('aria-hidden', 'true');
    for (let i = 0; i < 70; i++){
      const e = document.createElement('i');
      e.style.cssText = `left:${Math.random() * 100}%;background:${COULEURS[i % COULEURS.length]};--x:${(Math.random() - .5) * 160}px;--r:${(Math.random() - .5) * 1080}deg;--d:${1.6 + Math.random() * 1.4}s;--w:${Math.random() * .5}s`;
      c.appendChild(e);
    }
    document.body.appendChild(c); setTimeout(() => c.remove(), 4000);
  }
  const t = document.createElement('div'); t.className = 'p-toast'; t.setAttribute('role', 'status'); t.textContent = texte;
  document.body.appendChild(t); setTimeout(() => t.remove(), 4200);
}

$('#invBtn').addEventListener('click', () => { const me = BASE.moi(); partager(`⚽🏉 Rejoins mon groupe de pronos ${me.groupe} : jeu entre amis, gratuit et sans argent. Ouvre le lien, installe les Pronos sur ton écran d'accueil (la page t'explique comment), puis inscris-toi avec le code de groupe ${me.groupe}.`, `${location.origin}${location.pathname}?groupe=${encodeURIComponent(me.groupe)}`); });
/* v63 : identité arrivée d'un autre appareil par la synchro → la page se recharge sur ce joueur */
let MOI_VU = JSON.stringify(LS.get('pronos:moi', null));
let X_VU = JSON.stringify(LS.get('pronos:extras', null));
window.addEventListener('synchro:prefs', () => { const x = JSON.stringify(LS.get('pronos:extras', null)); if (x !== X_VU){ X_VU = x; if (actifs().length && !PLUSM.length) actualiser(); else rendre(); } });   // v68
window.addEventListener('synchro:prefs', () => { if (SIM) return; const m = JSON.stringify(LS.get('pronos:moi', null)); if (m === MOI_VU) return; MOI_VU = m; RECO = false; SYNC = 'ouverte'; oublierLien(); actualiser(); });
if (!SIM && window.Synchro && Synchro.actif()) Synchro.pret().then(p => { SYNC = p ? 'ouverte' : 'verrou'; if (!BASE.moi()) rendre(); }).catch(() => {});
setInterval(() => {                         // comptes à rebours ; fermeture au coup d'envoi sans recharger (pas pendant une saisie)
  if (document.hidden || !BASE.moi()) return;
  const now = Date.now(); let passe = false;
  document.querySelectorAll('[data-cd]').forEach(x => { const t = +x.dataset.cd; if (t <= now) passe = true; x.textContent = (x.dataset.pre || '') + compte(t); x.classList.toggle('urgent', x.classList.contains('p-cd') && t - now < 3600e3); });
  if (passe && SECTION === 'pronos' && VUE === 'jouer' && !(document.activeElement && document.activeElement.closest('.p-st')) && !Object.keys(enAttente).length) rendre();
  if (passe && SECTION === 'paris' && !Object.keys(PCHOIX).length) rendre();
  if (passe && SECTION === 'accueil') rendre();               // v60 : paris fermés au coup d'envoi
}, 30e3);
actualiser();
