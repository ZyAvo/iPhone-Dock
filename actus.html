<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Actus</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600;700&display=swap">
<style>
/* Layout : en-tête collant en verre (retour, recherche, actualiser, titre, onglets défilants) ;
   fil : grande « une » avec titre sur l'image, deux cartes côte à côte, puis cartes compactes à vignette */
:root{
  --base:#e7ecef;
  --blob-1:rgba(163,206,241,.95); --blob-2:rgba(96,150,186,.55); --blob-3:rgba(39,76,119,.35);
  --ink:#10233a; --ink-soft:#56636f;
  --glass:rgba(255,255,255,.22); --glass-tint:rgba(163,206,241,.10);
  --rim-1:rgba(255,255,255,.95); --rim-2:rgba(255,255,255,.12); --rim-3:rgba(255,255,255,.6);
  --spec:rgba(255,255,255,.55);
  --shadow:0 14px 34px -16px rgba(39,76,119,.45);
  --head:rgba(231,236,239,.72);
  --card:rgba(255,255,255,.6); --line:rgba(39,76,119,.12);
  --accent:#274c77; --on-accent:#e7ecef;
  --t-brick:#274c77; --t-slate:#6096ba; --t-olive:#3d6b97; --t-plum:#1b3656;
  --t-teal:#4c86b0; --t-ochre:#8b8c89; --t-char:#2f3e50; --t-rose:#7fb0d8;
  --f-ui:"Geist", -apple-system, "SF Pro Text", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --base:#08121f;
  --blob-1:rgba(39,76,119,.85); --blob-2:rgba(96,150,186,.45); --blob-3:rgba(163,206,241,.22);
  --ink:#e7ecef; --ink-soft:#a7b6c4;
  --glass:rgba(231,236,239,.07); --glass-tint:rgba(163,206,241,.06);
  --rim-1:rgba(231,236,239,.55); --rim-2:rgba(231,236,239,.04); --rim-3:rgba(163,206,241,.35);
  --spec:rgba(231,236,239,.16);
  --shadow:0 14px 34px -14px rgba(0,0,0,.75);
  --head:rgba(8,18,31,.66);
  --card:rgba(231,236,239,.06); --line:rgba(231,236,239,.1); --accent:#a3cef1; --on-accent:#08121f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --base:#08121f;
  --blob-1:rgba(39,76,119,.85); --blob-2:rgba(96,150,186,.45); --blob-3:rgba(163,206,241,.22);
  --ink:#e7ecef; --ink-soft:#a7b6c4;
  --glass:rgba(231,236,239,.07); --glass-tint:rgba(163,206,241,.06);
  --rim-1:rgba(231,236,239,.55); --rim-2:rgba(231,236,239,.04); --rim-3:rgba(163,206,241,.35);
  --spec:rgba(231,236,239,.16);
  --shadow:0 14px 34px -14px rgba(0,0,0,.75);
  --head:rgba(8,18,31,.66);
  --card:rgba(231,236,239,.06); --line:rgba(231,236,239,.1); --accent:#a3cef1; --on-accent:#08121f;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;font-family:var(--f-ui);color:var(--ink);
  background-color:var(--base);
  background-image:
    radial-gradient(60% 45% at 10% 8%, var(--blob-1), transparent 70%),
    radial-gradient(55% 45% at 95% 35%, var(--blob-2), transparent 70%),
    radial-gradient(70% 50% at 30% 100%, var(--blob-3), transparent 70%);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--head);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}

/* verre */
.glass{position:relative;isolation:isolate;background:linear-gradient(160deg, var(--glass), var(--glass-tint));box-shadow:var(--shadow);
  backdrop-filter:blur(30px) saturate(1.8) brightness(1.05);-webkit-backdrop-filter:blur(30px) saturate(1.8) brightness(1.05)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 70% at 15% 0%, var(--spec), transparent 55%)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(145deg, var(--rim-1), var(--rim-2) 35%, var(--rim-2) 65%, var(--rim-3));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

.wrap{max-width:560px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* ---------- En-tête ---------- */
header{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--head);
  backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);
  border-bottom:1px solid var(--line)}
header .wrap{padding-block:10px 12px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.back{display:flex;align-items:center;gap:2px;color:var(--accent);font-weight:500;font-size:1rem;padding-block:6px}
.back svg,.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn{color:var(--accent);width:38px;height:38px;display:grid;place-items:center;border-radius:50%}
.icon-btn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.title-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-weight:700;font-size:2.2rem;letter-spacing:-.035em;margin:0;line-height:1}
.stamp{font-size:.74rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}

.tabs{display:flex;gap:4px;padding:4px;border-radius:18px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;scroll-snap-align:center;padding:8px 14px;border-radius:14px;font-size:.85rem;font-weight:500;color:var(--ink-soft);white-space:nowrap;
  transition:background .2s ease,color .2s ease}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}

/* ---------- Recherche ---------- */
.search{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 12px;border-radius:16px}
.search svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--ink-soft);stroke-width:2;stroke-linecap:round}
.search input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:none;border:0;padding:8px 0;outline:none}
.search button{font-size:.82rem;font-weight:600;color:var(--accent);padding:8px 8px}

/* ---------- Fil ---------- */
main .wrap{padding-block:14px 40px;display:flex;flex-direction:column;gap:12px}
.sources{font-size:.76rem;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.sources span{display:inline-flex;align-items:center;gap:5px}
.sources i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.card{border-left:3px solid var(--c)}
.item.hero .card,.item.duo .card{border-left:0;border-top:3px solid var(--c)}
.sources span.off{opacity:.5;text-decoration:line-through}
.notice{font-size:.8rem;line-height:1.45;color:var(--ink-soft);background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:10px 12px}
.feed{display:grid;grid-template-columns:1fr 1fr;gap:10px;list-style:none;margin:0;padding:0;transition:opacity .2s ease}
.feed.loading{opacity:.45}
.feed > li{grid-column:1 / -1;min-width:0}
.feed > li.duo{grid-column:auto}

.card{border-radius:24px;overflow:hidden;display:flex;flex-direction:column}
.card > a{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;padding:14px 15px;border-radius:inherit}
.card > a:active{opacity:.75}
.item .txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.thumb{width:78px;height:78px;border-radius:16px;object-fit:cover;background:var(--card);display:block}
.meta{display:flex;align-items:center;gap:7px;font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);min-width:0}
.meta .src{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c);box-shadow:0 0 0 1.5px color-mix(in oklab, var(--c) 35%, transparent)}
.meta time{font-weight:400;letter-spacing:0;text-transform:none;margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.item h2{font-size:.98rem;line-height:1.3;margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:pretty;overflow-wrap:anywhere}
.item p{margin:0;font-size:.84rem;line-height:1.45;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.also{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:0 15px 13px;margin-top:-4px;font-size:.74rem;color:var(--ink-soft)}
.also a{padding:4px 9px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:500}
.also a:active{opacity:.6}

/* À la une : grande image, titre par-dessus */
.item.hero .card > a{grid-template-columns:1fr;padding:0;position:relative}
.item.hero .cover{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.item.hero .txt{padding:16px 18px 18px;gap:9px}
.item.hero.has-img .txt{position:absolute;inset:auto 0 0 0;padding:60px 18px 16px;color:#fff;
  background:linear-gradient(180deg, transparent, rgba(8,18,31,.55) 35%, rgba(8,18,31,.88))}
.item.hero.has-img .meta,.item.hero.has-img p{color:rgba(255,255,255,.82)}
.item.hero h2{font-size:1.36rem;letter-spacing:-.02em;line-height:1.22}
.item.hero p{-webkit-line-clamp:2}
.item.hero .also{padding-top:12px;margin-top:0}

/* Deux cartes côte à côte, image en haut */
.item.duo .card{height:100%}
.item.duo .card > a{grid-template-columns:1fr;padding:0;gap:0;flex:1;align-content:start}
.item.duo .cover{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--card)}
.item.duo .txt{padding:11px 12px 13px}
.item.duo h2{font-size:.9rem;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.item.duo .also{padding:0 12px 11px}

/* Déjà lu */
.item.lu .card{opacity:.55}
.item.lu h2{font-weight:500}

.section-h{grid-column:1 / -1;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:8px 4px 0}
.empty{grid-column:1 / -1;text-align:center;color:var(--ink-soft);font-size:.9rem;padding:40px 0}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <a class="back" href="index.html"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Accueil</a>
      <span style="display:flex;gap:8px">
        <button class="icon-btn glass" id="searchBtn" type="button" aria-label="Rechercher dans les actus" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button>
        <button class="icon-btn glass" id="refreshBtn" type="button" aria-label="Actualiser"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
      </span>
    </div>
    <div class="title-row"><h1 id="tabTitle">À la une</h1><span class="stamp" id="stamp"></span></div>
    <form class="search glass" id="searchBox" role="search" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input type="search" id="q" placeholder="Mot-clé dans tous les onglets…" aria-label="Mot-clé" autocomplete="off">
      <button type="button" id="qClose">Fermer</button>
    </form>
    <nav class="tabs glass" id="tabs" role="tablist" aria-label="Thèmes"></nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="sources" id="sources"></div>
    <div class="notice" id="notice" hidden></div>
    <ul class="feed" id="feed" role="tabpanel" aria-labelledby="tabTitle"></ul>
  </div>
</main>

<script>
/* ======================================================
   CONFIG — onglets et flux RSS
   Ajouter une source : { name:'Nom', color:'#couleur du média', url:'adresse du flux RSS' }
   (facultatif) site:'page du site' et hint:'mot' → si le flux ne répond plus, la tâche cherche le bon flux sur cette page
   (la tâche GitHub « Actus » relit cette liste : rien d'autre à modifier)
   ====================================================== */
const TABS = [
  { id:'une', label:'À la une', feeds:[
    {name:'France Info', color:'#f2b705', url:'https://www.francetvinfo.fr/titres.rss'},
    {name:'Le Monde',    color:'#2b2b2b',  url:'https://www.lemonde.fr/rss/une.xml'},
    {name:'Le Figaro',   color:'#163860',  url:'https://www.lefigaro.fr/rss/figaro_actualites.xml'},
    {name:'Libération',  color:'#e2001a', url:'https://www.liberation.fr/arc/outboundfeeds/rss-all/?outputType=xml'},
    {name:'20 Minutes',  color:'#0b5fb4',  url:'https://www.20minutes.fr/feeds/rss-une.xml'}
  ]},
  { id:'france', label:'France', feeds:[
    {name:'France Info', color:'#f2b705', url:'https://www.francetvinfo.fr/france.rss'},
    {name:'Le Monde',    color:'#2b2b2b',  url:'https://www.lemonde.fr/politique/rss_full.xml'},
    {name:'Le Figaro',   color:'#163860',  url:'https://www.lefigaro.fr/rss/figaro_politique.xml'}
  ]},
  { id:'monde', label:'Monde', feeds:[
    {name:'France Info', color:'#f2b705', url:'https://www.francetvinfo.fr/monde.rss'},
    {name:'Le Monde',    color:'#2b2b2b',  url:'https://www.lemonde.fr/international/rss_full.xml'},
    {name:'Courrier international', color:'#c8102e', url:'https://www.courrierinternational.com/feed/all/rss.xml'}
  ]},
  { id:'eco', label:'Éco', feeds:[
    {name:'Les Échos',   color:'#8a1538', url:'https://syndication.lesechos.fr/rss/rss_une.xml', site:'https://www.lesechos.fr/'},
    {name:"L'Usine Nouvelle", color:'#f08a00', url:'https://www.usinenouvelle.com/rss/'},
    {name:'France Info', color:'#f2b705', url:'https://www.francetvinfo.fr/economie.rss'},
    {name:'Le Monde',    color:'#2b2b2b',  url:'https://www.lemonde.fr/economie/rss_full.xml'}
  ]},
  { id:'sport', label:'Sport', feeds:[
    {name:"L'Équipe",       color:'#e30613', url:'https://dwh.lequipe.fr/api/edito/rss?path=/'},
    {name:"L'Équipe Rugby", color:'#a3121a',  url:'https://dwh.lequipe.fr/api/edito/rss?path=/Rugby/'},
    {name:'RMC Sport',      color:'#4a4a4a', url:'https://rmcsport.bfmtv.com/rss/info/flux-rss/flux-toutes-les-actualites/', site:'https://rmcsport.bfmtv.com/'},
    {name:'France Info',    color:'#f2b705', url:'https://www.francetvinfo.fr/sports.rss'}
  ]},
  { id:'tech', label:'Tech', feeds:[
    {name:'Numerama',  color:'#e4007c',  url:'https://www.numerama.com/feed/'},
    {name:'Les Numériques', color:'#0a8f6a', url:'https://www.lesnumeriques.com/rss.xml'},
    {name:'Frandroid', color:'#29a8e0', url:'https://www.frandroid.com/feed'},
    {name:'01net',     color:'#d6002a',  url:'https://www.01net.com/feed/'}
  ]},
  { id:'local', label:'Tarn', feeds:[
    {name:'La Dépêche Tarn',  color:'#d4021d', url:'https://www.ladepeche.fr/tarn/rss.xml', site:'https://www.ladepeche.fr/tarn/', hint:'tarn'},
    {name:'France 3 Occitanie', color:'#1f5ba8', url:'https://france3-regions.franceinfo.fr/occitanie/rss'}
  ]}
];
const RSS_PROXY = 'https://api.rss2json.com/v1/api.json?rss_url=';   // secours si les actus préparées manquent
const PRE_URL = 'donnees/actus/actus.json';
const PRE_MAX = 3 * 3600e3;    // au-delà, les actus préparées sont jugées trop vieilles
const CACHE_MIN = 15;          // secours : durée de conservation d'un onglet, en minutes
const MAX_ITEMS = 40;

/* ====================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch{ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
const col = c => !c ? 'var(--t-slate)' : c.startsWith('--') ? `var(${c})` : c;     // couleur du média (#rrggbb) ou couleur du thème
const COLOR = Object.fromEntries(TABS.flatMap(t => t.feeds.map(f => [f.name, f.color])));
let current = null, reqId = 0, PRE = null, query = '';

/* Articles déjà lus : grisés */
let LUS = new Set(store.get('actus:lus') || []);
function markRead(link){
  if (!link || link === '#') return;
  LUS.add(link); const arr = [...LUS].slice(-600); LUS = new Set(arr); store.set('actus:lus', arr);
}
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-link]'); if (!a) return;
  markRead(a.dataset.link); a.closest('.item')?.classList.add('lu');
});

/* Onglets */
function renderTabs(){
  $('#tabs').innerHTML = TABS.map(t =>
    `<button type="button" class="tab" role="tab" id="tab-${t.id}" data-id="${t.id}" aria-selected="${!query && t.id === current}">${esc(t.label)}</button>`).join('');
  $(`#tab-${current}`)?.scrollIntoView({inline:'center', block:'nearest'});
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b){ closeSearch(); select(b.dataset.id); } });
$('#tabs').addEventListener('keydown', e => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  step(e.key === 'ArrowRight' ? 1 : -1); $(`#tab-${current}`)?.focus();
});
function step(d){
  const i = TABS.findIndex(t => t.id === current);
  select(TABS[(i + d + TABS.length) % TABS.length].id);
}
function select(id, force = false){
  if (!TABS.some(t => t.id === id)) id = TABS[0].id;
  const changed = id !== current;
  current = id;
  store.set('actus:tab', id);
  try{ history.replaceState(null, '', '#' + id); }catch{}
  const tab = TABS.find(t => t.id === id);
  $('#tabTitle').textContent = tab.label;
  renderTabs();
  if (changed) window.scrollTo({top:0});
  load(tab, force);
}

/* Glisser à gauche / à droite pour changer d'onglet */
let sx = null, sy = null;
$('main').addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
$('main').addEventListener('touchend', e => {
  if (sx === null || query) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  sx = null;
  if (Math.abs(dx) > 70 && Math.abs(dy) < 40) step(dx < 0 ? 1 : -1);
}, {passive:true});

/* ---------- Actus préparées par la tâche GitHub (rapide) ---------- */
async function loadPre(force){
  if (PRE && !force && Date.now() - PRE.loaded < 5 * 60e3) return PRE;
  try{
    const r = await fetch(PRE_URL, {cache:'no-cache'});
    if (!r.ok) return null;
    const j = await r.json();
    if (Date.now() - Date.parse(j.updated) > PRE_MAX) return null;
    PRE = {...j, loaded:Date.now(), at:Date.parse(j.updated)};
    const top = (((j.tabs || {}).une || {}).items || [])[0];
    if (top) store.set('actus:top', {...top, color:COLOR[top.source] || '--t-slate'});
    return PRE;
  }catch{ return null; }
}

/* ---------- Secours : lecture directe des flux via rss2json ---------- */
function strip(html){ const d = document.createElement('div'); d.innerHTML = html || ''; return (d.textContent || '').replace(/\s+/g,' ').trim(); }
function imageOf(it){
  if (it.thumbnail) return it.thumbnail;
  if (it.enclosure && it.enclosure.link && /image|jpe?g|png|webp/i.test((it.enclosure.type || '') + it.enclosure.link)) return it.enclosure.link;
  const m = /<img[^>]+src=["']([^"']+)/i.exec(it.description || it.content || '');
  return m ? m[1] : '';
}
async function fetchFeed(f){
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 8000);
  try{
    const r = await fetch(RSS_PROXY + encodeURIComponent(f.url), {signal:ctrl.signal});
    const j = await r.json();
    if (j.status !== 'ok') throw new Error(j.message || 'flux indisponible');
    return j.items.map(it => ({source:f.name, title:strip(it.title), link:it.link, img:imageOf(it), desc:strip(it.description).slice(0,240),
      date:Date.parse((it.pubDate || '').replace(' ','T') + 'Z') || Date.now(), also:[]}));
  } finally { clearTimeout(t); }
}
async function loadDirect(tab, force, id){
  const cached = store.get('actus:' + tab.id);
  if (cached) render(tab, cached);
  if (cached && !force && Date.now() - cached.at < CACHE_MIN * 60000) return;
  busy(true);
  const res = await Promise.allSettled(tab.feeds.map(fetchFeed));
  if (id !== reqId) return;
  busy(false);
  const failed = tab.feeds.filter((f,i) => res[i].status === 'rejected').map(f => f.name);
  let items = res.filter(r => r.status === 'fulfilled').flatMap(r => r.value);
  if (!items.length){ render(tab, cached ? {...cached, failed} : {at:Date.now(), items:sample(tab), failed, sample:true}); return; }
  const seen = new Set();
  items = items.sort((a,b) => b.date - a.date).filter(i => !seen.has(i.link) && seen.add(i.link)).slice(0, MAX_ITEMS);
  const data = {at:Date.now(), items, failed};
  store.set('actus:' + tab.id, data);
  if (tab.id === 'une') store.set('actus:top', {...items[0], color:COLOR[items[0].source]});
  render(tab, data);
}
const busy = on => { $('#feed').classList.toggle('loading', on); $('#refreshBtn').classList.toggle('spin', on); };

async function load(tab, force){
  const id = ++reqId;
  if (PRE && !force) render(tab, preTab(tab));
  else { busy(true); if (!PRE) { $('#feed').innerHTML = ''; $('#sources').innerHTML = ''; } }
  const pre = await loadPre(force);
  if (id !== reqId) return;
  busy(false);
  if (pre) { render(tab, preTab(tab)); return; }
  loadDirect(tab, force, id);
}
function preTab(tab){
  const st = Object.fromEntries((PRE.sources || []).map(s => [s.url, s]));
  return {at:PRE.at, items:((PRE.tabs[tab.id] || {}).items) || [], failed:tab.feeds.filter(f => st[f.url] && !st[f.url].ok).map(f => f.name)};
}

function sample(tab){
  const now = Date.now(), min = 60000;
  return tab.feeds.flatMap((f, k) => [0,1,2].map(n => ({
    source:f.name, link:'#', img:'', also:n === 0 && k === 0 ? [{source:tab.feeds[1 % tab.feeds.length].name, link:'#'}] : [],
    title:`Exemple ${n+1} · ${tab.label} — le vrai titre de ${f.name} s'affichera ici`,
    desc:"Le début de l'article apparaît sous le titre. Un tap ouvre l'article complet sur le site de la source.",
    date:now - (k*17 + n*55 + 4) * min
  }))).sort((a,b) => b.date - a.date);
}

/* ---------- Affichage ---------- */
function ago(t){
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return "à l'instant";
  if (m < 60) return `${m} min`;
  const h = Math.round(m / 60);
  if (h < 24) return `${h} h`;
  return new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
}
function itemHTML(i, kind, extra = ''){
  const ext = i.link && i.link !== '#' ? ' target="_blank" rel="noopener"' : '';
  const img = i.img ? `<img class="${kind === 'list' ? 'thumb' : 'cover'}" src="${esc(i.img)}" alt="" loading="lazy" onerror="this.remove()">` : '';
  const also = (i.also || []).length ? `<div class="also"><span>Aussi :</span>${i.also.map(x =>
    `<a href="${esc(x.link)}"${ext} data-link="${esc(x.link)}">${esc(x.source)}</a>`).join('')}</div>` : '';
  const desc = i.desc && (kind === 'hero' || (kind === 'list' && !i.img)) ? `<p>${esc(i.desc)}</p>` : '';
  return `<li class="item ${kind}${i.img && kind === 'hero' ? ' has-img' : ''}${LUS.has(i.link) ? ' lu' : ''}" style="--c:${col(COLOR[i.source] || i.color)}">
    <div class="card glass"><a href="${esc(i.link)}"${ext} data-link="${esc(i.link)}">
      ${kind !== 'list' ? img : ''}
      <span class="txt"><span class="meta"><span class="dot"></span><span class="src">${esc(i.source)}${extra}</span><time>${ago(i.date)}</time></span>
        <h2>${esc(i.title)}</h2>${desc}</span>
      ${kind === 'list' ? img : ''}
    </a>${also}</div></li>`;
}
function render(tab, data){
  if (query) return renderSearch();
  const failed = data.failed || [];
  $('#sources').innerHTML = tab.feeds.map(f =>
    `<span class="${failed.includes(f.name) ? 'off' : ''}" style="--c:${col(f.color)}"><i></i>${esc(f.name)}</span>`).join('');
  const n = $('#notice');
  if (data.sample){ n.hidden = false; n.textContent = "Aperçu avec des articles d'exemple : les flux en direct ne se chargent pas ici. Sur ta page hébergée, les vrais titres s'affichent."; }
  else if (failed.length){ n.hidden = false; n.textContent = `Pas de réponse pour l'instant : ${failed.join(', ')}. Les autres sources sont affichées.`; }
  else n.hidden = true;
  $('#stamp').textContent = data.sample ? '' : `Mis à jour à ${new Date(data.at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}`;

  // en « une » : l'info la plus reprise par les autres sites parmi les plus récentes, avec une image de préférence
  let items = data.items || [];
  if (items.length > 1){
    const score = i => (i.also || []).length * 2 + (i.img ? 1 : 0);
    const h = items.slice(0, 8).reduce((b, i, k) => score(i) > score(items[b]) ? k : b, 0);
    items = [items[h], ...items.filter((_, k) => k !== h)];
  }
  // puis deux cartes côte à côte si elles ont une image, puis la liste
  const duo = items.length >= 3 && items[1].img && items[2].img;
  $('#feed').innerHTML = items.map((i, k) => itemHTML(i, k === 0 ? 'hero' : duo && k <= 2 ? 'duo' : 'list')).join('')
    || '<li class="empty">Aucun article pour ce thème.</li>';
}

/* ---------- Recherche par mot-clé, dans tous les onglets ---------- */
const fold = t => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function renderSearch(){
  const words = fold(query).split(/\s+/).filter(Boolean);
  const pool = PRE ? TABS.flatMap(t => ((PRE.tabs[t.id] || {}).items || []).map(i => ({...i, tab:t.label})))
                   : TABS.flatMap(t => ((store.get('actus:' + t.id) || {}).items || []).map(i => ({...i, tab:t.label})));
  const seen = new Set();
  const hits = pool.filter(i => { const h = fold(i.title + ' ' + i.desc); return words.every(w => h.includes(w)); })
    .filter(i => !seen.has(i.link) && seen.add(i.link)).sort((a, b) => b.date - a.date).slice(0, 60);
  $('#sources').innerHTML = ''; $('#notice').hidden = true;
  $('#tabTitle').textContent = 'Recherche';
  $('#stamp').textContent = `${hits.length} article${hits.length > 1 ? 's' : ''}`;
  $('#feed').innerHTML = hits.map(i => itemHTML(i, 'list', ` · ${esc(i.tab)}`)).join('')
    || `<li class="empty">Aucun article ne parle de « ${esc(query)} » en ce moment.</li>`;
}
function openSearch(){ $('#searchBox').hidden = false; $('#searchBtn').setAttribute('aria-expanded', 'true'); $('#q').focus(); }
function closeSearch(){
  if ($('#searchBox').hidden) return;
  $('#searchBox').hidden = true; $('#searchBtn').setAttribute('aria-expanded', 'false'); $('#q').value = '';
  if (query){ query = ''; select(current); }
}
$('#searchBtn').addEventListener('click', () => $('#searchBox').hidden ? openSearch() : closeSearch());
$('#qClose').addEventListener('click', closeSearch);
$('#searchBox').addEventListener('submit', e => { e.preventDefault(); $('#q').blur(); });
let qt = null;
$('#q').addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(() => {
  query = $('#q').value.trim();
  if (query){ renderTabs(); window.scrollTo({top:0}); renderSearch(); } else select(current);
}, 200); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#searchBox').hidden) closeSearch(); });

$('#refreshBtn').addEventListener('click', () => query ? loadPre(true).then(renderSearch) : select(current, true));
document.addEventListener('visibilitychange', () => { if (!document.hidden && PRE && Date.now() - PRE.loaded > 10 * 60e3 && !query) select(current); });

/* Démarrage : onglet de l'adresse (#sport…), sinon le dernier consulté */
const start = location.hash.slice(1) || store.get('actus:tab') || 'une';
select(start);
</script>
