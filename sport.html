<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sport</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Layout : en-tête collant en verre (retour, titre, bandeau de 7 jours J-3 → J+3, filtre de sport) ; bloc « En direct » puis matchs groupés par compétition, chaque match en carte de verre avec statut, score, cartons rouges et chaînes */
:root{
  --base:#e7ecef;
  --blob-1:rgba(163,206,241,.95); --blob-2:rgba(96,150,186,.55); --blob-3:rgba(39,76,119,.35);
  --ink:#10233a; --ink-soft:#56636f; --ink-faint:#8b8c89;
  --glass:rgba(255,255,255,.22); --glass-tint:rgba(163,206,241,.10);
  --rim-1:rgba(255,255,255,.95); --rim-2:rgba(255,255,255,.12); --rim-3:rgba(255,255,255,.6);
  --spec:rgba(255,255,255,.55);
  --shadow:0 14px 34px -16px rgba(39,76,119,.45);
  --head:rgba(231,236,239,.72);
  --card:rgba(255,255,255,.6); --line:rgba(39,76,119,.12);
  --accent:#274c77; --on-accent:#e7ecef; --accent-soft:rgba(39,76,119,.1);
  --live:#d6343c; --live-soft:rgba(214,52,60,.12); --redcard:#d6343c; --yellowcard:#e8b500;
  --warn:#c77700;
  --sheet:rgba(238,242,245,.94); --sheet-solid:#eef2f5; --scrim:rgba(16,35,58,.28);
  --f-ui:"Geist", -apple-system, "SF Pro Text", system-ui, sans-serif;
  --f-num:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --base:#08121f;
  --blob-1:rgba(39,76,119,.85); --blob-2:rgba(96,150,186,.45); --blob-3:rgba(163,206,241,.22);
  --ink:#e7ecef; --ink-soft:#a7b6c4; --ink-faint:#7d8a96;
  --glass:rgba(231,236,239,.07); --glass-tint:rgba(163,206,241,.06);
  --rim-1:rgba(231,236,239,.55); --rim-2:rgba(231,236,239,.04); --rim-3:rgba(163,206,241,.35);
  --spec:rgba(231,236,239,.16);
  --shadow:0 14px 34px -14px rgba(0,0,0,.75);
  --head:rgba(8,18,31,.66);
  --card:rgba(231,236,239,.06); --line:rgba(231,236,239,.1);
  --accent:#a3cef1; --on-accent:#08121f; --accent-soft:rgba(163,206,241,.12);
  --live:#ff5c63; --live-soft:rgba(255,92,99,.14); --redcard:#ff4a52; --yellowcard:#ffc83a;
  --warn:#f0a030;
  --sheet:rgba(11,22,37,.95); --sheet-solid:#0f1b2b; --scrim:rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --base:#08121f;
  --blob-1:rgba(39,76,119,.85); --blob-2:rgba(96,150,186,.45); --blob-3:rgba(163,206,241,.22);
  --ink:#e7ecef; --ink-soft:#a7b6c4; --ink-faint:#7d8a96;
  --glass:rgba(231,236,239,.07); --glass-tint:rgba(163,206,241,.06);
  --rim-1:rgba(231,236,239,.55); --rim-2:rgba(231,236,239,.04); --rim-3:rgba(163,206,241,.35);
  --spec:rgba(231,236,239,.16);
  --shadow:0 14px 34px -14px rgba(0,0,0,.75);
  --head:rgba(8,18,31,.66);
  --card:rgba(231,236,239,.06); --line:rgba(231,236,239,.1);
  --accent:#a3cef1; --on-accent:#08121f; --accent-soft:rgba(163,206,241,.12);
  --live:#ff5c63; --live-soft:rgba(255,92,99,.14); --redcard:#ff4a52; --yellowcard:#ffc83a;
  --warn:#f0a030;
  --sheet:rgba(11,22,37,.95); --sheet-solid:#0f1b2b; --scrim:rgba(0,0,0,.5);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;font-family:var(--f-ui);color:var(--ink);
  background-color:var(--base);
  background-image:
    radial-gradient(60% 45% at 10% 8%, var(--blob-1), transparent 70%),
    radial-gradient(55% 45% at 95% 35%, var(--blob-2), transparent 70%),
    radial-gradient(70% 50% at 30% 100%, var(--blob-3), transparent 70%);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--head);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}

.glass{position:relative;isolation:isolate;background:linear-gradient(160deg, var(--glass), var(--glass-tint));box-shadow:var(--shadow);
  backdrop-filter:blur(30px) saturate(1.8) brightness(1.05);-webkit-backdrop-filter:blur(30px) saturate(1.8) brightness(1.05)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 70% at 15% 0%, var(--spec), transparent 55%)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(145deg, var(--rim-1), var(--rim-2) 35%, var(--rim-2) 65%, var(--rim-3));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

.wrap{max-width:560px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* ---------- En-tête ---------- */
header{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--head);
  backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);border-bottom:1px solid var(--line)}
header .wrap{padding-block:10px 12px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.back{display:flex;align-items:center;gap:2px;color:var(--accent);font-weight:500;font-size:1rem;padding-block:6px}
.back svg,.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn{color:var(--accent);width:38px;height:38px;display:grid;place-items:center;border-radius:50%}
.icon-btn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-weight:700;font-size:2.2rem;letter-spacing:-.035em;margin:0;line-height:1}
.live-count{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--live-soft);color:var(--live);
  font-size:.74rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--live);flex:none;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

.days{display:flex;gap:2px;padding:4px;border-radius:18px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 calc((100% - 12px) / 7);scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px;border-radius:14px;position:relative;min-width:0}
.day.wk{margin-left:9px}
.day.wk::before{content:"";position:absolute;left:-6px;top:22%;bottom:22%;width:1px;background:var(--line)}
.day .dw{font-size:.62rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap}
.day .dn{font-family:var(--f-num);font-size:1.02rem;font-weight:600;font-variant-numeric:tabular-nums}
.day .dc{font-size:.6rem;color:var(--ink-faint);font-variant-numeric:tabular-nums;min-height:.8rem}
.day.has-live::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--live)}
.day[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.day[aria-selected="true"] .dw,.day[aria-selected="true"] .dc{color:var(--on-accent);opacity:.85}
.day.today:not([aria-selected="true"]) .dn{color:var(--accent)}

.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 9px;border-radius:999px;font-size:.82rem;font-weight:500;color:var(--ink-soft);border:1px solid var(--line);background:var(--card)}
.chip svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--base);border-color:var(--ink);font-weight:600}

/* ---------- Contenu ---------- */
main .wrap{padding-block:14px 48px;display:flex;flex-direction:column;gap:18px}
.notice{font-size:.8rem;line-height:1.45;color:var(--ink-soft);background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:10px 12px}
section.comp{display:flex;flex-direction:column;gap:8px}
.comp-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px}
.comp-head h2{margin:0;font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);display:flex;align-items:center;gap:8px;min-width:0}
.flag{font-size:1rem;line-height:1;letter-spacing:0;flex:none}
.clogo{width:20px;height:20px;object-fit:contain;display:block;flex:none}
.ctag{display:flex;align-items:center;gap:6px;padding:10px 14px 0;font-size:.68rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft)}
.ctag .flag{font-size:.86rem}.ctag .clogo{width:16px;height:16px}
.comp-head h2.live-title{color:var(--live);display:flex;align-items:center;gap:7px}
.comp-head .sp{font-size:.72rem;color:var(--ink-faint)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}

.match{border-radius:22px;overflow:hidden}
.match.is-live{background:linear-gradient(160deg, var(--live-soft), var(--glass-tint) 70%)}
.row{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center;width:100%;padding:12px 14px 8px}
.st{display:flex;flex-direction:column;align-items:flex-start;gap:3px;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:.86rem;font-weight:600;line-height:1.1}
.st small{font-family:var(--f-ui);font-size:.64rem;font-weight:500;color:var(--ink-faint);letter-spacing:.03em}
.st.live{color:var(--live)}
.st.live span{display:inline-flex;align-items:center;gap:5px}
.st.post{color:var(--ink-soft);font-family:var(--f-ui);font-size:.74rem;font-weight:600}
.st.off{color:var(--ink-faint);font-family:var(--f-ui);font-size:.74rem}
.teams{display:flex;flex-direction:column;gap:6px;min-width:0}
.team{display:grid;grid-template-columns:20px minmax(0,1fr) auto auto;align-items:center;gap:8px;min-width:0}
.team .lg{width:20px;height:20px;object-fit:contain;display:block}
.team .lg-ph{width:20px;height:20px;border-radius:6px;background:var(--accent-soft);display:grid;place-items:center;font-size:.58rem;font-weight:700;color:var(--accent)}
.team .nm{font-size:.95rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team.win .nm{font-weight:700}
.match.is-post .team:not(.win) .nm, .match.is-post .team:not(.win) .sc{color:var(--ink-soft)}
.match.is-post .team.draw .nm{color:var(--ink)}
.rc{display:inline-flex;gap:2px}
.rc i{width:8px;height:11px;border-radius:2px;background:var(--redcard);display:block;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.rc i.y{background:var(--yellowcard)}
.sc{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:1.02rem;font-weight:600;min-width:1.4ch;text-align:right}
.sc .so{font-size:.7rem;color:var(--ink-soft);font-weight:500;margin-left:2px}

.tv{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 12px 88px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:8px;font-size:.72rem;font-weight:600;white-space:nowrap}
.pill b{font-size:.58rem;letter-spacing:.08em;font-weight:700;opacity:.7}
.pill.fr{background:var(--accent);color:var(--on-accent)}
.pill.fr.exact{box-shadow:0 0 0 1px var(--on-accent) inset}
.pill.fr.partial{background:var(--accent-soft);color:var(--accent)}
.pill.us{border:1px solid var(--line);color:var(--ink-soft)}

.more{border-top:1px solid var(--line);padding:10px 14px 12px 88px;display:flex;flex-direction:column;gap:6px;font-size:.84rem}
.ev{display:grid;grid-template-columns:38px 14px 1fr;gap:6px;align-items:center}
.ev .m{font-family:var(--f-num);font-size:.76rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.ev .ic{width:12px;height:12px;display:grid;place-items:center}
.ev .ic.goal::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ink);box-shadow:inset 0 0 0 2px var(--base)}
.ev .ic.red::before{content:"";width:8px;height:11px;border-radius:2px;background:var(--redcard)}
.ev .ic.yellow::before{content:"";width:8px;height:11px;border-radius:2px;background:var(--yellowcard)}
.ic.svg{width:18px;height:18px;display:grid;place-items:center;font-style:normal}
.ic.svg svg{width:18px;height:18px;overflow:visible}
.ic.svg path{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round}
.ic.svg .f{fill:var(--accent);stroke:none}
.ic.svg .s{stroke:var(--on-accent);stroke-width:1.1}
.ic.svg text{font-family:var(--f-ui);font-size:10.5px;font-weight:800;fill:var(--ink);text-anchor:middle}
.ev{grid-template-columns:38px 18px 1fr}
.tl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tl b{min-width:6.5em}
.tk{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-num);font-variant-numeric:tabular-nums;color:var(--ink)}
.tk .ic.svg,.tk .ic.svg svg{width:15px;height:15px}
.diag{font-size:.7rem;color:var(--ink-faint);line-height:1.4;overflow-wrap:anywhere}
.diag a{color:var(--accent)}
.tally{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--ink-soft);padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:2px}
.tally b{color:var(--ink);font-weight:600}
.ev .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .who em{font-style:normal;color:var(--ink-faint);font-size:.76rem}
.more .src{margin-top:4px;font-size:.78rem;color:var(--accent);font-weight:600}
.more .none{color:var(--ink-faint);font-size:.8rem}

.empty{text-align:center;color:var(--ink-soft);font-size:.9rem;padding:48px 12px;line-height:1.5}
.skeleton{height:84px;border-radius:22px;opacity:.6}
.foot-note{font-size:.72rem;color:var(--ink-faint);line-height:1.5;text-align:center;padding:0 12px}

/* ---------- Feuille de match ---------- */
body.locked{overflow:hidden}
.bx-link{margin-left:auto;font-size:.74rem;font-weight:600;color:var(--accent);padding:3px 2px}
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fade .2s ease}
#sheet{z-index:40}
.panel{width:100%;max-width:600px;max-height:calc(100% - env(safe-area-inset-top, 0px) - 16px);overflow-y:auto;overscroll-behavior:contain;
  border-radius:30px 30px 0 0;background:var(--sheet);box-shadow:0 -20px 60px -20px rgba(0,0,0,.4);animation:up .32s cubic-bezier(.2,.9,.3,1);
  padding-bottom:calc(28px + env(safe-area-inset-bottom, 0px))}
.bx-bar{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--sheet-solid);border-bottom:1px solid var(--line);
  padding:16px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px))}
.bx-bar::before{content:"";position:absolute;top:6px;left:50%;width:38px;height:5px;margin-left:-19px;border-radius:3px;background:var(--line)}
.bx-comp{display:flex;align-items:center;gap:7px;font-size:.72rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);min-width:0}
.close{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--ink)}
.close svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.sheet-body{display:flex;flex-direction:column;gap:14px;padding-top:14px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.bx-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:6px 0}
.bx-team{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:.9rem;font-weight:600;text-align:center;min-width:0}
.bx-team span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bx-lg{width:52px;height:52px;object-fit:contain;display:block}
.bx-lg.ph,.seg-lg.ph{display:grid;place-items:center;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-size:.8rem;font-weight:700}
.bx-mid{display:flex;flex-direction:column;align-items:center;gap:6px}
.bx-pts{display:flex;align-items:baseline;gap:10px;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.bx-pts b{font-size:2.3rem;font-weight:600;letter-spacing:-.03em;color:var(--ink-soft)}
.bx-pts b.w,.bx-pts:not(:has(.w)) b{color:var(--ink)}
.bx-pts i{font-style:normal;color:var(--ink-faint)}
.bx-mid small{font-size:.76rem;font-weight:600;color:var(--ink-soft)}
.live-tag{display:inline-flex;align-items:center;gap:6px;color:var(--live)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.ls,.bx-tbl{border-collapse:separate;border-spacing:0;min-width:100%;font-variant-numeric:tabular-nums;font-size:.8rem}
.ls th,.ls td,.bx-tbl th,.bx-tbl td{padding:8px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.ls tr:last-child th,.ls tr:last-child td,.bx-tbl tbody tr:last-child th,.bx-tbl tbody tr:last-child td{border-bottom:0}
.ls thead th,.bx-tbl thead th{font-size:.66rem;font-weight:600;letter-spacing:.04em;color:var(--ink-soft)}
.ls td,.bx-tbl td{font-family:var(--f-num);font-size:.78rem}
.ls .tot{font-weight:700;color:var(--ink)}
.pl{position:sticky;left:0;z-index:1;text-align:left!important;background:var(--sheet-solid);font-family:var(--f-ui)}
.ls .pl{font-weight:700}
.bx-tbl .pl{min-width:118px;max-width:132px}
.pn{display:block;font-weight:600;font-size:.8rem;overflow:hidden;text-overflow:ellipsis}
.pp{display:block;font-size:.62rem;font-weight:500;color:var(--ink-faint)}
.bx-tbl thead button{font:inherit;color:inherit;letter-spacing:inherit;padding:2px 0}
.bx-tbl thead button.on{color:var(--accent);font-weight:700}
.bx-tbl td.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.bx-tbl tr.grp th,.bx-tbl tr.grp td{font-size:.62rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);padding-top:12px}
.bx-tbl tr.dnp td{text-align:left;font-family:var(--f-ui);font-style:italic;color:var(--ink-faint)}
.bx-tbl tr.dnp .pn{color:var(--ink-soft)}
.bx-tbl tfoot th,.bx-tbl tfoot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:18px}
.seg2 button{display:flex;align-items:center;justify-content:center;gap:7px;padding:8px;border-radius:14px;font-size:.86rem;font-weight:500;color:var(--ink-soft);min-width:0}
.seg2 button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  {id:'271937',              region:'reu', flag:'🇪🇺', sport:'rugby',  group:'rugby', name:'Champions Cup',      tv:['beIN Sports'], badges:'270559'},
  {id:'164205',              region:'rintl', flag:'🌍', sport:'rugby', group:'rugby', name:'Coupe du monde de rugby', tv:['TF1'], seasonal:true},
  {id:'180659',              region:'rintl', flag:'🇪🇺', sport:'rugby', group:'rugby', name:'Six Nations',       tv:['France TV'], seasonal:true},
  {id:'289234',              region:'rintl', flag:'🌍', sport:'rugby', group:'rugby', name:'Tests internationaux', tv:['TF1'], tvTeam:'France', seasonal:true},
  {id:'nba',                 region:'us',  flag:'🇺🇸', sport:'basketball', group:'basket', name:'NBA', tv:['beIN Sports','Prime Video'], partial:true},
  {id:'nfl',                 region:'us',  flag:'🇺🇸', sport:'football',   group:'nfl',    name:'NFL', tv:['beIN Sports'], partial:true, rounds:true},
  {id:'nhl',                 region:'us',  flag:'🇺🇸', sport:'hockey',     group:'hockey', name:'NHL', tv:['beIN Sports','DAZN'], partial:true}

const VERSION = '2026-10-27.5';          // numéro de version de la page (visible dans « État des données »)
const API = 'https://site.api.espn.com/apis/site/v2/sports';
const CACHE = 'sport:v3:';

/* ====================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch{ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
const LBY = Object.fromEntries(LEAGUES.map(l => [l.id, l]));

const dayAt = n => { const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate() + n); return d; };
const ymd = d => `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
const localKey = t => { const d = new Date(t); return ymd(d); };
const hhmm = t => new Date(t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
const MAXOFF = (7 - new Date().getDay()) % 7 + 7;   // dimanche de la semaine prochaine
const OFFSETS = Array.from({length:MAXOFF + 4}, (_, i) => i - 3);

let selDay = 0, shownDay = null;
let group = store.get('sport:group') || 'all';
if (!GROUPS.some(g => g.id === group)) group = 'all';
let DATA = {};                  // league id -> {at, events:[…]}
let sample = false, failed = new Set(), open = new Set();

/* ---------- Récupération ---------- */
const NET = {ok:0, ko:0, slow:0};
async function getJSON(url){
  const ctrl = new AbortController(), t0 = Date.now(); const t = setTimeout(() => ctrl.abort(), 9000);
  try{
    const r = await fetch(url, {signal:ctrl.signal});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json(); NET.ok++; return j;
  } catch(e){ NET.ko++; throw e; }
  finally { clearTimeout(t); if (Date.now() - t0 > 4000) NET.slow++; }
}
async function pool(tasks, n){
  const out = []; let i = 0;
  await Promise.all(Array.from({length:Math.min(n, tasks.length)}, async () => {
    while (i < tasks.length){ const k = i++; try{ out[k] = await tasks[k](); }catch{ out[k] = null; } }
  }));
  return out;
}

/* Type d'événement de match (foot et rugby) */
function classify(txt, scoring, d = {}){
  const t = String(txt || '').toLowerCase();
  if (d.redCard || /red card|carton rouge/.test(t)) return 'red';
  if (d.yellowCard || /yellow card|carton jaune|sin.?bin/.test(t)) return 'yellow';
  if (/penalty try|essai de p/.test(t)) return 'try';
  if (/\btry\b|essai/.test(t)) return 'try';
  if (/conver|transfo/.test(t)) return 'conv';
  if (/drop/.test(t)) return 'drop';
  if (/penalty goal|penalty kick|pénalité|penalite/.test(t)) return 'pen';
  if (/goal|\bbut\b/.test(t) || scoring) return 'goal';
  return '';
}
function norm(ev, L){
  const c = (ev.competitions || [])[0] || {};
  const status = ev.status || c.status || {};
  const st = status.type || {};
  const comp = c.competitors || [];
  const side = (h, i) => {
    const x = comp.find(t => t.homeAway === h) || comp[i] || {}; const t = x.team || {};
    return {id:t.id, name:t.shortDisplayName || t.displayName || t.name || '?', full:t.displayName || t.name || '',
            abbr:t.abbreviation || '', logo:t.logo || '', score:x.score ?? '', win:!!x.winner, so:x.shootoutScore ?? null};
  };
  const details = (c.details || []).map(d => {
    const txt = (d.type && d.type.text) || '';
    const a = (d.athletesInvolved || [])[0] || {};
    const kind = classify(txt, d.scoringPlay, d);
    return {kind, red:kind === 'red', yellow:kind === 'yellow', goal:kind === 'goal',
            og:!!d.ownGoal, pen:!!d.penaltyKick, min:(d.clock && d.clock.displayValue) || '',
            team:d.team && d.team.id, who:a.shortName || a.displayName || ''};
  }).filter(d => d.kind);
  const us = [...new Set([
    ...(c.geoBroadcasts || []).filter(g => !g.region || g.region === 'us').map(g => g.media && g.media.shortName),
    ...(c.broadcasts || []).flatMap(b => b.names || [])
  ].filter(Boolean))].slice(0,3);
  const links = ev.links || [];
  const link = (links.find(l => (l.rel || []).includes('summary')) || links[0] || {}).href || '';
  return {id:ev.id, league:L.id, t:Date.parse(ev.date), state:st.state || 'pre', code:st.name || '',
          detail:st.shortDetail || st.detail || '', home:side('home',0), away:side('away',1), details, us, link,
          round:(ev.week && ev.week.number) || null};
}

async function fetchLeague(L){
  const base = `${API}/${L.sport}/${L.id}/scoreboard`;
  const from = ymd(dayAt(-4)), to = ymd(dayAt(MAXOFF));
  const rangeKo = store.get('sport:norange') || {};
  let events = null, leagueInfo = null;
  if (!rangeKo[L.id]){
    try{
      const j = await getJSON(`${base}?dates=${from}-${to}&limit=300`);
      if (!Array.isArray(j.events)) throw 0;
      events = j.events; leagueInfo = j.leagues;
    }catch{ rangeKo[L.id] = 1; store.set('sport:norange', rangeKo); }
  }
  if (!events){                                  // repli : un appel par jour (J-4 à J+3, la suite à la demande)
    const days = [-4,-3,-2,-1,0,1,2,3].map(n => ymd(dayAt(n)));
    const res = await pool(days.map(d => () => getJSON(`${base}?dates=${d}&limit=300`)), 4);
    if (res.every(r => !r)) throw new Error('indisponible');
    events = res.flatMap(r => (r && r.events) || []);
    leagueInfo = (res.find(r => r && r.leagues) || {}).leagues;
  }
  const seen = new Map();
  events.forEach(e => seen.set(e.id, norm(e, L)));
  if (leagueInfo) setCalendar(L, leagueInfo[0]);
  return {events:[...seen.values()], ...logosOf(leagueInfo)};
}
function logosOf(leagues){

  const pick = rel => (ls.find(l => (l.rel || []).includes(rel)) || {}).href || '';
  const sz = lg.season || {};

async function fetchToday(L){                    // rafraîchissement léger des directs
  const base = `${API}/${L.sport}/${L.id}/scoreboard`;
  const days = ['basketball','football','hockey'].includes(L.sport) ? [ymd(dayAt(-1)), ymd(dayAt(0))] : [ymd(dayAt(0))];
  const res = await pool(days.map(d => () => getJSON(`${base}?dates=${d}&limit=300`)), 2);
  const fresh = res.flatMap(r => (r && r.events) || []).map(e => norm(e, L));
  return mergeLive(DATA[L.id]?.events || [], fresh);
}
/* Fusionne des matchs frais d'ESPN avec ceux déjà connus, en gardant journée et détail préparés */
function mergeLive(base, fresh){
  const map = new Map(base.map(e => [e.id, e]));
  fresh.forEach(e => { const o = map.get(e.id); map.set(e.id, o ? {...e, round:o.round || e.round, roundSrc:o.roundSrc || e.roundSrc, full:o.full} : e); });
  return [...map.values()];
}

async function ensureDay(off){
  if (off <= 3 || sample) return;
  const rk = store.get('sport:norange') || {}, key = ymd(dayAt(off));
  const todo = LEAGUES.filter(L => rk[L.id] && DATA[L.id] && !(DATA[L.id].extra || []).includes(key));
  if (!todo.length) return;
  $('#refreshBtn').classList.add('spin');
  await pool(todo.map(L => async () => {
    try{
      const j = await getJSON(`${API}/${L.sport}/${L.id}/scoreboard?dates=${key}&limit=300`);
      const map = new Map(DATA[L.id].events.map(e => [e.id, e]));
      (j.events || []).forEach(e => map.set(e.id, norm(e, L)));
      DATA[L.id] = {...DATA[L.id], events:[...map.values()], extra:[...(DATA[L.id].extra || []), key]};
      store.set(CACHE + L.id, DATA[L.id]);

function ttl(events){
  const now = Date.now();
  if (events.some(e => e.state === 'in')) return 30e3;
  if (events.some(e => e.state === 'pre' && e.t < now + 20*60e3 && e.t > now - 3*3600e3)) return 60e3;
  if (events.some(e => localKey(e.t) === ymd(dayAt(0)) && e.state !== 'post')) return 5*60e3;
  return 30*60e3;
}

/* ---------- Données préparées par la tâche GitHub (donnees/sport) ---------- */
const PRE = {ok:false, tried:false, at:0, missing:false, idle:{}, files:{}};
const PRE_MAX = 6 * 3600e3;                         // au-delà, on repasse en lecture directe sur ESPN
async function loadPre(){
  PRE.tried = true;
  if (sample) return false;
  try{
    const r = await fetch('donnees/sport/jours.json', {cache:'no-cache'});
    if (r.status === 404){ PRE.missing = true; renderHealth(); return false; }
    if (!r.ok) return false;
    const j = await r.json();
    PRE.missing = false; PRE.at = Date.parse(j.updated) || 0; renderHealth();
    if (Date.now() - PRE.at > PRE_MAX) return false;
    const idx = await fetch('donnees/sport/index.json', {cache:'no-cache'}).then(x => x.ok ? x.json() : null).catch(() => null);
    PRE.idle = {};
    if (idx) Object.entries(idx.leagues || {}).forEach(([id, v]) => { if (v.idle) PRE.idle[id] = true; });
    LEAGUES.forEach(L => {
      if (PRE.idle[L.id]){ delete DATA[L.id]; return; }
      const lg = (j.leagues || {})[L.id] || {}, old = DATA[L.id];
      const evs = (j.events || []).filter(m => m.league === L.id);
      DATA[L.id] = {at:Date.now(), day:ymd(dayAt(0)), events:old && old.liveAt ? mergeLive(evs, old.events.filter(m => m.state !== 'pre')) : evs,
                    logo:lg.logo || '', logoDark:lg.logoDark || '', pre:true, liveAt:old && old.liveAt};
    });
    PRE.ok = true; failed.clear();
    return true;
  }catch{ return false; }
}
async function preLeague(L){
  if (!PRE.ok) return null;
  const c = PRE.files[L.id];
  if (c && Date.now() - c.at < 10 * 60e3) return c.data;
  try{
    const r = await fetch(`donnees/sport/${slug(L.id)}.json`, {cache:'no-cache'});
    if (!r.ok) return null;
    const d = await r.json(); PRE.files[L.id] = {at:Date.now(), data:d}; return d;
  }catch{ return null; }
}
const preCovers = (pre, s, e) => pre && pre.events && pre.events.length && (!pre.range || (s.getTime() >= pre.range.start - 864e5 && e.getTime() <= pre.range.end + 864e5));

async function loadLeague(L, force){
  if (PRE.ok && !force){                              // données préparées : seuls les matchs du jour sont relus sur ESPN
    const d = DATA[L.id]; if (!d || PRE.idle[L.id]) return;
    const today = ymd(dayAt(0));
    const live = d.events.some(m => m.state === 'in' || (localKey(m.t) === today && m.state !== 'post'));
    if (!live || Date.now() - (d.liveAt || 0) < ttl(d.events)) return;
    try{ d.events = await fetchToday(L); d.liveAt = d.at = Date.now(); failed.delete(L.id); }catch{}
    return;
  }
  if (L.seasonal && isIdle(L) && !force) return;      // tournoi en pause : on revérifie toutes les 12 h
  const cached = store.get(CACHE + L.id);
  const today = ymd(dayAt(0));
  if (cached && cached.day === today) DATA[L.id] = cached;
  if (!force && cached && Date.now() - cached.at < ttl(cached.events)) return;
  try{
    let next;
    if (cached && cached.day === today && !force) next = {...cached, events:await fetchToday(L)};
    else next = await fetchLeague(L);
    if (!next.logo && cached) { next.logo = cached.logo; next.logoDark = cached.logoDark; }
    DATA[L.id] = {at:Date.now(), day:today, events:mergeLive((DATA[L.id] && DATA[L.id].events) || [], next.events), logo:next.logo || '', logoDark:next.logoDark || '',
                  season:next.season || (cached && cached.season) || null};
    store.set(CACHE + L.id, DATA[L.id]);
    failed.delete(L.id);
    if (L.seasonal){
      if (next.events.length) { try{ localStorage.removeItem(idleKey(L)); }catch{} }
      else { store.set(idleKey(L), Date.now()); delete DATA[L.id]; }
    }
  }catch{ if (!L.seasonal) failed.add(L.id); }
}

async function loadAll(force = false){

  const order = [...LEAGUES].sort((a,b) => (a.group === group || group === 'all' ? 0 : 1) - (b.group === group || group === 'all' ? 0 : 1));

}

function tvFor(m){

function num(v){
  const s = String(v ?? '').trim();
  if (/^\d+:\d{2}$/.test(s)){ const [a,b] = s.split(':'); return +a + b/60; }
  const m = s.match(/^[+-]?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : -Infinity;
}

function parseSummary(j){
  const comp = ((j.header || {}).competitions || [])[0] || {};
  const st = (comp.status || {}).type || {};
  const cs = comp.competitors || [];
  const teams = ['away','home'].map((h, i) => {
    const c = cs.find(x => x.homeAway === h) || cs[i] || {}; const t = c.team || {};
    return {id:String(t.id ?? ''), name:t.shortDisplayName || t.displayName || t.name || '?', abbr:t.abbreviation || '',
            logo:((t.logos || [])[0] || {}).href || t.logo || '', score:c.score ?? '', win:!!c.winner,
            lines:(c.linescores || []).map(l => l.displayValue ?? l.value ?? '')};
  });
  const bs = j.boxscore || {};
  const players = (bs.players || []).map(p => ({teamId:String((p.team || {}).id ?? ''), cats:(p.statistics || []).map(s => ({
    name:CAT_FR[s.name] || s.text || s.name || 'Joueurs', labels:s.labels || [], descs:s.descriptions || [], totals:s.totals || [],
    rows:(s.athletes || []).map(a => { const at = a.athlete || {};
      return {name:at.shortName || at.displayName || '?', pos:(at.position || {}).abbreviation || '', starter:!!a.starter,
              dnp:!!a.didNotPlay || !(a.stats || []).length, reason:a.reason || '', stats:a.stats || []}; })
  })).filter(c => c.rows.length)}));
  const tstats = (bs.teams || []).map(t => ({teamId:String((t.team || {}).id ?? ''),
    stats:(t.statistics || []).map(s => ({key:s.label || s.abbreviation || s.name, v:s.displayValue ?? ''}))}));
  return {state:st.state || 'pre', detail:st.shortDetail || st.detail || '', teams, players, tstats};
}

/* Feuille d'exemple (aperçu uniquement, joueurs fictifs) */
function sampleSummary(m){
  let seed = [...String(m.id)].reduce((a, c) => a * 31 + c.charCodeAt(0) >>> 0, 7);
  const r = (lo, hi) => { seed = (seed * 1103515245 + 12345) >>> 0; return lo + seed % (hi - lo + 1); };
  const NAMES = [['T. Marchand','J. Okafor','L. Brennan','D. Varga','M. Cissé','R. Holloway','K. Lindqvist','A. Moreau','S. Petrovic','E. Delgado','N. Avery'],
                 ['C. Whitfield','O. Bamba','P. Kowalski','G. Ferreira','H. Tanaka','B. Mensah','V. Duarte','I. Novak','W. Ashby','Z. Kader','F. Lemaire']];
  const POS = ['G','G','F','F','C','G','F','C','G','F','C'];
  const team = (t, side, k) => {
    const total = +t.score || 0; let left = total;
    const rows = NAMES[k].map((nm, i) => {
      if (i === 10) return {athlete:{shortName:nm, position:{abbreviation:POS[i]}}, starter:false, didNotPlay:true, reason:'Choix de l’entraîneur', stats:[]};
      const pts = i === 9 ? Math.max(0, left) : Math.min(left, r(i < 5 ? 9 : 0, i < 5 ? 26 : 12)); left -= pts;
      const fgm = Math.max(0, Math.round(pts / 2.3)), fga = fgm + r(2, 9), tpm = r(0, Math.min(4, fgm)), tpa = tpm + r(0, 5), ftm = Math.max(0, pts - 2 * fgm - tpm), fta = ftm + r(0, 2);
      return {athlete:{shortName:nm, position:{abbreviation:POS[i]}}, starter:i < 5,
        stats:[String(r(i < 5 ? 26 : 8, i < 5 ? 38 : 22)), String(pts), String(r(1, i < 5 ? 11 : 6)), String(r(0, i < 5 ? 9 : 4)), `${fgm}-${fga}`, `${tpm}-${tpa}`, `${ftm}-${fta}`,
               String(r(0, 3)), String(r(0, 2)), String(r(0, 4)), String(r(0, 4)), (r(0, 1) ? '+' : '-') + r(0, 12)]};
    });
    const q = [0, 0, 0].map(() => r(20, 32)); const lines = m.state === 'in' ? [q[0], q[1], Math.max(0, total - q[0] - q[1])] : [...q, Math.max(0, total - q.reduce((a, b) => a + b, 0))];
    return {comp:{homeAway:side, score:t.score, winner:t.win, team:{id:t.id, shortDisplayName:t.name, abbreviation:t.abbr}, linescores:lines.map(v => ({value:v}))},
            players:{team:{id:t.id}, statistics:[{name:'', labels:['MIN','PTS','REB','AST','FG','3PT','FT','STL','BLK','TO','PF','+/-'],
              descriptions:['Minutes','Points','Rebonds','Passes décisives','Tirs réussis-tentés','Tirs à 3 pts','Lancers francs','Interceptions','Contres','Balles perdues','Fautes','Écart au score'], athletes:rows}]},
            stats:{team:{id:t.id}, statistics:[{label:'FG', displayValue:`${r(36,46)}-${r(80,92)}`},{label:'Field Goal %', displayValue:`${r(42,52)}.${r(0,9)}`},
              {label:'3PT', displayValue:`${r(9,17)}-${r(30,40)}`},{label:'Rebounds', displayValue:String(r(38,52))},{label:'Assists', displayValue:String(r(20,30))},
              {label:'Turnovers', displayValue:String(r(9,16))},{label:'Steals', displayValue:String(r(5,11))},{label:'Blocks', displayValue:String(r(2,8))}]}};
  };
  if (LBY[m.league].sport !== 'basketball') return {header:{competitions:[{status:{type:{state:m.state, shortDetail:m.detail}}, competitors:[]}]}, boxscore:{}};
  const a = team(m.away, 'away', 0), h = team(m.home, 'home', 1);
  return {header:{competitions:[{status:{type:{state:m.state, shortDetail:m.detail}}, competitors:[a.comp, h.comp]}]},
          boxscore:{players:[a.players, h.players], teams:[a.stats, h.stats]}};
}

/* Classement */
const statOf = (e, names) => (e.stats || []).find(s => names.includes(s.name) || names.includes(s.type));
function tablesOf(j){
  const out = [];
  const walk = node => {
    if (node.standings && (node.standings.entries || []).length) out.push({title:node.name || node.abbreviation || '', entries:node.standings.entries});
    (node.children || []).forEach(walk);
  };
  walk(j);
  return out;
}
function sortEntries(entries){
  const v = (e, n) => { const s = statOf(e, [n]); return s ? num(s.displayValue ?? s.value) : null; };
  const k = entries.some(e => v(e, 'rank') != null) ? ['rank', 1] : entries.some(e => v(e, 'playoffSeed') != null) ? ['playoffSeed', 1]
          : entries.some(e => v(e, 'points') != null) ? ['points', -1] : ['winPercent', -1];
  return [...entries].sort((a, b) => ((v(a, k[0]) ?? 999) - (v(b, k[0]) ?? 999)) * k[1]);
}
function tableFrom(j){
  return {season:(j.season || {}).displayName || '', tables:tablesOf(j).map(t => ({title:t.title, entries:sortEntries(t.entries).map(e => ({
    name:(e.team || {}).shortDisplayName || (e.team || {}).displayName || '?', abbr:(e.team || {}).abbreviation || '',
    logo:((e.team || {}).logos || [])[0]?.href || (e.team || {}).logo || '',
    note:e.note ? {color:e.note.color, text:e.note.description} : null,
    stats:(e.stats || []).map(s => ({name:s.name, type:s.type, v:s.displayValue ?? s.value ?? '', abbr:s.abbreviation || s.shortDisplayName || s.displayName || s.name}))
  }))}))};
}
async function loadTable(force = false){
  const c = csheet, L = c.L, key = 'sport:table:' + L.id;
  const cached = store.get(key);
  if (!force && cached && Date.now() - cached.at < 3600e3){ c.table = cached.data; renderCsheet(); return; }
  try{

    const data = pre && pre.table ? pre.table : tableFrom(sample ? sampleStandings(L) : await getJSON(`https://site.api.espn.com/apis/v2/sports/${L.sport}/${L.id}/standings`));
    if (!sample) store.set(key, {at:Date.now(), data});
    if (csheet === c) c.table = data;
  }catch{ if (csheet === c) c.table = 'err'; }
  if (csheet === c) renderCsheet();
}
function tableHTML(L, data){
  if (data === 'err') return `<div class="empty">Le classement n'est pas disponible pour l'instant.</div>`;
  if (!data) return `<div class="skeleton glass"></div><div class="skeleton glass"></div>`;
  if (!data.tables.length) return `<div class="empty">Pas de classement pour cette compétition.</div>`;
  const all = data.tables.flatMap(t => t.entries);
  let cols = (COLS[L.sport] || []).filter(([n]) => all.some(e => statOf(e, n)));
  if (cols.length < 3) cols = (all[0].stats || []).slice(0, 6).map(s => [[s.name], s.abbr]);
  const notes = new Map();
  const one = data.tables.length === 1;
  const html = data.tables.map(t => {
    const rows = t.entries.map((e, i) => {
      if (e.note && e.note.text) notes.set(e.note.text, e.note.color);
      const rk = statOf(e, ['rank', 'playoffSeed']);
      return `<tr${e.note && e.note.color ? ` style="--nc:#${esc(e.note.color)}"` : ''} class="${e.note ? 'noted' : ''}">
        <th class="pl" scope="row"><span class="tc"><span class="rk">${esc(rk ? rk.v : i + 1)}</span>${e.logo ? `<img class="tlg" src="${esc(e.logo)}" alt="" loading="lazy" onerror="this.remove()">` : ''}<span class="tn">${esc(e.name)}</span></span></th>
        ${cols.map(([n], k) => { const s = statOf(e, n); return `<td class="${k === cols.length - 1 ? 'key' : ''}">${esc(s ? s.v : '')}</td>`; }).join('')}</tr>`;
    }).join('');
    return `${one ? '' : `<h3 class="bx-h">${esc(GROUP_FR[t.title] || t.title)}</h3>`}
      <div class="tbl-wrap"><table class="bx-tbl st-tbl"><thead><tr><th class="pl">Équipe</th>${cols.map(([, l]) => `<th>${esc(l)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join('');
  const legend = notes.size ? `<ul class="legend">${[...notes].map(([t, c]) => `<li><i style="background:#${esc(c || '888')}"></i>${esc(t)}</li>`).join('')}</ul>` : '';
  return `${data.season ? `<p class="hint">Saison ${esc(data.season)}</p>` : ''}${html}${legend}`;
}

/* Calendrier : récupération par période, sinon jour par jour (ESPN refuse parfois les périodes) */
const DAYCACHE = {}, CALDATES = {};
const daysBetween = (s, e) => { const out = []; for (let d = new Date(s); d <= e; d = addDays(d, 1)) out.push(ymd(d)); return out; };
function setCalendar(L, lg){
  const cal = (lg || {}).calendar;
  if (Array.isArray(cal) && cal.length && typeof cal[0] === 'string') CALDATES[L.id] = new Set(cal.map(x => x.slice(0, 10).replace(/-/g, '')));
}
async function fetchDays(L, days, onStep){
  if (!DAYCACHE[L.id]) DAYCACHE[L.id] = store.get('sport:days:' + L.id) || {};
  const C = DAYCACHE[L.id], today = ymd(dayAt(0)), now = Date.now();
  const fresh = d => C[d] && now - C[d].at < (d < today ? 12 * 3600e3 : d === today ? 60e3 : 30 * 60e3);
  const todo = [...new Set(days)].filter(d => !fresh(d));
  let done = 0; if (onStep && todo.length) onStep(0, todo.length);
  await pool(todo.map(d => async () => {
    try{
      const j = await getJSON(`${API}/${L.sport}/${L.id}/scoreboard?dates=${d}&limit=300`);
      C[d] = {at:Date.now(), events:(j.events || []).map(ev => norm(ev, L))};
      if (!CALDATES[L.id] && j.leagues) setCalendar(L, j.leagues[0]);
    } finally { if (onStep) onStep(++done, todo.length); }
  }), 8);
  if (todo.length){                                   // on garde ±3 semaines sur l'appareil pour les prochaines ouvertures
    const lo = ymd(dayAt(-21)), hi = ymd(dayAt(21)), keep = {};
    Object.keys(C).filter(d => d >= lo && d <= hi).forEach(d => keep[d] = C[d]);
    store.set('sport:days:' + L.id, keep);
  }
  const map = new Map();
  days.forEach(d => ((C[d] || {}).events || []).forEach(m => map.set(m.id, m)));
  return [...map.values()].sort((a, b) => a.t - b.t);
}
async function rangeEvents(L, s, e){
  const rk = store.get('sport:norange') || {}, k = 'cal:' + L.id;
  if (rk[k] && Date.now() - rk[k] < 7 * 86400e3) return null;
  for (const lim of [1000, 400]){
    try{
      const j = await getJSON(`${API}/${L.sport}/${L.id}/scoreboard?dates=${ymd(s)}-${ymd(e)}&limit=${lim}`);
      if (Array.isArray(j.events) && j.events.length){
        if (j.leagues) setCalendar(L, j.leagues[0]);
        const seen = new Map(); j.events.forEach(ev => seen.set(ev.id, norm(ev, L)));
        return [...seen.values()];
      }
    }catch{}
  }
  rk[k] = Date.now(); store.set('sport:norange', rk);
  return null;
}
async function matchDates(L, s, e){
  let days = daysBetween(addDays(s, -1), e);
  if (!CALDATES[L.id]) await fetchDays(L, [ymd(dayAt(0))]).catch(() => {});
  const cd = CALDATES[L.id];
  return cd ? days.filter(d => cd.has(d)) : days;
}

/* Calendrier */
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => { const x = new Date(d); x.setHours(12,0,0,0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const monthOf = d => new Date(d.getFullYear(), d.getMonth(), 1, 12);
function calBounds(c){
  return c.mode === 'month' ? [c.start, new Date(c.start.getFullYear(), c.start.getMonth() + 1, 0, 12)] : [c.start, addDays(c.start, 6)];
}
const SEASONS = {};
function seasonBounds(L){
  const sz = (DATA[L.id] || {}).season;
  if (sz) return [new Date(Date.parse(sz.start) + 43200e3), new Date(Date.parse(sz.end) - 43200e3)];
  const t = dayAt(0), y = t.getMonth() >= 6 ? t.getFullYear() : t.getFullYear() - 1;
  return L.id === 'nfl' ? [new Date(y, 7, 1, 12), new Date(y + 1, 1, 28, 12)] : [new Date(y, 6, 1, 12), new Date(y + 1, 5, 30, 12)];
}
function assignRounds(evs){
  const n = {};
  evs.forEach(m => {
    const h = (n[m.home.id] || 0) + 1, a = (n[m.away.id] || 0) + 1;
    n[m.home.id] = h; n[m.away.id] = a;
    if (!m.round){ m.round = Math.max(h, a); m.roundSrc = 'calc'; }
  });
}
const same = (w, v) => w === v || (Math.min(w.length, v.length) >= 4 && (w.startsWith(v) || v.startsWith(w)));
const sim = (a, b) => { const o = a.filter(w => b.some(v => same(w, v))).length; return o / (a.length + b.length - o || 1); };
/* Numéros de journée : ton calendrier, sinon openfootball (GitHub), sinon TheSportsDB, croisés avec ESPN */
function applyRefs(evs, ref, src){
  let found = 0;
  evs.forEach(m => {
    if (m.roundSrc && m.roundSrc !== 'calc') return;
    const H = tokens(m.home), A = tokens(m.away);
    let best = null, score = 0, tie = false;
    ref.forEach(x => {
      const oh = sim(H, x.h), oa = sim(A, x.a);
      if (!oh || !oa) return;
      const sc = oh + oa;
      if (sc > score){ best = x; score = sc; tie = false; } else if (sc === score) tie = true;
    });
    if (best && !tie){ m.round = best.r; m.roundSrc = src; found++; }
  });
  return found;
}
const REFMEMO = {};
async function memo(key, ttl, fn){ const c = REFMEMO[key]; if (c && Date.now() - c.at < ttl) return c.v; const v = await fn(); REFMEMO[key] = {at:Date.now(), v}; return v; }
async function officialRounds(L, evs){
  if (!L.of) return 0;
  const y = seasonBounds(L)[0].getFullYear();
  try{
    const ref = await memo('of:' + L.id, 6 * 3600e3, async () => {
      const j = await getJSON(`https://raw.githubusercontent.com/openfootball/football.json/master/${y}-${String(y + 1).slice(2)}/${L.of}.json`);
      return (j.matches || []).map(x => ({h:tokens({full:x.team1}), a:tokens({full:x.team2}), r:+(String(x.round || '').match(/\d+/) || [])[0] || null})).filter(x => x.r);
    });
    return applyRefs(evs, ref, 'of');
  }catch{ REFMEMO['of:' + L.id] = {at:Date.now(), v:[]}; return 0; }
}
/* ---------- Tes fichiers : logos et calendriers (index fichiers.json fait par la tâche GitHub) ---------- */
const slug = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const seasonOf = L => { const y = seasonBounds(L)[0].getFullYear(); return `${y}-${String(y + 1).slice(2)}`; };
const COUNTRY = L => ({fr:'france', rfr:'france', en:'angleterre', us:'etats-unis', intl:'selections', rintl:'selections'})[L.region]
  || ({'esp.1':'espagne', 'ita.1':'italie', 'ger.1':'allemagne'})[L.id] || null;

function userLogo(m, t){
  if (!FILES || FILES === 'missing' || !FILES.clubs.length) return '';
  const c = COUNTRY(LBY[m.league]);
  const pool = c ? FILES.clubs.filter(x => x.country === c) : FILES.clubs;
  const T = tokens(t); let best = '', sc = 0;
  pool.forEach(x => { const v = sim(T, x.k); if (v > sc){ sc = v; best = x.u; } });
  return sc >= 0.5 ? best : '';
}
function parseCalendar(txt){
  const out = []; let r = null;
  const SEP = [/\s+\/\s+/, /\s+vs\.?\s+/i, /\s+contre\s+/i, /\s+[–—]\s+/, /\s+-\s+/];
  txt.split(/\r?\n/).forEach(raw => {
    let line = raw.replace(/#.*$/, '').trim(); if (!line) return;
    const h = line.match(/^(?:j(?:ourn[ée]e)?\.?\s*(\d{1,2})|(\d{1,2})\s*(?:e|è|ème|eme|re|ère|er)?\s*journ[ée]e)\b\s*[:\-–—.]*\s*/i);
    if (h){ r = +(h[1] || h[2]); line = line.slice(h[0].length).trim(); if (!line) return; }
    if (!r) return;
    line = line.replace(/\b(?:lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche|lun|mar|mer|jeu|ven|sam|dim)\.?\s+(?=\d)/gi, '')
               .replace(/\b\d{1,2}[\/.]\d{1,2}(?:[\/.]\d{2,4})?\b/g, '')
               .replace(/\b\d{1,2}\s*[h:]\s*\d{0,2}\b/gi, '')
               .replace(/\s\d{1,3}\s*[-–]\s*\d{1,3}\s/, ' / ')
               .replace(/\s+\d{1,3}\s*[-–]\s*\d{1,3}\s*$/, '').trim();
    const sep = SEP.find(x => x.test(line)); if (!sep) return;
    const [a, b] = line.split(sep);
    if (a && b) out.push({h:tokens({full:a}), a:tokens({full:b}), r});
  });
  return out.filter(x => x.h.length && x.a.length);
}
async function refRounds(L, evs){
  const key = `${seasonOf(L)}/${slug(L.name)}`;
  if (!FILES || FILES === 'missing' || !FILES.cals.has(key)) return 0;
  try{
    const ref = await memo('ref:' + key, 5 * 60e3, async () => {
      const r = await fetch(encodeURI(`calendriers/${key}.txt`), {cache:'no-cache'});
      return r.ok ? parseCalendar(await r.text()) : [];
    });
    const n = applyRefs(evs, ref, 'ref');
    store.set('sport:refcheck:' + L.id, {season:seasonOf(L), miss:evs.length - n, at:Date.now()});
    return n;
  }catch{ return 0; }
}

const TSDB = 'https://www.thesportsdb.com/api/v1/json/123';
async function tsdbLeagueId(L){
  const key = L.tsdb ? L.id : L.badges;
  const ids = store.get('sport:tsdbid') || {};
  if (ids[key]) return ids[key];
  const T = LBY[key].tsdb;
  const j = await getJSON(`${TSDB}/search_all_leagues.php?c=${encodeURIComponent(T.c)}&s=${encodeURIComponent(T.s)}`);
  const hit = (j.countries || j.leagues || []).find(x => [x.strLeague, x.strLeagueAlternate].some(n => n && T.re.test(n)));
  if (!hit) throw 0;
  ids[key] = hit.idLeague; store.set('sport:tsdbid', ids);
  return hit.idLeague;
}
async function tsdbRounds(L, evs, rounds){
  if (!L.tsdb || sample) return 0;
  try{
    const id = await tsdbLeagueId(L), y = seasonBounds(L)[0].getFullYear(), season = `${y}-${y + 1}`;
    let cache = store.get('sport:tsdbr:' + L.id);
    if (!cache || cache.season !== season) cache = {season, r:{}};
    const todo = [...new Set(rounds)].filter(r => r > 0 && (!cache.r[r] || Date.now() - cache.r[r].at > 3 * 86400e3));
    for (const r of todo){
      try{
        const j = await getJSON(`${TSDB}/eventsround.php?id=${id}&r=${r}&s=${season}`);
        cache.r[r] = {at:Date.now(), list:(j.events || []).map(e => [e.strHomeTeam, e.strAwayTeam])};
      }catch{}
      await new Promise(ok => setTimeout(ok, 250));
    }
    store.set('sport:tsdbr:' + L.id, cache);
    const ref = Object.entries(cache.r).flatMap(([r, v]) => v.list.map(([h, a]) => ({h:tokens({full:h}), a:tokens({full:a}), r:+r})));
    return applyRefs(evs, ref, 'tsdb');
  }catch{ return 0; }
}

async function loadRoundsByDays(cs){
  const c = cs.cal, L = cs.L;
  if (!CALDATES[L.id]) await fetchDays(L, [ymd(dayAt(0))]).catch(() => {});
  const cd = CALDATES[L.id];
  if (csheet !== cs) return;
  if (!cd || !cd.size){ c.mode = c.view = 'week'; c.start = null; return loadCal(); }
  const dates = [...cd].sort(), clusters = [];
  const gap = (a, b) => (Date.parse(`${b.slice(0,4)}-${b.slice(4,6)}-${b.slice(6)}`) - Date.parse(`${a.slice(0,4)}-${a.slice(4,6)}-${a.slice(6)}`)) / 864e5;
  dates.forEach(d => { const last = clusters[clusters.length - 1]; if (last && gap(last[last.length - 1], d) <= 1) last.push(d); else clusters.push([d]); });
  c.rounds = clusters.map((_, i) => i + 1);
  const target = ymd(c.at ? new Date(c.at) : dayAt(0));
  if (c.round == null){ const i = clusters.findIndex(cl => cl[cl.length - 1] >= target); c.round = i < 0 ? clusters.length : i + 1; }
  if (!c.week) c.week = mondayOf(c.at ? new Date(c.at) : dayAt(0));
  c.events = null; renderCsheet();
  let want, extra = [];
  if (c.view === 'week') want = daysBetween(addDays(c.week, -1), addDays(c.week, 6)).filter(d => cd.has(d));
  else { const i = c.round - 1; want = clusters[i] || []; extra = [i - 1, i + 1].filter(k => clusters[k]).flatMap(k => clusters[k]); }
  const step = (n, t) => { if (csheet === cs && c.events === null){ c.progress = `${n}/${t}`; renderCsheet(); } };
  let evs;
  try{ evs = await fetchDays(L, want, step); }catch{ evs = []; }
  if (csheet !== cs) return;
  await placeRounds(cs, L, evs, clusters);
  if (extra.length){                                    // journées voisines ensuite (matchs reportés), sans bloquer l'affichage
    try{ evs = await fetchDays(L, [...want, ...extra]); }catch{}
    if (csheet !== cs) return;
    await placeRounds(cs, L, evs, clusters);
  }
}
async function placeRounds(cs, L, evs, clusters){
  const c = cs.cal;
  const idx = d => clusters.findIndex(cl => cl.includes(d));
  const fill = () => evs.forEach(m => { if (!m.round || m.roundSrc === 'calc'){ const i = idx(ymd(new Date(m.t))); const j = i < 0 ? idx(ymd(addDays(new Date(m.t), -1))) : i; m.round = j < 0 ? null : j + 1; m.roundSrc = 'calc'; } });
  const show = () => {
    if (csheet !== cs) return;
    c.events = c.view === 'week' ? evs.filter(m => m.t >= c.week.getTime() - 43200e3 && m.t < addDays(c.week, 7).getTime() - 43200e3) : evs.filter(m => m.round === c.round);
    c.progress = null; renderCsheet();
  };
  evs.forEach(m => { m.round = null; m.roundSrc = null; });
  await refRounds(L, evs); await officialRounds(L, evs);
  fill(); show();                                         // affichage immédiat
  if (L.tsdb && evs.some(m => m.roundSrc === 'calc')){    // vérification TheSportsDB ensuite, sans bloquer
    const n = await tsdbRounds(L, evs, [c.round - 1, c.round, c.round + 1]);
    if (n){ fill(); show(); }

}
function pickRound(c, all){
  c.rounds = [...new Set(all.map(m => m.round))].sort((a, b) => a - b);
  if (c.round == null){
    if (c.at){ const near = all.reduce((b, m) => Math.abs(m.t - c.at) < Math.abs(b.t - c.at) ? m : b, all[0]); c.round = near.round; }
    else { const next = all.find(m => m.state !== 'post'); c.round = next ? next.round : c.rounds[c.rounds.length - 1]; }
  }
  if (!c.week){ const ref = c.at ? new Date(c.at) : (all.find(m => m.state !== 'post') ? new Date(all.find(m => m.state !== 'post').t) : dayAt(0)); c.week = mondayOf(ref); }
}
const weekEvents = (c, all) => all.filter(m => m.t >= c.week.getTime() - 43200e3 && m.t < addDays(c.week, 7).getTime() - 43200e3);

  c.events = c.view === 'week' ? weekEvents(c, all) : all.filter(m => m.round === c.round);

async function loadCal(){

  if (!c.start) c.start = c.mode === 'month' ? monthOf(dayAt(0)) : mondayOf(dayAt(0));
  const key = c.mode + ymd(c.start);
  if (c.cache[key]){ c.events = c.cache[key]; renderCsheet(); return; }
  c.events = null; c.err = false; renderCsheet();
  const [s, e] = calBounds(c);
  try{
    let evs = null;

    else {
      const pre = await preLeague(L);
      if (preCovers(pre, s, e)) evs = mergeLive(pre.events, (DATA[L.id] || {}).events || []);
      if (!evs && c.mode === 'month') evs = await rangeEvents(L, s, e);
      if (!evs) evs = await fetchDays(L, await matchDates(L, s, e), (n, t) => { if (csheet === cs && c.events === null){ c.progress = `${n}/${t}`; renderCsheet(); } });

function sampleStandings(L){
  const NAMES = {soccer:['Paris SG','Marseille','Monaco','Lille','Lyon','Lens','Nice','Rennes','Strasbourg','Brest','Toulouse','Nantes'],
                 rugby:['Toulouse','Bordeaux-Bègles','Toulon','Castres','Clermont','La Rochelle','Racing 92','Stade Français','Pau','Bayonne','Montpellier','Perpignan']};
  const names = NAMES[L.sport] || ['Celtics','Knicks','Cavaliers','Bucks','Magic','Pacers','Heat','76ers'];
  let seed = 11; const r = (lo, hi) => { seed = (seed * 1103515245 + 12345) >>> 0; return lo + seed % (hi - lo + 1); };
  const entries = names.map((n, i) => {
    const w = r(2, 8), d = L.sport === 'soccer' || L.sport === 'rugby' ? r(0, 2) : 0, l = r(0, 5);
    const st = L.sport === 'soccer' || L.sport === 'rugby'
      ? [{name:'gamesPlayed', displayValue:String(w + d + l)}, {name:'wins', displayValue:String(w)}, {name:'ties', displayValue:String(d)}, {name:'losses', displayValue:String(l)},
         {name:'pointDifferential', displayValue:String(r(-9, 14))}, {name:'points', displayValue:String(w * (L.sport === 'rugby' ? 4 : 3) + d * (L.sport === 'rugby' ? 2 : 1))}]
      : [{name:'wins', displayValue:String(w)}, {name:'losses', displayValue:String(l)}, {name:'winPercent', displayValue:(w / (w + l)).toFixed(3).replace(/^0/, '')}, {name:'gamesBehind', displayValue:'-'}, {name:'streak', displayValue:'V' + r(1, 4)}];
    return {team:{shortDisplayName:n, abbreviation:n.slice(0, 3).toUpperCase()}, stats:st};
  });
  entries.sort((a, b) => num(statOf(b, ['points', 'winPercent']).displayValue) - num(statOf(a, ['points', 'winPercent']).displayValue));
  entries.forEach((e, i) => {
    e.stats.push({name:'rank', displayValue:String(i + 1)});
    if (L.sport === 'soccer') e.note = i < 3 ? {color:'3B82C4', description:'Ligue des champions'} : i >= entries.length - 2 ? {color:'C2453A', description:'Relégation'} : null;
  });
  return {season:{displayName:'2026-27'}, children:[{name:L.name, standings:{entries}}]};
}
