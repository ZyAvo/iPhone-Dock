name: Actus

# Toutes les 30 minutes : télécharge les flux RSS de la page Actus et prépare donnees/actus/actus.json
# (les onglets et les sources se règlent dans actus.html, liste TABS)
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:            # bouton « Run workflow » pour lancer à la main
  push:                         # dès que tu modifies les sources dans actus.html
    paths:
      - 'actus.html'
      - 'outils/actus-data.mjs'

permissions:
  contents: write

concurrency:
  group: actus
  cancel-in-progress: true

jobs:
  actus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lecture des flux
        run: node outils/actus-data.mjs

      - name: Enregistrement
        run: |
          git config user.name "mon-ecran"
          git config user.email "mon-ecran@users.noreply.github.com"
          git add donnees/actus
          if ! git diff --cached --quiet; then
            git commit -m "Actus"
            for i in 1 2 3; do
              git pull --rebase -X theirs && git push && break
              sleep 5
            done
          fi
