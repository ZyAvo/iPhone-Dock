# mon-ecran-version: 666cb3de
name: Actus

# Toutes les 15 minutes : télécharge les flux RSS de la page Actus et prépare donnees/actus/actus.json
# (les onglets et les sources se règlent dans actus.html, liste TABS).
# Les données vont sur la branche « donnees » (sans historique), puis la tâche « Publication » met le site à jour.
on:
  schedule:
    - cron: '4,19,34,49 * * * *'     # GitHub peut retarder ou sauter un passage : un rythme serré limite l'écart
  workflow_dispatch:            # bouton « Run workflow » pour lancer à la main
  push:                         # dès que tu modifies les sources dans actus.html
    paths:
      - 'actus.html'
      - 'outils/actus-data.mjs'

permissions:
  contents: write

concurrency:
  group: actus
  cancel-in-progress: true

jobs:
  actus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reprise des données précédentes
        run: bash outils/reprendre-donnees.sh

      - name: Lecture des flux
        run: node outils/actus-data.mjs

      - name: Envoi des données
        run: bash outils/publier-donnees.sh donnees/actus
