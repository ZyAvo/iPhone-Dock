# mon-ecran-version: 5c3df7af
# Configuration du dock : dépose « configuration.xlsx » à la racine du dépôt (Add file → Upload files),
# ou règle le dock dans l'appli (elle écrit config/modifs.json avec la clé de la synchronisation).
# Cette tâche reporte d'abord dans le classeur les choix faits dans l'appli (par identifiant ; le classeur reste
# la référence et il est réenregistré), lit le classeur, écrit les réglages dans config/*.json et le catalogue
# config/catalogue.json, teste les nouveautés cochées et les « Mes ajouts », range une copie du classeur avec la
# colonne « Résultat » remplie, puis relance la publication. Le résumé s'affiche dans la page État.
name: Configuration

on:
  push:
    paths: ['configuration.xlsx', 'config/modifs.json']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: configuration
  cancel-in-progress: false

jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Outil de lecture Excel
        run: pip install --quiet openpyxl

      - name: Lecture du classeur et tests
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ ! -f configuration.xlsx ]; then echo "Pas de configuration.xlsx à la racine du dépôt." | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; fi
          python3 outils/configuration.py configuration.xlsx --sortie config --modifs config/modifs.json --tester | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Résumé
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          r = json.load(open('config/rapport.json')); s = {'ok': '✅', 'warn': '⚠️', 'ko': '❌', 'info': 'ℹ️'}
          print('\n## Configuration\n')
          n = (r.get('modifs') or {}).get('nouvelles') or []
          if n:
              print(f"Choix faits dans l'appli : {len(n)} reçu(s)\n")
              for t in n: print(f"- {s['ok'] if t['statut'] == 'ok' else s['ko']} `{t['id'] or '—'}` : {t['message']}")
              print()
          for m in r['modules'].values(): print(f"- {m['onglet']} : {m['coches']} éléments choisis" + (f", {m['ajouts']} ajout(s)" if m['ajouts'] else ''))
          if r['tests']:
              print('\n| | Élément | Résultat |\n|---|---|---|')
              for t in sorted(r['tests'], key=lambda t: ['ko', 'warn', 'info', 'ok'].index(t['statut'])):
                  print(f"| {s[t['statut']]} | {t['onglet']} · {t['nom']} | {t['message']} |")
          PY

      - name: Enregistrement
        id: enreg
        run: |
          git config user.name "mon-ecran"
          git config user.email "mon-ecran@users.noreply.github.com"
          git add config configuration.xlsx
          if git diff --cached --quiet; then echo "change=0" >> "$GITHUB_OUTPUT"; echo "Réglages inchangés."; exit 0; fi
          git commit -q -m "Configuration depuis le classeur"
          # l'appli a pu écrire config/modifs.json entre-temps : on se replace après (fichier différent, pas de conflit) ;
          # ses nouvelles modifications seront traitées par le passage suivant de cette tâche, déjà en file
          for i in 1 2 3; do
            git push -q && break
            [ $i = 3 ] && { echo "Envoi impossible après 3 essais."; exit 1; }
            git pull -q --rebase || { git rebase --abort; echo "Conflit avec un dépôt fait pendant la tâche (classeur redéposé ?) : relance la tâche Configuration."; exit 1; }
          done
          echo "change=1" >> "$GITHUB_OUTPUT"

      # un enregistrement fait par une tâche ne relance pas les autres : on lance la publication nous-mêmes
      - name: Publication
        if: steps.enreg.outputs.change == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # réglages changés → les tâches concernées vont chercher les nouvelles données, puis publication
          ch=$(git show --name-only --format= HEAD || true)          # fichiers de notre enregistrement (même replacé après celui de l'appli)
          lance(){ gh workflow run "$1" --ref "${GITHUB_REF_NAME}" && echo "Lancé : $1"; }
          echo "$ch" | grep -qE '^config/(sport|tv)\.json$|^config/chaines-tv\.xml$' && lance programme-tv.yml || true
          echo "$ch" | grep -qE '^config/actus\.json$' && lance actus.yml || true
          echo "$ch" | grep -qE '^config/marches\.json$' && lance marches.yml || true
          echo "$ch" | grep -qE '^config/videos\.json$' && lance videos.yml || true
          echo "$ch" | grep -qE '^config/cotes\.json$' && lance cotes.yml || true
          lance publication.yml
