name: Publication

# Met le site en ligne (GitHub Pages) en assemblant :
#  - les pages et réglages de la branche main (ce que tu déposes) ;
#  - les dernières données de la branche « donnees » (matchs, TV, actus), qui ne garde pas d'historique ;
#  - l'index de tes logos et calendriers (fichiers.json) et le résumé « État des données » (etat.json).
# Réglage nécessaire une fois : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Programme TV sport", "Actus", "Marchés", "Vidéos"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dernières données
        run: bash outils/reprendre-donnees.sh

      - name: Index des logos et calendriers
        run: |
          node -e '
            const fs = require("fs"), p = require("path");
            const walk = d => fs.existsSync(d) ? fs.readdirSync(d, {withFileTypes: true}).flatMap(e => e.isDirectory() ? walk(p.join(d, e.name)) : [p.join(d, e.name).split(p.sep).join("/")]) : [];
            fs.writeFileSync("fichiers.json", JSON.stringify({
              updated: new Date().toISOString(),
              logos: walk("logos").filter(f => /\.(png|jpe?g|svg|webp)$/i.test(f)),
              calendriers: walk("calendriers").filter(f => /\.txt$/i.test(f))
            }, null, 1));
          '

      - name: État des données
        continue-on-error: true
        run: node outils/etat.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploiement
        uses: actions/deploy-pages@v4
