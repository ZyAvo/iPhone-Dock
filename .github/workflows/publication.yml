# mon-ecran-version: 14fa11db
name: Publication

# Met le site en ligne (GitHub Pages) en assemblant :
#  - les pages et réglages de la branche main (ce que tu déposes) ;
#  - les dernières données de la branche « donnees » (matchs, TV, actus), qui ne garde pas d'historique ;
#  - l'index de tes logos et calendriers (fichiers.json) et le résumé « État des données » (etat.json).
# Réglage nécessaire une fois : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
on:
  push:
    branches: [main]
    paths-ignore: ['config/modifs.json']     # réglages de l'appli : la tâche Configuration les reporte puis relance la publication
  workflow_dispatch:
  workflow_run:
    workflows: ["Sport", "Programme TV sport", "Actus", "Marchés", "Vidéos"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # v168 : deux étapes séparées. Avant, la mise en ligne démarrait dans la même seconde que l'envoi du site et ne le
  # trouvait pas encore (« No artifacts named "github-pages" were found ») : une publication sur deux échouait.
  preparation:
    # v51 : pas de mise en ligne après une tâche de données en échec (rien de neuf à montrer)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Dernières données
        run: bash outils/reprendre-donnees.sh donnees donnees-tv      # donnees-tv : catalogue TV (v51)

      - name: Index des logos et calendriers
        run: |
          node -e '
            const fs = require("fs"), p = require("path");
            const walk = d => fs.existsSync(d) ? fs.readdirSync(d, {withFileTypes: true}).flatMap(e => e.isDirectory() ? walk(p.join(d, e.name)) : [p.join(d, e.name).split(p.sep).join("/")]) : [];
            fs.writeFileSync("fichiers.json", JSON.stringify({
              updated: new Date().toISOString(),
              logos: walk("logos").filter(f => /\.(png|jpe?g|svg|webp)$/i.test(f)),
              calendriers: walk("calendriers").filter(f => /\.txt$/i.test(f))
            }, null, 1));
          '

      - name: État des données
        continue-on-error: true
        run: node outils/etat.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  mise-en-ligne:
    needs: preparation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.essai1.outputs.page_url || steps.essai2.outputs.page_url }}
    steps:
      - id: essai1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      # v168 : un second essai après une pause si GitHub n'a pas encore enregistré le site envoyé
      - name: Pause avant un second essai
        if: steps.essai1.outcome == 'failure'
        run: sleep 30

      - id: essai2
        if: steps.essai1.outcome == 'failure'
        uses: actions/deploy-pages@v5
