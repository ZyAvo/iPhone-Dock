name: TV (test)

# Test de la TV depuis GitHub : le serveur Xtream accepte-t-il la connexion, et que contient l'abonnement (directs, films, séries) ?
# Lancement à la main : Actions → TV (test) → Run workflow. Le rapport s'affiche dans le résumé de la tâche.
# Accès : secrets XT_SERVEUR, XT_IDENTIFIANT, XT_MOTDEPASSE. Le rapport n'affiche jamais l'adresse, l'identifiant ni le mot de passe.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test du serveur TV
        env:
          XT_SERVEUR: ${{ secrets.XT_SERVEUR }}
          XT_IDENTIFIANT: ${{ secrets.XT_IDENTIFIANT }}
          XT_MOTDEPASSE: ${{ secrets.XT_MOTDEPASSE }}
        run: node outils/tv-test.mjs
