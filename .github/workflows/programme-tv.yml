# mon-ecran-version: 3a0dff1e
name: Programme TV sport

# Programme des chaînes sport (Canal+, beIN, SFR…) → tv.json.
# v51 : 7 jours au passage de la nuit (01:17 UTC) ou lancé à la main, 2 jours aux autres passages (toutes les 4 h) ;
# les jours suivants sont repris du passage précédent (outils/tv-tri.mjs). Les matchs ont leur propre tâche : « Sport ».
# Les données vont sur la branche « donnees » (sans historique), puis la tâche « Publication » met le site à jour.
on:
  schedule:
    - cron: '17 1,5,9,13,17,21 * * *'
  workflow_dispatch:            # bouton « Run workflow » pour lancer à la main (7 jours)

permissions:
  contents: write

concurrency:
  group: donnees
  cancel-in-progress: false

jobs:
  donnees:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reprise des données précédentes
        run: bash outils/reprendre-donnees.sh

      # ---------- 1. Programme TV ----------
      - uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          path: epg

      - name: Installation de l'outil de programme TV
        working-directory: epg
        run: npm install --no-audit --no-fund

      - name: Récupération du programme
        working-directory: epg
        continue-on-error: true
        run: |
          # chaînes choisies dans le classeur (config/chaines-tv.xml), sinon la liste d'origine
          ch=../config/chaines-tv.xml; [ -s "$ch" ] || ch=../outils/chaines-tv.xml
          h=$((10#$(date -u +%H))); jours=2; { [ $h -ge 1 ] && [ $h -le 4 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; } && jours=7   # passage de la nuit, même parti en retard
          echo "Programme sur $jours jours"
          npm run grab --- --channels=$ch --output=../guide-tv.xml --days=$jours --maxConnections=3 --timeout=30000 2>&1 | tee ../grab.log

      - name: Tri des programmes de sport
        continue-on-error: true
        run: node outils/tv-tri.mjs guide-tv.xml tv.json grab.log

      # ---------- 2. Envoi des données ----------
      - name: Envoi des données
        run: bash outils/publier-donnees.sh tv.json
