name: Programme TV sport

# Toutes les 2 heures :
#  1. récupère le programme des chaînes sport (Canal+, beIN, DAZN…)      → tv.json
#  2. prépare les matchs, journées et classements de la page Sport       → donnees/sport/
#  3. fait l'index de tes logos et calendriers                           → fichiers.json
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:            # bouton « Run workflow » pour lancer à la main
  push:                         # dès que tu ajoutes un logo ou un calendrier
    paths:
      - 'logos/**'
      - 'calendriers/**'

permissions:
  contents: write

concurrency:
  group: donnees
  cancel-in-progress: false

jobs:
  donnees:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ---------- 1. Programme TV ----------
      - uses: actions/checkout@v4
        if: github.event_name != 'push'
        with:
          repository: iptv-org/epg
          path: epg

      - name: Installation de l'outil de programme TV
        if: github.event_name != 'push'
        working-directory: epg
        run: npm install --no-audit --no-fund

      - name: Récupération du programme (3 jours)
        if: github.event_name != 'push'
        working-directory: epg
        continue-on-error: true
        run: npm run grab --- --channels=../outils/chaines-tv.xml --output=../guide-tv.xml --days=3 --maxConnections=6 --timeout=20000

      - name: Tri des programmes de sport
        if: github.event_name != 'push'
        continue-on-error: true
        run: node outils/tv-tri.mjs guide-tv.xml tv.json

      # ---------- 2. Données de la page Sport ----------
      - name: Matchs, journées et classements
        continue-on-error: true
        run: node outils/sport-data.mjs

      # ---------- 3. Index des logos et calendriers ----------
      - name: Index des logos et calendriers
        run: |
          node -e '
            const fs = require("fs"), p = require("path");
            const walk = d => fs.existsSync(d) ? fs.readdirSync(d, {withFileTypes: true}).flatMap(e => e.isDirectory() ? walk(p.join(d, e.name)) : [p.join(d, e.name).split(p.sep).join("/")]) : [];
            fs.writeFileSync("fichiers.json", JSON.stringify({
              updated: new Date().toISOString(),
              logos: walk("logos").filter(f => /\.(png|jpe?g|svg|webp)$/i.test(f)),
              calendriers: walk("calendriers").filter(f => /\.txt$/i.test(f))
            }, null, 1));
          '

      - name: Enregistrement
        run: |
          git config user.name "mon-ecran"
          git config user.email "mon-ecran@users.noreply.github.com"
          git add fichiers.json
          [ -f tv.json ] && git add tv.json
          [ -d donnees/sport ] && git add donnees/sport
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour des données (TV, sport, index)"
            git pull --rebase
            git push
          fi
