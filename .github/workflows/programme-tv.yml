# mon-ecran-version: 972cb9b5
name: Programme TV sport

# Toutes les 2 heures :
#  1. récupère le programme des chaînes sport (Canal+, beIN, SFR…)       → tv.json
#  2. prépare les matchs, journées et classements de la page Sport       → donnees/sport/
#  Les données vont sur la branche « donnees » (sans historique), puis la tâche « Publication » met le site à jour.
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:            # bouton « Run workflow » pour lancer à la main
  push:                         # dès que tu ajoutes un logo ou un calendrier
    paths:
      - 'logos/**'
      - 'calendriers/**'

permissions:
  contents: write

concurrency:
  group: donnees
  cancel-in-progress: false

jobs:
  donnees:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reprise des données précédentes
        run: bash outils/reprendre-donnees.sh

      # ---------- 1. Programme TV ----------
      - uses: actions/checkout@v4
        if: github.event_name != 'push'
        with:
          repository: iptv-org/epg
          path: epg

      - name: Installation de l'outil de programme TV
        if: github.event_name != 'push'
        working-directory: epg
        run: npm install --no-audit --no-fund

      - name: Récupération du programme (7 jours)
        if: github.event_name != 'push'
        working-directory: epg
        continue-on-error: true
        run: |
          # chaînes choisies dans le classeur (config/chaines-tv.xml), sinon la liste d'origine
          ch=../config/chaines-tv.xml; [ -s "$ch" ] || ch=../outils/chaines-tv.xml
          npm run grab --- --channels=$ch --output=../guide-tv.xml --days=7 --maxConnections=3 --timeout=30000 2>&1 | tee ../grab.log

      - name: Tri des programmes de sport
        if: github.event_name != 'push'
        continue-on-error: true
        run: node outils/tv-tri.mjs guide-tv.xml tv.json grab.log

      # ---------- 2. Données de la page Sport ----------
      - name: Matchs, journées et classements
        continue-on-error: true
        run: node outils/sport-data.mjs

      # ---------- 3. Envoi des données ----------
      - name: Envoi des données
        run: bash outils/publier-donnees.sh tv.json donnees/sport
