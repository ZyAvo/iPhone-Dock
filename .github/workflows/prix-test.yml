name: Prix (test)

# Test de faisabilité de l'agrégateur de prix : Open Prices (Open Food Facts) + accès aux sites drive
# (Carrefour, E.Leclerc, Auchan, Intermarché, Super U, Monoprix, Lidl). Ne publie rien, n'écrit rien sur le dépôt.
# Lancement à la main : Actions → Prix (test) → Run workflow. Le rapport s'affiche dans le résumé de la tâche
# et se télécharge en bas de la page (« rapport-prix »). À comparer avec le même test lancé depuis le PC :
#   node outils/prix-test.mjs
on:
  workflow_dispatch:
    inputs:
      lat:
        description: 'Latitude de ta zone pour Open Prices (vide = Paris)'
        required: false
        default: ''
      lon:
        description: 'Longitude de ta zone (vide = Paris)'
        required: false
        default: ''
      rayon:
        description: 'Rayon en km'
        required: false
        default: '30'
      mot:
        description: 'Mot cherché sur les sites drive'
        required: false
        default: 'nutella'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test des sources de prix
        env:
          PRIX_LAT: ${{ inputs.lat }}
          PRIX_LON: ${{ inputs.lon }}
          PRIX_RAYON: ${{ inputs.rayon }}
          PRIX_MOT: ${{ inputs.mot }}
        run: node outils/prix-test.mjs
      - name: Rapport à télécharger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-prix
          path: |
            prix-test-rapport.md
            prix-test-rapport.json
          if-no-files-found: ignore
