<script>/* réglages du classeur (config/config.js) : CFG('sport.leagues', valeur par défaut) ; {re, flags} redevient une expression régulière */window.CFG=function(c,d){try{var v=c.split('.').reduce(function(o,k){return o==null?o:o[k]},window.MON_ECRAN_CONFIG);if(v==null)return d;return(function r(x){if(Array.isArray(x))return x.map(r);if(x&&typeof x==='object'){var k=Object.keys(x);if(k.length===2&&'re' in x&&'flags' in x)return new RegExp(x.re,x.flags);var o={};k.forEach(function(n){o[n]=r(x[n])});return o}return x})(v)}catch(e){return d}};</script>
<script>/* thème, mode clair/sombre (choisis dans État) et mise en page PC, avant l'affichage */try{const d=document.documentElement,p=localStorage.getItem('palette')||CFG('apparence.palette',''),m=localStorage.getItem('mode')||CFG('apparence.mode','');if(p&&p!=='bleu')d.dataset.palette=p;if(m==='clair')d.dataset.theme='light';else if(m==='sombre')d.dataset.theme='dark';const q=matchMedia('(min-width:1024px) and (hover:hover) and (pointer:fine)');d.classList.toggle('desk',q.matches);q.addEventListener&&q.addEventListener('change',e=>d.classList.toggle('desk',e.matches))}catch(e){}</script>

/* Layout : page cachée (coffre) — en-tête en verre, liens en grille d'icônes, notes en cartes */
:root{
  --base:#e7ecef;
  --blob-1:rgba(163,206,241,.95); --blob-2:rgba(96,150,186,.55); --blob-3:rgba(39,76,119,.35);
  --ink:#10233a; --ink-soft:#56636f;
  --glass:rgba(255,255,255,.22); --glass-tint:rgba(163,206,241,.10);
  --rim-1:rgba(255,255,255,.95); --rim-2:rgba(255,255,255,.12); --rim-3:rgba(255,255,255,.6);
  --spec:rgba(255,255,255,.55);
  --shadow:0 14px 34px -16px rgba(39,76,119,.45);
  --head:rgba(231,236,239,.72);
  --card:rgba(255,255,255,.6); --line:rgba(39,76,119,.12);
  --accent:#274c77; --on-accent:#e7ecef;
  --t-brick:#274c77; --t-slate:#6096ba; --t-olive:#3d6b97; --t-plum:#1b3656;
  --t-teal:#4c86b0; --t-ochre:#8b8c89; --t-char:#2f3e50; --t-rose:#7fb0d8;
  --f-ui:"Geist", -apple-system, "SF Pro Text", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --base:#08121f;
  --blob-1:rgba(39,76,119,.85); --blob-2:rgba(96,150,186,.45); --blob-3:rgba(163,206,241,.22);
  --ink:#e7ecef; --ink-soft:#a7b6c4;
  --glass:rgba(231,236,239,.07); --glass-tint:rgba(163,206,241,.06);
  --rim-1:rgba(231,236,239,.55); --rim-2:rgba(231,236,239,.04); --rim-3:rgba(163,206,241,.35);
  --spec:rgba(231,236,239,.16);
  --shadow:0 14px 34px -14px rgba(0,0,0,.75);
  --head:rgba(8,18,31,.66);
  --card:rgba(231,236,239,.06); --line:rgba(231,236,239,.1); --accent:#a3cef1; --on-accent:#08121f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --base:#08121f;
  --blob-1:rgba(39,76,119,.85); --blob-2:rgba(96,150,186,.45); --blob-3:rgba(163,206,241,.22);
  --ink:#e7ecef; --ink-soft:#a7b6c4;
  --glass:rgba(231,236,239,.07); --glass-tint:rgba(163,206,241,.06);
  --rim-1:rgba(231,236,239,.55); --rim-2:rgba(231,236,239,.04); --rim-3:rgba(163,206,241,.35);
  --spec:rgba(231,236,239,.16);
  --shadow:0 14px 34px -14px rgba(0,0,0,.75);
  --head:rgba(8,18,31,.66);

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;font-family:var(--f-ui);color:var(--ink);
  background-color:var(--base);
  background-image:
    radial-gradient(60% 45% at 10% 8%, var(--blob-1), transparent 70%),
    radial-gradient(55% 45% at 95% 35%, var(--blob-2), transparent 70%),
    radial-gradient(70% 50% at 30% 100%, var(--blob-3), transparent 70%);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--head);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}

/* verre */
.glass{position:relative;isolation:isolate;background:linear-gradient(160deg, var(--glass), var(--glass-tint));box-shadow:var(--shadow);
  backdrop-filter:blur(30px) saturate(1.8) brightness(1.05);-webkit-backdrop-filter:blur(30px) saturate(1.8) brightness(1.05)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 70% at 15% 0%, var(--spec), transparent 55%)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(145deg, var(--rim-1), var(--rim-2) 35%, var(--rim-2) 65%, var(--rim-3));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

.wrap{max-width:560px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

html.desk .wrap{max-width:860px}
/* ---------- Choix du thème ---------- */
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}
.th{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:16px;background:var(--card);border:2px solid transparent;text-align:left;min-height:44px}
.th[aria-checked="true"]{border-color:var(--accent)}
.themes .th b{font-size:.88rem;letter-spacing:0}
.th small{font-size:.72rem;color:var(--ink-soft)}
.pal{display:flex;height:24px;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.pal i{flex:1}
/* ---------- Interrupteurs ---------- */
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.sw-row small{display:block;color:var(--ink-soft);font-size:.78rem;margin-top:2px}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;border-radius:99px;background:rgba(139,140,137,.45);position:relative;cursor:pointer;transition:background .2s;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw:checked{background:#2fa35a}
.sw:checked::after{transform:translateX(18px)}
/* ---------- En-tête ---------- */
header{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--head);
  backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);
  border-bottom:1px solid var(--line)}
header .wrap{padding-block:10px 12px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.back{display:flex;align-items:center;gap:2px;color:var(--accent);font-weight:500;font-size:1rem;padding-block:6px}
.back svg,.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn{color:var(--accent);width:38px;height:38px;display:grid;place-items:center;border-radius:50%}
.icon-btn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.title-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-weight:700;font-size:2.2rem;letter-spacing:-.035em;margin:0;line-height:1}
.stamp{font-size:.74rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}

.tabs{display:flex;gap:4px;padding:4px;border-radius:18px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;scroll-snap-align:center;padding:8px 14px;border-radius:14px;font-size:.85rem;font-weight:500;color:var(--ink-soft);white-space:nowrap;
  transition:background .2s ease,color .2s ease}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}

/* ---------- État ---------- */
main .wrap{padding-block:14px 40px;display:flex;flex-direction:column;gap:12px}
.sum{border-radius:24px;padding:16px 18px;display:flex;align-items:center;gap:14px}
.sum b{font-size:1.1rem;letter-spacing:-.01em}
.sum p{margin:2px 0 0;font-size:.82rem;color:var(--ink-soft)}
.lamp{width:14px;height:14px;border-radius:50%;flex:none;background:var(--lc);box-shadow:0 0 0 4px color-mix(in oklab, var(--lc) 22%, transparent)}
.ok{--lc:#1e8a4c}.warn{--lc:#e08a12}.err{--lc:#d63c3c}.none{--lc:#8b8c89}
.part{border-radius:24px;overflow:hidden}
.part > summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.part > summary::-webkit-details-marker{display:none}
.part > summary .t{flex:1;min-width:0}
.part > summary b{display:block;font-size:1rem}
.part > summary small{display:block;font-size:.8rem;color:var(--ink-soft);margin-top:2px}
.part > summary .chev{width:18px;height:18px;fill:none;stroke:var(--ink-soft);stroke-width:2;transition:transform .2s ease}
.part[open] > summary .chev{transform:rotate(90deg)}
.body{padding:0 16px 14px;font-size:.84rem}
.rows{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.rows th,.rows td{text-align:left;padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
.rows th{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;border-top:0}
.rows td.n{text-align:right;white-space:nowrap}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:600;background:color-mix(in oklab, var(--lc) 16%, transparent);color:color-mix(in oklab, var(--lc) 80%, var(--ink))}
.note{color:var(--ink-soft);font-size:.8rem;margin:8px 0 0;line-height:1.45}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, monospace;font-size:.72rem;overflow-wrap:anywhere;color:var(--ink-soft)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{padding:10px 14px;border-radius:14px;font-weight:600;font-size:.86rem;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.main{background:var(--accent);color:var(--on-accent);border-color:transparent}
/* ---------- Toucher visible et fondu entre les pages ---------- */
@view-transition{navigation:auto}
::view-transition-old(root),::view-transition-new(root){animation-duration:.22s}
.tap-dot{position:fixed;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;pointer-events:none;z-index:9999;
  background:radial-gradient(circle, color-mix(in oklab, var(--accent) 45%, transparent), color-mix(in oklab, var(--accent) 22%, transparent) 55%, rgba(255,255,255,.15) 72%);
  box-shadow:0 0 0 2.5px rgba(255,255,255,.9), 0 0 0 4px color-mix(in oklab, var(--accent) 45%, transparent), 0 4px 16px rgba(0,0,0,.22);animation:tapdot .6s ease-out forwards}
.maj-toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:9998;
  padding:10px 16px;border-radius:999px;background:var(--accent, #274c77);color:var(--on-accent, #e7ecef);font:600 .85rem/1.2 var(--f-ui, system-ui);box-shadow:0 10px 26px -10px rgba(0,0,0,.5);
  animation:majin .3s ease-out}
@keyframes majin{from{opacity:0;transform:translate(-50%, 10px)}}
@keyframes tapdot{from{transform:scale(.55);opacity:1}to{transform:scale(1.45);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

<script>
/* Page cachée : on y arrive par un appui de 3 s sur l'heure de l'accueil, puis le code d'Investissements.
   Son contenu (liens et notes) reste uniquement sur cet appareil et y est CHIFFRÉ avec ton code
   (AES-GCM, clé tirée du code par PBKDF2) : sans le code, la mémoire du navigateur ne montre qu'un bloc illisible. */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'})[c]);
const LS = {get(k, d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? d; }catch{ return d; } },
            set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }};
const SS = {get(k){ try{ return sessionStorage.getItem(k); }catch{ return null; } }, set(k, v){ try{ v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); }catch{} }};
let ITEMS = [], CLE = null;
const OUVERT = 10 * 60e3;                       // le coffre reste ouvert 10 min (pour recharger la page sans redonner le code)
const ouvert = () => { const t = +SS.get('coffre:ok') || 0; return Date.now() - t < OUVERT && !!SS.get('coffre:cle'); };
/* ---------- Chiffrement ---------- */
const b64 = buf => { const u = new Uint8Array(buf); let t = ''; for (let i = 0; i < u.length; i += 8192) t += String.fromCharCode(...u.subarray(i, i + 8192)); return btoa(t); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriver(pin, sel){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:sel, iterations:150000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['encrypt', 'decrypt']);
}
async function chiffrer(cle, sel, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, cle, new TextEncoder().encode(JSON.stringify(obj)));
  return {v:1, sel:b64(sel), iv:b64(iv), ct:b64(ct)};
}
async function dechiffrer(cle, box){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(box.iv)}, cle, unb64(box.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function save(sync = true){
  const box = LS.get('coffre:chiffre', null), sel = box ? unb64(box.sel) : crypto.getRandomValues(new Uint8Array(16));
  LS.set('coffre:chiffre', await chiffrer(CLE, sel, ITEMS));
  if (sync && window.Synchro && Synchro.actif()) Synchro.plusTard('coffre', SYNC);
}
/* Synchronisation chiffrée entre appareils (synchro.js, réglée dans la page État) */
const SYNC = {local:() => ITEMS, choisir:(...a) => Synchro.conflit('Le coffre')(...a),
  appliquer:async v => { ITEMS = Array.isArray(v) ? v : []; await save(false); render(); }};
const syncCoffre = async () => { if (window.Synchro && Synchro.actif() && CLE && await Synchro.pret()) await Synchro.partie('coffre', SYNC); };
/* ouverture avec le code : déchiffre (ou chiffre l'ancien contenu en clair) ; garde la clé pour la session (10 min) */
async function ouvrirAvec(pin, ancien){
  const box = LS.get('coffre:chiffre', null);
  if (!box){                                                   // premier passage : contenu en clair de l'ancienne version
    const sel = crypto.getRandomValues(new Uint8Array(16)); CLE = await deriver(pin, sel);
    ITEMS = LS.get('coffre:items', []); LS.set('coffre:chiffre', await chiffrer(CLE, sel, ITEMS)); try{ localStorage.removeItem('coffre:items'); }catch{}
  } else {
    const sel = unb64(box.sel);
    try{ CLE = await deriver(ancien || pin, sel); ITEMS = await dechiffrer(CLE, box); }
    catch{ CLE = null; return false; }
    if (ancien){ CLE = await deriver(pin, sel); await save(false); }   // code changé depuis : on rechiffre avec le code actuel
  }
  SS.set('coffre:cle', b64(await crypto.subtle.exportKey('raw', CLE))); SS.set('coffre:ok', String(Date.now()));
  return true;
}
async function reprendre(){                                     // rechargement pendant la session
  try{ CLE = await crypto.subtle.importKey('raw', unb64(SS.get('coffre:cle')), 'AES-GCM', false, ['encrypt', 'decrypt']);
    ITEMS = await dechiffrer(CLE, LS.get('coffre:chiffre', null)); return true; }
  catch{ SS.set('coffre:cle', null); SS.set('coffre:ok', null); return false; }
}

let PRET = false;
async function demarrer(){ if (ouvert() && !(await reprendre())){} PRET = true; render(); if (CLE) syncCoffre(); }
function render(){
  if (!PRET) return;
  if (!LS.get('invest:pin', null)){ $('#lockBtn').hidden = true;
    $('#out').innerHTML = `<div class="lock glass"><b>Pas encore de code</b><p class="note">Crée d'abord un code dans Investissements (réglages ⚙︎, verrouillage). Le coffre utilise le même.</p><a class="btn main" href="invest.html">Aller à Investissements</a></div>`; return; }
  if (!ouvert() || !CLE){ $('#lockBtn').hidden = true; lockScreen(); return; }
  SS.set('coffre:ok', String(Date.now()));       // chaque action prolonge l'ouverture
  $('#lockBtn').hidden = false;
  const liens = ITEMS.map((x, i) => ({...x, i})).filter(x => x.type === 'lien'), notes = ITEMS.map((x, i) => ({...x, i})).filter(x => x.type === 'note');
  const ini = t => esc((String(t || '?').trim()[0] || '?').toUpperCase());
  $('#out').innerHTML = `
    <div class="sec-h"><span class="k">Liens</span><button class="add" type="button" data-add="lien">+ Ajouter</button></div>
    ${liens.length ? `<div class="liens">${liens.map(x => `<a class="lien glass" href="${esc(x.url)}" data-i="${x.i}" ${/^https?:/i.test(x.url) ? 'target="_blank" rel="noopener"' : ''}><span class="ic">${ini(x.titre)}</span><b>${esc(x.titre || x.url)}</b></a>`).join('')}</div>`
      : '<div class="vide glass">Aucun lien. Un lien peut être un site (https://…) ou une appli (par exemple « shortcuts://run-shortcut?name=… »).</div>'}
    <div class="sec-h"><span class="k">Notes</span><button class="add" type="button" data-add="note">+ Ajouter</button></div>
    ${notes.length ? `<div class="notes">${notes.map(x => `<button type="button" class="note-c glass" data-i="${x.i}">${x.titre ? `<b>${esc(x.titre)}</b>` : ''}<p>${esc(x.texte)}</p></button>`).join('')}</div>`
      : '<div class="vide glass">Aucune note.</div>'}
    <p class="edit-hint">Appui long sur un lien, ou touche une note, pour modifier ou supprimer. Tout reste sur cet iPhone.</p>`;
}
function lockScreen(){
  $('#out').innerHTML = `<form class="lock glass" id="pinF"><svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/><path d="M12 14.5v2.5"/></svg>
    <b>Code</b><input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" aria-label="Code">
    <p class="msg" aria-live="polite"></p><div class="row"><a class="btn" href="index.html">Annuler</a><button class="btn main" type="submit">Ouvrir</button></div></form>`;
  const f = $('#pinF'), inp = f.querySelector('input'), msg = f.querySelector('.msg'); setTimeout(() => inp.focus(), 50);
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const r = LS.get('invest:pin', null), t = LS.get('invest:pin-essais', {n:0, jusqu:0});
    if (t.jusqu > Date.now()){ msg.textContent = `Trop d'essais : réessaie dans ${Math.ceil((t.jusqu - Date.now()) / 1000)} s.`; return; }
    const h = [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(r.sel + inp.value)))].map(x => x.toString(16).padStart(2, '0')).join('');
    if (h === r.h){ LS.set('invest:pin-essais', {n:0, jusqu:0});
      const anc = f.querySelector('[name=ancien]');
      if (await ouvrirAvec(inp.value, anc && anc.value)){ render();
        if (window.Synchro && Synchro.actif()) Synchro.ouvrirAvecCode(inp.value).then(r => { if (r) syncCoffre(); });
        return; }
      // bon code, mais le coffre a été chiffré avec un code précédent (code changé depuis)
      msg.textContent = anc && anc.value ? 'Ancien code incorrect.' : 'Ton code a changé depuis : entre aussi l\'ancien code pour rouvrir le coffre.';
      if (!anc){ const l = document.createElement('input'); l.type = 'password'; l.name = 'ancien'; l.inputMode = 'numeric'; l.maxLength = 6; l.placeholder = 'Ancien code'; l.setAttribute('aria-label', 'Ancien code'); inp.after(l); }
      f.dataset.pin = inp.value; return; }
    t.n++; if (t.n >= 5){ t.n = 0; t.jusqu = Date.now() + 30e3; } LS.set('invest:pin-essais', t);
    msg.textContent = t.jusqu > Date.now() ? 'Trop d\'essais : attends 30 s.' : `Code incorrect (essai ${t.n}/5).`; inp.value = ''; inp.focus();
  });
}
function editer(i, type){
  const x = i != null ? ITEMS[i] : {type, titre:'', url:'', texte:''};
  const box = document.createElement('div'); box.className = 'scrim';
  box.innerHTML = `<form class="panel glass" role="dialog" aria-modal="true" aria-label="${x.type === 'lien' ? 'Lien' : 'Note'}"><h3>${i != null ? 'Modifier' : 'Ajouter'} ${x.type === 'lien' ? 'un lien' : 'une note'}</h3>
    <label>Titre<input name="titre" value="${esc(x.titre)}" autocomplete="off"></label>
    ${x.type === 'lien' ? `<label>Adresse<input name="url" value="${esc(x.url)}" placeholder="https://… ou appli://…" autocomplete="off" autocapitalize="off" spellcheck="false"></label>`
      : `<label>Texte<textarea name="texte">${esc(x.texte)}</textarea></label>`}
    <p class="msg" aria-live="polite"></p>
    <div class="row">${i != null ? '<button type="button" class="btn del" data-x="del">Supprimer</button>' : ''}<button type="button" class="btn" data-x="close">Annuler</button><button type="submit" class="btn main">Enregistrer</button></div></form>`;
  document.body.appendChild(box);
  const f = box.querySelector('form'); setTimeout(() => f.querySelector('input,textarea').focus(), 50);
  box.addEventListener('click', e => { const a = e.target.closest('[data-x]');
    if (e.target === box || (a && a.dataset.x === 'close')) box.remove();
    else if (a && a.dataset.x === 'del'){ ITEMS.splice(i, 1); save(); box.remove(); render(); } });
  f.addEventListener('submit', e => { e.preventDefault();
    const d = Object.fromEntries(new FormData(f)); let url = (d.url || '').trim();
    if (x.type === 'lien'){ if (!url){ f.querySelector('.msg').textContent = 'Indique une adresse.'; return; } if (!/^[a-z][\w+.-]*:/i.test(url)) url = 'https://' + url; }
    else if (!(d.texte || '').trim() && !(d.titre || '').trim()){ f.querySelector('.msg').textContent = 'Note vide.'; return; }
    const y = x.type === 'lien' ? {type:'lien', titre:(d.titre || '').trim(), url} : {type:'note', titre:(d.titre || '').trim(), texte:d.texte || ''};
    if (i != null) ITEMS[i] = y; else ITEMS.push(y);
    save(); box.remove(); render(); });
}
document.addEventListener('click', e => {
  const add = e.target.closest('[data-add]'); if (add){ editer(null, add.dataset.add); return; }
  const n = e.target.closest('.note-c'); if (n){ editer(+n.dataset.i); return; }
  if (e.target.closest('#lockBtn')){ SS.set('coffre:ok', null); SS.set('coffre:cle', null); location.href = 'index.html'; }
});
/* appui long sur un lien : modifier */
(() => { let t = null, fired = false;
  document.addEventListener('pointerdown', e => { const a = e.target.closest('.lien'); if (!a) return; fired = false; t = setTimeout(() => { fired = true; editer(+a.dataset.i); }, 600); });
  ['pointerup', 'pointercancel', 'pointermove'].forEach(ev => document.addEventListener(ev, e => { if (ev === 'pointermove' && Math.abs(e.movementX) + Math.abs(e.movementY) < 4) return; clearTimeout(t); }));
  document.addEventListener('contextmenu', e => { if (e.target.closest('.lien')) e.preventDefault(); });
  window.addEventListener('click', e => { if (fired && e.target.closest('.lien')){ e.preventDefault(); e.stopImmediatePropagation(); fired = false; } }, true);
})();
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
demarrer();
</script>

<script>
/* Toucher visible : un rond qui s'efface là où le doigt appuie (pratique aussi pour les vidéos de démo) */
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const d = document.createElement('span'); d.className = 'tap-dot';
  d.style.left = e.clientX + 'px'; d.style.top = e.clientY + 'px';
  document.body.appendChild(d); setTimeout(() => d.remove(), 650);
}, {passive:true, capture:true});
</script>
<script>
/* Mise en mémoire sur l'iPhone (démarrage instantané, hors ligne) + avis quand une nouvelle version est déposée */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  const t0 = Date.now(); let majDispo = false, cacheAt = 0;
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => {
    if (!e.data || e.data.type !== 'nouvelle-version') return;
    majDispo = true;
    if (Date.now() - t0 < 8000){ location.reload(); return; }         // page tout juste ouverte : on passe directement à la nouvelle version
    if (document.querySelector('.maj-toast')) return;
    const b = document.createElement('button'); b.type = 'button'; b.className = 'maj-toast'; b.textContent = 'Nouvelle version — toucher pour l\'afficher';
    b.addEventListener('click', () => location.reload()); document.body.appendChild(b);
  });
  try{ navigator.serviceWorker.startMessages(); }catch{}
  /* Retour sur l'appli : nouvelle version déjà prête → rechargement ; sinon on vérifie s'il y en a une (au plus toutes les 2 min) */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (majDispo){ location.reload(); return; }
    if (Date.now() - cacheAt < 120e3) return;
    cacheAt = Date.now();
    navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});
    fetch(location.pathname, {cache:'no-cache'}).catch(() => {});
  });
}
</script>

<style>
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top, 0px) + 6px);z-index:9999;width:38px;height:38px;margin-left:-19px;border-radius:50%;
  display:grid;place-items:center;pointer-events:none;opacity:0;transform:translateY(-60px);
  background:var(--sheet-solid, var(--base, #eef2f5));color:var(--ink-soft, #56636f);box-shadow:0 6px 18px -8px rgba(0,0,0,.45);border:1px solid var(--line, rgba(0,0,0,.1))}
.ptr svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.ptr.pret{color:var(--accent, #274c77)}
.ptr.pret svg{transform:rotate(180deg)}
.ptr.va{transition:transform .2s, opacity .2s}
.ptr.tourne svg{animation:ptr-t .7s linear infinite}
@keyframes ptr-t{to{transform:rotate(360deg)}}
</style>
<div class="ptr" id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg></div>
<script>
(() => {
  const el = document.getElementById('ptr'), SEUIL = 78;
  let y0 = null, x0 = 0, d = 0, actif = false;
  const OVER = '.scrim:not([hidden]),.sheet-bg:not([hidden]),.sheet:not([hidden]),[role="dialog"]:not([hidden])';
  const bloque = t => [...document.querySelectorAll(OVER)].some(e => e.getClientRects().length) || !t.closest || t.closest('input,textarea,select,[data-no-ptr]') ||
    (() => { for (let n = t; n && n !== document.body; n = n.parentElement) if (n.scrollTop > 0) return true; return false; })();
  const set = (y, cls) => { el.style.transform = `translateY(${y}px)`; el.style.opacity = Math.min(1, y / 40); el.className = 'ptr' + (cls ? ' ' + cls : ''); };
  addEventListener('touchstart', e => {
    if (e.touches.length !== 1 || (scrollY || document.documentElement.scrollTop) > 0 || bloque(e.target)) { y0 = null; return; }
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; d = 0; actif = false;
  }, {passive:true});
  addEventListener('touchmove', e => {
    if (y0 == null) return;
    const dy = e.touches[0].clientY - y0, dx = e.touches[0].clientX - x0;
    if (!actif){ if (Math.abs(dx) > Math.abs(dy) || dy < 6){ if (Math.abs(dx) > 10 || dy < -6) y0 = null; return; } if ((scrollY || document.documentElement.scrollTop) > 0){ y0 = null; return; } actif = true; }
    d = Math.max(0, dy);
    const y = Math.min(80, d * .5);
    set(y - 10, d >= SEUIL ? 'pret' : '');
  }, {passive:true});
  addEventListener('touchend', () => {
    if (y0 == null || !actif){ y0 = null; return; }
    y0 = null;
    if (d >= SEUIL){ set(34, 'va tourne'); setTimeout(() => location.reload(), 250); }
    else { set(-60, 'va'); }
  }, {passive:true});
  addEventListener('touchcancel', () => { if (actif) set(-60, 'va'); y0 = null; }, {passive:true});
})();
</script>
