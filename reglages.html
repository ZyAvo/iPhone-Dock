<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="mon-ecran-version" content="e05ed3bd">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Réglages</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<script src="config/config.js"></script>
<script src="noyau.js"></script>
<script src="themes.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600;700&display=swap">
<style>
/* Layout : en-tête collant en verre (retour, titre, recherche) ; menu des réglages et écran de choix
   (côte à côte sur ordinateur, l'un après l'autre sur téléphone) ; barre d'envoi en bas */
:root{
  --base:#e7ecef;
  --blob-1:rgba(163,206,241,.95); --blob-2:rgba(96,150,186,.55); --blob-3:rgba(39,76,119,.35);
  --ink:#10233a; --ink-soft:#56636f;
  --glass:rgba(255,255,255,.22); --glass-tint:rgba(163,206,241,.10);
  --rim-1:rgba(255,255,255,.95); --rim-2:rgba(255,255,255,.12); --rim-3:rgba(255,255,255,.6);
  --spec:rgba(255,255,255,.55);
  --shadow:0 14px 34px -16px rgba(39,76,119,.45);
  --head:rgba(231,236,239,.72);
  --card:rgba(255,255,255,.6); --line:rgba(39,76,119,.12);
  --accent:#274c77; --on-accent:#e7ecef;
  --t-brick:#274c77; --t-slate:#6096ba; --t-olive:#3d6b97; --t-plum:#1b3656;
  --t-teal:#4c86b0; --t-ochre:#8b8c89; --t-char:#2f3e50; --t-rose:#7fb0d8;
  --f-ui:"Geist", -apple-system, "SF Pro Text", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --base:#08121f;
  --blob-1:rgba(39,76,119,.85); --blob-2:rgba(96,150,186,.45); --blob-3:rgba(163,206,241,.22);
  --ink:#e7ecef; --ink-soft:#a7b6c4;
  --glass:rgba(231,236,239,.07); --glass-tint:rgba(163,206,241,.06);
  --rim-1:rgba(231,236,239,.55); --rim-2:rgba(231,236,239,.04); --rim-3:rgba(163,206,241,.35);
  --spec:rgba(231,236,239,.16);
  --shadow:0 14px 34px -14px rgba(0,0,0,.75);
  --head:rgba(8,18,31,.66);
  --card:rgba(231,236,239,.06); --line:rgba(231,236,239,.1); --accent:#a3cef1; --on-accent:#08121f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --base:#08121f;
  --blob-1:rgba(39,76,119,.85); --blob-2:rgba(96,150,186,.45); --blob-3:rgba(163,206,241,.22);
  --ink:#e7ecef; --ink-soft:#a7b6c4;
  --glass:rgba(231,236,239,.07); --glass-tint:rgba(163,206,241,.06);
  --rim-1:rgba(231,236,239,.55); --rim-2:rgba(231,236,239,.04); --rim-3:rgba(163,206,241,.35);
  --spec:rgba(231,236,239,.16);
  --shadow:0 14px 34px -14px rgba(0,0,0,.75);
  --head:rgba(8,18,31,.66);
  --card:rgba(231,236,239,.06); --line:rgba(231,236,239,.1); --accent:#a3cef1; --on-accent:#08121f;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;font-family:var(--f-ui);color:var(--ink);
  background-color:var(--base);
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--head);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}

/* verre */
.glass{position:relative;isolation:isolate;background:linear-gradient(160deg, var(--glass), var(--glass-tint));box-shadow:var(--shadow);
  backdrop-filter:blur(30px) saturate(1.8) brightness(1.05);-webkit-backdrop-filter:blur(30px) saturate(1.8) brightness(1.05)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 70% at 15% 0%, var(--spec), transparent 55%)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(145deg, var(--rim-1), var(--rim-2) 35%, var(--rim-2) 65%, var(--rim-3));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

.wrap{max-width:560px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

html.desk .wrap{max-width:860px}
/* ---------- Interrupteurs ---------- */
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.sw-row small{display:block;color:var(--ink-soft);font-size:.78rem;margin-top:2px}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;border-radius:99px;background:rgba(139,140,137,.45);position:relative;cursor:pointer;transition:background .2s;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw:checked{background:#2fa35a}
.sw:checked::after{transform:translateX(18px)}
/* ---------- En-tête ---------- */
header{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--head);
  backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);
  border-bottom:1px solid var(--line)}
header .wrap{padding-block:10px 12px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.back{display:flex;align-items:center;gap:2px;color:var(--accent);font-weight:500;font-size:1rem;padding-block:6px}
.back svg,.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn{color:var(--accent);width:38px;height:38px;display:grid;place-items:center;border-radius:50%}
.icon-btn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.title-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-weight:700;font-size:2.2rem;letter-spacing:-.035em;margin:0;line-height:1}
.stamp{font-size:.74rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}

.tabs{display:flex;gap:4px;padding:4px;border-radius:18px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;scroll-snap-align:center;padding:8px 14px;border-radius:14px;font-size:.85rem;font-weight:500;color:var(--ink-soft);white-space:nowrap;
  transition:background .2s ease,color .2s ease}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}


.note{color:var(--ink-soft);font-size:.8rem;margin:8px 0 0;line-height:1.45}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, monospace;font-size:.72rem;overflow-wrap:anywhere;color:var(--ink-soft)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{padding:10px 14px;border-radius:14px;font-weight:600;font-size:.86rem;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.main{background:var(--accent);color:var(--on-accent);border-color:transparent}
/* ---------- Toucher visible et fondu entre les pages ---------- */
@view-transition{navigation:auto}
::view-transition-old(root),::view-transition-new(root){animation-duration:.22s}
.tap-dot{position:fixed;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;pointer-events:none;z-index:9999;
  background:radial-gradient(circle, color-mix(in oklab, var(--accent) 45%, transparent), color-mix(in oklab, var(--accent) 22%, transparent) 55%, rgba(255,255,255,.15) 72%);
  box-shadow:0 0 0 2.5px rgba(255,255,255,.9), 0 0 0 4px color-mix(in oklab, var(--accent) 45%, transparent), 0 4px 16px rgba(0,0,0,.22);animation:tapdot .6s ease-out forwards}
.maj-toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:9998;
  padding:10px 16px;border-radius:999px;background:var(--accent, #274c77);color:var(--on-accent, #e7ecef);font:600 .85rem/1.2 var(--f-ui, system-ui);box-shadow:0 10px 26px -10px rgba(0,0,0,.5);
  animation:majin .3s ease-out}
@keyframes majin{from{opacity:0;transform:translate(-50%, 10px)}}
@keyframes tapdot{from{transform:scale(.55);opacity:1}to{transform:scale(1.45);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* ---------- Réglages : menu (liste des écrans) et écran de choix ---------- */
main .wrap{padding-block:14px calc(120px + env(safe-area-inset-bottom, 0px))}
.lay{display:flex;flex-direction:column;gap:12px}
html.desk .lay{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
html.desk .menu{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 96px)}
.lay:not(.sur-ecran) #ecran,.lay.sur-ecran .menu{display:none}
html.desk .lay .menu,html.desk .lay #ecran{display:flex}
.menu,#ecran{flex-direction:column;gap:12px;min-width:0}
.menu{display:flex}
#ecran{display:flex}
.groupe{border-radius:22px;overflow:hidden}
.groupe h2{margin:0;padding:12px 16px 6px;font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;min-height:54px;text-align:left;border-top:1px solid var(--line)}
.groupe h2 + .mrow{border-top:0}
.mrow .ic{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent)}
.mrow .ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mrow .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mrow b{font-size:.95rem;font-weight:600}
.mrow small{font-size:.76rem;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .chev{flex:none;width:16px;height:16px;fill:none;stroke:var(--ink-soft);stroke-width:2}
.mrow[aria-current="page"]{background:var(--accent-soft, rgba(127,127,127,.1))}
.mrow:active{background:var(--accent-soft, rgba(127,127,127,.1))}
.ptit{font-size:.78rem;color:var(--ink-soft);line-height:1.45;margin:0;padding:0 16px 12px}

/* outils de l'écran (dans l'en-tête) : français / international, recherche */
.outils{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;gap:2px;padding:3px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.seg button{flex:1;padding:7px 6px;border-radius:11px;font-size:.84rem;font-weight:500;color:var(--ink-soft);min-height:34px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.cherche{display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.cherche svg{flex:none;width:17px;height:17px;fill:none;stroke:var(--ink-soft);stroke-width:2;stroke-linecap:round}
.cherche input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:none;border:0;padding:9px 0;outline:none}
.cherche input::placeholder{color:var(--ink-soft)}
.cherche button{font-size:.8rem;color:var(--accent);font-weight:600;padding:6px 0}
.intro{font-size:.8rem;color:var(--ink-soft);line-height:1.45;margin:0 4px}
header.sur-ecran h1{font-size:1.75rem}
header.sur-ecran .wrap{gap:8px}
.ecr-t{display:none;margin:0 4px;font-size:1.35rem;letter-spacing:-.02em}
html.desk .ecr-t{display:block}

/* sections repliables */
.sec{border-radius:20px;overflow:hidden}
.sec-h{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;min-height:54px}
.sec-t{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:8px 6px 8px 10px;text-align:left;border-radius:14px}
.sec-t .chev{flex:none;width:16px;height:16px;fill:none;stroke:var(--ink-soft);stroke-width:2.2;transition:transform .2s ease}
.sec-t[aria-expanded="true"] .chev{transform:rotate(90deg)}
.sec-t span{min-width:0;display:flex;flex-direction:column;gap:2px}
.sec-t b{font-size:.95rem;font-weight:600}
.sec-t small{font-size:.74rem;color:var(--ink-soft)}
.tout{flex:none;display:flex;align-items:center;gap:7px;font-size:.72rem;color:var(--ink-soft);padding:6px 4px;cursor:pointer}
.tout.gris{opacity:.45;cursor:default}
.sec-b{border-top:1px solid var(--line)}
.sec-b[hidden]{display:none}
.chefs{display:flex;justify-content:flex-end;gap:12px;padding:6px 14px 0;font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.chefs span:last-child{width:46px;text-align:center}

/* une ligne = un élément */
.it{display:flex;align-items:center;gap:10px;padding:9px 14px;min-height:52px;border-top:1px solid var(--line)}
.sec-b > .it:first-child,.chefs + .it{border-top:0}
.it-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.it-t b{font-size:.9rem;font-weight:500;overflow-wrap:anywhere}
.it-t small{font-size:.74rem;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it.gris .it-t b,.it.gris .it-t small:first-of-type{opacity:.5}
.it.efface .it-t b{text-decoration:line-through;opacity:.6}
.etq{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.bd{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:.7rem;font-weight:600;white-space:normal;line-height:1.3;
  background:color-mix(in oklab, var(--lc, #8b8c89) 15%, transparent);color:color-mix(in oklab, var(--lc, #8b8c89) 78%, var(--ink))}
.bd.att{--lc:#e08a12}.bd.ok{--lc:#1e8a4c}.bd.ko{--lc:#d63c3c}.bd.gr{--lc:#8b8c89}
.it .mini{flex:none;font-size:.76rem;font-weight:600;color:var(--accent);padding:6px 4px}
.it .poub{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:#d63c3c}
.it .poub svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* case « Accueil » (marchés) */
.acc{flex:none;width:34px;height:30px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);color:var(--ink-soft);background:var(--card)}
.acc svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.acc[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.acc:disabled{opacity:.35;cursor:default}
.acc-vide{flex:none;width:34px}

/* interrupteur (élément) et case ronde (toute la section) */
.sw:disabled{opacity:.4;cursor:default}
.ck{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:0;border-radius:50%;border:2px solid var(--ink-soft);display:grid;place-items:center;cursor:pointer;background:transparent}
.ck::after{content:"";width:10px;height:6px;border:solid var(--on-accent);border-width:0 0 2.4px 2.4px;transform:translateY(-1px) rotate(-45deg);opacity:0}
.ck:checked{background:var(--accent);border-color:var(--accent)}
.ck:checked::after{opacity:1}
.ck:indeterminate{border-color:var(--accent);background:radial-gradient(circle, var(--accent) 0 4px, transparent 5px)}
.ck:disabled{opacity:.4;cursor:default}

/* Mes ajouts */
.ajf{display:flex;flex-direction:column;gap:10px;padding:12px 14px 14px;border-top:1px solid var(--line)}
.ajf label{display:flex;flex-direction:column;gap:5px;font-size:.78rem;color:var(--ink-soft);font-weight:500}
.ajf input,.ajf select{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;width:100%;min-width:0}
.ajf .lig{display:flex;gap:8px;align-items:center;font-size:.82rem;color:var(--ink)}
.ajf .msg{margin:0;font-size:.8rem;color:#d63c3c}
.vide{padding:14px 16px;font-size:.84rem;color:var(--ink-soft)}
.ajout-btn{display:flex;align-items:center;gap:8px;width:100%;padding:12px 14px;border-top:1px solid var(--line);color:var(--accent);font-weight:600;font-size:.88rem;text-align:left}
.ajout-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

/* Pages et widgets */
.sec-t.fixe{cursor:default;padding-left:12px}
label.it{cursor:pointer}
.it.dispo-l{flex-wrap:wrap;row-gap:8px}
.it.dispo-l .it-t small,.it.acc-l .it-t small{white-space:normal}
.it .seg.dispo{flex:1 1 100%}
.it .seg.dispo button{min-height:30px;padding:5px 6px;font-size:.8rem}

/* ---------- Écran d'accueil (éditeur) : tuiles comme sur l'accueil, bandeau, menu Navigation, fiche ---------- */
.ed-etat{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 4px}
.eg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px 10px;padding:14px 12px 12px;min-height:84px}
.eg.eg4{grid-template-columns:repeat(4,minmax(0,1fr));padding:4px 2px 2px}
html.desk .eg:not(.eg4){grid-template-columns:repeat(7,minmax(0,1fr))}
.et{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;padding:0;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;cursor:grab}
.et .tile,.en .tile,.sh-h .tile{width:100%;aspect-ratio:1;border-radius:26%;display:grid;place-items:center;color:var(--glyph,#fff);position:relative;isolation:isolate;
  background:linear-gradient(160deg, color-mix(in oklab, var(--c) 55%, transparent), color-mix(in oklab, var(--c) 88%, transparent));
  box-shadow:0 10px 22px -12px color-mix(in oklab, var(--c) 80%, black);transition:transform .15s}
.et:active .tile{transform:scale(.94)}
.et .tile svg,.en .tile svg,.sh-h .tile svg{width:50%;height:50%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tile .mo{font-weight:700;font-size:.9rem;letter-spacing:-.03em}
.tile .mo.long{font-size:.66rem}
.en .tile .mo{font-size:.78rem}
.tile.img{background:var(--img) center / cover no-repeat;box-shadow:0 8px 18px -10px rgba(0,0,0,.45)}
.tile.img > *{display:none}
.tile.folder{background:linear-gradient(160deg, var(--glass), var(--glass-tint));box-shadow:var(--shadow);border:1px solid var(--line);
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10%;padding:16%;place-items:stretch}
.tile.folder i{border-radius:30%;display:block;min-width:0;min-height:0;background:linear-gradient(160deg, color-mix(in oklab, var(--c) 60%, transparent), var(--c))}
.tile.folder i.img{background:var(--img) center / cover no-repeat}
.tile.auto{background:none;box-shadow:none;border:2px dashed color-mix(in oklab, var(--ink-soft) 60%, transparent);color:var(--ink-soft)}
.live-w{display:flex;flex-direction:column;align-items:flex-start;color:var(--glyph,#fff)}
.live-row{display:flex;align-items:center;gap:3px}.live-row b{font-weight:800;font-size:.72rem;letter-spacing:.05em}
.live-dot{width:7px;height:7px;border-radius:50%;background:#aeb4ba;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.live-sub{margin-left:10px;font-size:.6rem;font-weight:700;font-style:italic;color:var(--sport-accent,#a3cef1);line-height:1}
.et .name{font-size:.64rem;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.et.et-auto .name{color:var(--ink-soft);font-style:italic}
.et.off .tile{filter:grayscale(1);opacity:.4}
.pt{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;border:2px solid var(--base);background:#e08a12}
.pt.ko{background:#d63c3c}

<script>
/* Réglages : tout ce qui se règle dans l'appli, au même endroit.
   - Choix du classeur (médias d'actus, chaînes YouTube, compétitions, marchés et fonds) : lus dans config/catalogue.json,
     modifiés avec Noyau.modifs (envoyés groupés dans config/modifs.json, reportés dans configuration.xlsx par la tâche « Configuration »).
   - Mes choix personnels (favoris, abonnements, villes météo, Spotify, portefeuille) : raccourcis vers les fenêtres de leurs pages,
     rien ne change dans leur fonctionnement (ils restent sur l'appareil et dans la partie « prefs » de la synchro).
   Uniquement Noyau (pas d'astuce propre à Safari) : la même page servira aux applis dédiées.
   - Pages et widgets (onglet Accueil) : activer / désactiver pages et widgets, source du widget « À la une » ; appliqués tout de suite
     sur cet appareil par Noyau.accueil (choix en attente compris), sur les autres après le report.
   Adresses : reglages.html#accueil | #actus | #actus-en | #youtube | #sport | #marches ; ?retour=actus (page d'où l'on vient) ;
   ?ajout=youtube (Mes ajouts de ce module, formulaire ouvert) */
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const M = Noyau.modifs, C = Noyau.catalogue, S = Noyau.stockage, A = Noyau.accueil;
const SVG = p => `<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const ICO = {
  actus:'<path d="M5 4h11a2 2 0 0 1 2 2v13a1 1 0 0 0 2 0V8"/><path d="M5 4v15a1 1 0 0 0 1 1h14"/><path d="M8 8h6M8 12h6M8 16h4"/>',
  youtube:'<rect x="3" y="5.5" width="18" height="13" rx="3.5"/><path d="m10.5 9.5 4 2.5-4 2.5z"/>',
  sport:'<circle cx="12" cy="12" r="8.5"/><path d="m12 7.5 3.6 2.6-1.4 4.2H9.8L8.4 10.1z"/><path d="M12 3.5v4M20.5 10l-4.9.1M17 19l-2.8-4.7M7 19l2.8-4.7M3.5 10l4.9.1"/>',
  marches:'<path d="M4 19h16"/><path d="m5 15 4-4 3 3 6-7"/><path d="M14 7h4v4"/>',
  etoile:'<path d="m12 4 2.5 5.1 5.6.8-4 3.9.9 5.6L12 16.8 7 19.4l1-5.6-4-3.9 5.6-.8z"/>',
  abos:'<rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M8 3.5 12 6l4-2.5"/>',

  synchro:'<path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20v-4h-4"/>',
  chev:'<path d="m9 6 6 6-6 6"/>', maison:'<path d="M4 11 12 4l8 7"/><path d="M6 10v9h12v-9"/>',
  poub:'<path d="M4 7h16M9 7V5h6v2M6.5 7l1 12h9l1-12"/>', plus:'<path d="M12 5v14M5 12h14"/>',
  pages:'<rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><path d="M14 17h6M17 14v6"/>',
  applis:'<rect x="3.5" y="3.5" width="5" height="5" rx="1.5"/><rect x="9.5" y="3.5" width="5" height="5" rx="1.5"/><rect x="15.5" y="3.5" width="5" height="5" rx="1.5"/><rect x="3.5" y="9.5" width="5" height="5" rx="1.5"/><rect x="9.5" y="9.5" width="5" height="5" rx="1.5"/><path d="M5 19.5h14"/>',
  cadenas:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  poignee:'<path d="M5 9h14M5 15h14"/>', croix:'<path d="M6 6l12 12M18 6 6 18"/>',
};
/* écrans de choix : modules du catalogue (config/catalogue.json) */
const ECRANS = {
  accueil:{titre:'Pages et widgets', modules:['accueil'], ico:'pages', special:'accueil',
           intro:'Désactive une page ou un widget : il disparaît de l\'écran d\'accueil et ne charge plus rien. Le changement se voit tout de suite sur cet appareil, sur tes autres appareils après le report dans le classeur.'},
  applis:{titre:'Écran d\'accueil', modules:['applis'], ico:'applis', special:'applis',
          intro:'Maintiens une tuile puis fais-la glisser pour la déplacer (sur un dossier pour l\'y ranger) ; touche-la pour la renommer, changer ses liens, la déplacer ou la masquer. Réglages et État restent toujours dans le bandeau. Le changement se voit tout de suite sur cet appareil, sur tes autres appareils après le report dans le classeur.'},
  actus:{titre:'Médias d\'actus', modules:['actus', 'actus-en'], langues:['Français', 'International'], ico:'actus',
         intro:'Coche un média : sa rubrique apparaît dans la page Actus. « Toute la rubrique » prend tous ses médias, y compris ceux ajoutés plus tard au classeur.'},
  youtube:{titre:'Chaînes YouTube', modules:['youtube'], ico:'youtube',
           intro:'Les vidéos récentes des chaînes cochées s\'affichent dans l\'onglet YouTube de la page Vidéos.'},
  sport:{titre:'Compétitions', modules:['sport'], ico:'sport',
         intro:'Les compétitions cochées s\'affichent dans la page Sport. Les favoris (équipes, compétitions) se choisissent avec l\'étoile, dans la page Sport.'},
  marches:{titre:'Marchés et fonds', modules:['marches'], ico:'marches', widget:true,
           intro:'Coche ce que la page Investissements suit. La case maison l\'affiche aussi dans le widget de l\'écran d\'accueil (4 au plus conseillés).'},
};
const MOD_ECRAN = {accueil:'accueil', applis:'applis', actus:'actus', 'actus-en':'actus', youtube:'youtube', sport:'sport', marches:'marches'};
/* raccourcis vers les choix personnels, qui restent dans leurs pages */
const PERSO = [
  {ico:'etoile', t:'Équipes et compétitions favorites', d:'Page Sport, onglet Favoris (étoile sous un match)', url:'sport.html?ouvrir=favoris', page:'sport'},
  {ico:'abos', t:'Mes abonnements vidéo', d:'Page Vidéos : plateformes auxquelles tu es abonné', url:'videos.html?ouvrir=abos', page:'videos'},
  {ico:'meteo', t:'Villes météo', d:'Écran d\'accueil : lieux enregistrés', url:'index.html?ouvrir=villes', widget:'meteo'},
  {ico:'musique', t:'Spotify', d:'Écran d\'accueil : connexion du widget', url:'index.html?ouvrir=spotify', widget:'spotify'},
  {ico:'porte', t:'Réglages du portefeuille', d:'Page Investissements : cible, fiscalité, code', url:'invest.html?ouvrir=reglages', page:'invest'},
  {ico:'theme', t:'Thème, sauvegarde et synchronisation', d:'Page État', url:'etat.html'},
];
const RETOURS = {index:['index.html', 'Accueil'], actus:['actus.html', 'Actus'], sport:['sport.html', 'Sport'], videos:['videos.html', 'Vidéos'],
                 invest:['invest.html', 'Investissements'], etat:['etat.html', 'État']};
const params = new URLSearchParams(location.search), RETOUR = RETOURS[params.get('retour')] || null;

let CAT = null, erreurCat = '', route = '', langue = 0, q = '';
const OUV = new Set(S.session.lire('reglages:ouverts', []));            // sections dépliées (pour la session)
let formAjout = null;                                                    // module dont le formulaire « Ajouter » est ouvert
const VUS = new Set(S.lire('reglages:vus', []));                        // refus de report déjà lus (masqués)

/* ---------- état d'un élément ---------- */
const desk = () => document.documentElement.classList.contains('desk');
const moduleDe = mid => CAT && CAT.modules && CAT.modules[mid];
const etat = id => C.etat(id) || {oui:'', champs:{}, choisi:false, attente:false, support:'ok'};
const attenteDe = id => M.enAttente().filter(m => m.id === id);
const pasEnvoyee = id => M.nonEnvoyees().some(m => m.id === id);
const infoTxt = (mod, it) => Object.entries(it.infos || {}).filter(([k]) => !/^Prise en charge|^Clé ESPN|^Site|^Sport$/.test(k))
  .map(([, v]) => /^https?:\/\//.test(v) ? (() => { try{ return new URL(v).hostname.replace(/^www\./, ''); }catch{ return v; } })() : v).join(' · ');
const RECENT = 3 * 864e5;
function badges(id, it, {ajout = false} = {}){
  const b = [], A = attenteDe(id);
  if (it && it.support === 'dev') b.push('<span class="bd gr">à développer</span>');
  if (it && it.support === 'non') b.push('<span class="bd gr">non disponible</span>');
  if (A.length) b.push(`<span class="bd att">⏳ ${A.some(m => m.nonEnvoyee) ? 'pas encore envoyé' : 'en attente de report'}</span>`);
  else {
    const r = M.dernierResultat(id);
    if (r && r.statut !== 'ok') b.push(`<span class="bd ko">❌ ${esc(r.message)}</span>`);
    else if (r && Date.now() - Date.parse(r.le) < RECENT) b.push('<span class="bd ok">✅ reporté dans le classeur</span>');
  }
  if (it && it.support !== 'ok' && it.note) b.push(`<span class="bd gr">${esc(it.note)}</span>`);
  return b.length ? `<span class="etq">${b.join('')}</span>` : '';
}
/* compte des éléments disponibles choisis (et en attente) d'une section ou d'un module */
function compte(items){
  let n = 0, tot = 0, att = 0;
  for (const it of items){ const e = etat(it.id); if (it.support === 'ok'){ tot++; if (e.choisi) n++; } if (e.attente) att++; }
  return {n, tot, att};
}
const itemsDe = mod => (mod.sections || []).flatMap(s => s.items || []);

/* ---------- changements ---------- */
/* une modification pas encore envoyée qui revient à la valeur du classeur est simplement annulée */
function nettoyerRetour(id){
  const e = C.element(id); if (!e) return;
  const base = e.item ? {Oui:e.item.oui || '', ...(e.item.champs || {})} : {Oui:e.section.oui || ''};
  const ne = M.nonEnvoyees().find(m => m.id === id && m.champs && !m.effacer);
  if (!ne || M.enAttente().some(m => m.id === id && !m.nonEnvoyee)) return;
  if (Object.entries(ne.champs).every(([k, v]) => (base[k] || '') === (v || ''))) M.annuler(ne.uid);
}
function changer(id, champs, nom){ M.modifier(id, champs, nom ? {nom} : {}); nettoyerRetour(id); }
function choisirItem(id, on){
  const e = C.element(id); if (!e) return;
  if (e.ajout){ changer(id, {Oui:on ? 'Oui' : 'Non'}, e.item.nom); return; }
  const secOui = etat(e.section.id).oui;
  changer(id, {Oui:on ? 'Oui' : secOui === 'Oui' ? 'Non' : ''});
}
function choisirSection(secId, on){
  const e = C.element(secId); if (!e) return;
  changer(secId, {Oui:on ? 'Oui' : ''});
  for (const it of e.section.items || []){
    const o = etat(it.id).oui;
    if (on && o === 'Non') changer(it.id, {Oui:''});                       // la section prend tout : on retire les « Non »
    if (!on && o === 'Oui') changer(it.id, {Oui:''});                      // plus rien de la section
  }
}
function apresChangement(){ rendre(); planifier(); }

/* ---------- envoi groupé ---------- */
let etatBarre = {k:''}, suivi = null;
async function planifier(){
  if (!M.nonEnvoyees().length){ barre(); return; }
  if (!Noyau.synchro.actif()){ barre({k:'inactif'}); return; }
  if (!(await Noyau.synchro.pret())){ barre({k:'code'}); return; }
  barre({k:'bientot'});
  M.envoyerPlusTard(4000);
}
window.addEventListener('noyau:envoi', e => {
  const r = e.detail && e.detail.resultat;
  if (r === 'encours') return barre({k:'encours'});
  if (r === 'envoye'){ barre({k:'envoye'}); suivre(); }
  else if (r === 'verrou') barre({k:'code'});
  else if (r === 'inactif') barre({k:'inactif'});
  else if (r && r.startsWith('erreur:')) barre({k:'erreur', msg:Noyau.message(r)});
  else barre();
  rendre();
});
window.addEventListener('noyau:modifs', () => { if (!document.hidden) rendreMenu(); });
/* après un envoi : on relit le catalogue toutes les 30 s jusqu'au passage de la tâche « Configuration » (15 min au plus) */
function suivre(){
  if (suivi) return;
  const debut = Date.now();
  suivi = setInterval(async () => {
    if (document.hidden) return;
    const envoyees = M.enAttente().filter(m => !m.nonEnvoyee).map(m => m.uid);

/* ---------- Écran d'accueil : applis, dossiers, bandeau du bas, menu Navigation (onglet Applis du classeur) ----------
   Modèle : Noyau.applis (catalogue + choix en attente) ; l'ordre part en une « disposition » complète (Noyau.modifs.disposer),
   noms, liens et « masquer » en modifs par identifiant, les nouvelles applis par « Mes ajouts ». Réglages (⚙︎) et État ne sont pas
   dans le classeur : affichés verrouillés, on ne peut ni les déplacer ni les retirer. */
const AP = Noyau.applis, IC = Noyau.icones;
const ICS = S.lire('icons:v1', {}) || {};                                  // vraies icônes App Store gardées par l'accueil
const cleIcone = d => d.icon && !d.store && !d.storeId ? '' : d.storeId ? 'id:' + d.storeId : d.store ? 's:' + d.store : '';
const imgDe = d => { const k = cleIcone(d); return k && ICS[k] || ''; };
const pageDe = url => { const m = String(url || '').match(/^(?:\.\/)?(actus|sport|ecarts|videos|invest|cachee|etat|reglages)\.html(?:[?#]|$)/); return m ? (m[1] === 'ecarts' ? 'sport' : m[1]) : null; };
const AUTO_INFO = {actus:{icon:'news', w:'À la une', page:'actus'}, invest:{icon:'invest', w:'Investissements', page:'invest'}, sport:{icon:'sport', w:'Bandeau Sports', page:'sport'}};
let ED = null, FICHE = null, apresGlisse = 0, glisseId = '';
const modApplis = () => moduleDe('applis');
const sansDispoNonEnvoyee = () => M.enAttente().filter(x => !(x.disposition && x.disposition.module === 'applis' && x.nonEnvoyee));
function calculerED(){ const mod = modApplis(); ED = mod ? AP.appliquer(AP.depuisCatalogue(mod), M.enAttente()) : null; return ED; }
const tous = () => ED ? Object.entries(ED.listes).flatMap(([cle, L]) => L.map((it, i) => ({it, cle, i}))) : [];
const trouverIt = id => tous().find(x => x.it.id === id) || null;
const visibles = cle => ((ED && ED.listes[cle]) || []).filter(it => !it.cache);
const nomListe = cle => cle.startsWith('d:') ? `Dossier ${((ED.dossiers[cle.slice(2)] || {}).nom) || ''}` :
  ({accueil:'Écran d\'accueil', bas_gauche:'Bandeau du bas · gauche', bas_droite:'Bandeau du bas · droite', navigation:'Menu Navigation'})[cle] || cle;
function resumeApplis(){
  const m = calculerED(); if (!m) return 'onglet Applis absent du classeur';
  const n = Object.keys(m.listes).reduce((a, k) => a + visibles(k).filter(it => !['folder', 'auto'].includes(it.def.type)).length, 0);
  const d = m.ordreD.filter(k => visibles('d:' + k).length).length;
  return `${n} appli${n > 1 ? 's' : ''} · ${d} dossier${d > 1 ? 's' : ''} · bandeau ${visibles('bas_gauche').length + visibles('bas_droite').length}`;
}

/* ----- dessin ----- */
function tuileHTML(d, contenu){
  const c = `--c:var(${d.color || '--t-slate'})`;
  if (d.type === 'folder') return `<span class="tile folder">${(contenu || []).slice(0, 4).map(i => { const u = imgDe(i.def);
    return `<i class="${u ? 'img' : ''}" style="--c:var(${i.def.color || '--t-slate'})${u ? `;--img:url(&quot;${esc(u)}&quot;)` : ''}"></i>`; }).join('')}</span>`;
  if (d.type === 'auto') return `<span class="tile auto">${SVG(IC[(AUTO_INFO[d.auto] || {}).icon] || '')}</span>`;
  if (d.live) return `<span class="tile live-tile" style="${c}"><span class="live-w"><span class="live-row"><i class="live-dot"></i><b>LIVE</b></span><span class="live-sub">Sports</span></span></span>`;
  const u = imgDe(d), mono = d.mono || String(d.label || '').slice(0, 2);
  const inner = d.icon && IC[d.icon] ? SVG(IC[d.icon]) : `<span class="mo${String(mono).length > 3 ? ' long' : ''}">${esc(mono)}</span>`;
  return `<span class="tile${u ? ' img' : ''}" style="${c}${u ? `;--img:url(&quot;${esc(u)}&quot;)` : ''}">${inner}</span>`;
}
const pastille = it => { if (it.attente) return '<i class="pt" aria-hidden="true"></i>'; const r = M.dernierResultat(it.id); return r && r.statut !== 'ok' ? '<i class="pt ko" aria-hidden="true"></i>' : ''; };
const titreDe = it => { const d = it.def, p = pageDe(d.url);
  if (d.type === 'auto') return `${d.label} : visible seulement si le widget ${(AUTO_INFO[d.auto] || {}).w} est coupé`;
  if (p && !A.page(p)) return `${d.label} : page désactivée (Pages et widgets)`;
  return d.label; };
function etHTML(it){
  const d = it.def, p = pageDe(d.url), off = (p && !A.page(p)) || (d.type === 'auto' && !A.page((AUTO_INFO[d.auto] || {}).page));
  return `<button type="button" class="et${off ? ' off' : ''}${d.type === 'auto' ? ' et-auto' : ''}" data-et="${esc(it.id)}" aria-label="${esc(titreDe(it))}" title="${esc(titreDe(it))}">${tuileHTML(d, d.type === 'folder' ? visibles('d:' + d.target) : null)}<span class="name">${esc(d.label)}</span>${pastille(it)}</button>`;
}
const glypheBandeau = d => d.icon && IC[d.icon] ? SVG(IC[d.icon]) : `<span class="qm">${esc(d.mono || String(d.label || '').slice(0, 2))}</span>`;
const eqHTML = it => `<button type="button" class="eq" data-et="${esc(it.id)}" aria-label="${esc(it.def.label)}" title="${esc(it.def.label)}">${glypheBandeau(it.def)}${pastille(it)}</button>`;
const enHTML = (it, i) => `<button type="button" class="en" data-et="${esc(it.id)}" aria-label="${esc(it.def.label)}">${tuileHTML(it.def)}<span class="t"><b>${esc(it.def.label)}</b><small>${i === 0 ? 'mise en avant (première du menu)' : ''}</small></span>${SVG(ICO.poignee).replace('<svg', '<svg class="poi"')}${pastille(it)}</button>`;

function ecranApplis(E, mod){
  calculerED(); const m = ED;
  const dispo = M.enAttente().filter(x => x.disposition && x.disposition.module === 'applis');
  const refus = M.reportees().filter(r => (r.disposition === 'applis' || (r.ajout && r.ajout.module === 'applis') || /^(ap:|ajout:applis:)/.test(r.id || '')) &&
    r.resultat && r.resultat.statut !== 'ok' && !VUS.has(r.uid));
  let h = `<h2 class="ecr-t">${esc(E.titre)}</h2><p class="intro">${esc(E.intro)}</p>`;
  if (dispo.length) h += `<div class="ed-etat"><span class="bd att">⏳ nouvel ordre ${dispo.some(x => x.nonEnvoyee) ? 'pas encore envoyé' : 'en attente de report'}</span></div>`;
  for (const r of refus) h += `<div class="ed-etat"><span class="bd ko">❌ ${esc(r.nom || (r.ajout && r.ajout.nom) || (r.disposition ? 'Disposition' : r.id || ''))} : ${esc(r.resultat.message)}</span><button type="button" class="mini" data-vu="${esc(r.uid)}" style="color:var(--accent);font-weight:600;font-size:.78rem">OK</button></div>`;
  const acc = visibles('accueil');
  const manque = ['actus', 'invest', 'sport'].filter(a => !m.listes.accueil.some(it => it.def.type === 'auto' && it.def.auto === a && !it.cache));
  h += blocAccueil('Accueil', `${acc.length} tuile${acc.length > 1 ? 's' : ''} · dans l'ordre de l'écran`, `<div class="eg" data-liste="accueil" data-no-ptr>${acc.map(etHTML).join('')}</div>
    <div class="ed-act"><button type="button" class="btn" data-ap="ajouter">${SVG(ICO.plus)}Ajouter une appli</button></div>
    ${manque.length ? `<div class="ed-auto"><span>Tuiles de remplacement (si leur widget est coupé) : en fin de grille. Choisir leur place :</span>${manque.map(a => `<button type="button" data-auto="${a}">＋ ${esc(AP.TUILES_AUTO[a].label)}</button>`).join('')}</div>` : ''}`, false);
  const nb = k => visibles(k).length, trop = nb('bas_gauche') > 4 || nb('bas_droite') > 4;
  h += blocAccueil('Bandeau du bas', 'gauche · Réglages · État · droite', `<div class="eb" data-no-ptr>
      <div class="eb-g"><div class="eb-c" data-liste="bas_gauche">${visibles('bas_gauche').map(eqHTML).join('')}</div>
      <span class="eq fixe" role="img" aria-label="Réglages : toujours au bout du côté gauche" title="Réglages : toujours là">${SVG(IC.cog)}<span class="cad">${SVG(ICO.cadenas)}</span></span></div>
      <span class="eetat" role="img" aria-label="État des données : toujours au milieu" title="État : toujours au milieu"><i></i></span>
      <div class="eb-g d"><div class="eb-c" data-liste="bas_droite">${visibles('bas_droite').map(eqHTML).join('')}</div></div></div>
    ${trop ? '<p class="ptit">Sur téléphone, le bandeau tient 4 icônes de chaque côté.</p>' : '<p class="ptit">Fais glisser une icône d\'un côté à l\'autre, ou depuis l\'accueil (fiche › Place).</p>'}`, false);
  h += blocAccueil('Menu Navigation', 'proposé par le bouton Navigation du bandeau ; la première est mise en avant',
    `<div class="en-l" data-liste="navigation" data-sens="v" data-no-ptr>${visibles('navigation').map(enHTML).join('') || '<p class="vide">Aucune appli : le bouton Navigation n\'ouvre rien.</p>'}</div>`, false);
  const cachees = tous().filter(x => x.it.cache && x.it.def.type !== 'folder');
  const dossiersCaches = tous().filter(x => x.it.cache && x.it.def.type === 'folder');
  if (cachees.length || dossiersCaches.length) h += blocAccueil('Masquées', 'pas sur l\'écran ; touche « Afficher » pour les remettre',
    `<div class="en-l">${[...dossiersCaches, ...cachees].map(({it, cle}) => `<div class="en" style="cursor:default">${tuileHTML(it.def, it.def.type === 'folder' ? visibles('d:' + it.def.target) : null)}<span class="t"><b>${esc(it.def.label)}</b><small>${esc(it.def.type === 'folder' ? 'dossier' : nomListe(cle))}${it.attente ? ' · ⏳' : ''}</small></span><button type="button" class="mini" data-afficher="${esc(it.id)}">Afficher</button></div>`).join('')}</div>`, false);
  return h;
}

/* ----- changements ----- */
function envoyerDisposition(){
  const mod = modApplis(); if (!mod || !ED) return;
  const L = AP.disposition(ED), sans = AP.disposition(AP.appliquer(AP.depuisCatalogue(mod), sansDispoNonEnvoyee()));
  M.disposer('applis', JSON.stringify(L) === JSON.stringify(sans) ? null : L);     // revenu à l'ordre déjà connu : rien à envoyer
  apresChangement();
}
function deplacer(id, vers, pos){
  const x = trouverIt(id); if (!x || !AP.permis(x.it.def, vers) || !ED.listes[vers]) return false;
  ED.listes[x.cle].splice(x.i, 1);
  const L = ED.listes[vers]; L.splice(pos == null ? L.length : Math.max(0, Math.min(pos, L.length)), 0, x.it); return true;
}
function decaler(id, sens){
  const x = trouverIt(id); if (!x) return false; const L = ED.listes[x.cle];
  let j = x.i + sens; while (j >= 0 && j < L.length && L[j].cache) j += sens;
  if (j < 0 || j >= L.length) return false;
  L.splice(x.i, 1); L.splice(j, 0, x.it); return true;
}
function creerDossier(nom, idApp){
  const k = 'nouveau-' + Date.now().toString(36), x = trouverIt(idApp);
  ED.dossiers[k] = {nom, id:null}; ED.listes['d:' + k] = []; ED.ordreD.push(k);
  const pos = x && x.cle === 'accueil' ? x.i : ED.listes.accueil.length;
  ED.listes.accueil.splice(pos, 0, {id:'dossier:' + k, def:{label:nom, type:'folder', target:k}, cache:false});
  deplacer(idApp, 'd:' + k); return k;
}
function afficher(id, montrer){
  const x = trouverIt(id); if (!x) return;
  if (id.startsWith('uid:')){ M.majAjout(x.it.uid, {champs:{Oui:montrer ? 'Oui' : 'Non'}}); apresChangement(); return; }
  if (/^(auto|dossier):/.test(id)){ if (!montrer){ ED.listes[x.cle].splice(x.i, 1); envoyerDisposition(); } return; }   // pas encore une ligne du classeur
  changer(id, {Oui:montrer ? 'Oui' : 'Non'}); apresChangement();
}
/* cibles possibles pour « Place » */
function cibles(d){
  const L = [['accueil', 'Écran d\'accueil']];
  if (!AP.accueilSeul(d)){
    for (const k of ED.listes.accueil.filter(it => it.def.type === 'folder').map(it => it.def.target).filter(k => ED.dossiers[k])) L.push(['d:' + k, `Dossier ${ED.dossiers[k].nom}`]);
    if (!d.action) L.push(['+dossier', 'Nouveau dossier…']);
    L.push(['bas_gauche', 'Bandeau du bas · gauche'], ['bas_droite', 'Bandeau du bas · droite']);
    if (AP.estAppli(d)) L.push(['navigation', 'Menu Navigation']);
  }
  return L.filter(([k]) => k.startsWith('+') || AP.permis(d, k));
}

/* ----- fiche ----- */
const LIENS_F = [['Lien iPhone', 'app', 'Lien iPhone', 'ex. spotify://, shortcuts://run-shortcut?name=…'], ['Lien Android', 'android', 'Lien Android', 'ex. intent://…;package=…;end'], ['Lien web', 'web', 'Lien web', 'https://… (ordinateur, ou si l\'appli manque)']];
const champ = (nom, lab, val, {ph = '', lien = false, dis = false, aide = ''} = {}) => `<label class="chp">${esc(lab)}<input name="${esc(nom)}" value="${esc(val)}" ${ph ? `placeholder="${esc(ph)}"` : ''} maxlength="${lien ? 600 : 40}" autocomplete="off" ${lien ? 'autocapitalize="off" spellcheck="false" inputmode="url" class="lien"' : ''}${dis ? ' disabled' : ''}>${aide ? `<small>${esc(aide)}</small>` : ''}</label>`;
function teteFiche(d, sous, contenu){
  return `<div class="sh-h">${['bas_gauche', 'bas_droite'].includes(sous && sous.cle) ? `<span class="eq">${glypheBandeau(d)}</span>` : tuileHTML(d, contenu)}<span class="t"><h3 id="fT">${esc(d.label)}</h3><small>${esc(sous ? sous.txt : '')}</small></span>
    <button type="button" class="sh-x" data-f="fermer" aria-label="Fermer">${SVG(ICO.croix)}</button></div>`;
}
function ficheItem(f){
  const x = trouverIt(f.id); if (!x) return null;
  const {it, cle} = x, d = it.def, pend = it.id.startsWith('uid:'), parti = pend && !it.nonEnvoyee;
  const v = {Appli:d.label, 'Lien iPhone':d.app || '', 'Lien Android':d.android || '', 'Lien web':d.web || '', ...(f.brouillon || {})};
  const p = pageDe(d.url), L = ED.listes[cle], vi = L.filter(y => !y.cache), k = vi.indexOf(it);
  const typ = d.type === 'folder' ? 'dossier' : d.type === 'auto' ? `tuile de remplacement : visible seulement si le widget ${(AUTO_INFO[d.auto] || {}).w} est coupé` :
    d.action ? 'bouton : choix de l\'appli de navigation' : d.live ? 'tuile LIVE Sports (sur ordinateur, ou si le bandeau Sports est coupé)' : p ? `page ${d.url}${A.page(p) ? '' : ' · désactivée (Pages et widgets)'}` : 'appli';
  let b = '';
  if (pend) b = `<span class="etq"><span class="bd att">⏳ ajout ${it.nonEnvoyee ? 'pas encore envoyé' : 'en attente de report'}</span></span>`;
  else b = badges(it.id, null);
  let h = teteFiche(d, {cle, txt:`${typ} · ${nomListe(cle)}`}, d.type === 'folder' ? visibles('d:' + d.target) : null) + b;
  if (d.type !== 'auto' && d.type !== 'folder') h += champ('Appli', 'Nom', v.Appli, {dis:parti});
  if (AP.estAppli(d)){
    h += LIENS_F.map(([n, , lab, ph]) => champ(n, lab, v[n], {ph, lien:true, dis:parti})).join('');
    h += '<p class="ptit" style="padding:0">Le lien utilisé dépend de l\'appareil : iPhone (puis le site), Android (puis le site), ordinateur : le site.</p>';
  }
  const C_ = cibles(d);
  if (!pend) h += `<div class="sh-l"><label class="chp">Place<select data-f="vers">${C_.map(([kk, lab]) => `<option value="${esc(kk)}"${kk === cle ? ' selected' : ''}>${esc(lab)}</option>`).join('')}</select></label>
    <div class="seg" role="group" aria-label="Déplacer"><button type="button" data-f="avant" aria-label="Plus tôt"${k <= 0 ? ' disabled' : ''}>◀</button><button type="button" data-f="apres" aria-label="Plus loin"${k < 0 || k >= vi.length - 1 ? ' disabled' : ''}>▶</button></div></div>
    <div id="nvD" hidden>${champ('nouveauDossier', 'Nom du nouveau dossier', '', {ph:'ex. Loisirs'})}<div class="sh-a" style="margin-top:8px"><button type="button" class="btn main" data-f="creerDossier">Créer et y ranger</button></div></div>`;
  const act = [];
  if (pend && it.nonEnvoyee) act.push(`<button type="button" class="btn ko" data-f="annulerAjout">Annuler l'ajout</button>`);
  if (!pend && !(d.type === 'folder' && it.id.startsWith('dossier:'))) act.push(`<button type="button" class="btn" data-f="${it.cache ? 'afficher' : 'masquer'}">${it.cache ? 'Afficher' : d.type === 'folder' ? 'Masquer le dossier' : 'Masquer'}</button>`);
  if (it.id.startsWith('ajout:applis:')) act.push(`<button type="button" class="btn ko" data-f="effacer">Effacer l'ajout</button>`);
  if (d.type === 'folder') act.push(`<button type="button" class="btn" data-f="ouvrirDossier">Ouvrir le dossier</button>`);
  if (act.length) h += `<div class="sh-a">${act.join('')}</div>`;
  h += '<p class="sh-msg" id="fMsg" aria-live="polite"></p>';
  const modif = d.type !== 'auto' && d.type !== 'folder' && !parti;
  h += `<div class="sh-pied">${f.retour ? `<button type="button" class="btn" data-f="retour">‹ Dossier</button>` : ''}<button type="button" class="btn" data-f="fermer">${modif ? 'Annuler' : 'Fermer'}</button>${modif ? '<button type="button" class="btn main" data-f="ok">Enregistrer</button>' : ''}</div>`;
  return h;
}
function ficheDossier(f){
  const k = f.dossier, D = ED.dossiers[k]; if (!D) return null;
  const tuile = ED.listes.accueil.find(it => it.def.type === 'folder' && it.def.target === k), L = visibles('d:' + k);
  const nom = f.brouillon && 'nom' in f.brouillon ? f.brouillon.nom : D.nom;
  let h = teteFiche({label:D.nom, type:'folder'}, {cle:'accueil', txt:`dossier · ${L.length} appli${L.length > 1 ? 's' : ''}`}, L);
  h += champ('nom', 'Nom du dossier', nom);
  h += `<div class="eg eg4" data-liste="d:${esc(k)}" data-no-ptr>${L.map(etHTML).join('')}</div>
    <p class="ptit" style="padding:0">Maintiens puis fais glisser pour changer l'ordre ; touche une appli pour la régler ou la sortir du dossier (Place). Un dossier vide disparaît de l'écran.</p>`;
  const act = [`<button type="button" class="btn" data-f="ajouterIci">${SVG(ICO.plus).replace('<svg', '<svg style="width:15px;height:15px;vertical-align:-2px;fill:none;stroke:currentColor;stroke-width:2"')} Ajouter une appli ici</button>`];
  if (tuile) act.push(`<button type="button" class="btn" data-f="ficheTuile">Place du dossier…</button>`);
  h += `<div class="sh-a">${act.join('')}</div><p class="sh-msg" id="fMsg" aria-live="polite"></p>
    <div class="sh-pied"><button type="button" class="btn" data-f="fermer">Fermer</button><button type="button" class="btn main" data-f="okDossier">Enregistrer le nom</button></div>`;
  return h;
}
function ficheNouvelle(f){
  const v = {nom:'', ou:f.ou || 'accueil', nd:'', 'Lien iPhone':'', 'Lien Android':'', 'Lien web':'', ...(f.brouillon || {})};
  const opts = cibles({}).map(([k, lab]) => [k === '+dossier' ? '+dossier' : k, lab]);
  let h = `<div class="sh-h"><span class="t"><h3 id="fT">Nouvelle appli</h3><small>ajoutée dans « Mes ajouts » du classeur, testée par la tâche Configuration</small></span>
    <button type="button" class="sh-x" data-f="fermer" aria-label="Fermer">${SVG(ICO.croix)}</button></div>`;
  h += champ('nom', 'Nom', v.nom, {ph:'ex. Spotify'});
  h += `<label class="chp">Où<select name="ou">${opts.map(([k, lab]) => `<option value="${esc(k)}"${k === v.ou ? ' selected' : ''}>${esc(lab)}</option>`).join('')}</select></label>`;
  h += `<div id="nvD"${v.ou === '+dossier' ? '' : ' hidden'}>${champ('nd', 'Nom du nouveau dossier', v.nd, {ph:'ex. Loisirs'})}</div>`;
  h += LIENS_F.map(([n, , lab, ph]) => champ(n, lab, v[n], {ph, lien:true})).join('');
  h += `<p class="ptit" style="padding:0">Au moins un lien : celui de l'iPhone (ex. spotify://) ou celui du site.</p><p class="sh-msg" id="fMsg" aria-live="polite"></p>
    <div class="sh-pied"><button type="button" class="btn" data-f="fermer">Annuler</button><button type="button" class="btn main" data-f="creer">Ajouter</button></div>`;
  return h;
}
function lireBrouillon(){
  const el = $('#feuille'), b = {}; el.querySelectorAll('input[name],select[name]').forEach(i => { b[i.name] = i.value; }); return b;
}
function rendreFiche(force = false){
  const el = $('#feuille');
  if (!FICHE || route !== 'applis' || !ED){ if (!el.hidden){ el.hidden = true; el.innerHTML = ''; } return; }
  const act = document.activeElement;
  if (!force && !el.hidden && el.contains(act) && /^(INPUT|SELECT)$/.test(act.tagName)) return;      // en pleine saisie : on ne redessine pas
  if (!el.hidden && el.innerHTML) FICHE.brouillon = {...(FICHE.brouillon || {}), ...lireBrouillon()};
  const h = FICHE.nouveau ? ficheNouvelle(FICHE) : FICHE.dossier ? ficheDossier(FICHE) : ficheItem(FICHE);
  if (!h){ FICHE = null; el.hidden = true; el.innerHTML = ''; return; }
  const ouvert = !el.hidden;
  el.innerHTML = `<div class="sheet-bg" data-f="fermer"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="fT" data-no-ptr>${h}</div>`;
  el.hidden = false;
  if (!ouvert) el.querySelector('.sheet').style.animation = '';
  else el.querySelector('.sheet').style.animation = 'none';
}
function ouvrirFiche(f){ FICHE = f; rendreFiche(true); }
function fermerFiche(){ FICHE = null; rendreFiche(true); }
const msgF = t => { const m = $('#fMsg'); if (m) m.textContent = t; };
const lienRefuse = v => /^(javascript|data|vbscript|file):/i.test(String(v || '').trim());
function enregistrerItem(){
  const x = trouverIt(FICHE.id); if (!x) return fermerFiche();
  const {it} = x, d = it.def, b = lireBrouillon(), nom = String(b.Appli || '').replace(/\s+/g, ' ').trim();

/* ----- glisser-déposer (doigt : appui de 0,3 s puis glisser ; souris : glisser) ----- */
const DND = {st:null};
function dndDebut(el, x, y, source){
  DND.st = {el, id:el.dataset.et, x0:x, y0:y, x, y, source, actif:false, timer:null, dossier:null, tAction:null, prevue:'', action:null};
  if (source === 'touch') DND.st.timer = setTimeout(() => dndActiver(), 300);
}
function dndActiver(){
  const st = DND.st; if (!st || st.actif) return;
  const x = trouverIt(st.id); if (!x){ DND.st = null; return; }
  st.actif = true; st.def = x.it.def;
  const r = st.el.getBoundingClientRect(); st.dx = st.x0 - r.left; st.dy = st.y0 - r.top;
  const c = st.el.cloneNode(true); c.classList.add('glisse'); c.removeAttribute('data-et'); c.style.width = r.width + 'px'; c.style.height = r.height + 'px';
  document.body.appendChild(c); st.clone = c; st.el.classList.add('fantome');
  document.documentElement.classList.add('glisse-en-cours');
  try{ navigator.vibrate && navigator.vibrate(8); }catch{}
  dndPlacer(); dndBoucle();
}
function dndPlacer(){ const st = DND.st; if (st && st.clone) st.clone.style.transform = `translate(${st.x - st.dx}px, ${st.y - st.dy}px)`; }
function dndBoucle(){
  const st = DND.st; if (!st || !st.actif) return;
  const H = innerHeight, v = st.y < 70 ? -10 : st.y > H - 90 ? 10 : 0;
  const sc = $('#feuille .sheet');
  if (v){ if (sc && sc.contains(st.el)) sc.scrollTop += v; else window.scrollBy(0, v); dndSurvol(); }
  requestAnimationFrame(dndBoucle);
}
function flip(conteneurs, agir){
  const els = conteneurs.flatMap(c => [...c.children]), avant = new Map(els.map(e => [e, e.getBoundingClientRect()]));
  agir();
  for (const e of els){ const a = avant.get(e), b = e.getBoundingClientRect(); if (!a || e === DND.st.el) continue;
    const dx = a.left - b.left, dy = a.top - b.top; if (!dx && !dy) continue;
    e.style.transition = 'none'; e.style.transform = `translate(${dx}px, ${dy}px)`;
    requestAnimationFrame(() => { e.style.transition = 'transform .18s ease'; e.style.transform = ''; }); }
}
/* au-dessus d'une place : on attend que le doigt s'y pose un instant avant de déplacer (sinon tout bouge pendant le trajet) ;
   au milieu d'un dossier de l'accueil, un peu plus longtemps : l'appli y sera rangée au lâcher */
function dndSurvol(){
  const st = DND.st; if (!st || !st.actif) return;
  const a = dndAction(st);
  const cle = a ? (a.dossier ? 'd:' + a.dossier : a.cont.dataset.liste + '|' + (a.ref ? a.ref.dataset.et || '' : '$')) : '';
  if (cle === st.prevue) return;
  clearTimeout(st.tAction); st.prevue = cle;
  if (st.dossier && (!a || a.dossier !== st.dossier)){ st.dossier = null; document.querySelectorAll('.cible-dossier').forEach(e => e.classList.remove('cible-dossier')); }
  if (!a) return;
  st.action = a;
  st.tAction = setTimeout(() => { if (DND.st === st && st.prevue === cle) dndAppliquer(st, a); }, a.dossier ? 420 : 110);
}
function dndAppliquer(st, a){
  st.prevue = '';
  if (a.dossier){ st.dossier = a.dossier; a.el.classList.add('cible-dossier'); return; }
  if (a.ref === st.el || (st.el.nextElementSibling === a.ref && st.el.parentNode === a.cont)) return;
  const anc = st.el.parentNode, vide = a.cont.querySelector(':scope > .vide'); if (vide) vide.remove();
  flip([a.cont, anc].filter((c, i, l) => l.indexOf(c) === i), () => a.cont.insertBefore(st.el, a.ref));
}
function dndAction(st){
  const cible = document.elementFromPoint(st.x, st.y);
  const tuile = cible && cible.closest('[data-et]'), cont = cible && cible.closest('[data-liste]');
  if (tuile && tuile !== st.el && tuile.closest('[data-liste="accueil"]') && !AP.accueilSeul(st.def) && !st.def.action){
    const dos = (trouverIt(tuile.dataset.et) || {}).it;
    if (dos && dos.def.type === 'folder'){
      const r = tuile.getBoundingClientRect();
      if (Math.abs(st.x - (r.left + r.width / 2)) < r.width * .25 && Math.abs(st.y - (r.top + r.width / 2)) < r.width * .25) return {dossier:dos.def.target, el:tuile};
    }
  }
  if (!cont || !AP.permis(st.def, cont.dataset.liste)) return null;
  if (tuile && tuile !== st.el && cont.contains(tuile)){
    const r = tuile.getBoundingClientRect(), v = cont.dataset.sens === 'v';
    return {cont, ref:(v ? st.y > r.top + r.height / 2 : st.x > r.left + r.width / 2) ? tuile.nextElementSibling : tuile};
  }
  if (!tuile && cont !== st.el.parentNode) return {cont, ref:null};          // espace libre d'une autre liste : à la fin
  return null;
}
function dndBouger(x, y){
  const st = DND.st; if (!st) return;
  st.x = x; st.y = y;
  if (!st.actif){
    const dist = Math.hypot(x - st.x0, y - st.y0);
    if (st.source === 'mouse'){ if (dist > 6) dndActiver(); else return; }
    else { if (dist > 10){ clearTimeout(st.timer); DND.st = null; } return; }       // le doigt bouge avant l'appui long : défilement normal
  }
  dndPlacer(); dndSurvol();
}
function dndFin(annule){
  const st = DND.st; DND.st = null; if (!st) return;
  clearTimeout(st.timer); clearTimeout(st.tAction);
  if (!st.actif) return;
  if (!annule && st.prevue && st.action && !st.action.dossier) dndAppliquer(st, st.action);   // lâché avant la fin de l'attente : la place visée compte
  apresGlisse = Date.now(); glisseId = st.id;
  if (st.clone) st.clone.remove();
  st.el.classList.remove('fantome'); document.documentElement.classList.remove('glisse-en-cours');
  document.querySelectorAll('.cible-dossier').forEach(e => e.classList.remove('cible-dossier'));
  if (annule){ rendre(); return; }                                         // (un rendu reporté pendant le glisser se fait après l'envoi ci-dessous)
  if (st.dossier){ if (deplacer(st.id, 'd:' + st.dossier)) envoyerDisposition(); else rendre(); return; }
  // nouvel ordre lu dans la page : chaque liste affichée garde ses éléments masqués à leur place
  const conts = [...document.querySelectorAll('#ecran [data-liste], #feuille [data-liste]')];
  const parId = new Map(tous().map(x => [x.it.id, x.it])), V = {};
  for (const c of conts) V[c.dataset.liste] = [...c.querySelectorAll(':scope > [data-et]')].map(e => e.dataset.et).filter(id => parId.has(id));
  const cites = new Set(Object.values(V).flat());
  for (const [cle, L] of Object.entries(ED.listes)) if (!(cle in V)) ED.listes[cle] = L.filter(it => !cites.has(it.id) || it.cache);
  for (const [cle, ids] of Object.entries(V)){
    const L = (ED.listes[cle] || []).filter(it => it.cache || ids.includes(it.id)), q = [...ids], res = [];
    for (const it of L){ if (it.cache) res.push(it); else if (q.length) res.push(parId.get(q.shift())); }
    for (const id of q) res.push(parId.get(id));
    ED.listes[cle] = res;
  }
  envoyerDisposition();
}

  if (M.enAttente().some(m => !m.nonEnvoyee)) suivre();
  planifier();
})();
document.addEventListener('visibilitychange', () => { if (!document.hidden && CAT) rendre(); });
</script>

<script>
/* Toucher visible : un rond qui s'efface là où le doigt appuie (pratique aussi pour les vidéos de démo) */
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const d = document.createElement('span'); d.className = 'tap-dot';
  d.style.left = e.clientX + 'px'; d.style.top = e.clientY + 'px';
  document.body.appendChild(d); setTimeout(() => d.remove(), 650);
}, {passive:true, capture:true});
</script>
<script>
/* Mise en mémoire sur l'iPhone (démarrage instantané, hors ligne) + avis quand une nouvelle version est déposée */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  const t0 = Date.now(); let majDispo = false, cacheAt = 0;
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => {
    if (!e.data || e.data.type !== 'nouvelle-version') return;
    majDispo = true;
    if (Date.now() - t0 < 8000){ location.reload(); return; }         // page tout juste ouverte : on passe directement à la nouvelle version
    if (document.querySelector('.maj-toast')) return;
    const b = document.createElement('button'); b.type = 'button'; b.className = 'maj-toast'; b.textContent = 'Nouvelle version — toucher pour l\'afficher';
    b.addEventListener('click', () => location.reload()); document.body.appendChild(b);
  });
  try{ navigator.serviceWorker.startMessages(); }catch{}
  /* Retour sur l'appli : nouvelle version déjà prête → rechargement ; sinon on vérifie s'il y en a une (au plus toutes les 2 min) */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (majDispo){ location.reload(); return; }
    if (Date.now() - cacheAt < 120e3) return;
    cacheAt = Date.now();
    navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});
    fetch(location.pathname, {cache:'no-cache'}).catch(() => {});
  });
}
</script>

<div class="ptr" id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg></div>
<script>
(() => {
  const el = document.getElementById('ptr'), SEUIL = 78;
  let y0 = null, x0 = 0, d = 0, actif = false;
  const OVER = '.scrim:not([hidden]),.sheet-bg:not([hidden]),.sheet:not([hidden]),[role="dialog"]:not([hidden])';
  const bloque = t => [...document.querySelectorAll(OVER)].some(e => e.getClientRects().length) || !t.closest || t.closest('input,textarea,select,[data-no-ptr]') ||
    (() => { for (let n = t; n && n !== document.body; n = n.parentElement) if (n.scrollTop > 0) return true; return false; })();
  const set = (y, cls) => { el.style.transform = `translateY(${y}px)`; el.style.opacity = Math.min(1, y / 40); el.className = 'ptr' + (cls ? ' ' + cls : ''); };
  addEventListener('touchstart', e => {
    if (e.touches.length !== 1 || (scrollY || document.documentElement.scrollTop) > 0 || bloque(e.target)) { y0 = null; return; }
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; d = 0; actif = false;
  }, {passive:true});
  addEventListener('touchmove', e => {
    if (y0 == null) return;
    const dy = e.touches[0].clientY - y0, dx = e.touches[0].clientX - x0;
    if (!actif){ if (Math.abs(dx) > Math.abs(dy) || dy < 6){ if (Math.abs(dx) > 10 || dy < -6) y0 = null; return; } if ((scrollY || document.documentElement.scrollTop) > 0){ y0 = null; return; } actif = true; }
    d = Math.max(0, dy);
    const y = Math.min(80, d * .5);
    set(y - 10, d >= SEUIL ? 'pret' : '');
  }, {passive:true});
  addEventListener('touchend', () => {
    if (y0 == null || !actif){ y0 = null; return; }
    y0 = null;
    if (d >= SEUIL){ set(34, 'va tourne'); setTimeout(() => location.reload(), 250); }
    else { set(-60, 'va'); }
  }, {passive:true});
  addEventListener('touchcancel', () => { if (actif) set(-60, 'va'); y0 = null; }, {passive:true});
})();
</script>
