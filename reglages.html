<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="mon-ecran-version" content="a7eebed2">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Réglages</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<script src="config/config.js"></script>
<script src="noyau.js"></script>
<script>/* thème, mode clair/sombre (choisis dans État) et mise en page PC, avant l'affichage */try{const d=document.documentElement,p=localStorage.getItem('palette')||CFG('apparence.palette',''),m=localStorage.getItem('mode')||CFG('apparence.mode','');if(p&&p!=='bleu')d.dataset.palette=p;if(m==='clair')d.dataset.theme='light';else if(m==='sombre')d.dataset.theme='dark';const q=matchMedia('(min-width:1024px) and (hover:hover) and (pointer:fine)');d.classList.toggle('desk',q.matches);q.addEventListener&&q.addEventListener('change',e=>d.classList.toggle('desk',e.matches))}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600;700&display=swap">
<style>
/* Layout : en-tête collant en verre (retour, titre, recherche) ; menu des réglages et écran de choix
   (côte à côte sur ordinateur, l'un après l'autre sur téléphone) ; barre d'envoi en bas */
:root{
  --base:#e7ecef;
  --blob-1:rgba(163,206,241,.95); --blob-2:rgba(96,150,186,.55); --blob-3:rgba(39,76,119,.35);
  --ink:#10233a; --ink-soft:#56636f;
  --glass:rgba(255,255,255,.22); --glass-tint:rgba(163,206,241,.10);
  --rim-1:rgba(255,255,255,.95); --rim-2:rgba(255,255,255,.12); --rim-3:rgba(255,255,255,.6);
  --spec:rgba(255,255,255,.55);
  --shadow:0 14px 34px -16px rgba(39,76,119,.45);
  --head:rgba(231,236,239,.72);
  --card:rgba(255,255,255,.6); --line:rgba(39,76,119,.12);
  --accent:#274c77; --on-accent:#e7ecef;
  --t-brick:#274c77; --t-slate:#6096ba; --t-olive:#3d6b97; --t-plum:#1b3656;
  --t-teal:#4c86b0; --t-ochre:#8b8c89; --t-char:#2f3e50; --t-rose:#7fb0d8;
  --f-ui:"Geist", -apple-system, "SF Pro Text", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --base:#08121f;
  --blob-1:rgba(39,76,119,.85); --blob-2:rgba(96,150,186,.45); --blob-3:rgba(163,206,241,.22);
  --ink:#e7ecef; --ink-soft:#a7b6c4;
  --glass:rgba(231,236,239,.07); --glass-tint:rgba(163,206,241,.06);
  --rim-1:rgba(231,236,239,.55); --rim-2:rgba(231,236,239,.04); --rim-3:rgba(163,206,241,.35);
  --spec:rgba(231,236,239,.16);
  --shadow:0 14px 34px -14px rgba(0,0,0,.75);
  --head:rgba(8,18,31,.66);
  --card:rgba(231,236,239,.06); --line:rgba(231,236,239,.1); --accent:#a3cef1; --on-accent:#08121f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --base:#08121f;
  --blob-1:rgba(39,76,119,.85); --blob-2:rgba(96,150,186,.45); --blob-3:rgba(163,206,241,.22);
  --ink:#e7ecef; --ink-soft:#a7b6c4;
  --glass:rgba(231,236,239,.07); --glass-tint:rgba(163,206,241,.06);
  --rim-1:rgba(231,236,239,.55); --rim-2:rgba(231,236,239,.04); --rim-3:rgba(163,206,241,.35);
  --spec:rgba(231,236,239,.16);
  --shadow:0 14px 34px -14px rgba(0,0,0,.75);
  --head:rgba(8,18,31,.66);
  --card:rgba(231,236,239,.06); --line:rgba(231,236,239,.1); --accent:#a3cef1; --on-accent:#08121f;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;font-family:var(--f-ui);color:var(--ink);
  background-color:var(--base);
  background-image:
    radial-gradient(60% 45% at 10% 8%, var(--blob-1), transparent 70%),
    radial-gradient(55% 45% at 95% 35%, var(--blob-2), transparent 70%),
    radial-gradient(70% 50% at 30% 100%, var(--blob-3), transparent 70%);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--head);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}

/* verre */
.glass{position:relative;isolation:isolate;background:linear-gradient(160deg, var(--glass), var(--glass-tint));box-shadow:var(--shadow);
  backdrop-filter:blur(30px) saturate(1.8) brightness(1.05);-webkit-backdrop-filter:blur(30px) saturate(1.8) brightness(1.05)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 70% at 15% 0%, var(--spec), transparent 55%)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(145deg, var(--rim-1), var(--rim-2) 35%, var(--rim-2) 65%, var(--rim-3));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

.wrap{max-width:560px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

html.desk .wrap{max-width:860px}
/* ---------- Interrupteurs ---------- */
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.sw-row small{display:block;color:var(--ink-soft);font-size:.78rem;margin-top:2px}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;border-radius:99px;background:rgba(139,140,137,.45);position:relative;cursor:pointer;transition:background .2s;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw:checked{background:#2fa35a}
.sw:checked::after{transform:translateX(18px)}
/* ---------- En-tête ---------- */
header{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--head);
  backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);
  border-bottom:1px solid var(--line)}
header .wrap{padding-block:10px 12px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.back{display:flex;align-items:center;gap:2px;color:var(--accent);font-weight:500;font-size:1rem;padding-block:6px}
.back svg,.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn{color:var(--accent);width:38px;height:38px;display:grid;place-items:center;border-radius:50%}
.icon-btn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.title-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-weight:700;font-size:2.2rem;letter-spacing:-.035em;margin:0;line-height:1}
.stamp{font-size:.74rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}

.tabs{display:flex;gap:4px;padding:4px;border-radius:18px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;scroll-snap-align:center;padding:8px 14px;border-radius:14px;font-size:.85rem;font-weight:500;color:var(--ink-soft);white-space:nowrap;
  transition:background .2s ease,color .2s ease}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}


.note{color:var(--ink-soft);font-size:.8rem;margin:8px 0 0;line-height:1.45}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, monospace;font-size:.72rem;overflow-wrap:anywhere;color:var(--ink-soft)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{padding:10px 14px;border-radius:14px;font-weight:600;font-size:.86rem;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.main{background:var(--accent);color:var(--on-accent);border-color:transparent}
/* ---------- Toucher visible et fondu entre les pages ---------- */
@view-transition{navigation:auto}
::view-transition-old(root),::view-transition-new(root){animation-duration:.22s}
.tap-dot{position:fixed;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;pointer-events:none;z-index:9999;
  background:radial-gradient(circle, color-mix(in oklab, var(--accent) 45%, transparent), color-mix(in oklab, var(--accent) 22%, transparent) 55%, rgba(255,255,255,.15) 72%);
  box-shadow:0 0 0 2.5px rgba(255,255,255,.9), 0 0 0 4px color-mix(in oklab, var(--accent) 45%, transparent), 0 4px 16px rgba(0,0,0,.22);animation:tapdot .6s ease-out forwards}
.maj-toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:9998;
  padding:10px 16px;border-radius:999px;background:var(--accent, #274c77);color:var(--on-accent, #e7ecef);font:600 .85rem/1.2 var(--f-ui, system-ui);box-shadow:0 10px 26px -10px rgba(0,0,0,.5);
  animation:majin .3s ease-out}
@keyframes majin{from{opacity:0;transform:translate(-50%, 10px)}}
@keyframes tapdot{from{transform:scale(.55);opacity:1}to{transform:scale(1.45);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* ---------- Réglages : menu (liste des écrans) et écran de choix ---------- */
main .wrap{padding-block:14px calc(120px + env(safe-area-inset-bottom, 0px))}
.lay{display:flex;flex-direction:column;gap:12px}
html.desk .lay{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
html.desk .menu{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 96px)}
.lay:not(.sur-ecran) #ecran,.lay.sur-ecran .menu{display:none}
html.desk .lay .menu,html.desk .lay #ecran{display:flex}
.menu,#ecran{flex-direction:column;gap:12px;min-width:0}
.menu{display:flex}
#ecran{display:flex}
.groupe{border-radius:22px;overflow:hidden}
.groupe h2{margin:0;padding:12px 16px 6px;font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;min-height:54px;text-align:left;border-top:1px solid var(--line)}
.groupe h2 + .mrow{border-top:0}
.mrow .ic{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent)}
.mrow .ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mrow .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mrow b{font-size:.95rem;font-weight:600}
.mrow small{font-size:.76rem;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .chev{flex:none;width:16px;height:16px;fill:none;stroke:var(--ink-soft);stroke-width:2}
.mrow[aria-current="page"]{background:var(--accent-soft, rgba(127,127,127,.1))}
.mrow:active{background:var(--accent-soft, rgba(127,127,127,.1))}
.ptit{font-size:.78rem;color:var(--ink-soft);line-height:1.45;margin:0;padding:0 16px 12px}

/* outils de l'écran (dans l'en-tête) : français / international, recherche */
.outils{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;gap:2px;padding:3px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.seg button{flex:1;padding:7px 6px;border-radius:11px;font-size:.84rem;font-weight:500;color:var(--ink-soft);min-height:34px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.cherche{display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.cherche svg{flex:none;width:17px;height:17px;fill:none;stroke:var(--ink-soft);stroke-width:2;stroke-linecap:round}
.cherche input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:none;border:0;padding:9px 0;outline:none}
.cherche input::placeholder{color:var(--ink-soft)}
.cherche button{font-size:.8rem;color:var(--accent);font-weight:600;padding:6px 0}
.intro{font-size:.8rem;color:var(--ink-soft);line-height:1.45;margin:0 4px}
header.sur-ecran h1{font-size:1.75rem}
header.sur-ecran .wrap{gap:8px}
.ecr-t{display:none;margin:0 4px;font-size:1.35rem;letter-spacing:-.02em}
html.desk .ecr-t{display:block}

/* sections repliables */
.sec{border-radius:20px;overflow:hidden}
.sec-h{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;min-height:54px}
.sec-t{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:8px 6px 8px 10px;text-align:left;border-radius:14px}
.sec-t .chev{flex:none;width:16px;height:16px;fill:none;stroke:var(--ink-soft);stroke-width:2.2;transition:transform .2s ease}
.sec-t[aria-expanded="true"] .chev{transform:rotate(90deg)}
.sec-t span{min-width:0;display:flex;flex-direction:column;gap:2px}
.sec-t b{font-size:.95rem;font-weight:600}
.sec-t small{font-size:.74rem;color:var(--ink-soft)}
.tout{flex:none;display:flex;align-items:center;gap:7px;font-size:.72rem;color:var(--ink-soft);padding:6px 4px;cursor:pointer}
.tout.gris{opacity:.45;cursor:default}
.sec-b{border-top:1px solid var(--line)}
.sec-b[hidden]{display:none}
.chefs{display:flex;justify-content:flex-end;gap:12px;padding:6px 14px 0;font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.chefs span:last-child{width:46px;text-align:center}

/* une ligne = un élément */
.it{display:flex;align-items:center;gap:10px;padding:9px 14px;min-height:52px;border-top:1px solid var(--line)}
.sec-b > .it:first-child,.chefs + .it{border-top:0}
.it-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.it-t b{font-size:.9rem;font-weight:500;overflow-wrap:anywhere}
.it-t small{font-size:.74rem;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it.gris .it-t b,.it.gris .it-t small:first-of-type{opacity:.5}
.it.efface .it-t b{text-decoration:line-through;opacity:.6}
.etq{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.bd{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:.7rem;font-weight:600;white-space:normal;line-height:1.3;
  background:color-mix(in oklab, var(--lc, #8b8c89) 15%, transparent);color:color-mix(in oklab, var(--lc, #8b8c89) 78%, var(--ink))}
.bd.att{--lc:#e08a12}.bd.ok{--lc:#1e8a4c}.bd.ko{--lc:#d63c3c}.bd.gr{--lc:#8b8c89}
.it .mini{flex:none;font-size:.76rem;font-weight:600;color:var(--accent);padding:6px 4px}
.it .poub{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:#d63c3c}
.it .poub svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* case « Accueil » (marchés) */
.acc{flex:none;width:34px;height:30px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);color:var(--ink-soft);background:var(--card)}
.acc svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.acc[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.acc:disabled{opacity:.35;cursor:default}
.acc-vide{flex:none;width:34px}

/* interrupteur (élément) et case ronde (toute la section) */
.sw:disabled{opacity:.4;cursor:default}
.ck{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:0;border-radius:50%;border:2px solid var(--ink-soft);display:grid;place-items:center;cursor:pointer;background:transparent}
.ck::after{content:"";width:10px;height:6px;border:solid var(--on-accent);border-width:0 0 2.4px 2.4px;transform:translateY(-1px) rotate(-45deg);opacity:0}
.ck:checked{background:var(--accent);border-color:var(--accent)}
.ck:checked::after{opacity:1}
.ck:indeterminate{border-color:var(--accent);background:radial-gradient(circle, var(--accent) 0 4px, transparent 5px)}
.ck:disabled{opacity:.4;cursor:default}

/* Mes ajouts */
.ajf{display:flex;flex-direction:column;gap:10px;padding:12px 14px 14px;border-top:1px solid var(--line)}
.ajf label{display:flex;flex-direction:column;gap:5px;font-size:.78rem;color:var(--ink-soft);font-weight:500}
.ajf input,.ajf select{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;width:100%;min-width:0}
.ajf .lig{display:flex;gap:8px;align-items:center;font-size:.82rem;color:var(--ink)}
.ajf .msg{margin:0;font-size:.8rem;color:#d63c3c}
.vide{padding:14px 16px;font-size:.84rem;color:var(--ink-soft)}
.ajout-btn{display:flex;align-items:center;gap:8px;width:100%;padding:12px 14px;border-top:1px solid var(--line);color:var(--accent);font-weight:600;font-size:.88rem;text-align:left}
.ajout-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

/* barre d'envoi (en bas) */
.barre{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom, 0px));z-index:30;width:min(528px, calc(100% - 24px));
  border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:.84rem;line-height:1.4;
  background:var(--sheet, var(--head));animation:majin .25s ease-out}
.barre p{margin:0}
.barre .lig{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.barre .lig .t{flex:1;min-width:0}
.barre input{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;width:130px}
.barre .btn{padding:8px 12px}
.barre a{color:var(--accent);font-weight:600}
.barre .ko{color:#d63c3c}

/* ==PALETTES== Thèmes de couleurs (choix dans la page État, gardé sur l'appareil). « Bleu » = valeurs ci-dessus. */
:root[data-palette="gris"]{
  --base:#eef0f2;
  --blob-1:rgba(198,199,196,.9); --blob-2:rgba(162,153,158,.45); --blob-3:rgba(132,106,106,.28);
  --ink:#1c1f20; --ink-soft:#5b5557; --ink-faint:#8f8a8c;
  --glass:rgba(255,255,255,.28); --glass-tint:rgba(198,199,196,.12);
  --shadow:0 14px 34px -16px rgba(53,59,60,.42);
  --head:rgba(238,240,242,.74); --panel:#eef0f2;
  --card:rgba(255,255,255,.62); --line:rgba(53,59,60,.13);
  --accent:#353b3c; --on-accent:#eef0f2; --accent-soft:rgba(53,59,60,.09);
  --sheet:rgba(240,241,243,.95); --sheet-solid:#f0f1f3; --scrim:rgba(28,31,32,.3);
  --t-brick:#c6c7c4; --t-slate:#d8d9d6; --t-olive:#a2999e; --t-plum:#b8b0b4;
  --t-teal:#cfd0cd; --t-ochre:#c9b8b8; --t-char:#9a9497; --t-rose:#e3e4e2;
  --glyph:#111111; --sport-accent:#6b4f4f;
}
:root[data-palette="ardoise"]{
  --base:#f4f4f4;
  --blob-1:rgba(191,192,192,.85); --blob-2:rgba(79,93,117,.32); --blob-3:rgba(239,131,84,.24);
  --ink:#2d3142; --ink-soft:#5d6273; --ink-faint:#8e93a0;
  --glass:rgba(255,255,255,.3); --glass-tint:rgba(191,192,192,.12);
  --shadow:0 14px 34px -16px rgba(45,49,66,.42);

     rien ne change dans leur fonctionnement (ils restent sur l'appareil et dans la partie « prefs » de la synchro).
   Uniquement Noyau (pas d'astuce propre à Safari) : la même page servira aux applis dédiées.

/* écrans de choix : modules du catalogue (config/catalogue.json) */
const ECRANS = {

const MOD_ECRAN = {actus:'actus', 'actus-en':'actus', youtube:'youtube', sport:'sport', marches:'marches'};
/* raccourcis vers les choix personnels, qui restent dans leurs pages */
const PERSO = [
  {ico:'etoile', t:'Équipes et compétitions favorites', d:'Page Sport, onglet Favoris (étoile sous un match)', url:'sport.html?ouvrir=favoris'},

const RETOURS = {index:['index.html', 'Accueil'], actus:['actus.html', 'Actus'], sport:['sport.html', 'Sport'], videos:['videos.html', 'Vidéos'],
                 invest:['invest.html', 'Investissements'], etat:['etat.html', 'État']};
const params = new URLSearchParams(location.search), RETOUR = RETOURS[params.get('retour')] || null;

let CAT = null, erreurCat = '', route = '', langue = 0, q = '';
const OUV = new Set(S.session.lire('reglages:ouverts', []));            // sections dépliées (pour la session)

/* ---------- état d'un élément ---------- */
const desk = () => document.documentElement.classList.contains('desk');
const moduleDe = mid => CAT && CAT.modules && CAT.modules[mid];
const etat = id => C.etat(id) || {oui:'', champs:{}, choisi:false, attente:false, support:'ok'};
const attenteDe = id => M.enAttente().filter(m => m.id === id);
const pasEnvoyee = id => M.nonEnvoyees().some(m => m.id === id);
const infoTxt = (mod, it) => Object.entries(it.infos || {}).filter(([k]) => !/^Prise en charge|^Clé ESPN|^Site|^Sport$/.test(k))
  .map(([, v]) => /^https?:\/\//.test(v) ? (() => { try{ return new URL(v).hostname.replace(/^www\./, ''); }catch{ return v; } })() : v).join(' · ');
const RECENT = 3 * 864e5;
function badges(id, it, {ajout = false} = {}){
  const b = [], A = attenteDe(id);
  if (it && it.support === 'dev') b.push('<span class="bd gr">à développer</span>');
  if (it && it.support === 'non') b.push('<span class="bd gr">non disponible</span>');
  if (A.length) b.push(`<span class="bd att">⏳ ${A.some(m => m.nonEnvoyee) ? 'pas encore envoyé' : 'en attente de report'}</span>`);
  else {
    const r = M.dernierResultat(id);
    if (r && r.statut !== 'ok') b.push(`<span class="bd ko">❌ ${esc(r.message)}</span>`);
    else if (r && Date.now() - Date.parse(r.le) < RECENT) b.push('<span class="bd ok">✅ reporté dans le classeur</span>');
  }
  if (it && it.support !== 'ok' && it.note) b.push(`<span class="bd gr">${esc(it.note)}</span>`);
  return b.length ? `<span class="etq">${b.join('')}</span>` : '';
}
/* compte des éléments disponibles choisis (et en attente) d'une section ou d'un module */
function compte(items){
  let n = 0, tot = 0, att = 0;
  for (const it of items){ const e = etat(it.id); if (it.support === 'ok'){ tot++; if (e.choisi) n++; } if (e.attente) att++; }
  return {n, tot, att};
}
const itemsDe = mod => (mod.sections || []).flatMap(s => s.items || []);

/* ---------- changements ---------- */
/* une modification pas encore envoyée qui revient à la valeur du classeur est simplement annulée */
function nettoyerRetour(id){
  const e = C.element(id); if (!e) return;
  const base = e.item ? {Oui:e.item.oui || '', ...(e.item.champs || {})} : {Oui:e.section.oui || ''};
  const ne = M.nonEnvoyees().find(m => m.id === id && m.champs && !m.effacer);
  if (!ne || M.enAttente().some(m => m.id === id && !m.nonEnvoyee)) return;
  if (Object.entries(ne.champs).every(([k, v]) => (base[k] || '') === (v || ''))) M.annuler(ne.uid);
}
function changer(id, champs, nom){ M.modifier(id, champs, nom ? {nom} : {}); nettoyerRetour(id); }
function choisirItem(id, on){
  const e = C.element(id); if (!e) return;
  if (e.ajout){ changer(id, {Oui:on ? 'Oui' : 'Non'}, e.item.nom); return; }
  const secOui = etat(e.section.id).oui;
  changer(id, {Oui:on ? 'Oui' : secOui === 'Oui' ? 'Non' : ''});
}
function choisirSection(secId, on){
  const e = C.element(secId); if (!e) return;
  changer(secId, {Oui:on ? 'Oui' : ''});
  for (const it of e.section.items || []){
    const o = etat(it.id).oui;
    if (on && o === 'Non') changer(it.id, {Oui:''});                       // la section prend tout : on retire les « Non »
    if (!on && o === 'Oui') changer(it.id, {Oui:''});                      // plus rien de la section
  }
}
function apresChangement(){ rendre(); planifier(); }

/* ---------- envoi groupé ---------- */
let etatBarre = {k:''}, suivi = null;
async function planifier(){
  if (!M.nonEnvoyees().length){ barre(); return; }
  if (!Noyau.synchro.actif()){ barre({k:'inactif'}); return; }
  if (!(await Noyau.synchro.pret())){ barre({k:'code'}); return; }
  barre({k:'bientot'});
  M.envoyerPlusTard(4000);
}
window.addEventListener('noyau:envoi', e => {
  const r = e.detail && e.detail.resultat;
  if (r === 'encours') return barre({k:'encours'});
  if (r === 'envoye'){ barre({k:'envoye'}); suivre(); }
  else if (r === 'verrou') barre({k:'code'});
  else if (r === 'inactif') barre({k:'inactif'});
  else if (r && r.startsWith('erreur:')) barre({k:'erreur', msg:Noyau.message(r)});
  else barre();
  rendre();
});
window.addEventListener('noyau:modifs', () => { if (!document.hidden) rendreMenu(); });
/* après un envoi : on relit le catalogue toutes les 30 s jusqu'au passage de la tâche « Configuration » (15 min au plus) */
function suivre(){
  if (suivi) return;
  const debut = Date.now();
  suivi = setInterval(async () => {
    if (document.hidden) return;
    const envoyees = M.enAttente().filter(m => !m.nonEnvoyee).map(m => m.uid);
    if (!envoyees.length || Date.now() - debut > 15 * 60e3){ clearInterval(suivi); suivi = null; return; }
    await charger(true);
    const faites = envoyees.map(u => ({u, r:C.resultat(u)})).filter(x => x.r);
    if (faites.length){
      const ko = faites.filter(x => x.r.statut !== 'ok').length;
      barre({k:'reporte', n:faites.length, ko});
    }
  }, 30e3);
}
function barre(b = {k:''}){
  etatBarre = b; const el = $('#barre'), ne = M.nonEnvoyees().length, att = M.enAttente().length;
  const ret = encodeURIComponent(location.pathname.split('/').pop() + location.hash);
  const H = {
    inactif:`<p><b>Synchronisation pas activée sur cet appareil.</b> Tes choix (${ne}) sont gardés ici et partiront dès qu'elle le sera : elle fournit la clé GitHub qui permet d'écrire dans le classeur.</p>
      <div class="lig"><a href="etat.html">Activer dans État ›</a></div>`,
    code:`<form class="lig" id="codeF"><span class="t">Ton code pour envoyer ${ne > 1 ? `tes ${ne} choix` : 'ton choix'}</span>
      <input type="password" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="Code" id="codeIn"><button class="btn main" type="submit">Envoyer</button></form><p class="ko" id="codeMsg" aria-live="polite"></p>`,
    bientot:`<div class="lig"><span class="t">${ne} choix à envoyer…</span><button class="btn" type="button" data-b="maintenant">Envoyer maintenant</button></div>`,
    encours:'<p>Envoi…</p>',
    envoye:`<div class="lig"><span class="t"><b>Envoyé ✓</b> La tâche « Configuration » les reporte dans le classeur en 1 à 2 minutes.</span><button class="btn" type="button" data-b="fermer">OK</button></div>`,
    erreur:`<p class="ko"><b>Pas envoyé :</b> ${esc(b.msg || '')}. Tes choix restent sur cet appareil.</p><div class="lig"><button class="btn main" type="button" data-b="maintenant">Réessayer</button><button class="btn" type="button" data-b="fermer">Plus tard</button></div>`,
    reporte:`<div class="lig"><span class="t">${b.ko ? `<b class="ko">${b.ko} choix refusé${b.ko > 1 ? 's' : ''}</b> (motif sur la ligne ❌)` : '<b>Reporté dans le classeur ✓</b>'}${att ? ` · ${att} encore en attente` : ''}</span><button class="btn" type="button" data-b="fermer">OK</button></div>`,
  };
  const h = H[b.k] || (ne ? H.bientot : '');
  el.hidden = !h; el.innerHTML = h;
  if (b.k === 'code'){ const i = $('#codeIn'); if (i && !('ontouchstart' in window)) i.focus(); }
}
$('#barre').addEventListener('click', async e => {
  const b = e.target.closest('[data-b]'); if (!b) return;
  if (b.dataset.b === 'fermer') return barre(M.nonEnvoyees().length ? {k:'bientot'} : {k:''});
  if (b.dataset.b === 'maintenant'){
    if (!Noyau.synchro.actif()) return barre({k:'inactif'});
    if (!(await Noyau.synchro.pret())) return barre({k:'code'});
    M.envoyer();
  }
});
const pinOk = async pin => { const r = S.lire('invest:pin', null); if (!r) return false;
  const h = [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(r.sel + pin)))].map(x => x.toString(16).padStart(2, '0')).join(''); return h === r.h; };
$('#barre').addEventListener('submit', async e => {
  if (e.target.id !== 'codeF') return; e.preventDefault();
  const pin = $('#codeIn').value, m = $('#codeMsg');
  if (!(await pinOk(pin))){ m.textContent = 'Code incorrect.'; return; }
  m.textContent = '';
  const o = await Noyau.synchro.ouvrirAvecCode(pin).catch(() => null);
  if (!o){ m.textContent = o === false ? 'Ton code a changé depuis l\'activation : passe par « Synchroniser maintenant » dans État.' : 'Impossible d\'ouvrir la synchronisation (GitHub injoignable ?).'; return; }
  M.envoyer();
});

/* ---------- rendu ---------- */
function rendreMenu(){
  const ligne = (href, ico, t, d, cur) => `<a class="mrow" href="${href}"${cur ? ' aria-current="page"' : ''}><span class="ic">${SVG(ICO[ico])}</span><span class="t"><b>${esc(t)}</b><small>${d}</small></span>${SVG(ICO.chev).replace('<svg', '<svg class="chev"')}</a>`;
  const choix = Object.entries(ECRANS).map(([k, E]) => {
    let d = 'catalogue pas encore chargé';
    if (CAT){ const its = E.modules.flatMap(mid => moduleDe(mid) ? itemsDe(moduleDe(mid)) : []), c = compte(its);
      const att = E.modules.reduce((a, mid) => a + M.enAttente().filter(m => (m.ajout && m.ajout.module === mid) || (m.id && C.element(m.id) && C.element(m.id).module === mid)).length, 0);
      d = `${c.n} choisi${c.n > 1 ? 's' : ''} sur ${c.tot}${att ? ` · ${att} en attente` : ''}`; }
    return ligne('#' + (k === 'actus' && langue ? 'actus-en' : k), E.ico, E.titre, esc(d), route.replace('-en', '') === k);
  }).join('');
  const perso = PERSO.filter(p => !p.widget || (CFG('accueil.widgets', ['spotify']) || []).includes(p.widget)).map(p => ligne(p.url, p.ico, p.t, esc(p.d), false)).join('');
  const N = M.enAttente(), ne = N.filter(m => m.nonEnvoyee).length;
  const sy = !Noyau.synchro.actif() ? 'Synchronisation pas activée : les choix restent sur cet appareil'
    : N.length ? `${N.length} choix en attente de report${ne ? ` (dont ${ne} pas encore envoyé${ne > 1 ? 's' : ''})` : ''}` : 'Rien en attente : le classeur est à jour';
  $('#menu').innerHTML = `<div class="groupe glass"><h2>Choix du classeur</h2>${choix}</div>
    <div class="groupe glass"><h2>Mes choix personnels</h2>${perso}<p class="ptit">Gardés dans l'appli et partagés entre tes appareils par la synchronisation (pas dans le classeur).</p></div>
    <div class="groupe glass"><h2>Report dans le classeur</h2>${ligne('etat.html', 'synchro', 'Synchro et report', esc(sy), false)}
      <p class="ptit">Tes choix partent groupés dans <b>config/modifs.json</b> ; la tâche « Configuration » les reporte dans <b>configuration.xlsx</b>, qui reste la référence.${CAT && CAT.genere ? ` Catalogue du ${new Date(CAT.genere).toLocaleString('fr-FR', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})}.` : ''}</p></div>`;
}

function rendreEcran(){
  const k = route.replace('-en', ''), E = ECRANS[k], out = $('#ecran');
  if (!E){ out.innerHTML = ''; return; }
  if (!CAT){ out.innerHTML = `<div class="sec glass"><p class="vide">${esc(erreurCat || 'Chargement du catalogue…')}</p></div>`; return; }
  const mid = E.modules[E.langues ? langue : 0], mod = moduleDe(mid);
  if (!mod){ out.innerHTML = `<div class="sec glass"><p class="vide">L'onglet « ${esc(mid)} » n'est pas dans le classeur actuel.</p></div>`; return; }
  const nq = norm(q.trim());
  const trouve = it => !nq || norm([it.nom, ...Object.values(it.infos || {})].join(' ')).includes(nq);
  let h = `<h2 class="ecr-t">${esc(E.titre)}</h2><p class="intro">${esc(E.intro)}</p>`, rien = true;
  for (const s of mod.sections || []){
    const items = (s.items || []).filter(trouve);
    if (nq && !items.length) continue;
    rien = false;
    const c = compte(s.items || []), ouvert = !!nq || OUV.has(s.id), es = etat(s.id);
    const tout = c.tot && c.n === c.tot, partiel = c.n > 0 && !tout, gris = !c.tot;
    const sub = gris ? 'pas encore disponible' : `${c.n} sur ${c.tot}${es.oui === 'Oui' ? ' · toute la section' : ''}${c.att ? ` · ${c.att} en attente` : ''}`;
    h += `<div class="sec glass" data-sec="${esc(s.id)}"><div class="sec-h">
      <button type="button" class="sec-t" data-ouvrir="${esc(s.id)}" aria-expanded="${ouvert}">${SVG(ICO.chev).replace('<svg', '<svg class="chev"')}<span><b>${esc(s.label)}</b><small>${esc(sub)}${attenteDe(s.id).length ? ' · ⏳' : ''}</small></span></button>
      <label class="tout${gris ? ' gris' : ''}"><span>Tout</span><input type="checkbox" class="ck" data-tout="${esc(s.id)}" aria-label="Toute la section ${esc(s.label)}"${tout ? ' checked' : ''}${partiel ? ' data-partiel="1"' : ''}${gris ? ' disabled' : ''}></label></div>`;
    if (ouvert){
      const widget = E.widget && (s.tech || {}).liste !== 'suivi';
      h += `<div class="sec-b">${E.widget ? `<div class="chefs">${widget ? '<span>Accueil</span>' : ''}<span>Suivi</span></div>` : ''}`;
      const r = M.dernierResultat(s.id);
      if (attenteDe(s.id).length || (r && r.statut !== 'ok')) h += `<div class="it"><span class="it-t"><small>Ligne « toute la section »</small>${badges(s.id, null)}</span></div>`;
      for (const it of items) h += ligneItem(it, E, widget);
      h += '</div>';
    }
    h += '</div>';
  }
  if (mod.ajout || (mod.ajouts || []).length){ const a = sectionAjouts(mid, mod, nq, trouve); if (a){ h += a; rien = false; } }
  if (nq && rien) h += `<div class="sec glass"><p class="vide">Rien ne correspond à « ${esc(q)} ».</p></div>`;
  out.innerHTML = h;
  out.querySelectorAll('[data-partiel]').forEach(i => { i.indeterminate = true; });
}
function ligneItem(it, E, widget){
  const e = etat(it.id), gris = it.support !== 'ok', bloque = gris && !e.choisi;          // grisé : on peut seulement le retirer s'il était coché
  const inf = infoTxt(null, it), acc = e.champs['Widget accueil'] === 'Oui';
  return `<div class="it${gris ? ' gris' : ''}"><span class="it-t"><b>${esc(it.nom)}</b>${inf ? `<small>${esc(inf)}</small>` : ''}${badges(it.id, it)}</span>
    ${E.widget ? widget ? `<button type="button" class="acc" data-acc="${esc(it.id)}" aria-pressed="${acc}" aria-label="${esc(it.nom)} sur l'écran d'accueil"${e.choisi && !gris ? '' : ' disabled'}>${SVG(ICO.maison)}</button>` : '' : ''}
    <input type="checkbox" class="sw" data-choisir="${esc(it.id)}" aria-label="${esc(it.nom)}"${e.choisi ? ' checked' : ''}${bloque ? ' disabled' : ''}></div>`;
}
function sectionAjouts(mid, mod, nq, trouve){
  const A = (mod.ajouts || []).filter(a => a.nom || a.source);
  const enAtt = M.enAttente().filter(m => m.ajout && m.ajout.module === mid);
  const refus = M.reportees().filter(r => r.ajout && r.ajout.module === mid && r.resultat && r.resultat.statut !== 'ok' && !VUS.has(r.uid));
  const ouvert = !!nq || OUV.has('ajouts:' + mid) || formAjout === mid;
  let rows = '';
  for (const a of A){
    if (!trouve({nom:a.nom, infos:{s:a.section, src:a.source}})) continue;
    const e = etat(a.id), eff = attenteDe(a.id).find(m => m.effacer);
    rows += `<div class="it${eff ? ' efface' : ''}"><span class="it-t"><b>${esc(a.nom || a.source)}</b><small>${esc([a.section, a.nom ? a.source : ''].filter(Boolean).join(' · '))}</small>${eff ? `<span class="etq"><span class="bd att">⏳ effacement ${eff.nonEnvoyee ? 'pas encore envoyé' : 'en attente de report'}</span></span>` : badges(a.id, null, {ajout:true})}</span>
      ${eff ? (eff.nonEnvoyee ? `<button type="button" class="mini" data-annuler="${esc(eff.uid)}">Annuler</button>` : '')
            : `<button type="button" class="poub" data-effacer="${esc(a.id)}" data-nom="${esc(a.nom)}" aria-label="Effacer ${esc(a.nom || a.source)}">${SVG(ICO.poub)}</button>
               <input type="checkbox" class="sw" data-choisir="${esc(a.id)}" aria-label="${esc(a.nom || a.source)}"${e.choisi ? ' checked' : ''}>`}</div>`;
  }
  for (const m of enAtt){
    if (!trouve({nom:m.ajout.nom, infos:{s:m.ajout.section, src:m.ajout.source}})) continue;
    rows += `<div class="it"><span class="it-t"><b>${esc(m.ajout.nom || m.ajout.source)}</b><small>${esc([m.ajout.section, m.ajout.nom ? m.ajout.source : ''].filter(Boolean).join(' · '))}</small>
      <span class="etq"><span class="bd att">⏳ ajout ${m.nonEnvoyee ? 'pas encore envoyé' : 'en attente de report'}</span></span></span>${m.nonEnvoyee ? `<button type="button" class="mini" data-annuler="${esc(m.uid)}">Annuler</button>` : ''}</div>`;
  }
  for (const r of refus) rows += `<div class="it"><span class="it-t"><b>${esc(r.nom || (r.ajout && r.ajout.source) || 'Ajout')}</b><span class="etq"><span class="bd ko">❌ ${esc(r.resultat.message)}</span></span></span><button type="button" class="mini" data-vu="${esc(r.uid)}">OK</button></div>`;
  if (nq && !rows) return '';
  const n = A.length + enAtt.length;
  let h = `<div class="sec glass" data-sec="ajouts:${esc(mid)}"><div class="sec-h"><button type="button" class="sec-t" data-ouvrir="ajouts:${esc(mid)}" aria-expanded="${ouvert}">${SVG(ICO.chev).replace('<svg', '<svg class="chev"')}<span><b>Mes ajouts</b><small>${n ? `${n} ajout${n > 1 ? 's' : ''}` : 'ce qui n\'est pas dans la liste'}${refus.length ? ` · ${refus.length} ❌` : ''}</small></span></button></div>`;
  if (ouvert){
    h += `<div class="sec-b">${rows || (formAjout === mid ? '' : '<p class="vide">Aucun ajout pour l\'instant.</p>')}`;
    if (mod.ajout) h += formAjout === mid ? formulaire(mid, mod) : `<button type="button" class="ajout-btn" data-form="${esc(mid)}">${SVG(ICO.plus)}Ajouter</button>`;
    h += '</div>';
  }
  return h + '</div>';
}
function formulaire(mid, mod){
  const en = (mod.ajout && mod.ajout.entetes) || {}, secs = (mod.sections || []).filter(s => (s.items || []).some(i => i.support === 'ok')).map(s => s.label);
  const ecr = ECRANS[MOD_ECRAN[mid]] || {};
  return `<form class="ajf" id="ajF" data-module="${esc(mid)}">
    <label>${esc(en.section || 'Section')}<select name="section">${secs.map(l => `<option>${esc(l)}</option>`).join('')}<option value="">Nouvelle…</option></select></label>
    <label id="ajNouv" hidden>Nom de la nouvelle section<input name="nouvelle" maxlength="60" autocomplete="off"></label>
    <label>${esc(en.nom || 'Nom')}<input name="nom" maxlength="80" autocomplete="off" required></label>
    ${en.source ? `<label>${esc(en.source)}<input name="source" maxlength="600" autocomplete="off" autocapitalize="off" spellcheck="false"></label>` : ''}
    <p class="msg" id="ajMsg" aria-live="polite"></p>
    <div class="actions"><button class="btn main" type="submit">Ajouter</button><button class="btn" type="button" data-form="">Annuler</button></div>
    <p class="note" style="margin:0">L'ajout est testé par la tâche « Configuration »${ecr.titre === 'Compétitions' ? ' (la clé ESPN est trouvée si possible)' : ''} ; le résultat s'affiche ici.</p></form>`;
}

function rendre(){
  const k = route.replace('-en', ''), E = ECRANS[k];
  $('#lay').classList.toggle('sur-ecran', !!E);
  if (desk() && !E){ route = 'actus'; return rendre(); }
  $('#titre').textContent = E && !desk() ? E.titre : 'Réglages';
  document.title = E ? `${E.titre} · Réglages` : 'Réglages';
  const [bh, bt] = E && !desk() && !RETOUR ? ['#', 'Réglages'] : RETOUR || ['index.html', 'Accueil'];
  $('#back').setAttribute('href', bh); $('#backT').textContent = bt;
  $('#outils').hidden = !E;
  document.querySelector('header').classList.toggle('sur-ecran', !!E && !desk());
  const seg = $('#seg');
  seg.hidden = !(E && E.langues);
  if (E && E.langues) seg.innerHTML = E.langues.map((l, i) => `<button type="button" data-langue="${i}" aria-pressed="${i === langue}">${i ? '🇺🇸' : '🇫🇷'} ${esc(l)}</button>`).join('');
  $('#q').placeholder = E ? `Rechercher ${{actus:'un média', youtube:'une chaîne', sport:'une compétition', marches:'un indice, un fonds…'}[k]}` : 'Rechercher';
  $('#qEff').hidden = !q;
  rendreMenu(); rendreEcran();
  $('#stamp').textContent = M.enAttente().length ? `${M.enAttente().length} en attente` : '';
}

/* ---------- interactions ---------- */
function lireRoute(){
  const h = decodeURIComponent(location.hash.slice(1));
  route = h in ECRANS || h === 'actus-en' ? h : '';
  if (route === 'actus-en') langue = 1; else if (route === 'actus') langue = 0;
}
window.addEventListener('hashchange', () => { lireRoute(); q = ''; $('#q').value = ''; formAjout = null; rendre(); window.scrollTo({top:0}); });
$('#back').addEventListener('click', e => {
  if ($('#back').getAttribute('href') !== '#') return;
  e.preventDefault(); history.length > 1 && location.hash && history.state !== 'direct' ? history.back() : (location.hash = '');
});
$('#seg').addEventListener('click', e => { const b = e.target.closest('[data-langue]'); if (!b) return;
  langue = +b.dataset.langue; history.replaceState(history.state, '', '#' + (langue ? 'actus-en' : 'actus')); route = langue ? 'actus-en' : 'actus'; formAjout = null; rendre(); });
$('#q').addEventListener('input', e => { q = e.target.value; $('#qEff').hidden = !q; rendreEcran(); });
$('#qEff').addEventListener('click', () => { q = ''; $('#q').value = ''; $('#qEff').hidden = true; rendreEcran(); });
$('#refreshBtn').addEventListener('click', async () => { const b = $('#refreshBtn'); b.classList.add('spin'); await charger(true); b.classList.remove('spin'); });
$('#ecran').addEventListener('click', async e => {
  const t = e.target.closest('[data-ouvrir],[data-acc],[data-effacer],[data-annuler],[data-form],[data-vu]'); if (!t) return;
  if (t.dataset.ouvrir){ const id = t.dataset.ouvrir; OUV.has(id) ? OUV.delete(id) : OUV.add(id); S.session.ecrire('reglages:ouverts', [...OUV]); if (formAjout && id === 'ajouts:' + formAjout) formAjout = null; rendreEcran(); return; }
  if (t.dataset.acc){ changer(t.dataset.acc, {'Widget accueil':t.getAttribute('aria-pressed') === 'true' ? '' : 'Oui'}); apresChangement(); return; }
  if (t.dataset.effacer){ const nom = t.dataset.nom || '';
    const ok = await Synchro.demander('Effacer cet ajout ?', `« ${esc(nom || 'cet ajout')} » sera retiré de tes ajouts : sa ligne est vidée dans le classeur.`, [['oui', 'Effacer'], ['non', 'Garder']]);
    if (ok !== 'oui') return;
    M.effacer(t.dataset.effacer, nom); apresChangement(); return; }
  if (t.dataset.annuler){ M.annuler(t.dataset.annuler); apresChangement(); return; }
  if (t.dataset.vu){ VUS.add(t.dataset.vu); S.ecrire('reglages:vus', [...VUS].slice(-100)); rendreEcran(); return; }
  if ('form' in t.dataset){ formAjout = t.dataset.form || null; if (formAjout) OUV.add('ajouts:' + formAjout); rendreEcran();
    const f = $('#ajF'); if (f){ f.scrollIntoView({block:'nearest', behavior:'smooth'}); if (!('ontouchstart' in window)) f.querySelector('[name=nom]').focus(); } }
});
$('#ecran').addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.choisir){ choisirItem(t.dataset.choisir, t.checked); apresChangement(); }
  else if (t.dataset.tout){ choisirSection(t.dataset.tout, t.checked); OUV.add(t.dataset.tout); S.session.ecrire('reglages:ouverts', [...OUV]); apresChangement(); }
  else if (t.name === 'section' && t.form && t.form.id === 'ajF'){ $('#ajNouv').hidden = !!t.value; }
});
$('#ecran').addEventListener('submit', e => {
  if (e.target.id !== 'ajF') return; e.preventDefault();
  const f = e.target, v = n => (f.elements[n] ? f.elements[n].value : '').trim(), msg = $('#ajMsg');
  const section = v('section') || v('nouvelle'), nom = v('nom'), source = v('source');
  if (!nom && !source){ msg.textContent = 'Indique au moins un nom.'; return; }
  if (!f.elements.section.value && !v('nouvelle')){ msg.textContent = 'Indique le nom de la nouvelle section.'; return; }
  if (/^(javascript|data|vbscript|file):/i.test(source)){ msg.textContent = 'Ce lien n\'est pas accepté.'; return; }
  M.ajouter(f.dataset.module, {section, nom, source});
  formAjout = null; apresChangement();
});

/* ---------- chargement ---------- */
async function charger(frais = false){
  try{ CAT = await C.charger({frais}); erreurCat = ''; }
  catch(e){ if (!CAT) erreurCat = 'Catalogue introuvable : ' + (e.message || 'réseau'); }
  rendre();
}
lireRoute();
if (location.hash) history.replaceState('direct', '');
rendre();
(async () => {
  const frais = M.enAttente().some(m => !m.nonEnvoyee) && await Noyau.synchro.pret();    // des choix envoyés attendent : on lit la dernière version sur GitHub
  await charger(frais);
  if (M.enAttente().some(m => !m.nonEnvoyee)) suivre();
  planifier();
})();
document.addEventListener('visibilitychange', () => { if (!document.hidden && CAT) rendre(); });
</script>

</script>
<script>
/* Toucher visible : un rond qui s'efface là où le doigt appuie (pratique aussi pour les vidéos de démo) */
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const d = document.createElement('span'); d.className = 'tap-dot';
  d.style.left = e.clientX + 'px'; d.style.top = e.clientY + 'px';
  document.body.appendChild(d); setTimeout(() => d.remove(), 650);
}, {passive:true, capture:true});
</script>
<script>
/* Mise en mémoire sur l'iPhone (démarrage instantané, hors ligne) + avis quand une nouvelle version est déposée */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  const t0 = Date.now(); let majDispo = false, cacheAt = 0;
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => {
    if (!e.data || e.data.type !== 'nouvelle-version') return;
    majDispo = true;
    if (Date.now() - t0 < 8000){ location.reload(); return; }         // page tout juste ouverte : on passe directement à la nouvelle version
    if (document.querySelector('.maj-toast')) return;
    const b = document.createElement('button'); b.type = 'button'; b.className = 'maj-toast'; b.textContent = 'Nouvelle version — toucher pour l\'afficher';
    b.addEventListener('click', () => location.reload()); document.body.appendChild(b);
  });
  try{ navigator.serviceWorker.startMessages(); }catch{}
  /* Retour sur l'appli : nouvelle version déjà prête → rechargement ; sinon on vérifie s'il y en a une (au plus toutes les 2 min) */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (majDispo){ location.reload(); return; }
    if (Date.now() - cacheAt < 120e3) return;
    cacheAt = Date.now();
    navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});
    fetch(location.pathname, {cache:'no-cache'}).catch(() => {});
  });
}
</script>
<!-- ==TIRER== Tirer vers le bas pour recharger (comme Safari) -->
<style>
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top, 0px) + 6px);z-index:9999;width:38px;height:38px;margin-left:-19px;border-radius:50%;
  display:grid;place-items:center;pointer-events:none;opacity:0;transform:translateY(-60px);
  background:var(--sheet-solid, var(--base, #eef2f5));color:var(--ink-soft, #56636f);box-shadow:0 6px 18px -8px rgba(0,0,0,.45);border:1px solid var(--line, rgba(0,0,0,.1))}
.ptr svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.ptr.pret{color:var(--accent, #274c77)}
.ptr.pret svg{transform:rotate(180deg)}
.ptr.va{transition:transform .2s, opacity .2s}
.ptr.tourne svg{animation:ptr-t .7s linear infinite}
@keyframes ptr-t{to{transform:rotate(360deg)}}
</style>
<div class="ptr" id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg></div>
<script>
(() => {
  const el = document.getElementById('ptr'), SEUIL = 78;
  let y0 = null, x0 = 0, d = 0, actif = false;
  const OVER = '.scrim:not([hidden]),.sheet-bg:not([hidden]),.sheet:not([hidden]),[role="dialog"]:not([hidden])';
  const bloque = t => [...document.querySelectorAll(OVER)].some(e => e.getClientRects().length) || !t.closest || t.closest('input,textarea,select,[data-no-ptr]') ||
    (() => { for (let n = t; n && n !== document.body; n = n.parentElement) if (n.scrollTop > 0) return true; return false; })();
  const set = (y, cls) => { el.style.transform = `translateY(${y}px)`; el.style.opacity = Math.min(1, y / 40); el.className = 'ptr' + (cls ? ' ' + cls : ''); };
  addEventListener('touchstart', e => {
    if (e.touches.length !== 1 || (scrollY || document.documentElement.scrollTop) > 0 || bloque(e.target)) { y0 = null; return; }
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; d = 0; actif = false;
  }, {passive:true});
  addEventListener('touchmove', e => {
    if (y0 == null) return;
    const dy = e.touches[0].clientY - y0, dx = e.touches[0].clientX - x0;
    if (!actif){ if (Math.abs(dx) > Math.abs(dy) || dy < 6){ if (Math.abs(dx) > 10 || dy < -6) y0 = null; return; } if ((scrollY || document.documentElement.scrollTop) > 0){ y0 = null; return; } actif = true; }
    d = Math.max(0, dy);
    const y = Math.min(80, d * .5);
    set(y - 10, d >= SEUIL ? 'pret' : '');
  }, {passive:true});
  addEventListener('touchend', () => {
    if (y0 == null || !actif){ y0 = null; return; }
    y0 = null;
    if (d >= SEUIL){ set(34, 'va tourne'); setTimeout(() => location.reload(), 250); }
    else { set(-60, 'va'); }
  }, {passive:true});
  addEventListener('touchcancel', () => { if (actif) set(-60, 'va'); y0 = null; }, {passive:true});
})();
</script>
