<script>/* réglages du classeur (config/config.js) : CFG('sport.leagues', valeur par défaut) ; {re, flags} redevient une expression régulière */window.CFG=function(c,d){try{var v=c.split('.').reduce(function(o,k){return o==null?o:o[k]},window.MON_ECRAN_CONFIG);if(v==null)return d;return(function r(x){if(Array.isArray(x))return x.map(r);if(x&&typeof x==='object'){var k=Object.keys(x);if(k.length===2&&'re' in x&&'flags' in x)return new RegExp(x.re,x.flags);var o={};k.forEach(function(n){o[n]=r(x[n])});return o}return x})(v)}catch(e){return d}};</script>
<script>/* thème, mode clair/sombre (choisis dans État) et mise en page PC, avant l'affichage */try{const d=document.documentElement,p=localStorage.getItem('palette')||CFG('apparence.palette',''),m=localStorage.getItem('mode')||CFG('apparence.mode','');if(p&&p!=='bleu')d.dataset.palette=p;if(m==='clair')d.dataset.theme='light';else if(m==='sombre')d.dataset.theme='dark';const q=matchMedia('(min-width:1024px) and (hover:hover) and (pointer:fine)');d.classList.toggle('desk',q.matches);q.addEventListener&&q.addEventListener('change',e=>d.classList.toggle('desk',e.matches))}catch(e){}</script>

<style>
/* Layout : en-tête collant en verre (retour, actualiser, titre) ; une carte par source de données
   (résumé coloré en tête, détails dépliables) */
:root{
  --base:#e7ecef;
  --blob-1:rgba(163,206,241,.95); --blob-2:rgba(96,150,186,.55); --blob-3:rgba(39,76,119,.35);
  --ink:#10233a; --ink-soft:#56636f;
  --glass:rgba(255,255,255,.22); --glass-tint:rgba(163,206,241,.10);
  --rim-1:rgba(255,255,255,.95); --rim-2:rgba(255,255,255,.12); --rim-3:rgba(255,255,255,.6);
  --spec:rgba(255,255,255,.55);
  --shadow:0 14px 34px -16px rgba(39,76,119,.45);
  --head:rgba(231,236,239,.72);
  --card:rgba(255,255,255,.6); --line:rgba(39,76,119,.12);
  --accent:#274c77; --on-accent:#e7ecef;
  --t-brick:#274c77; --t-slate:#6096ba; --t-olive:#3d6b97; --t-plum:#1b3656;
  --t-teal:#4c86b0; --t-ochre:#8b8c89; --t-char:#2f3e50; --t-rose:#7fb0d8;
  --f-ui:"Geist", -apple-system, "SF Pro Text", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --base:#08121f;
  --blob-1:rgba(39,76,119,.85); --blob-2:rgba(96,150,186,.45); --blob-3:rgba(163,206,241,.22);
  --ink:#e7ecef; --ink-soft:#a7b6c4;
  --glass:rgba(231,236,239,.07); --glass-tint:rgba(163,206,241,.06);
  --rim-1:rgba(231,236,239,.55); --rim-2:rgba(231,236,239,.04); --rim-3:rgba(163,206,241,.35);
  --spec:rgba(231,236,239,.16);
  --shadow:0 14px 34px -14px rgba(0,0,0,.75);
  --head:rgba(8,18,31,.66);
  --card:rgba(231,236,239,.06); --line:rgba(231,236,239,.1); --accent:#a3cef1; --on-accent:#08121f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --base:#08121f;
  --blob-1:rgba(39,76,119,.85); --blob-2:rgba(96,150,186,.45); --blob-3:rgba(163,206,241,.22);
  --ink:#e7ecef; --ink-soft:#a7b6c4;
  --glass:rgba(231,236,239,.07); --glass-tint:rgba(163,206,241,.06);
  --rim-1:rgba(231,236,239,.55); --rim-2:rgba(231,236,239,.04); --rim-3:rgba(163,206,241,.35);
  --spec:rgba(231,236,239,.16);
  --shadow:0 14px 34px -14px rgba(0,0,0,.75);
  --head:rgba(8,18,31,.66);
  --card:rgba(231,236,239,.06); --line:rgba(231,236,239,.1); --accent:#a3cef1; --on-accent:#08121f;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;font-family:var(--f-ui);color:var(--ink);
  background-color:var(--base);
  background-image:
    radial-gradient(60% 45% at 10% 8%, var(--blob-1), transparent 70%),
    radial-gradient(55% 45% at 95% 35%, var(--blob-2), transparent 70%),
    radial-gradient(70% 50% at 30% 100%, var(--blob-3), transparent 70%);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--head);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}

/* verre */
.glass{position:relative;isolation:isolate;background:linear-gradient(160deg, var(--glass), var(--glass-tint));box-shadow:var(--shadow);
  backdrop-filter:blur(30px) saturate(1.8) brightness(1.05);-webkit-backdrop-filter:blur(30px) saturate(1.8) brightness(1.05)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 70% at 15% 0%, var(--spec), transparent 55%)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(145deg, var(--rim-1), var(--rim-2) 35%, var(--rim-2) 65%, var(--rim-3));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

.wrap{max-width:560px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

html.desk .wrap{max-width:860px}
/* ---------- Choix du thème ---------- */
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}
.th{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:16px;background:var(--card);border:2px solid transparent;text-align:left;min-height:44px}
.th[aria-checked="true"]{border-color:var(--accent)}
.themes .th b{font-size:.88rem;letter-spacing:0}
.th small{font-size:.72rem;color:var(--ink-soft)}
.modes{display:flex;gap:2px;padding:3px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin:2px 0 4px}
.modes button{flex:1;padding:8px 6px;border-radius:11px;font-size:.84rem;font-weight:500;color:var(--ink-soft);min-height:36px}
.modes button[aria-checked="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.pals{display:flex;flex-direction:column;border-radius:16px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.pl-row{display:flex;align-items:center;gap:12px;padding:10px 12px;text-align:left;min-height:52px;border-top:1px solid var(--line)}
.pl-row:first-child{border-top:0}
.pl-row .pal{flex:none;width:78px}
.pl-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pl-t b{font-size:.9rem}
.pl-t small{font-size:.74rem;color:var(--ink-soft)}
.pl-row .ok{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}
.pl-row[aria-checked="true"] .ok{border-color:var(--accent);background:radial-gradient(circle, var(--accent) 0 5px, transparent 6px)}
.pl-row[aria-checked="true"]{background:var(--accent-soft, rgba(127,127,127,.08))}
.pal{display:flex;height:24px;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.pal i{flex:1}
/* ---------- Interrupteurs ---------- */
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.sw-row small{display:block;color:var(--ink-soft);font-size:.78rem;margin-top:2px}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;border-radius:99px;background:rgba(139,140,137,.45);position:relative;cursor:pointer;transition:background .2s;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw:checked{background:#2fa35a}
.sw:checked::after{transform:translateX(18px)}
/* ---------- En-tête ---------- */
header{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--head);
  backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);
  border-bottom:1px solid var(--line)}
header .wrap{padding-block:10px 12px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.back{display:flex;align-items:center;gap:2px;color:var(--accent);font-weight:500;font-size:1rem;padding-block:6px}
.back svg,.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn{color:var(--accent);width:38px;height:38px;display:grid;place-items:center;border-radius:50%}
.icon-btn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.title-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-weight:700;font-size:2.2rem;letter-spacing:-.035em;margin:0;line-height:1}
.stamp{font-size:.74rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}

.tabs{display:flex;gap:4px;padding:4px;border-radius:18px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;scroll-snap-align:center;padding:8px 14px;border-radius:14px;font-size:.85rem;font-weight:500;color:var(--ink-soft);white-space:nowrap;
  transition:background .2s ease,color .2s ease}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}

/* ---------- État ---------- */
main .wrap{padding-block:14px 40px;display:flex;flex-direction:column;gap:12px}
.sum{border-radius:24px;padding:16px 18px;display:flex;align-items:center;gap:14px}
.sum b{font-size:1.1rem;letter-spacing:-.01em}
.sum p{margin:2px 0 0;font-size:.82rem;color:var(--ink-soft)}
.lamp{width:14px;height:14px;border-radius:50%;flex:none;background:var(--lc);box-shadow:0 0 0 4px color-mix(in oklab, var(--lc) 22%, transparent)}
.ok{--lc:#1e8a4c}.warn{--lc:#e08a12}.err{--lc:#d63c3c}.none{--lc:#8b8c89}
.part{border-radius:24px;overflow:hidden}
.part > summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.part > summary::-webkit-details-marker{display:none}
.part > summary .t{flex:1;min-width:0}
.part > summary b{display:block;font-size:1rem}
.part > summary small{display:block;font-size:.8rem;color:var(--ink-soft);margin-top:2px}
.part > summary .chev{width:18px;height:18px;fill:none;stroke:var(--ink-soft);stroke-width:2;transition:transform .2s ease}
.part[open] > summary .chev{transform:rotate(90deg)}
.body{padding:0 16px 14px;font-size:.84rem}
.rows{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.rows th,.rows td{text-align:left;padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
.rows th{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;border-top:0}
.rows td.n{text-align:right;white-space:nowrap}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:600;background:color-mix(in oklab, var(--lc) 16%, transparent);color:color-mix(in oklab, var(--lc) 80%, var(--ink))}
.note{color:var(--ink-soft);font-size:.8rem;margin:8px 0 0;line-height:1.45}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, monospace;font-size:.72rem;overflow-wrap:anywhere;color:var(--ink-soft)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{padding:10px 14px;border-radius:14px;font-weight:600;font-size:.86rem;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.main{background:var(--accent);color:var(--on-accent);border-color:transparent}
.sv-code{width:100%;font:12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;word-break:break-all}
.sv-form label,.sv-pinl{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.sv-form input,.sv-pin{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-width:220px}
#sauvZone .actions{margin-top:8px}
#syZone .actions{margin-top:8px}
.ct-jauge{position:relative;height:10px;border-radius:99px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;margin:4px 0 8px}
.ct-jauge i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px}
.ct-jauge span{position:absolute;top:0;bottom:0;width:2px;background:#e08a12}
.sy-row{display:flex;gap:8px;align-items:center}
.sy-row input{flex:1;max-width:none!important;font:13px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace!important}
#syForm label input[name=jeton]{max-width:none}
.sy-etapes{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sy-etapes a{color:var(--accent);text-decoration:underline}
/* ---------- Toucher visible et fondu entre les pages ---------- */
@view-transition{navigation:auto}
::view-transition-old(root),::view-transition-new(root){animation-duration:.22s}
.tap-dot{position:fixed;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;pointer-events:none;z-index:9999;
  background:radial-gradient(circle, color-mix(in oklab, var(--accent) 45%, transparent), color-mix(in oklab, var(--accent) 22%, transparent) 55%, rgba(255,255,255,.15) 72%);
  box-shadow:0 0 0 2.5px rgba(255,255,255,.9), 0 0 0 4px color-mix(in oklab, var(--accent) 45%, transparent), 0 4px 16px rgba(0,0,0,.22);animation:tapdot .6s ease-out forwards}
.maj-toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:9998;
  padding:10px 16px;border-radius:999px;background:var(--accent, #274c77);color:var(--on-accent, #e7ecef);font:600 .85rem/1.2 var(--f-ui, system-ui);box-shadow:0 10px 26px -10px rgba(0,0,0,.5);
  animation:majin .3s ease-out}
@keyframes majin{from{opacity:0;transform:translate(-50%, 10px)}}
@keyframes tapdot{from{transform:scale(.55);opacity:1}to{transform:scale(1.45);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

<script>
/* Lit etat.json (fait par la tâche « Publication ») et juge la fraîcheur de chaque donnée */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hours = t => t ? (Date.now() - Date.parse(t)) / 36e5 : Infinity;
function ago(t){
  if (!t) return 'jamais';
  const m = Math.round((Date.now() - Date.parse(t)) / 60000);
  if (m < 1) return "à l'instant"; if (m < 60) return `il y a ${m} min`;
  const h = Math.floor(m / 60); if (h < 48) return `il y a ${h} h${m % 60 && h < 6 ? ' ' + String(m % 60).padStart(2, '0') : ''}`;
  return `le ${new Date(t).toLocaleDateString('fr-FR', {day:'numeric', month:'short'})}`;
}
const LVL = {ok:0, none:1, warn:2, err:3}, worst = l => l.reduce((a, b) => LVL[b] > LVL[a] ? b : a, 'ok');
function judge(e){
  const out = {};
  const age = (t, okH, warnH) => hours(t) < okH ? 'ok' : hours(t) < warnH ? 'warn' : 'err';
  if (!e.sport) out.sport = {lvl:'err', msg:'Aucune donnée de matchs'};
  else {
    const bad = e.sport.ligues.filter(l => l.erreur), lvl = worst([age(e.sport.updated, 5, 12), bad.length ? 'warn' : 'ok']);
    out.sport = {lvl, msg:`Mis à jour ${ago(e.sport.updated)}${bad.length ? ` · ${bad.length} compétition${bad.length > 1 ? 's' : ''} en erreur` : ''}`};
  }
  if (!e.tv) out.tv = {lvl:'warn', msg:'Pas encore de programme TV'};
  else out.tv = {lvl:age(e.tv.updated, 5, 12), msg:`Mis à jour ${ago(e.tv.updated)} · ${e.tv.chaines.length} chaînes avec programme`};
  if (!e.actus) out.actus = {lvl:'warn', msg:'Pas encore d\'actus préparées'};
  else {
    const ko = e.actus.sources.filter(s => !s.ok);
    out.actus = {lvl:worst([age(e.actus.updated, 1.5, 6), ko.length ? 'warn' : 'ok']), msg:`Mis à jour ${ago(e.actus.updated)} · ${e.actus.sources.length - ko.length}/${e.actus.sources.length} sources`};
  }
  if (e.marches){
    const old = e.marches.series.filter(s => s.ancien), we = [0, 6].includes(new Date().getDay());
    out.marches = {lvl:worst([age(e.marches.updated, we ? 60 : 3, we ? 80 : 26), old.length ? 'warn' : 'ok']), msg:`Mis à jour ${ago(e.marches.updated)} · ${e.marches.series.length - old.length}/${e.marches.series.length} cours`};
  }
  out.global = worst([out.sport.lvl, out.tv.lvl, out.actus.lvl, ...(out.marches ? [out.marches.lvl] : [])]);
  return out;
}
const chev = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
const part = (title, j, inner, open) => `<details class="part glass ${j.lvl}"${open ? ' open' : ''}><summary><span class="lamp"></span><span class="t"><b>${title}</b><small>${esc(j.msg)}</small></span>${chev}</summary><div class="body">${inner}</div></details>`;

/* Thème de couleurs (gardé sur cet appareil, appliqué à toutes les pages) */
const PALETTES_TOUTES = [
  {id:'bleu',    t:'Bleu',             d:'Le thème d\'origine',      c:['#e7ecef', '#a3cef1', '#6096ba', '#274c77', '#8b8c89']},
  {id:'gris',    t:'Gris',             d:'Icônes noires',            c:['#eef0f2', '#c6c7c4', '#a2999e', '#846a6a', '#353b3c']},
  {id:'ardoise', t:'Ardoise et corail', d:'Bleu nuit, touche orangée', c:['#2d3142', '#4f5d75', '#bfc0c0', '#ffffff', '#ef8354']},
  {id:'minuit',  t:'Minuit et or',      d:'Marine profond, icônes dorées', c:['#000814', '#001d3d', '#003566', '#ffc300', '#ffd60a']},
  {id:'encre',   t:'Encre et ambre',    d:'Noir et marine, icônes ambre',  c:['#000000', '#14213d', '#fca311', '#e5e5e5', '#ffffff']},
  {id:'petrole', t:'Pétrole et cuivre', d:'Bleu pétrole, crème, orange',   c:['#001524', '#15616d', '#ffecd1', '#ff7d00', '#78290f']},
  {id:'azur',    t:'Azur et mandarine', d:'Bleu roi, gris clair, orange',  c:['#ff6700', '#ebebeb', '#c0c0c0', '#3a6ea5', '#004e98']}
];
const PALETTES = (l => l ? PALETTES_TOUTES.filter(p => l.includes(p.id)) : PALETTES_TOUTES)(CFG('apparence.palettes', null));   // thèmes proposés (classeur, onglet Apparence)
const PAL_DEF = CFG('apparence.palette', 'bleu'), MODE_DEF = CFG('apparence.mode', 'auto');   // choix de départ d'un nouvel appareil
const modeNow = () => { try{ return localStorage.getItem('mode') || MODE_DEF; }catch{ return 'auto'; } };
const palNow = () => { try{ return localStorage.getItem('palette') || PAL_DEF; }catch{ return 'bleu'; } };
function themeHTML(){
  const cur = palNow();
  return `<div class="sum glass" style="flex-direction:column;align-items:stretch;gap:6px"><b>Thème</b>
    <div class="modes" role="radiogroup" aria-label="Mode clair ou sombre">${[['auto', 'Défaut'], ['clair', 'Clair'], ['sombre', 'Sombre']].map(([v, t]) => `<button type="button" role="radio" aria-checked="${v === modeNow()}" data-mode="${v}"${v === 'auto' ? ' title="Suit le réglage de l\'iPhone"' : ''}>${t}</button>`).join('')}</div>
    <div class="pals" role="radiogroup" aria-label="Thème de couleurs">${PALETTES.map(p => `<button type="button" class="pl-row" role="radio" aria-checked="${p.id === cur}" data-pal="${p.id}">
      <span class="pal" aria-hidden="true">${p.c.map(c => `<i style="background:${c}"></i>`).join('')}</span><span class="pl-t"><b>${p.t}</b><small>${p.d}</small></span><span class="ok" aria-hidden="true"></span></button>`).join('')}</div>
    <p class="note" style="margin:2px 0 0">Appliqué à toutes les pages de cet appareil.</p></div>`;
}

/* Rafraîchissement automatique sur cet iPhone (les tâches GitHub, elles, continuent de tourner) */
const AUTO = [
  {k:'sport',   t:'Sports',        d:'Scores en direct (toutes les 30 s), témoin LIVE de l\'accueil, programme TV'},
  {k:'actus',   t:'Actus',         d:'Rechargement au retour sur la page Actus et « une » de l\'accueil'},

];
const autoGet = () => { try{ return JSON.parse(localStorage.getItem('rafraichissement')) || {}; }catch{ return {}; } };
function autoHTML(){

  return part('Rafraîchissement automatique (sur cet iPhone)', {lvl:off.length ? 'warn' : 'ok', msg:off.length ? `Coupé : ${off.map(a => a.t).join(', ')}` : 'Tout est actif'},

}

function render(e){
  const j = judge(e);
  const label = {ok:'Tout est à jour', warn:'Quelques points à vérifier', err:'Des données ne se mettent plus à jour'}[j.global];
  let h = `<div class="sum glass ${j.global}"><span class="lamp"></span><div><b>${label}</b><p>Résumé fait ${ago(e.genere)}. Les données se rafraîchissent toutes les 15 min (actus), toutes les 20 min en semaine (marchés) et toutes les 2 h (matchs, TV).</p></div></div>`;

  if (e.sport){
    const rows = e.sport.ligues.map(l => {
      const st = l.erreur ? `<span class="tag err" title="${esc(l.erreur)}">erreur</span>` : l.pause ? `<span class="tag none">en pause</span>` : l.joursEnEchec ? `<span class="tag warn">${l.joursEnEchec} j. non lus</span>` : l.avert ? `<span class="tag warn">${esc(l.avert)}</span>` : `<span class="tag ok">ok</span>`;
      return `<tr><td>${esc(l.nom)}</td><td class="n">${l.pause ? '—' : esc(l.matchs ?? '?')}</td><td>${esc(l.classement)}</td><td>${st}</td></tr>`;
    }).join('');

  } else h += part('Matchs et classements', j.sport, '<p class="note">La tâche « Programme TV sport » n\'a encore rien publié.</p>', true);

  if (e.sport && e.sport.ligues.some(l => l.logo)){

    const vieux = P.liste.filter(x => x.v !== x.attendu), wf = vieux.filter(x => x.f.startsWith('.github/'));

    const rows = [...vieux, ...P.liste.filter(x => !vieux.includes(x))].map(x => `<tr><td class="mono">${esc(x.f)}</td><td>${x.v === x.attendu ? '<span class="tag ok">à jour</span>' : x.v === undefined ? '<span class="tag warn">absent</span>' : `<span class="tag warn">${esc(x.v || 'ancien')}</span>`}</td></tr>`).join('');
    h += part('Pages et scripts', {lvl, msg:vieux.length ? `${vieux.length} fichier${vieux.length > 1 ? 's' : ''} pas à jour (lot ${P.lot})` : `Lot ${P.lot} complet`},
      `<table class="rows"><thead><tr><th>Fichier</th><th>Version</th></tr></thead><tbody>${rows}</tbody></table>
      ${wf.length ? `<p class="note"><b>À déposer à la main</b> (une tâche GitHub ne peut pas les modifier) : ${wf.map(x => esc(x.f)).join(', ')}.</p>` : ''}
      <p class="note">Lot ${esc(P.lot)}${P.date ? ` du ${new Date(P.date).toLocaleString('fr-FR', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})}` : ''}. Cette page sur ton iPhone : ${esc(mine || '?')}${mine && mine !== P.lot ? ' (ancienne : tire vers le bas pour recharger)' : ''}.</p>`, vieux.length > 0);
  }

  if (e.fichiers){
    const f = e.fichiers;
    h += part('Tes calendriers et logos', {lvl:'ok', msg:`${f.calendriers.length} calendrier${f.calendriers.length > 1 ? 's' : ''} · ${f.logos} logo${f.logos > 1 ? 's' : ''}`},
      f.calendriers.length ? `<ul class="note">${f.calendriers.map(c => `<li>${esc(c.replace(/^calendriers\//, ''))}</li>`).join('')}</ul>` : '<p class="note">Aucun calendrier déposé.</p>', false);

  h += cotesPart() + confPart() + themeHTML() + autoHTML() + syncHTML() + sauvHTML();
  h += `<div class="actions"><a class="btn main" href="https://github.com/ZyAvo/iPhone-Dock/actions" target="_blank" rel="noopener">Voir les tâches GitHub</a>
    <button type="button" class="btn" id="resetBtn">Vider la mémoire de l'appli</button></div>
    <p class="note" id="resetMsg">« Vider la mémoire » efface les données gardées sur cet appareil (matchs, actus, pages) ; tes réglages (lieu météo, Spotify, favoris, langue des actus, placements, rafraîchissement) sont conservés.</p>`;
  $('#out').innerHTML = h;
  $('#stamp').textContent = '';

/* ---------- Configuration : résultat de la lecture du classeur (tâche « Configuration », fichier config/rapport.json) ---------- */
let CONF = null;
function confPart(){
  const R = CONF;
  if (!R) return part('Configuration (classeur)', {lvl:'none', msg:'Aucun classeur déposé pour l\'instant'},
    '<p class="note">Dépose <b>configuration.xlsx</b> à la racine du dépôt GitHub : la tâche « Configuration » le lit, teste les nouveautés et affiche ici le résultat.</p>', false);
  const T = R.tests || [], n = k => T.filter(t => t.statut === k).length, ko = n('ko'), warn = n('warn');
  const nb = Object.values(R.modules || {}).reduce((a, m) => a + (m.coches || 0), 0);
  const lvl = ko ? 'warn' : 'ok';
  const msg = `${nb} éléments choisis · ${T.length ? `${n('ok')} ✅ · ${warn} ⚠️ · ${ko} ❌` : 'aucune nouveauté à tester'}`;
  const ordre = {ko:0, warn:1, info:2, ok:3}, sym = {ok:'✅', warn:'⚠️', ko:'❌', info:'ℹ️'};
  const rows = [...T].sort((a, b) => ordre[a.statut] - ordre[b.statut]).map(t => `<tr><td>${sym[t.statut]}</td><td>${esc(t.nom)}<br><small class="note" style="margin:0">${esc(t.onglet)} · ligne ${t.ligne}</small></td><td>${esc(t.message)}</td></tr>`).join('');
  return part('Configuration (classeur)', {lvl, msg}, `<p class="note">Classeur lu ${ago(Date.parse(R.date))}${R.teste ? '' : ' (sans test réseau)'} · le détail est aussi dans <b>config/configuration-resultat.xlsx</b>, colonne « Résultat ».</p>
    ${rows ? `<table class="rows"><thead><tr><th></th><th>Élément</th><th>Résultat</th></tr></thead><tbody>${rows}</tbody></table>` : ''}`, false);
}
/* ---------- Cotes des matchs (tâche « Cotes », The Odds API) : compteur de crédits et clé pour l'actualisation à la main ---------- */
let COTES = null;
function cotesPart(){
  const C = COTES, q = C && C.quota, cle = (() => { try{ return JSON.parse(localStorage.getItem('cotes:cle')) || ''; }catch{ return ''; } })();
  const lq = (() => { try{ return JSON.parse(localStorage.getItem('cotes:quota')); }catch{ return null; } })();
  const Q = !q || !lq ? q || lq : Math.abs(q.at - lq.at) < 3 * 864e5 ? (q.restants <= lq.restants ? q : lq) : (lq.at > q.at ? lq : q);   // même règle que la page Sport
  const lvl = !C ? 'none' : C.erreur ? 'warn' : Q && Q.restants <= 40 ? 'warn' : 'ok';
  const msg = !C ? 'Pas encore lancées' : C.erreur ? `⚠ ${C.erreur}` : Q ? `${Q.utilises} crédit${Q.utilises > 1 ? 's' : ''} utilisé${Q.utilises > 1 ? 's' : ''} · ${Q.restants} restant${Q.restants > 1 ? 's' : ''}` : 'Aucun relevé pour l\'instant';
  const pct = Q && Q.total ? Math.min(100, Math.round(Q.utilises / Q.total * 100)) : 0;
  return part('Cotes des matchs', {lvl, msg}, `
    ${Q ? `<div class="ct-jauge" role="img" aria-label="${pct} % des crédits utilisés"><i style="width:${pct}%"></i><span style="left:${100 - 120 / (Q.total || 500) * 100}%" title="mi-temps coupée"></span><span style="left:${100 - 40 / (Q.total || 500) * 100}%" title="relevés automatiques coupés"></span></div>
      <p class="note">${Q.restants} crédits restants sur ${Q.total}. Sous <b>120</b> : plus de relevé à la mi-temps. Sous <b>40</b> : plus de relevé automatique (gardés pour l'actualisation à la main). Sous <b>5</b> : tout est bloqué jusqu'au renouvellement mensuel.</p>` : ''}
    <p class="note"><a href="ecarts.html" style="color:var(--accent);font-weight:600">Voir les écarts de cotes entre sites ›</a></p>
    <p class="note">Relevés automatiques : le matin, dans les 45 min avant chaque coup d'envoi et à la mi-temps, pour la Ligue 1, la Premier League, la Liga, la Serie A, la Bundesliga et les 3 coupes d'Europe. Une demande = 1 crédit.</p>
    ${C && C.journal && C.journal.length ? `<p class="note"><b>Derniers relevés</b></p>${C.journal.slice(-6).reverse().map(l => `<div class="mono">${esc(l)}</div>`).join('')}` : ''}
    <form class="sv-form" id="ctForm"><label class="note">Ta clé The Odds API (pour le bouton ↻ des matchs, gardée sur cet appareil)<input name="cle" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(cle)}" placeholder="clé de the-odds-api.com"></label>
      <div class="actions"><button class="btn" type="submit">Enregistrer la clé</button></div><p class="note sv-msg" aria-live="polite"></p></form>
    <p class="note">Mise en place : crée une clé gratuite sur <a href="https://the-odds-api.com" target="_blank" rel="noopener">the-odds-api.com</a>, puis sur GitHub : Settings → Secrets and variables → Actions → New repository secret, nom <b>ODDS_API_KEY</b>.</p>`, false);
}
document.addEventListener('submit', e => { if (e.target.id !== 'ctForm') return; e.preventDefault();
  try{ localStorage.setItem('cotes:cle', JSON.stringify(e.target.cle.value.trim())); e.target.querySelector('.sv-msg').textContent = 'Clé enregistrée ✓'; }catch{} });
async function load(){
  $('#refreshBtn').classList.add('spin');
  try{ const r = await fetch('donnees/cotes/cotes.json', {cache:'no-cache'}); COTES = r.ok ? await r.json() : null; }catch{ COTES = null; }
  try{ const r = await fetch('config/rapport.json', {cache:'no-cache'}); CONF = r.ok ? await r.json() : null; }catch{ CONF = null; }
  try{
    const r = await fetch('etat.json', {cache:'no-cache'});
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  }catch(err){
    $('#out').innerHTML = `<div class="sum glass err"><span class="lamp"></span><div><b>Résumé introuvable</b><p>Le fichier etat.json est fait par la tâche GitHub « Publication ». Vérifie qu'elle a bien tourné (Settings → Pages → Source : GitHub Actions).</p></div></div>` + cotesPart() + confPart() + themeHTML() + autoHTML() + syncHTML() + sauvHTML();
  }finally{ $('#refreshBtn').classList.remove('spin'); }
}

/* ---------- Sauvegarde : tes réglages et données personnelles dans un code à garder (Notes…), chiffré avec ton code ---------- */
const REGLAGES = ['cotes:cle', 'synchro:cfg', 'synchro:etat', 'invest:lignes', 'invest:reglages', 'invest:pin', 'invest:perimetre', 'invest:widget-per', 'invest:versements', 'coffre:chiffre', 'coffre:items',
  'sport:favoris', 'sport:reduites', 'actus:langue', 'videos:abos', 'videos:liste', 'videos:vus', 'videos:yt-chaine',
  'lieu:favoris', 'lieu:actuel', 'palette', 'mode', 'rafraichissement', 'spotify:client'];
const B64 = {de:u => { let t = ''; for (let i = 0; i < u.length; i += 8192) t += String.fromCharCode(...u.subarray(i, i + 8192)); return btoa(t); }, vers:s => Uint8Array.from(atob(s), c => c.charCodeAt(0))};
async function cleDe(pin, sel){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:sel, iterations:150000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt', 'decrypt']);
}
const pinOk = async pin => { const r = (() => { try{ return JSON.parse(localStorage.getItem('invest:pin')); }catch{ return null; } })(); if (!r) return false;
  const h = [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(r.sel + pin)))].map(x => x.toString(16).padStart(2, '0')).join(''); return h === r.h; };
const aUnCode = () => { try{ return !!JSON.parse(localStorage.getItem('invest:pin')); }catch{ return false; } };
async function creerSauvegarde(pin){
  const d = {}; REGLAGES.forEach(k => { const v = localStorage.getItem(k); if (v != null) d[k] = v; });
  const txt = new TextEncoder().encode(JSON.stringify({v:1, at:new Date().toISOString(), d}));
  if (!pin) return 'MONECRAN0.' + B64.de(txt);
  const sel = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, await cleDe(pin, sel), txt));
  return 'MONECRAN1.' + B64.de(new Uint8Array([...sel, ...iv, ...ct]));
}
async function lireSauvegarde(code, pin){
  code = code.replace(/\s+/g, '');
  if (code.startsWith('MONECRAN0.')) return JSON.parse(new TextDecoder().decode(B64.vers(code.slice(10))));
  if (!code.startsWith('MONECRAN1.')) throw new Error('code');
  const b = B64.vers(code.slice(10)), sel = b.slice(0, 16), iv = b.slice(16, 28), ct = b.slice(28);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv}, await cleDe(pin, sel), ct)));
}

  else if (a === 'lire'){

/* ---------- Synchronisation chiffrée entre appareils (synchro.js) ---------- */
const quandSync = t => { if (!t) return 'jamais'; const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'à l\'instant' : m < 60 ? `il y a ${m} min` : m < 1440 ? `il y a ${Math.round(m / 60)} h` : new Date(t).toLocaleDateString('fr-FR', {day:'numeric', month:'short'}); };
function syncHTML(){
  if (!window.Synchro) return '';

  const msg = !aUnCode() ? 'Crée d\'abord un code dans Investissements' : !on ? 'Désactivée sur cet appareil' : st.err ? `⚠ ${Synchro.MSG[st.err] || st.err}` : `Active · dernière synchro ${quandSync(st.at)}`;
  const lvl = !on ? 'none' : st.err ? 'warn' : 'ok';
  const corps = !aUnCode() ? '<p class="note">La synchronisation utilise ton code d\'Investissements (Investissements → ⚙︎ → verrouillage).</p>'

      <div class="actions"><button type="button" class="btn main" data-sy="maintenant">Synchroniser maintenant</button><button type="button" class="btn" data-sy="off">Désactiver sur cet appareil</button></div><div id="syZone"></div>`
    : `<p class="note">Pour retrouver <b>les mêmes placements, versements et le même Coffre</b> sur ton iPhone et ton PC. Le contenu est chiffré avec une <b>phrase secrète</b> (6 mots) avant de partir sur ton dépôt GitHub : sans elle, c'est illisible. Au quotidien, ton code suffit.</p>
      <ol class="note sy-etapes">
        <li><b>Clé GitHub</b> (une fois) : <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">crée une clé « fine-grained »</a>. Nom : Mon Écran ; Expiration : 1 an ; Repository access : <i>Only select repositories</i> → <b>${esc(Synchro.DEPOT.split('/')[1])}</b> ; Permissions → <i>Contents</i> : <b>Read and write</b>. Copie la clé (github_pat_…).</li>
        <li><b>Phrase secrète</b> : sur le premier appareil, touche « Générer ». Garde-la avec la clé dans Bitwarden : il faudra les deux sur chaque appareil, et la phrase perdue ne se retrouve pas.</li>

      <form class="sv-form" id="syForm">
        <label class="note">Phrase secrète<span class="sy-row"><input name="phrase" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="mot-mot-mot-mot-mot-mot"><button type="button" class="btn" data-sy="generer">Générer</button></span></label>
        <label class="note">Clé GitHub<input name="jeton" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…"></label>
        <label class="note">Ton code<input name="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></label>
        <div class="actions"><button class="btn main" type="submit">Activer sur cet appareil</button></div><p class="note sv-msg" aria-live="polite"></p></form><div id="syZone"></div>`;
  return part('Synchronisation entre appareils', {lvl, msg}, corps, false);
}
const syErr = e => Synchro.MSG[e && e.message] || 'erreur inattendue (' + ((e && e.message) || '?') + ')';
const syncInvestOpts = () => ({local:() => Synchro.investLocal(), appliquer:v => Synchro.investAppliquer(v), choisir:Synchro.conflit('Ton portefeuille')});
const syncCoffreOpts = pin => ({local:() => Synchro.coffreLire(pin).catch(() => { throw new Error('coffre'); }), appliquer:v => Synchro.coffreEcrire(pin, v), choisir:Synchro.conflit('Le coffre')});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'syForm') return; e.preventDefault();
  const f = e.target, msg = f.querySelector('.sv-msg'), phrase = f.phrase.value, jeton = f.jeton.value, pin = f.pin.value;
  if (phrase.trim().split(/[-\s]+/).length < 5){ msg.textContent = 'La phrase doit faire au moins 5 mots (touche « Générer »).'; return; }

  try{

        <div class="actions"><button type="button" class="btn main" data-sy="prendre">Prendre ces données</button><button type="button" class="btn" data-sy="envoyer">Les remplacer par celles de cet appareil</button></div>`;
      window.__sy = {phrase, jeton, pin}; return;
    }
    location.reload();
  }catch(err){ msg.textContent = 'Impossible : ' + syErr(err) + '.'; }
});
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-sy]'); if (!b) return;
  const a = b.dataset.sy;
  if (a === 'generer'){ const i = document.querySelector('#syForm [name=phrase]'); i.value = Synchro.genererPhrase(); i.select(); return; }
  if (a === 'prendre' || a === 'envoyer'){ try{ await Synchro.activer({...window.__sy, choix:a}); location.reload(); }catch(err){ $('#syZone').insertAdjacentHTML('beforeend', `<p class="note">Impossible : ${esc(syErr(err))}.</p>`); } return; }
  if (a === 'off'){ Synchro.desactiver(); location.reload(); return; }
  if (a === 'maintenant'){
    $('#syZone').innerHTML = `<form class="sv-form" id="syPin"><label class="note">Ton code<input type="password" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="Code"></label>
      <label class="note sy-anc" hidden>Ton ancien code (celui de l'activation)<input type="password" inputmode="numeric" maxlength="6" autocomplete="off" class="sy-ancien"></label>
      <div class="actions"><button class="btn main" type="submit">Synchroniser</button></div><p class="note sv-msg" aria-live="polite"></p></form>`;
    const f = $('#syPin'); f.querySelector('input').focus();
    f.addEventListener('submit', async ev => { ev.preventDefault(); const m = f.querySelector('.sv-msg'), pin = f.querySelector('input').value, anc = f.querySelector('.sy-ancien').value;
      if (!(await pinOk(pin))){ m.textContent = 'Code incorrect.'; return; }
      if (anc && !(await Synchro.recoder(anc, pin))){ m.textContent = 'Ancien code incorrect.'; return; }
      if (anc){ try{ await Synchro.coffreEcrire(pin, await Synchro.coffreLire(anc)); }catch{} }     // le Coffre suit aussi le nouveau code
      m.textContent = 'Synchronisation…';
      const o = await Synchro.ouvrirAvecCode(pin).catch(() => null);
      if (o === false){ f.querySelector('.sy-anc').hidden = false; m.textContent = 'Ton code a changé depuis l\'activation : entre aussi l\'ancien.'; return; }
      if (!o){ m.textContent = 'Impossible : ' + (Synchro.MSG[Synchro.etat().err] || 'GitHub injoignable') + '.'; return; }
      const r1 = await Synchro.partie('invest', syncInvestOpts()), r2 = await Synchro.partie('coffre', syncCoffreOpts(pin));
      const bad = [r1, r2].find(r => String(r).startsWith('erreur'));
      m.textContent = bad ? 'Impossible : ' + (Synchro.MSG[bad.split(':')[1]] || bad) + '.' : 'Synchronisé ✓';
    });
  }
});
document.addEventListener('click', async e => {
  if (!e.target.closest('#resetBtn')) return;
  try{
    Object.keys(localStorage).filter(k => /^(sport|actus|meteo|icons|invest):/.test(k) && !REGLAGES.includes(k)).forEach(k => localStorage.removeItem(k));
    if (window.caches) for (const k of await caches.keys()) await caches.delete(k);

});
load();

/* Toucher visible : un rond qui s'efface là où le doigt appuie (pratique aussi pour les vidéos de démo) */
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const d = document.createElement('span'); d.className = 'tap-dot';
  d.style.left = e.clientX + 'px'; d.style.top = e.clientY + 'px';
  document.body.appendChild(d); setTimeout(() => d.remove(), 650);
}, {passive:true, capture:true});

<script>
/* Mise en mémoire sur l'iPhone (démarrage instantané, hors ligne) + avis quand une nouvelle version est déposée */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  const t0 = Date.now(); let majDispo = false, cacheAt = 0;
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => {
    if (!e.data || e.data.type !== 'nouvelle-version') return;
    majDispo = true;
    if (Date.now() - t0 < 8000){ location.reload(); return; }         // page tout juste ouverte : on passe directement à la nouvelle version
    if (document.querySelector('.maj-toast')) return;
    const b = document.createElement('button'); b.type = 'button'; b.className = 'maj-toast'; b.textContent = 'Nouvelle version — toucher pour l\'afficher';
    b.addEventListener('click', () => location.reload()); document.body.appendChild(b);
  });
  try{ navigator.serviceWorker.startMessages(); }catch{}
  /* Retour sur l'appli : nouvelle version déjà prête → rechargement ; sinon on vérifie s'il y en a une (au plus toutes les 2 min) */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (majDispo){ location.reload(); return; }
    if (Date.now() - cacheAt < 120e3) return;
    cacheAt = Date.now();
    navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});
    fetch(location.pathname, {cache:'no-cache'}).catch(() => {});
  });
}
</script>

<style>
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top, 0px) + 6px);z-index:9999;width:38px;height:38px;margin-left:-19px;border-radius:50%;
  display:grid;place-items:center;pointer-events:none;opacity:0;transform:translateY(-60px);
  background:var(--sheet-solid, var(--base, #eef2f5));color:var(--ink-soft, #56636f);box-shadow:0 6px 18px -8px rgba(0,0,0,.45);border:1px solid var(--line, rgba(0,0,0,.1))}
.ptr svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.ptr.pret{color:var(--accent, #274c77)}
.ptr.pret svg{transform:rotate(180deg)}
.ptr.va{transition:transform .2s, opacity .2s}
.ptr.tourne svg{animation:ptr-t .7s linear infinite}
@keyframes ptr-t{to{transform:rotate(360deg)}}
</style>
<div class="ptr" id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg></div>
<script>
(() => {
  const el = document.getElementById('ptr'), SEUIL = 78;
  let y0 = null, x0 = 0, d = 0, actif = false;
  const OVER = '.scrim:not([hidden]),.sheet-bg:not([hidden]),.sheet:not([hidden]),[role="dialog"]:not([hidden])';
  const bloque = t => [...document.querySelectorAll(OVER)].some(e => e.getClientRects().length) || !t.closest || t.closest('input,textarea,select,[data-no-ptr]') ||
    (() => { for (let n = t; n && n !== document.body; n = n.parentElement) if (n.scrollTop > 0) return true; return false; })();
  const set = (y, cls) => { el.style.transform = `translateY(${y}px)`; el.style.opacity = Math.min(1, y / 40); el.className = 'ptr' + (cls ? ' ' + cls : ''); };
  addEventListener('touchstart', e => {
    if (e.touches.length !== 1 || (scrollY || document.documentElement.scrollTop) > 0 || bloque(e.target)) { y0 = null; return; }
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; d = 0; actif = false;
  }, {passive:true});
  addEventListener('touchmove', e => {
    if (y0 == null) return;
    const dy = e.touches[0].clientY - y0, dx = e.touches[0].clientX - x0;
    if (!actif){ if (Math.abs(dx) > Math.abs(dy) || dy < 6){ if (Math.abs(dx) > 10 || dy < -6) y0 = null; return; } if ((scrollY || document.documentElement.scrollTop) > 0){ y0 = null; return; } actif = true; }
    d = Math.max(0, dy);
    const y = Math.min(80, d * .5);
    set(y - 10, d >= SEUIL ? 'pret' : '');
  }, {passive:true});
  addEventListener('touchend', () => {
    if (y0 == null || !actif){ y0 = null; return; }
    y0 = null;
    if (d >= SEUIL){ set(34, 'va tourne'); setTimeout(() => location.reload(), 250); }
    else { set(-60, 'va'); }
  }, {passive:true});
  addEventListener('touchcancel', () => { if (actif) set(-60, 'va'); y0 = null; }, {passive:true});
})();
</script>
