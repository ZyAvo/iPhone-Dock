<script>/* thème, mode clair/sombre (choisis dans État) et mise en page PC, avant l'affichage */try{const d=document.documentElement,p=localStorage.getItem('palette')||CFG('apparence.palette',''),m=localStorage.getItem('mode')||CFG('apparence.mode','');if(p&&p!=='bleu')d.dataset.palette=p;if(m==='clair')d.dataset.theme='light';else if(m==='sombre')d.dataset.theme='dark';const q=matchMedia('(min-width:1024px) and (hover:hover) and (pointer:fine)');d.classList.toggle('desk',q.matches);q.addEventListener&&q.addEventListener('change',e=>d.classList.toggle('desk',e.matches))}catch(e){}</script>

/* Layout : en-tête collant en verre (retour, actualiser, titre) ; une carte par source de données
   (résumé coloré en tête, détails dépliables) */
:root{
  --base:#e7ecef;
  --blob-1:rgba(163,206,241,.95); --blob-2:rgba(96,150,186,.55); --blob-3:rgba(39,76,119,.35);
  --ink:#10233a; --ink-soft:#56636f;
  --glass:rgba(255,255,255,.22); --glass-tint:rgba(163,206,241,.10);
  --rim-1:rgba(255,255,255,.95); --rim-2:rgba(255,255,255,.12); --rim-3:rgba(255,255,255,.6);
  --spec:rgba(255,255,255,.55);
  --shadow:0 14px 34px -16px rgba(39,76,119,.45);
  --head:rgba(231,236,239,.72);
  --card:rgba(255,255,255,.6); --line:rgba(39,76,119,.12);
  --accent:#274c77; --on-accent:#e7ecef;
  --t-brick:#274c77; --t-slate:#6096ba; --t-olive:#3d6b97; --t-plum:#1b3656;
  --t-teal:#4c86b0; --t-ochre:#8b8c89; --t-char:#2f3e50; --t-rose:#7fb0d8;
  --f-ui:"Geist", -apple-system, "SF Pro Text", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --base:#08121f;
  --blob-1:rgba(39,76,119,.85); --blob-2:rgba(96,150,186,.45); --blob-3:rgba(163,206,241,.22);
  --ink:#e7ecef; --ink-soft:#a7b6c4;
  --glass:rgba(231,236,239,.07); --glass-tint:rgba(163,206,241,.06);
  --rim-1:rgba(231,236,239,.55); --rim-2:rgba(231,236,239,.04); --rim-3:rgba(163,206,241,.35);
  --spec:rgba(231,236,239,.16);
  --shadow:0 14px 34px -14px rgba(0,0,0,.75);
  --head:rgba(8,18,31,.66);
  --card:rgba(231,236,239,.06); --line:rgba(231,236,239,.1); --accent:#a3cef1; --on-accent:#08121f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --base:#08121f;
  --blob-1:rgba(39,76,119,.85); --blob-2:rgba(96,150,186,.45); --blob-3:rgba(163,206,241,.22);
  --ink:#e7ecef; --ink-soft:#a7b6c4;
  --glass:rgba(231,236,239,.07); --glass-tint:rgba(163,206,241,.06);
  --rim-1:rgba(231,236,239,.55); --rim-2:rgba(231,236,239,.04); --rim-3:rgba(163,206,241,.35);
  --spec:rgba(231,236,239,.16);
  --shadow:0 14px 34px -14px rgba(0,0,0,.75);
  --head:rgba(8,18,31,.66);
  --card:rgba(231,236,239,.06); --line:rgba(231,236,239,.1); --accent:#a3cef1; --on-accent:#08121f;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;font-family:var(--f-ui);color:var(--ink);
  background-color:var(--base);
  background-image:
    radial-gradient(60% 45% at 10% 8%, var(--blob-1), transparent 70%),
    radial-gradient(55% 45% at 95% 35%, var(--blob-2), transparent 70%),
    radial-gradient(70% 50% at 30% 100%, var(--blob-3), transparent 70%);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--head);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}

/* verre */
.glass{position:relative;isolation:isolate;background:linear-gradient(160deg, var(--glass), var(--glass-tint));box-shadow:var(--shadow);
  backdrop-filter:blur(30px) saturate(1.8) brightness(1.05);-webkit-backdrop-filter:blur(30px) saturate(1.8) brightness(1.05)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 70% at 15% 0%, var(--spec), transparent 55%)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(145deg, var(--rim-1), var(--rim-2) 35%, var(--rim-2) 65%, var(--rim-3));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

.wrap{max-width:560px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

html.desk .wrap{max-width:860px}
/* ---------- Choix du thème ---------- */
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}
.th{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:16px;background:var(--card);border:2px solid transparent;text-align:left;min-height:44px}
.th[aria-checked="true"]{border-color:var(--accent)}
.themes .th b{font-size:.88rem;letter-spacing:0}
.th small{font-size:.72rem;color:var(--ink-soft)}
.modes{display:flex;gap:2px;padding:3px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin:2px 0 4px}
.modes button{flex:1;padding:8px 6px;border-radius:11px;font-size:.84rem;font-weight:500;color:var(--ink-soft);min-height:36px}
.modes button[aria-checked="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.pals{display:flex;flex-direction:column;border-radius:16px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.pl-row{display:flex;align-items:center;gap:12px;padding:10px 12px;text-align:left;min-height:52px;border-top:1px solid var(--line)}
.pl-row:first-child{border-top:0}
.pl-row .pal{flex:none;width:78px}
.pl-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pl-t b{font-size:.9rem}
.pl-t small{font-size:.74rem;color:var(--ink-soft)}
.pl-row .ok{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}
.pl-row[aria-checked="true"] .ok{border-color:var(--accent);background:radial-gradient(circle, var(--accent) 0 5px, transparent 6px)}
.pl-row[aria-checked="true"]{background:var(--accent-soft, rgba(127,127,127,.08))}
.pal{display:flex;height:24px;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.pal i{flex:1}
/* ---------- Interrupteurs ---------- */
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.sw-row small{display:block;color:var(--ink-soft);font-size:.78rem;margin-top:2px}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;border-radius:99px;background:rgba(139,140,137,.45);position:relative;cursor:pointer;transition:background .2s;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw:checked{background:#2fa35a}
.sw:checked::after{transform:translateX(18px)}
/* ---------- En-tête ---------- */
header{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--head);
  backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);
  border-bottom:1px solid var(--line)}
header .wrap{padding-block:10px 12px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.back{display:flex;align-items:center;gap:2px;color:var(--accent);font-weight:500;font-size:1rem;padding-block:6px}
.back svg,.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn{color:var(--accent);width:38px;height:38px;display:grid;place-items:center;border-radius:50%}
.icon-btn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.title-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-weight:700;font-size:2.2rem;letter-spacing:-.035em;margin:0;line-height:1}
.stamp{font-size:.74rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}

.tabs{display:flex;gap:4px;padding:4px;border-radius:18px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;scroll-snap-align:center;padding:8px 14px;border-radius:14px;font-size:.85rem;font-weight:500;color:var(--ink-soft);white-space:nowrap;
  transition:background .2s ease,color .2s ease}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}

/* ---------- État ---------- */
main .wrap{padding-block:14px 40px;display:flex;flex-direction:column;gap:12px}
.sum{border-radius:24px;padding:16px 18px;display:flex;align-items:center;gap:14px}
.sum b{font-size:1.1rem;letter-spacing:-.01em}
.sum p{margin:2px 0 0;font-size:.82rem;color:var(--ink-soft)}
.lamp{width:14px;height:14px;border-radius:50%;flex:none;background:var(--lc);box-shadow:0 0 0 4px color-mix(in oklab, var(--lc) 22%, transparent)}
.ok{--lc:#1e8a4c}.warn{--lc:#e08a12}.err{--lc:#d63c3c}.none{--lc:#8b8c89}
.part{border-radius:24px;overflow:hidden}
.part > summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.part > summary::-webkit-details-marker{display:none}
.part > summary .t{flex:1;min-width:0}
.part > summary b{display:block;font-size:1rem}
.part > summary small{display:block;font-size:.8rem;color:var(--ink-soft);margin-top:2px}
.part > summary .chev{width:18px;height:18px;fill:none;stroke:var(--ink-soft);stroke-width:2;transition:transform .2s ease}
.part[open] > summary .chev{transform:rotate(90deg)}
.body{padding:0 16px 14px;font-size:.84rem}
.rows{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.rows th,.rows td{text-align:left;padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
.rows th{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;border-top:0}
.rows td.n{text-align:right;white-space:nowrap}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:600;background:color-mix(in oklab, var(--lc) 16%, transparent);color:color-mix(in oklab, var(--lc) 80%, var(--ink))}
.note{color:var(--ink-soft);font-size:.8rem;margin:8px 0 0;line-height:1.45}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, monospace;font-size:.72rem;overflow-wrap:anywhere;color:var(--ink-soft)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{padding:10px 14px;border-radius:14px;font-weight:600;font-size:.86rem;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.main{background:var(--accent);color:var(--on-accent);border-color:transparent}
.sv-code{width:100%;font:12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;word-break:break-all}
.sv-form label,.sv-pinl{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.sv-form input,.sv-pin{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-width:220px}
#sauvZone .actions{margin-top:8px}
#syZone .actions{margin-top:8px}
.ct-jauge{position:relative;height:10px;border-radius:99px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;margin:4px 0 8px}
.ct-jauge i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px}
.ct-jauge span{position:absolute;top:0;bottom:0;width:2px;background:#e08a12}
.sy-row{display:flex;gap:8px;align-items:center}
.sy-row input{flex:1;max-width:none!important;font:13px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace!important}
#syForm label input[name=jeton]{max-width:none}
.sy-etapes{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sy-etapes a{color:var(--accent);text-decoration:underline}
/* ---------- Toucher visible et fondu entre les pages ---------- */
@view-transition{navigation:auto}
::view-transition-old(root),::view-transition-new(root){animation-duration:.22s}
.tap-dot{position:fixed;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;pointer-events:none;z-index:9999;
  background:radial-gradient(circle, color-mix(in oklab, var(--accent) 45%, transparent), color-mix(in oklab, var(--accent) 22%, transparent) 55%, rgba(255,255,255,.15) 72%);
  box-shadow:0 0 0 2.5px rgba(255,255,255,.9), 0 0 0 4px color-mix(in oklab, var(--accent) 45%, transparent), 0 4px 16px rgba(0,0,0,.22);animation:tapdot .6s ease-out forwards}
.maj-toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:9998;
  padding:10px 16px;border-radius:999px;background:var(--accent, #274c77);color:var(--on-accent, #e7ecef);font:600 .85rem/1.2 var(--f-ui, system-ui);box-shadow:0 10px 26px -10px rgba(0,0,0,.5);
  animation:majin .3s ease-out}
@keyframes majin{from{opacity:0;transform:translate(-50%, 10px)}}
@keyframes tapdot{from{transform:scale(.55);opacity:1}to{transform:scale(1.45);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- Écarts de cotes ---------- */
.filtres{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px 0}
.chips::-webkit-scrollbar{display:none}
.chips .lab{flex:none;align-self:center;font-size:.72rem;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-right:2px;min-width:74px}
.chip{flex:none;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:.8rem;font-weight:500;white-space:nowrap;min-height:34px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.ec{border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.ec-h{display:flex;align-items:baseline;gap:8px;min-width:0}
.ec-h b{font-size:.96rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ec-h small{margin-left:auto;flex:none;font-size:.72rem;color:var(--ink-soft);white-space:nowrap}
.ec-rows{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;column-gap:10px;row-gap:5px;align-items:center;font-variant-numeric:tabular-nums}
.ec-rows > span{white-space:nowrap}
.ec-i{font-size:.84rem;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis}
.ec-c{font-size:.9rem}.ec-c b{font-weight:700}
.ec-m{font-size:.78rem;color:var(--ink-soft)}
.ec-p{justify-self:end;padding:2px 9px;border-radius:999px;font-weight:700;font-size:.82rem;background:var(--accent);color:var(--on-accent)}
.sum-l{display:flex;align-items:center;gap:10px;font-size:.84rem;color:var(--ink-soft);margin:-2px 2px 0}
.sum-l b{color:var(--ink)}
.icon-btn .nb{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:.66rem;font-weight:700;display:grid;place-items:center}
#filtreBtn{position:relative}
.top-actions{display:flex;gap:8px}
.f-bg{position:fixed;inset:0;z-index:50;background:var(--scrim, rgba(0,0,0,.35));display:flex;align-items:flex-end;justify-content:center}
.f-bg[hidden]{display:none}
.f-sheet{width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom, 0px));background:var(--sheet-solid, var(--base));display:flex;flex-direction:column;gap:12px;box-shadow:0 -10px 30px -12px rgba(0,0,0,.5)}
html.desk .f-bg{align-items:center}
html.desk .f-sheet{border-radius:26px}
.f-sheet h2{margin:0;font-size:1.1rem}

<script>
/* Écarts de cotes : pour chaque match relevé, chaque issue (1, N, 2) et chaque site, l'écart entre la cote du site et celle des autres sites.
   On classe les plus fortes déviations positives (le site paie nettement plus que les autres). Seuil et méthode : classeur, onglet Cotes. */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {get(k, d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? d; }catch{ return d; } }, set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }};
const R = CFG('cotes.rapport', {seuil:0.05, reference:'moyenne'});
const SEUIL = +R.seuil || 0.05, REF = R.reference === 'mediane' ? 'mediane' : 'moyenne';
const SITES_NOMS = {winamax_fr:'Winamax', betclic_fr:'Betclic', unibet_fr:'Unibet', pmu_fr:'PMU', netbet_fr:'NetBet', parionssport_fr:'Parions Sport'};
const PHASES = {matin:'le matin', avant:'avant le match', 'mi-temps':'à la mi-temps', manuel:'à la main'};
const LIGUES = Object.fromEntries(CFG('sport.leagues', []).map(L => [L.id, L.name]));
const NOMS_LG = {'fra.1':'Ligue 1', 'eng.1':'Premier League', 'esp.1':'Liga', 'ita.1':'Serie A', 'ger.1':'Bundesliga', 'uefa.champions':'Ligue des champions', 'uefa.europa':'Ligue Europa', 'uefa.europa.conf':'Ligue Conférence'};
const nomLg = id => LIGUES[id] || NOMS_LG[id] || id;
const cote = v => Number(v).toLocaleString('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2});
const pct = v => (v > 0 ? '+' : '') + (v * 100).toLocaleString('fr-FR', {maximumFractionDigits:1}) + ' %';
const quand = t => new Date(t).toLocaleString('fr-FR', {weekday:'short', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}).replace('.', '');
/* jour et heure du match : « auj. 19:00 », « demain 20:45 », « dim. 01/11 · 15:00 » (les relevés à la main couvrent toute la compétition, pas seulement aujourd'hui) */
const jourCle = t => new Date(t).toLocaleDateString('fr-CA');
function jourHeure(t){
  const d = new Date(t), j = jourCle(t), auj = jourCle(Date.now()), dem = jourCle(Date.now() + 864e5), hier = jourCle(Date.now() - 864e5);
  const jour = j === auj ? 'auj.' : j === dem ? 'demain' : j === hier ? 'hier' : d.toLocaleDateString('fr-FR', {weekday:'short', day:'2-digit', month:'2-digit'}).replace('.', '');
  return `${jour} ${heure(t)}`;
}
const heure = t => new Date(t).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
const ago = t => { const m = Math.round((Date.now() - t) / 60000); if (m < 60) return `il y a ${Math.max(1, m)} min`; const h = Math.round(m / 60); return h < 48 ? `il y a ${h} h` : `il y a ${Math.round(h / 24)} j`; };
const moyenne = l => l.reduce((a, b) => a + b, 0) / l.length;
const mediane = l => { const s = [...l].sort((a, b) => a - b), n = s.length; return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2; };
let F = {releve:'dernier', periode:'avenir', lg:'toutes', ...LS.get('ecarts:filtres', {})};
let COTES = null, NOMS = {}, chargeA = 0;

function matchs(){
  // relevés des tâches GitHub + relevés faits à la main sur cet appareil (bouton ↻ des matchs)
  const M = {};
  for (const [id, m] of Object.entries((COTES && COTES.matchs) || {})) M[id] = {id, t:m.t, lg:m.lg, eq:m.eq, releves:(m.releves || []).filter(r => r.sites)};
  for (const [id, m] of Object.entries(LS.get('cotes:manuel', {}))){
    const x = M[id] = M[id] || {id, t:m.t, lg:m.lg, eq:m.eq, releves:[]};
    x.t = x.t || m.t; x.lg = x.lg || m.lg; x.eq = x.eq || m.eq;
    x.releves.push({phase:'manuel', at:m.at, sites:m.sites});
  }
  return Object.values(M).map(m => ({...m, eq:m.eq || NOMS[m.id] && [NOMS[m.id].h, NOMS[m.id].a], t:m.t || NOMS[m.id] && NOMS[m.id].t, lg:m.lg || NOMS[m.id] && NOMS[m.id].lg}));
}
function ecarts(liste){
  const out = []; let compares = 0;
  for (const m of liste){
    const rel = [...m.releves].sort((a, b) => a.at - b.at);
    const garder = F.releve === 'dernier' ? rel.slice(-1) : rel;
    if (garder.length) compares++;
    for (const r of garder){
      for (const k of ['h', 'd', 'a']){
        const vals = Object.entries(r.sites || {}).map(([s, o]) => [s, +(o || {})[k]]).filter(([, v]) => v > 1);
        if (vals.length < 3) continue;                      // il faut au moins 2 autres sites pour comparer
        for (const [s, v] of vals){
          const autres = vals.filter(([x]) => x !== s).map(([, x]) => x);
          const ref = REF === 'mediane' ? mediane(autres) : moyenne(autres), e = v / ref - 1;
          if (e >= SEUIL) out.push({m, r, k, s, v, ref, e, vals});
        }
      }
    }
  }
  return {lignes:out.sort((a, b) => b.e - a.e), compares};
}
const chip = (k, v, t) => `<button class="chip" type="button" data-f="${k}" data-v="${esc(v)}" aria-pressed="${F[k] === v}">${esc(t)}</button>`;
const DEF = {releve:'dernier', periode:'avenir', lg:'toutes'};
const nFiltres = () => Object.keys(DEF).filter(k => F[k] !== DEF[k]).length;
let LGS = [];
function feuille(){
  $('#fSheet').innerHTML = `<h2 id="fTitre">Filtres</h2>
    <div><h3>Relevés</h3><div class="chips">${chip('releve', 'dernier', 'Le plus récent')}${chip('releve', 'tous', 'Tous')}</div></div>
    <div><h3>Matchs</h3><div class="chips">${chip('periode', 'proches', 'Aujourd\'hui et demain')}${chip('periode', 'avenir', 'À venir et en cours')}${chip('periode', 'tout', 'Avec ceux des 3 derniers jours')}</div></div>
    ${LGS.length > 1 ? `<div><h3>Compétition</h3><div class="chips">${chip('lg', 'toutes', 'Toutes')}${LGS.map(l => chip('lg', l, nomLg(l))).join('')}</div></div>` : ''}
    <button type="button" class="f-ok" data-fermer>Voir les écarts</button>`;
}
const court = n => String(n || '').replace(/^(AS|AC|OGC|RC|FC|SC|Stade|Olympique) /, '').replace(/ (AC|FC|SC|CF)$/, '');
function render(){
  const now = Date.now();
  const finDemain = new Date(jourCle(now + 2 * 864e5) + 'T00:00').getTime();
  let L = matchs().filter(m => m.releves.length && (F.periode === 'tout' || (m.t || now) > now - 2 * 3600e3) && (F.periode !== 'proches' || (m.t || now) < finDemain));
  LGS = [...new Set(L.map(m => m.lg).filter(Boolean))];
  if (F.lg !== 'toutes' && !LGS.includes(F.lg)) F.lg = 'toutes';
  if (F.lg !== 'toutes') L = L.filter(m => m.lg === F.lg);
  const {lignes, compares} = ecarts(L);
  const dernier = Math.max(0, ...matchs().flatMap(m => m.releves.map(r => r.at)));
  // une tuile par match (rangées par leur plus fort écart), une ligne par écart
  const parMatch = new Map();
  for (const x of lignes){ if (!parMatch.has(x.m.id)) parMatch.set(x.m.id, []); parMatch.get(x.m.id).push(x); }
  const issue = (m, k) => k === 'd' ? 'Nul' : m.eq ? court(k === 'h' ? m.eq[0] : m.eq[1]) : (k === 'h' ? '1' : '2');
  const cartes = [...parMatch.values()].slice(0, 30).map(l => {
    const m = l[0].m, r = l[0].r;
    const titre = m.eq ? `${court(m.eq[0])} – ${court(m.eq[1])}` : `Match ${m.id}`;
    const meta = `${esc(nomLg(m.lg))}${m.t ? ' · ' + jourHeure(m.t) : ''}${F.releve === 'dernier' ? ` · ${esc(PHASES[r.phase] || r.phase || '')}` : ''}`;
    return `<article class="ec glass"><div class="ec-h"><b>${esc(titre)}</b><small>${meta}</small></div>
      <div class="ec-rows">${l.map(x => `<span class="ec-i">${esc(issue(x.m, x.k))}${F.releve === 'tous' ? ` <small>· ${esc(PHASES[x.r.phase] || '')}</small>` : ''}</span>
        <span class="ec-c">${esc(SITES_NOMS[x.s] || x.s)} <b>${cote(x.v)}</b></span><span class="ec-m">moy. ${cote(x.ref)}</span><span class="ec-p">${pct(x.e)}</span>`).join('')}</div></article>`;
  }).join('');
  const n = nFiltres(); $('#filtreN').hidden = !n; $('#filtreN').textContent = n;
  $('#out').innerHTML = `
    <p class="sum-l"><span><b>${lignes.length}</b> écart${lignes.length > 1 ? 's' : ''} ≥ ${pct(SEUIL).slice(1)} · ${compares} match${compares > 1 ? 's' : ''}${dernier ? ` · relevé ${ago(dernier)}` : ''}</span></p>
    ${cartes || `<div class="vide glass">${COTES ? `Aucun site ne s'écarte d'au moins ${pct(SEUIL).slice(1)} des autres${n ? ' avec ces filtres' : ''}.` : 'Pas encore de cotes relevées : la tâche « Cotes » relève les matchs le matin, avant le coup d’envoi et à la mi-temps.'}</div>`}
    <p class="risque">Écart = cote du site comparée à la ${REF === 'mediane' ? 'médiane' : 'moyenne'} des autres sites ; souvent un site en retard de mise à jour.<br>
      Jouer comporte des risques : 09 74 75 13 13 (appel non surtaxé) · <a href="https://www.joueurs-info-service.fr/" target="_blank" rel="noopener">joueurs-info-service.fr</a></p>`;
  $('#stamp').textContent = '';
  if (!$('#fBg').hidden) feuille();
}
document.addEventListener('click', e => {
  if (e.target === $('#fBg') || e.target.closest('[data-fermer]')){ $('#fBg').hidden = true; return; }
  const b = e.target.closest('[data-f]'); if (!b) return;
  F[b.dataset.f] = b.dataset.v; LS.set('ecarts:filtres', F); render();
});
$('#filtreBtn').addEventListener('click', () => { feuille(); $('#fBg').hidden = false; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#fBg').hidden = true; });
async function load(){
  $('#refreshBtn').classList.add('spin'); chargeA = Date.now();
  try{ const r = await fetch('donnees/cotes/cotes.json', {cache:'no-cache'}); COTES = r.ok ? await r.json() : null; }catch{ COTES = null; }
  render();
  // noms des équipes des anciens relevés (avant que la tâche ne les enregistre) : programme des matchs de la page Sport
  try{ const r = await fetch('donnees/sport/jours.json', {cache:'no-cache'}); if (r.ok){ const j = await r.json();
    for (const m of j.events || []) if (m.home && m.away) NOMS[m.id] = {h:m.home.name, a:m.away.name, t:m.t, lg:m.league}; render(); } }catch{}
  $('#refreshBtn').classList.remove('spin');
}
$('#refreshBtn').addEventListener('click', load);
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - chargeA > 5 * 60e3) load(); });
load();
</script>
<script>
/* Toucher visible : un rond qui s'efface là où le doigt appuie (pratique aussi pour les vidéos de démo) */
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const d = document.createElement('span'); d.className = 'tap-dot';
  d.style.left = e.clientX + 'px'; d.style.top = e.clientY + 'px';
  document.body.appendChild(d); setTimeout(() => d.remove(), 650);
}, {passive:true, capture:true});
</script>
<script>
/* Mise en mémoire sur l'iPhone (démarrage instantané, hors ligne) + avis quand une nouvelle version est déposée */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  const t0 = Date.now(); let majDispo = false, cacheAt = 0;
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => {
    if (!e.data || e.data.type !== 'nouvelle-version') return;
    majDispo = true;
    if (Date.now() - t0 < 8000){ location.reload(); return; }         // page tout juste ouverte : on passe directement à la nouvelle version
    if (document.querySelector('.maj-toast')) return;
    const b = document.createElement('button'); b.type = 'button'; b.className = 'maj-toast'; b.textContent = 'Nouvelle version — toucher pour l\'afficher';
    b.addEventListener('click', () => location.reload()); document.body.appendChild(b);
  });
  try{ navigator.serviceWorker.startMessages(); }catch{}
  /* Retour sur l'appli : nouvelle version déjà prête → rechargement ; sinon on vérifie s'il y en a une (au plus toutes les 2 min) */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (majDispo){ location.reload(); return; }
    if (Date.now() - cacheAt < 120e3) return;
    cacheAt = Date.now();
    navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});
    fetch(location.pathname, {cache:'no-cache'}).catch(() => {});
  });
}
</script>
<!-- ==TIRER== Tirer vers le bas pour recharger (comme Safari) -->
<style>
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top, 0px) + 6px);z-index:9999;width:38px;height:38px;margin-left:-19px;border-radius:50%;
  display:grid;place-items:center;pointer-events:none;opacity:0;transform:translateY(-60px);
  background:var(--sheet-solid, var(--base, #eef2f5));color:var(--ink-soft, #56636f);box-shadow:0 6px 18px -8px rgba(0,0,0,.45);border:1px solid var(--line, rgba(0,0,0,.1))}
.ptr svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.ptr.pret{color:var(--accent, #274c77)}
.ptr.pret svg{transform:rotate(180deg)}
.ptr.va{transition:transform .2s, opacity .2s}
.ptr.tourne svg{animation:ptr-t .7s linear infinite}
@keyframes ptr-t{to{transform:rotate(360deg)}}
</style>
<div class="ptr" id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg></div>
<script>
(() => {
  const el = document.getElementById('ptr'), SEUIL = 78;
  let y0 = null, x0 = 0, d = 0, actif = false;
  const OVER = '.scrim:not([hidden]),.sheet-bg:not([hidden]),.sheet:not([hidden]),[role="dialog"]:not([hidden])';
  const bloque = t => [...document.querySelectorAll(OVER)].some(e => e.getClientRects().length) || !t.closest || t.closest('input,textarea,select,[data-no-ptr]') ||
    (() => { for (let n = t; n && n !== document.body; n = n.parentElement) if (n.scrollTop > 0) return true; return false; })();
  const set = (y, cls) => { el.style.transform = `translateY(${y}px)`; el.style.opacity = Math.min(1, y / 40); el.className = 'ptr' + (cls ? ' ' + cls : ''); };
  addEventListener('touchstart', e => {
    if (e.touches.length !== 1 || (scrollY || document.documentElement.scrollTop) > 0 || bloque(e.target)) { y0 = null; return; }
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; d = 0; actif = false;
  }, {passive:true});
  addEventListener('touchmove', e => {
    if (y0 == null) return;
    const dy = e.touches[0].clientY - y0, dx = e.touches[0].clientX - x0;
    if (!actif){ if (Math.abs(dx) > Math.abs(dy) || dy < 6){ if (Math.abs(dx) > 10 || dy < -6) y0 = null; return; } if ((scrollY || document.documentElement.scrollTop) > 0){ y0 = null; return; } actif = true; }
    d = Math.max(0, dy);
    const y = Math.min(80, d * .5);
    set(y - 10, d >= SEUIL ? 'pret' : '');
  }, {passive:true});
  addEventListener('touchend', () => {
    if (y0 == null || !actif){ y0 = null; return; }
    y0 = null;
    if (d >= SEUIL){ set(34, 'va tourne'); setTimeout(() => location.reload(), 250); }
    else { set(-60, 'va'); }
  }, {passive:true});
  addEventListener('touchcancel', () => { if (actif) set(-60, 'va'); y0 = null; }, {passive:true});
})();
</script>
<!-- ==FIN TIRER== -->
